<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesseract — a four-dimensional polytope visualiser</title>
<meta name="description" content="An interactive 4D polytope viewer: tesseract, 5-cell, 16-cell, 24-cell and a Clifford torus rotating in six planes, drawn as thin glowing lines coloured by depth in the fourth dimension.">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#04050d; --ice:#7dd3fc; --mag:#f0abfc; --amb:#fcd34d;
  --ink:#dbe7ff; --dim:#8fa3c7; --faint:#5d6f93; --line:rgba(125,211,252,.26);
  --sans:"Helvetica Neue",Helvetica,Arial,"Nimbus Sans","Liberation Sans",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#bg,#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#cv.pick{cursor:crosshair}

/* ============ HEADER ============ */
.hd{position:fixed;left:clamp(18px,3.2vw,52px);top:clamp(18px,3.4vw,46px);z-index:3;max-width:min(560px,calc(100vw - 36px));pointer-events:none}
.logo{display:block;width:clamp(230px,26vw,400px);height:auto;overflow:visible;filter:drop-shadow(0 0 6px rgba(125,211,252,.55))}
.logo path{fill:none;stroke:#e6f3ff;stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.hd p{margin:14px 0 0;font:300 clamp(12px,1.05vw,14px)/1.6 var(--sans);letter-spacing:.09em;color:var(--dim);max-width:44ch;min-height:4.8em}
.hd p b{font-weight:400;color:var(--ink)}

/* ============ PANELS ============ */
.sheet{display:contents}
.tag{font:400 9.5px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
.objs{position:fixed;left:clamp(18px,3.2vw,52px);top:clamp(190px,26vh,240px);z-index:3;display:flex;flex-direction:column;gap:2px;width:210px}
.objs .tag{margin-bottom:10px}
.objs button{appearance:none;background:none;border:0;border-left:1px solid var(--line);text-align:left;cursor:pointer;padding:9px 0 9px 14px;font:300 14px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  display:flex;gap:12px;align-items:baseline;transition:color .3s,border-color .3s,padding .3s var(--ease)}
.objs button i{font:400 9.5px/1 var(--mono);color:var(--faint);letter-spacing:.1em;font-style:normal;transition:color .3s}
.objs button:hover{color:var(--ink)}
.objs button[aria-pressed="true"]{color:#fff;border-left-color:var(--ice);padding-left:20px}
.objs button[aria-pressed="true"] i{color:var(--ice)}
.tog{position:fixed;left:clamp(18px,3.2vw,52px);bottom:clamp(20px,3.4vh,40px);z-index:3;display:flex;flex-wrap:wrap;gap:10px;max-width:260px}
.tg{appearance:none;cursor:pointer;background:rgba(6,9,24,.5);border:1px solid var(--line);color:var(--dim);padding:0 14px;height:36px;border-radius:99px;font:400 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:9px;transition:color .3s,border-color .3s,background .3s}
.tg::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid currentColor;transition:background .3s,box-shadow .3s}
.tg:hover{color:var(--ink);border-color:rgba(125,211,252,.55)}
.tg[aria-pressed="true"]{color:#fff;border-color:var(--ice);background:rgba(125,211,252,.08)}
.tg[aria-pressed="true"]::before{background:var(--ice);box-shadow:0 0 10px var(--ice)}
.planes{position:fixed;right:clamp(18px,3.2vw,52px);top:clamp(20px,4vh,44px);z-index:3;width:min(270px,calc(100vw - 36px))}
.planes .tag{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.planes summary{list-style:none;cursor:default}
.planes summary::-webkit-details-marker{display:none}
.sl{display:grid;grid-template-columns:30px 1fr 46px;align-items:center;gap:10px;height:34px}
.sl .nm{font:400 11px/1 var(--mono);letter-spacing:.14em;color:var(--ink)}
.sl .nm em{font-style:normal;color:var(--amb)}
.sl output{font:400 10.5px/1 var(--mono);color:var(--dim);text-align:right;letter-spacing:.04em}
.trk{position:relative}
.trk::after{content:"";position:absolute;left:50%;top:50%;width:1px;height:9px;margin-top:-4.5px;background:rgba(219,231,255,.35);pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:24px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:linear-gradient(90deg,rgba(125,211,252,.6),rgba(240,171,252,.6),rgba(252,211,77,.6))}
input[type=range]::-moz-range-track{height:1px;background:linear-gradient(90deg,rgba(125,211,252,.6),rgba(240,171,252,.6),rgba(252,211,77,.6))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-5px;border-radius:50%;border:0;background:#eaf7ff;box-shadow:0 0 0 4px rgba(125,211,252,.16),0 0 14px rgba(125,211,252,.9)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;border:0;background:#eaf7ff;box-shadow:0 0 0 4px rgba(125,211,252,.16),0 0 14px rgba(125,211,252,.9)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(252,211,77,.5),0 0 14px rgba(125,211,252,.9)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px rgba(252,211,77,.5),0 0 14px rgba(125,211,252,.9)}
input[type=range]:disabled{opacity:.3;cursor:not-allowed}
.planes .row{display:flex;gap:8px;margin-top:10px}
.mini{appearance:none;cursor:pointer;background:none;border:1px solid var(--line);color:var(--dim);height:30px;padding:0 12px;border-radius:99px;font:400 9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;transition:color .3s,border-color .3s}
.mini:hover{color:#fff;border-color:rgba(125,211,252,.6)}
.tg:focus-visible,.mini:focus-visible,.objs button:focus-visible{outline:2px solid var(--amb);outline-offset:3px}
.inset{position:fixed;right:clamp(18px,3.2vw,52px);bottom:clamp(20px,3.4vh,40px);z-index:3;width:212px;border:1px solid var(--line);background:rgba(4,6,18,.66);border-radius:4px;padding:10px 10px 12px}
.inset canvas{display:block;width:100%;height:auto;aspect-ratio:1;border-bottom:1px solid rgba(125,211,252,.12)}
.inset .tag{display:flex;justify-content:space-between;margin-bottom:8px}
.inset .tag span:last-child{color:var(--ice)}
.inset .co{margin:9px 0 0;font:400 10.5px/1.7 var(--mono);color:var(--ink);letter-spacing:.02em;min-height:5.1em}
.inset .co s{text-decoration:none;color:var(--faint)}

/* ============ MOBILE ============ */
@media (max-width:820px){
  .hd p{min-height:0;font-size:11.5px;margin-top:10px}
  .sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:4;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(4,5,13,0),rgba(4,5,13,.92) 22%)}
  .objs,.tog,.planes{position:static;width:auto;max-width:none}
  .objs{flex-direction:row;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .objs::-webkit-scrollbar{display:none}
  .objs .tag{display:none}
  .objs button{flex:none;border-left:0;border-bottom:1px solid var(--line);padding:10px 2px 8px;font-size:12px}
  .objs button i{display:none}
  .objs button[aria-pressed="true"]{border-bottom-color:var(--ice);padding-left:2px}
  .tog{margin:8px 0 6px;gap:8px}
  .tg{height:40px;padding:0 12px}
  .planes summary{cursor:pointer}
  .planes .tag{margin-bottom:0;height:34px}
  .planes .tag::after{content:"+";font-size:14px;color:var(--ice)}
  .planes[open] .tag::after{content:"\2212"}
  .inset{width:112px;padding:6px;right:12px;bottom:auto;top:clamp(124px,18vh,160px);background:rgba(4,6,18,.5)}
  .inset .tag,.inset .co{display:none}
}
@media (max-width:820px) and (max-height:700px){.inset{display:none}}
@media (prefers-reduced-motion:reduce){.objs button,.tg,.mini{transition:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="cv" aria-label="Interactive four-dimensional polytope. Drag to rotate; move over a vertex to read its 4D coordinates." role="img"></canvas>

<header class="hd">
  <h1 class="sr">Tesseract</h1>
  <svg class="logo" viewBox="0 0 300 30" aria-hidden="true" focusable="false">
    <g transform="translate(0 3)">
      <path d="M0 1H14M7 1V24"/>
      <path transform="translate(33 0)" d="M14 1H1V24H14M1 12H11"/>
      <path transform="translate(66 0)" d="M13 5C13 2 10 1 7 1C3 1 1 3.5 1 6C1 11 13 13 13 18C13 21 10 23 7 23C3 23 1 21 1 18.500"/>
      <path transform="translate(99 0)" d="M13 5C13 2 10 1 7 1C3 1 1 3.500 1 6C1 11 13 13 13 18C13 21 10 23 7 23C3 23 1 21 1 18.500"/>
      <path transform="translate(132 0)" d="M14 1H1V24H14M1 12H11"/>
      <path transform="translate(165 0)" d="M1 24V1H8C12 1 13 4 13 7C13 10 11 12.500 8 12.500H1M8 12.500L13.500 24"/>
      <path transform="translate(198 0)" d="M.5 24L7 1L13.500 24M3 16H11"/>
      <path transform="translate(231 0)" d="M13 5C12 2 10 1 7.500 1C3.500 1 1 5 1 12.500C1 20 3.500 23.500 7.500 23.500C10 23.500 12 22 13 19"/>
      <path transform="translate(264 0)" d="M0 1H14M7 1V24"/>
    </g>
  </svg>
  <p id="sub">A cube&rsquo;s four-dimensional cousin &mdash; <b>8</b> cubic cells, <b>24</b> square faces, <b>32</b> edges, <b>16</b> vertices</p>
</header>

<div class="sheet">
  <nav class="objs" id="objs" aria-label="Polytope">
    <span class="tag">Polytope</span>
  </nav>
  <div class="tog" role="group" aria-label="Display options">
    <button type="button" class="tg" id="tFaces" aria-pressed="false">Faces</button>
    <button type="button" class="tg" id="tCells" aria-pressed="false">Cell by cell</button>
    <button type="button" class="tg" id="tMan" aria-pressed="false" aria-label="Manual mode: dragging rotates the 4D object">Manual</button>
  </div>
  <details class="planes" id="planes" open>
    <summary class="tag"><span>Rotation planes &middot; rad/s</span></summary>
    <div id="sliders"></div>
    <div class="row"><button type="button" class="mini" id="bReset">Reset</button><button type="button" class="mini" id="bStill">Freeze</button></div>
  </details>
</div>

<aside class="inset" aria-label="Shadow: the fixed projection along the W axis">
  <div class="tag"><span>Shadow</span><span id="inName">Tesseract</span></div>
  <canvas id="sh" width="400" height="400" aria-hidden="true"></canvas>
  <p class="co" id="co"></p>
</aside>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}

/* ================= polytope construction ================= */
function finish(o){
  var n=o.V.length/4,i,j,k;
  o.n=n;o.ne=o.E.length/2;
  // radius-1 normalisation
  var mr=0;for(i=0;i<n;i++){var r=Math.hypot(o.V[4*i],o.V[4*i+1],o.V[4*i+2],o.V[4*i+3]);if(r>mr)mr=r}
  for(i=0;i<o.V.length;i++)o.V[i]/=mr;
  o.cellSets=o.cells.map(function(c){var m=new Uint8Array(n);c.forEach(function(v){m[v]=1});return m});
  o.edgeCells=[];for(i=0;i<o.ne;i++){var a=o.E[2*i],b=o.E[2*i+1],l=[];for(k=0;k<o.cellSets.length;k++)if(o.cellSets[k][a]&&o.cellSets[k][b])l.push(k);o.edgeCells.push(l)}
  o.faceCells=o.F.map(function(f){var l=[];for(k=0;k<o.cellSets.length;k++){var ok=true;for(j=0;j<f.length;j++)if(!o.cellSets[k][f[j]]){ok=false;break}if(ok)l.push(k)}return l});
  return o;
}
function mkTesseract(){
  var V=[],E=[],F=[],cells=[],i,j,a,b;
  for(i=0;i<16;i++)V.push((i&1?.5:-.5),(i&2?.5:-.5),(i&4?.5:-.5),(i&8?.5:-.5));
  for(i=0;i<16;i++)for(a=0;a<4;a++){j=i^(1<<a);if(j>i)E.push(i,j)}
  for(a=0;a<4;a++)for(b=a+1;b<4;b++)for(i=0;i<16;i++){
    if((i>>a)&1||(i>>b)&1)continue;
    F.push([i,i|(1<<a),i|(1<<a)|(1<<b),i|(1<<b)]);
  }
  for(a=0;a<4;a++)for(var s=0;s<2;s++){var c=[];for(i=0;i<16;i++)if(((i>>a)&1)===s)c.push(i);cells.push(c)}
  return finish({key:'tesseract',name:'Tesseract',V:new Float32Array(V),E:new Uint16Array(E),F:F,cells:cells,cellName:'cubic cell',
    facts:[16,32,24,8],sub:'A cube&rsquo;s four-dimensional cousin &mdash; <b>8</b> cubic cells, <b>24</b> square faces, <b>32</b> edges, <b>16</b> vertices',shadow:'cube within cube'});
}
function mk5cell(){
  var s5=Math.sqrt(5),P=[[1,1,1,-1/s5],[1,-1,-1,-1/s5],[-1,1,-1,-1/s5],[-1,-1,1,-1/s5],[0,0,0,s5-1/s5]],V=[],E=[],F=[],cells=[],i,j,k;
  var m=[0,0,0,0];P.forEach(function(p){for(var q=0;q<4;q++)m[q]+=p[q]/5});
  P.forEach(function(p){for(var q=0;q<4;q++)V.push(p[q]-m[q])});
  for(i=0;i<5;i++)for(j=i+1;j<5;j++){E.push(i,j);for(k=j+1;k<5;k++)F.push([i,j,k])}
  for(i=0;i<5;i++){var c=[];for(j=0;j<5;j++)if(j!==i)c.push(j);cells.push(c)}
  return finish({key:'5cell',name:'5-cell',V:new Float32Array(V),E:new Uint16Array(E),F:F,cells:cells,cellName:'tetrahedral cell',
    facts:[5,10,10,5],sub:'The four-dimensional simplex &mdash; <b>5</b> tetrahedral cells, <b>10</b> triangular faces, <b>10</b> edges, <b>5</b> vertices',shadow:'simplex projection'});
}
function mk16cell(){
  var V=[],E=[],F=[],cells=[],i,j,k,m;
  for(i=0;i<4;i++){var p=[0,0,0,0],q=[0,0,0,0];p[i]=1;q[i]=-1;V.push.apply(V,p);V.push.apply(V,q)}
  function anti(a,b){return (a>>1)===(b>>1)}
  for(i=0;i<8;i++)for(j=i+1;j<8;j++){if(anti(i,j))continue;E.push(i,j);for(k=j+1;k<8;k++)if(!anti(i,k)&&!anti(j,k))F.push([i,j,k])}
  for(m=0;m<16;m++){var c=[];for(i=0;i<4;i++)c.push(2*i+((m>>i)&1));cells.push(c)}
  return finish({key:'16cell',name:'16-cell',V:new Float32Array(V),E:new Uint16Array(E),F:F,cells:cells,cellName:'tetrahedral cell',
    facts:[8,24,32,16],sub:'The cross-polytope &mdash; <b>16</b> tetrahedral cells, <b>32</b> triangular faces, <b>24</b> edges, <b>8</b> vertices',shadow:'octahedral shadow'});
}
function mk24cell(){
  var V=[],pts=[],E=[],F=[],cells=[],i,j,k,a,b,sa,sb;
  for(a=0;a<4;a++)for(b=a+1;b<4;b++)for(sa=-1;sa<=1;sa+=2)for(sb=-1;sb<=1;sb+=2){var p=[0,0,0,0];p[a]=sa;p[b]=sb;pts.push(p);V.push.apply(V,p)}
  function d2(p,q){var s=0;for(var t=0;t<4;t++)s+=(p[t]-q[t])*(p[t]-q[t]);return s}
  var adj=[];for(i=0;i<24;i++){adj.push([]);}
  for(i=0;i<24;i++)for(j=i+1;j<24;j++)if(Math.abs(d2(pts[i],pts[j])-2)<1e-6){E.push(i,j);adj[i][j]=1;adj[j][i]=1}
  for(i=0;i<24;i++)for(j=i+1;j<24;j++)if(adj[i][j])for(k=j+1;k<24;k++)if(adj[i][k]&&adj[j][k])F.push([i,j,k]);
  var centres=[];
  for(a=0;a<4;a++){var c1=[0,0,0,0],c2=[0,0,0,0];c1[a]=1;c2[a]=-1;centres.push(c1,c2)}
  for(i=0;i<16;i++)centres.push([(i&1?.5:-.5),(i&2?.5:-.5),(i&4?.5:-.5),(i&8?.5:-.5)]);
  centres.forEach(function(c){var cell=[];for(i=0;i<24;i++){var d=0;for(var t=0;t<4;t++)d+=pts[i][t]*c[t];if(Math.abs(d-1)<1e-6)cell.push(i)}cells.push(cell)});
  return finish({key:'24cell',name:'24-cell',V:new Float32Array(V),E:new Uint16Array(E),F:F,cells:cells,cellName:'octahedral cell',
    facts:[24,96,96,24],sub:'The self-dual wonder &mdash; <b>24</b> octahedral cells, <b>96</b> triangular faces, <b>96</b> edges, <b>24</b> vertices',shadow:'cuboctahedral shadow'});
}
function mkTorus(){
  var NA=24,NB=12,V=[],E=[],F=[],cells=[],i,j,r=Math.SQRT1_2;
  for(i=0;i<NA;i++)for(j=0;j<NB;j++){var a=i/NA*TAU,b=j/NB*TAU;V.push(Math.cos(a)*r,Math.sin(a)*r,Math.cos(b)*r,Math.sin(b)*r)}
  function id(i,j){return ((i+NA)%NA)*NB+((j+NB)%NB)}
  for(i=0;i<NA;i++)for(j=0;j<NB;j++){E.push(id(i,j),id(i+1,j),id(i,j),id(i,j+1));F.push([id(i,j),id(i+1,j),id(i+1,j+1),id(i,j+1)])}
  for(var s=0;s<8;s++){var c=[];for(i=0;i<=3;i++)for(j=0;j<NB;j++)c.push(id(s*3+i,j));cells.push(c)}
  return finish({key:'torus',name:'Clifford torus',V:new Float32Array(V),E:new Uint16Array(E),F:F,cells:cells,cellName:'sector',
    facts:[NA*NB,NA*NB*2,NA*NB,8],sub:'A flat torus inside the 3-sphere &mdash; <b>288</b> points on the surface where two circles of radius <span style="white-space:nowrap">1/&radic;2</span> meet at right angles',shadow:'doughnut shadow',torus:true});
}
var OBJS=[mkTesseract(),mk5cell(),mk16cell(),mk24cell(),mkTorus()];
var cur=OBJS[0],curIdx=0;

/* ================= colour ramp: ice -> magenta -> amber ================= */
var RAMP=[];
(function(){var A=[125,211,252],B=[240,171,252],C=[252,211,77];for(var i=0;i<64;i++){var t=i/63,c=t<.5?[lerp(A[0],B[0],t*2),lerp(A[1],B[1],t*2),lerp(A[2],B[2],t*2)]:[lerp(B[0],C[0],t*2-1),lerp(B[1],C[1],t*2-1),lerp(B[2],C[2],t*2-1)];RAMP.push('rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')')}})();
var SPR=[];
(function(){for(var q=0;q<16;q++){var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d'),t=q/15,A=[125,211,252],B=[240,171,252],C=[252,211,77],col=t<.5?[lerp(A[0],B[0],t*2),lerp(A[1],B[1],t*2),lerp(A[2],B[2],t*2)]:[lerp(B[0],C[0],t*2-1),lerp(B[1],C[1],t*2-1),lerp(B[2],C[2],t*2-1)];
  var gr=g.createRadialGradient(32,32,0,32,32,32),rc=col.map(Math.round).join(',');
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.12,'rgba(255,255,255,.95)');gr.addColorStop(.2,'rgba('+rc+',.85)');gr.addColorStop(.5,'rgba('+rc+',.22)');gr.addColorStop(1,'rgba('+rc+',0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);SPR.push(c)}})();

/* ================= state ================= */
var PL=[['XY',0,1],['XZ',0,2],['YZ',1,2],['XW',0,3],['YW',1,3],['ZW',2,3]];
var DEF=[0,0,0,.22,.14,.29];
var spd=DEF.slice(),ang=[.4,.2,.1,0,0,0];
var K={faces:false,cells:false,manual:false};
var view={yaw:.55,pitch:.32,vyaw:0,vpitch:0,px:0,py:0};
var vel={xw:0,yw:0,zw:0};
var P4=new Float32Array(4*300),SX=new Float32Array(300),SY=new Float32Array(300),SZ=new Float32Array(300),SW=new Float32Array(300),SS=new Float32Array(300);
var hoverIdx=-1,ptr={x:-1,y:-1,in:false},cellW=[],cellPhase=0;
function resetCellW(){cellW=[];for(var i=0;i<cur.cells.length;i++)cellW.push(0)}
resetCellW();

/* ================= canvas setup ================= */
var cv=$('#cv'),ctx=cv.getContext('2d'),bg=$('#bg'),bctx=bg.getContext('2d'),shc=$('#sh'),sctx=shc.getContext('2d');
var W=0,H=0,DPR=1;
var MONO10='400 10px ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace',MONO11='400 11px ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace';
function drawBg(){
  var c=bctx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  var g=c.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,Math.hypot(W,H)*.6);g.addColorStop(0,'#0a1030');g.addColorStop(.45,'#060820');g.addColorStop(1,'#04050d');c.fillStyle=g;c.fillRect(0,0,W,H);
  var cx=W*.5,cy=H*.5,R=Math.min(W,H)*.3;
  c.lineWidth=1;
  for(var k=1;k<=4;k++){c.strokeStyle='rgba(125,211,252,'+(.12-k*.02)+')';c.beginPath();c.arc(cx,cy,R*(.55+k*.42),0,TAU);c.stroke()}
  c.strokeStyle='rgba(125,211,252,.07)';c.beginPath();c.moveTo(cx-R*2.6,cy);c.lineTo(cx+R*2.6,cy);c.moveTo(cx,cy-R*2.6);c.lineTo(cx,cy+R*2.6);c.stroke();
  for(var t=0;t<72;t++){var a=t/72*TAU,r1=R*(.55+4*.42)+3,r2=r1+(t%6===0?9:4);c.strokeStyle='rgba(125,211,252,'+(t%6===0?.28:.13)+')';c.beginPath();c.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);c.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);c.stroke()}
  var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  for(var i=0;i<150;i++){var x=rnd()*W,y=rnd()*H,a2=rnd();c.fillStyle='rgba(200,225,255,'+(.05+a2*.22)+')';c.fillRect(x,y,a2>.92?1.6:1,a2>.92?1.6:1)}
}
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
  [cv,bg].forEach(function(c){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)});
  drawBg();
}
resize();
if(window.ResizeObserver){new ResizeObserver(function(){if(innerWidth!==W||innerHeight!==H)resize()}).observe(document.documentElement)}
window.addEventListener('resize',resize);

/* ================= 4D rotation + projection ================= */
var D4=2.5,D3=4.4;
function rotateAll(){
  var c0=Math.cos(ang[0]),s0=Math.sin(ang[0]),c1=Math.cos(ang[1]),s1=Math.sin(ang[1]),c2=Math.cos(ang[2]),s2=Math.sin(ang[2]),
      c3=Math.cos(ang[3]),s3=Math.sin(ang[3]),c4=Math.cos(ang[4]),s4=Math.sin(ang[4]),c5=Math.cos(ang[5]),s5=Math.sin(ang[5]);
  var V=cur.V,n=cur.n,i,x,y,z,w,t;
  for(i=0;i<n;i++){
    x=V[4*i];y=V[4*i+1];z=V[4*i+2];w=V[4*i+3];
    t=x*c0-y*s0;y=x*s0+y*c0;x=t;
    t=x*c1-z*s1;z=x*s1+z*c1;x=t;
    t=y*c2-z*s2;z=y*s2+z*c2;y=t;
    t=x*c3-w*s3;w=x*s3+w*c3;x=t;
    t=y*c4-w*s4;w=y*s4+w*c4;y=t;
    t=z*c5-w*s5;w=z*s5+w*c5;z=t;
    P4[4*i]=x;P4[4*i+1]=y;P4[4*i+2]=z;P4[4*i+3]=w;
  }
}
function projectAll(yaw,pitch,cx,cy,sc,useRot){
  var n=cur.n,cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),V=useRot?P4:cur.V;
  for(var i=0;i<n;i++){
    var x=V[4*i],y=V[4*i+1],z=V[4*i+2],w=V[4*i+3],s4=D4/(D4-w),X=x*s4,Y=y*s4,Z=z*s4;
    var x1=X*cyw+Z*syw,z1=-X*syw+Z*cyw,y1=Y*cp-z1*sp,z2=Y*sp+z1*cp,s3=D3/(D3-z2);
    SX[i]=cx+x1*s3*sc;SY[i]=cy-y1*s3*sc;SZ[i]=z2;SW[i]=w;SS[i]=s3*s4;
  }
}
function ramp(t){return RAMP[Math.max(0,Math.min(63,Math.round(t*63)))]}

/* ================= drawing the main scene ================= */
function drawScene(c,cx,cy,sc,dt,time,useRot,small,hi){
  var o=cur,E=o.E,ne=o.ne,i,a,b;
  var doCells=K.cells&&!small;
  var mult=small?.8:1;
  // faces (additive glow)
  if(K.faces||small){
    c.globalCompositeOperation='lighter';
    var F=o.F,nf=F.length;
    for(i=0;i<nf;i++){
      var f=F[i],wsum=0,zsum=0,fl=f.length,j;
      for(j=0;j<fl;j++){wsum+=SW[f[j]];zsum+=SZ[f[j]]}
      var t=(wsum/fl+1)/2,al=(small?.03:(o.torus?.018:.04))*(.55+.75*t);
      if(doCells){var hm=0,fc=o.faceCells[i];for(j=0;j<fc.length;j++)if(cellW[fc[j]]>hm)hm=cellW[fc[j]];al=al*(.35)+.16*hm}
      c.globalAlpha=al;c.fillStyle=ramp(t);
      c.beginPath();c.moveTo(SX[f[0]],SY[f[0]]);for(j=1;j<fl;j++)c.lineTo(SX[f[j]],SY[f[j]]);c.closePath();c.fill();
    }
    c.globalAlpha=1;
  }
  c.globalCompositeOperation='lighter';
  c.lineCap='round';
  var lw=small?.9:1;
  for(i=0;i<ne;i++){
    a=E[2*i];b=E[2*i+1];
    var wm=(SW[a]+SW[b])/2,t2=(wm+1)/2,zm=(SZ[a]+SZ[b])/2;
    var al2=(.22+.7*t2)*(.72+.28*clamp((zm+1)/2,0,1)),wd=(.55+1.35*t2)*lw;
    if(o.torus){al2*=.42;wd*=.7}
    var hm2=0;
    if(doCells){var ec=o.edgeCells[i];for(var q=0;q<ec.length;q++)if(cellW[ec[q]]>hm2)hm2=cellW[ec[q]];al2=al2*(1-.72*(1-hm2))+hm2*.35;wd+=hm2*1.5}
    var sx1=SX[a],sy1=SY[a],sx2=SX[b],sy2=SY[b];
    c.strokeStyle=ramp(t2);
    if(!small&&!o.torus){c.globalAlpha=Math.min(.16,al2*.16);c.lineWidth=wd*4.2;c.beginPath();c.moveTo(sx1,sy1);c.lineTo(sx2,sy2);c.stroke()}
    c.globalAlpha=Math.min(1,al2*mult);c.lineWidth=wd;c.beginPath();c.moveTo(sx1,sy1);c.lineTo(sx2,sy2);c.stroke();
    if(hm2>.05&&!small){c.globalAlpha=hm2*.7;c.strokeStyle='#fff';c.lineWidth=.7;c.beginPath();c.moveTo(sx1,sy1);c.lineTo(sx2,sy2);c.stroke()}
  }
  c.globalAlpha=1;
  // vertices: glowing dots with halos
  var n=o.n,r0=small?.55:1;
  for(i=0;i<n;i++){
    var tt=(SW[i]+1)/2,sz=(o.torus?5:9+9*tt)*clamp(SS[i],.6,1.7)*r0;
    var spr=SPR[Math.max(0,Math.min(15,Math.round(tt*15)))];
    c.globalAlpha=o.torus?.85:(.6+.4*tt);
    c.drawImage(spr,SX[i]-sz,SY[i]-sz,sz*2,sz*2);
  }
  c.globalAlpha=1;c.globalCompositeOperation='source-over';
  if(hi>=0){
    var hx=SX[hi],hy=SY[hi];
    c.strokeStyle='#fff';c.lineWidth=1;c.beginPath();c.arc(hx,hy,small?6:12,0,TAU);c.stroke();
    c.strokeStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(hx,hy,small?9:19,0,TAU);c.stroke();
  }
}

/* axes gizmo + w legend (screen space, bottom-left of the scene) */
function drawGizmo(c,yaw,pitch){
  var ox=W*.5-140,oy=H-70,L=30;
  if(W<=820){return}
  var axes=[[1,0,0,'x'],[0,1,0,'y'],[0,0,1,'z']],cyw=Math.cos(yaw),syw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  c.save();c.font=MONO10;c.textAlign='center';c.textBaseline='middle';
  var cols=['#7dd3fc','#f0abfc','#fcd34d'];
  for(var i=0;i<3;i++){
    var X=axes[i][0],Y=axes[i][1],Z=axes[i][2],x1=X*cyw+Z*syw,z1=-X*syw+Z*cyw,y1=Y*cp-z1*sp;
    c.strokeStyle=cols[i];c.globalAlpha=.55;c.lineWidth=1;c.beginPath();c.moveTo(ox,oy);c.lineTo(ox+x1*L,oy-y1*L);c.stroke();
    c.globalAlpha=.9;c.fillStyle=cols[i];c.fillText(axes[i][3],ox+x1*(L+10),oy-y1*(L+10));
  }
  c.globalAlpha=1;
  var lx=W*.5-56,ly=H-46,g=c.createLinearGradient(lx,0,lx+112,0);g.addColorStop(0,'#7dd3fc');g.addColorStop(.5,'#f0abfc');g.addColorStop(1,'#fcd34d');
  c.fillStyle=g;c.fillRect(lx,ly,112,2);
  c.fillStyle='rgba(143,163,199,.9)';c.textAlign='left';c.fillText('w −1',lx,ly+14);c.textAlign='right';c.fillText('+1 w',lx+112,ly+14);
  c.textAlign='left';c.fillStyle='rgba(93,111,147,1)';c.fillText('DEPTH IN THE FOURTH DIMENSION',lx,ly+30);
  c.restore();
}
function fmt(v){var s=(Math.abs(v)<.0005?0:v).toFixed(2);return (v>=0.0005?'+':(v<=-.0005?'':'±'))+s.replace(/^-/,'−')}
function coordText(i){
  var V=cur.V;
  return 'v'+(i+1)+' of '+cur.n+'<br><s>x</s> '+fmt(V[4*i])+' <s>y</s> '+fmt(V[4*i+1])+'<br><s>z</s> '+fmt(V[4*i+2])+' <s>w</s> '+fmt(V[4*i+3]);
}
function updateInsetText(){
  var f=cur.facts,co=$('#co');
  if(hoverIdx>=0)co.innerHTML=coordText(hoverIdx)+'<br><s>rotated w</s> '+fmt(SW[hoverIdx]);
  else co.innerHTML=f[0]+' vertices &middot; '+f[1]+' edges<br>'+f[2]+' faces &middot; '+f[3]+' cells<br><s>hover a vertex to read its 4D coordinates</s>';
}

/* ================= interaction ================= */
var dragging=false,lastP={x:0,y:0,t:0},moved=0,tapT=0;
cv.addEventListener('pointerdown',function(e){
  dragging=true;moved=0;lastP.x=e.clientX;lastP.y=e.clientY;lastP.t=performance.now();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  cv.classList.add('drag');view.vyaw=view.vpitch=0;vel.xw=vel.yw=vel.zw=0;
});
cv.addEventListener('pointermove',function(e){
  ptr.x=e.clientX;ptr.y=e.clientY;ptr.in=true;
  if(!dragging)return;
  var dx=e.clientX-lastP.x,dy=e.clientY-lastP.y,now=performance.now(),dt=Math.max(.008,(now-lastP.t)/1000);lastP.x=e.clientX;lastP.y=e.clientY;lastP.t=now;moved+=Math.abs(dx)+Math.abs(dy);
  if(K.manual){
    ang[3]+=dx*.0068;ang[5]+=dx*.0046;ang[4]+=dy*.0068;
    vel.xw=vel.xw*.5+(dx*.0068/dt)*.5;vel.zw=vel.zw*.5+(dx*.0046/dt)*.5;vel.yw=vel.yw*.5+(dy*.0068/dt)*.5;
  }else{
    view.yaw+=dx*.006;view.pitch=clamp(view.pitch+dy*.006,-1.35,1.35);
    view.vyaw=view.vyaw*.5+(dx*.006/dt)*.5;view.vpitch=view.vpitch*.5+(dy*.006/dt)*.5;
  }
});
function endDrag(e){dragging=false;cv.classList.remove('drag');
  if(e&&e.type==='pointerup'&&e.pointerType==='touch'&&moved<9){ptr.x=e.clientX;ptr.y=e.clientY;ptr.in=true;clearTimeout(tapT);tapT=setTimeout(function(){ptr.in=false},3800)}
  var m=Math.max(Math.abs(vel.xw),Math.abs(vel.yw),Math.abs(vel.zw));if(m>5){var k=5/m;vel.xw*=k;vel.yw*=k;vel.zw*=k}
  view.vyaw=clamp(view.vyaw,-6,6);view.vpitch=clamp(view.vpitch,-6,6)}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',function(e){if(e.pointerType!=='touch')ptr.in=false});
window.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'))return;
  var k=e.key;
  if(k==='f'||k==='F')$('#tFaces').click();else if(k==='c'||k==='C')$('#tCells').click();else if(k==='m'||k==='M')$('#tMan').click();
  else if(k>='1'&&k<='5')pick(+k-1);
});

/* ================= UI wiring ================= */
var objsEl=$('#objs');
OBJS.forEach(function(o,i){
  var b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',i===0?'true':'false');b.innerHTML='<i>0'+(i+1)+'</i>'+o.name;
  b.addEventListener('click',function(){pick(i)});objsEl.appendChild(b);
});
function pick(i){
  curIdx=i;cur=OBJS[i];hoverIdx=-1;resetCellW();cellPhase=0;
  [].forEach.call(objsEl.querySelectorAll('button'),function(b,k){b.setAttribute('aria-pressed',k===i?'true':'false')});
  $('#sub').innerHTML=cur.sub;$('#inName').textContent=cur.name;updateInsetText();
}
function bindToggle(id,key,cb){var b=$(id);b.addEventListener('click',function(){K[key]=!K[key];b.setAttribute('aria-pressed',K[key]?'true':'false');if(cb)cb()})}
bindToggle('#tFaces','faces');
bindToggle('#tCells','cells',function(){cellPhase=0;resetCellW()});
bindToggle('#tMan','manual',function(){[].forEach.call(document.querySelectorAll('#sliders input'),function(s){s.disabled=K.manual});$('#sliders').style.opacity=K.manual?.5:1});
var slEl=$('#sliders'),sliders=[];
PL.forEach(function(p,i){
  var row=document.createElement('label');row.className='sl';
  var isW=p[0].indexOf('W')>=0;
  row.innerHTML='<span class="nm">'+(isW?p[0].replace('W','<em>W</em>'):p[0])+'</span><span class="trk"><input type="range" min="-1" max="1" step="0.01" value="'+DEF[i]+'" aria-label="'+p[0]+' rotation speed in radians per second"></span><output>'+DEF[i].toFixed(2)+'</output>';
  var inp=row.querySelector('input'),out=row.querySelector('output');
  inp.addEventListener('input',function(){spd[i]=+inp.value;out.textContent=(spd[i]>=0?'+':'−')+Math.abs(spd[i]).toFixed(2)});
  out.textContent=(DEF[i]>=0?'+':'−')+Math.abs(DEF[i]).toFixed(2);
  slEl.appendChild(row);sliders.push([inp,out]);
});
function setSpeeds(arr){arr.forEach(function(v,i){spd[i]=v;sliders[i][0].value=v;sliders[i][1].textContent=(v>=0?'+':'−')+Math.abs(v).toFixed(2)})}
$('#bReset').addEventListener('click',function(){setSpeeds(DEF);ang=[.4,.2,.1,0,0,0];view.yaw=.55;view.pitch=.32});
$('#bStill').addEventListener('click',function(){setSpeeds([0,0,0,0,0,0])});
if(matchMedia('(max-width:820px)').matches)$('#planes').removeAttribute('open');
pick(0);

/* ================= main loop ================= */
var last=0,T=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){last=now;return}
  var dt=Math.min(.05,(now-(last||now))/1000);last=now;T+=dt;
  var slow=reduce?.3:1;
  if(!K.manual){for(var k=0;k<6;k++)ang[k]+=spd[k]*dt*slow}
  else if(!dragging){
    ang[3]+=vel.xw*dt;ang[4]+=vel.yw*dt;ang[5]+=vel.zw*dt;var d=Math.exp(-2.3*dt);vel.xw*=d;vel.yw*=d;vel.zw*=d;
  }
  if(!dragging){view.yaw+=view.vyaw*dt;view.pitch=clamp(view.pitch+view.vpitch*dt,-1.35,1.35);var d2=Math.exp(-3*dt);view.vyaw*=d2;view.vpitch*=d2}
  // pointer parallax on the 3D view
  var tx=ptr.in?(ptr.x/W-.5)*.35:0,ty=ptr.in?(ptr.y/H-.5)*.25:0;
  view.px+=(tx-view.px)*Math.min(1,dt*2.2);view.py+=(ty-view.py)*Math.min(1,dt*2.2);
  // cell-by-cell highlight
  if(K.cells){
    cellPhase+=dt*(reduce?.25:.55);var nc=cur.cells.length,ci=Math.floor(cellPhase)%nc,fr=cellPhase-Math.floor(cellPhase);
    for(var q=0;q<nc;q++){var tgt=(q===ci)?Math.sin(clamp(fr,0,1)*Math.PI)*1.25:0;cellW[q]+=(clamp(tgt,0,1)-cellW[q])*Math.min(1,dt*10)}
  }
  rotateAll();
  var mob=W<=820,cx=W*.5,cy=H*(mob?.42:.5),sc=Math.min(W,H)*(mob?.3:.27);
  projectAll(view.yaw+view.px,view.pitch+view.py,cx,cy,sc,true);
  // hover pick
  var prev=hoverIdx;hoverIdx=-1;
  if(ptr.in&&!dragging){var best=1600;for(var i=0;i<cur.n;i++){var dx=SX[i]-ptr.x,dy=SY[i]-ptr.y,dd=dx*dx+dy*dy;if(dd<best){best=dd;hoverIdx=i}}}
  cv.classList.toggle('pick',hoverIdx>=0);
  var c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  drawScene(c,cx,cy,sc,dt,T,true,false,hoverIdx);
  drawGizmo(c,view.yaw+view.px,view.pitch+view.py);
  if(hoverIdx>=0){
    var hx=SX[hoverIdx],hy=SY[hoverIdx],lab='('+fmt(cur.V[4*hoverIdx])+', '+fmt(cur.V[4*hoverIdx+1])+', '+fmt(cur.V[4*hoverIdx+2])+', '+fmt(cur.V[4*hoverIdx+3])+')',ox=hx+22,oy=hy-22;
    c.font=MONO11;c.textBaseline='middle';
    var tw=c.measureText(lab).width;if(ox+tw>W-12)ox=hx-22-tw;
    c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1;c.beginPath();c.moveTo(hx+(ox>hx?12:-12),hy-(12*.9));c.lineTo(ox>hx?ox-4:ox+tw+4,oy);c.stroke();
    c.fillStyle='rgba(4,6,18,.72)';c.fillRect(ox-6,oy-11,tw+12,22);c.strokeStyle='rgba(125,211,252,.4)';c.strokeRect(ox-6,oy-11,tw+12,22);
    c.fillStyle='#eaf6ff';c.textAlign='left';c.fillText(lab,ox,oy+.5);
  }
  if(prev!==hoverIdx)updateInsetText();
  // shadow inset: the fixed projection along W (no 4D rotation) so the cube-within-cube stays legible
  if(shc.offsetParent!==null){
    var s2=sctx,sw=shc.width,sh=shc.height;
    s2.setTransform(1,0,0,1,0,0);s2.clearRect(0,0,sw,sh);
    projectAll(T*.42,.42,sw/2,sh/2,sw*.31,false);
    drawScene(s2,sw/2,sh/2,sw*.31,dt,T,false,true,hoverIdx);
  }
}
requestAnimationFrame(frame);
})();
</script>
