<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORM / MOTION — Showreel 2026</title>
<style>
:root{
  --cream:#f4ecd8;
  --ink:#14110f;
  --vermilion:#ff4b2b;
  --cobalt:#2340ff;
  --sun:#ffc233;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --heavy:Impact,"Arial Black","Haettenschweiler","Franklin Gothic Heavy","Nimbus Sans",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0908;overflow:hidden}
body{color:var(--cream);font-family:var(--mono);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.theatre{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(70% 70% at 50% 45%,#1b1613 0,#0b0908 100%)}
.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:var(--ink);overflow:hidden;
  box-shadow:0 30px 120px rgba(0,0,0,.65),0 0 0 1px rgba(244,236,216,.06);cursor:pointer;touch-action:manipulation}
@supports (height:100dvh){.stage{width:min(100vw,calc(100dvh * 16 / 9))}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.grain{position:absolute;inset:-100px;pointer-events:none;opacity:.16;mix-blend-mode:overlay;background-size:200px 200px;animation:grain .9s steps(6) infinite}
@keyframes grain{
  0%{transform:translate(0,0)}17%{transform:translate(-37px,21px)}34%{transform:translate(23px,-44px)}
  50%{transform:translate(-61px,-12px)}67%{transform:translate(48px,38px)}84%{transform:translate(-14px,63px)}100%{transform:translate(0,0)}
}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,rgba(0,0,0,0) 58%,rgba(10,6,4,.42) 100%)}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;font-size:clamp(11px,1.5vw,16px);
  letter-spacing:.3em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:.8em 1.2em;transition:opacity .3s}
.hint.on{opacity:1}

/* control bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:26px clamp(10px,2.4vw,28px) clamp(10px,1.6vh,18px);
  background:linear-gradient(180deg,rgba(11,9,8,0),rgba(11,9,8,.82) 55%,rgba(11,9,8,.94));
  display:flex;align-items:center;gap:clamp(8px,1.6vw,18px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.bar.hide{opacity:0;transform:translateY(18px);pointer-events:none}
.cbtn{appearance:none;flex:none;height:44px;min-width:44px;padding:0 12px;border:1px solid rgba(244,236,216,.32);background:rgba(20,17,15,.7);color:var(--cream);
  font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s}
.cbtn:hover{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.cbtn[aria-pressed="true"]{background:var(--vermilion);border-color:var(--vermilion);color:var(--ink)}
.cbtn svg{width:18px;height:18px;fill:currentColor}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.tcode{flex:none;font-size:12px;letter-spacing:.1em;font-variant-numeric:tabular-nums;color:rgba(244,236,216,.86);min-width:9.6em}
.tcode b{color:var(--sun);font-weight:400}
.scrub{position:relative;flex:1;min-width:0;height:44px;display:flex;flex-direction:column;justify-content:center}
.track{position:relative;height:22px;cursor:pointer;touch-action:none;outline-offset:4px}
.track::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;background:rgba(244,236,216,.2)}
.fill{position:absolute;left:0;top:9px;height:4px;background:var(--vermilion);width:0}
.head{position:absolute;top:3px;width:4px;height:16px;margin-left:-2px;background:var(--cream);box-shadow:0 0 0 3px rgba(20,17,15,.75)}
.tick{position:absolute;top:2px;width:2px;height:18px;margin-left:-1px;background:rgba(244,236,216,.7);pointer-events:none}
.names{position:relative;height:16px;margin-top:0}
.names button{position:absolute;top:0;transform:translateX(0);appearance:none;border:0;background:none;color:rgba(244,236,216,.55);font:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;padding:0 6px;height:16px;line-height:16px;white-space:nowrap;text-align:left}
.names button:hover,.names button[aria-current="true"]{color:var(--sun)}
.scene-now{display:none;flex:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
@media (max-width:700px){
  .names{display:none}
  .scene-now{display:block}
  .tcode{min-width:0}
  .tcode .tot{display:none}
  .bar{flex-wrap:wrap;row-gap:4px}
  .scrub{order:5;flex:1 1 100%;height:30px}
}
@media (prefers-reduced-motion:reduce){
  .grain{animation:none}
  .bar{transition:none}
}
</style>
</head>
<body>
<div class="theatre">
  <div class="stage" id="stage">
    <canvas id="cv" width="1280" height="720" aria-label="FORM / MOTION showreel 2026, a thirty second self-playing motion graphics title sequence"></canvas>
    <div class="grain" id="grain" aria-hidden="true"></div>
    <div class="vig" aria-hidden="true"></div>
    <div class="hint" id="hint" aria-hidden="true">Paused</div>
  </div>
</div>

<div class="bar" id="bar" role="group" aria-label="Showreel controls">
  <button class="cbtn" id="playBtn" type="button" aria-label="Pause"><svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
  <div class="tcode" id="tcode" aria-hidden="true"><b>00:00</b> <span class="tot">/ 00:30</span></div>
  <div class="scrub" id="scrub">
    <div class="track" id="track" role="slider" tabindex="0" aria-label="Timeline" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" aria-valuetext="0 seconds">
      <div class="fill" id="fill"></div><div class="head" id="head"></div>
    </div>
    <div class="names" id="names"></div>
  </div>
  <div class="scene-now" id="sceneNow">01 Form</div>
  <button class="cbtn" id="speedBtn" type="button" aria-label="Playback speed 1x">1×</button>
  <button class="cbtn" id="soundBtn" type="button" aria-pressed="false" aria-label="Sound cues, off"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="sndPath" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2-3.7v7.4a4.5 4.5 0 0 0 2-3.7z"/></svg></button>
</div>

<script>
(function(){
'use strict';
var W=1920,H=1080,DUR=30;
var CREAM='#f4ecd8',INK='#14110f',VERM='#ff4b2b',COB='#2340ff',SUN='#ffc233';
var HEAVY='Impact,"Arial Black","Haettenschweiler","Franklin Gothic Heavy","Nimbus Sans","Helvetica Neue",Arial,sans-serif';
var MONO='ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace';
var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
var PI=Math.PI,TAU=PI*2;

/* ================= easing (hand-implemented) ================= */
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function lerp(a,b,t){return a+(b-a)*t;}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}
var E={
  lin:function(x){return x;},
  inQ:function(x){return x*x;},
  outQ:function(x){return 1-(1-x)*(1-x);},
  inC:function(x){return x*x*x;},
  outC:function(x){var y=1-x;return 1-y*y*y;},
  ioC:function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;},
  outB:function(x){var c1=1.70158,c3=c1+1,y=x-1;return 1+c3*y*y*y+c1*y*y;},
  inB:function(x){var c1=1.70158,c3=c1+1;return c3*x*x*x-c1*x*x;},
  outE:function(x){if(x<=0)return 0;if(x>=1)return 1;return Math.pow(2,-10*x)*Math.sin((x*10-.75)*(TAU/3))+1;},
  outX:function(x){return x>=1?1:1-Math.pow(2,-10*x);},
  inX:function(x){return x<=0?0:Math.pow(2,10*x-10);},
  ioX:function(x){if(x<=0)return 0;if(x>=1)return 1;return x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2;},
  outBo:function(x){var n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d){x-=1.5/d;return n*x*x+.75;}if(x<2.5/d){x-=2.25/d;return n*x*x+.9375;}x-=2.625/d;return n*x*x+.984375;}
};
function mixHex(a,b,t){
  var pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);
  var r=lerp(pa>>16,pb>>16,t)|0,g=lerp((pa>>8)&255,(pb>>8)&255,t)|0,bl=lerp(pa&255,pb&255,t)|0;
  return 'rgb('+r+','+g+','+bl+')';
}

/* ================= canvas ================= */
var cv=document.getElementById('cv'),c=cv.getContext('2d');
var stage=document.getElementById('stage');
var scaleK=1;
function fit(){
  var r=stage.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.max(320,Math.min(1920,Math.round(r.width*dpr)));
  var h=Math.round(w*9/16);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  scaleK=w/W;
  if(!playing)render(T);
}

/* ================= text helpers ================= */
function setFont(px){c.font='900 '+px+'px '+HEAVY;}
var capRatio=0.72;
function capOf(px){setFont(100);var m=c.measureText('H');var a=m.actualBoundingBoxAscent;capRatio=(a&&a>40&&a<100)?a/100:0.72;return px*capRatio;}
function fitFont(word,targetW){setFont(100);var w=c.measureText(word).width;return 100*targetW/w;}
function textW(s){return c.measureText(s).width;}
function chip(x,y,text,align){
  c.font='500 19px '+MONO;
  if('letterSpacing' in c)c.letterSpacing='3px';
  var w=Math.ceil(c.measureText(text).width)+24,h=34;
  var rx=align==='r'?x-w:x;
  c.fillStyle=INK;c.fillRect(Math.round(rx),Math.round(y),w,h);
  c.fillStyle=CREAM;c.textBaseline='middle';c.textAlign='left';
  c.fillText(text,Math.round(rx)+12,Math.round(y)+h/2+1);
  if('letterSpacing' in c)c.letterSpacing='0px';
}

/* ================= SCENE 1 — FORM ================= */
var S1_R=250,S1_W=30;
function scene1(t){
  c.fillStyle=INK;c.fillRect(0,0,W,H);
  var cx=960,cy=540;
  var fs=440,cap=capOf(fs);setFont(fs);
  var word='FORM',gap=14,ws=[],tot=0,i;
  for(i=0;i<4;i++){ws[i]=textW(word[i]);tot+=ws[i];}
  tot+=gap*3;
  var x0=cx-tot/2,base=cy+cap/2+20,xs=[],xc=[],acc=x0;
  for(i=0;i<4;i++){xs[i]=acc;xc[i]=acc+ws[i]/2;acc+=ws[i]+gap;}
  var rotEnd=.9;
  /* dot -> disc -> ring */
  if(t<1.8){
    var dotR=t<.95?9*E.outB(seg(t,.35,.75)):0;
    if(t>=.35&&t<.95){c.fillStyle=CREAM;c.beginPath();c.arc(cx,cy,dotR,0,TAU);c.fill();}
    if(t>=.95){
      var e=E.outX(seg(t,.95,1.75)),R=lerp(9,S1_R,e);
      var ri=Math.max(0,(R-S1_W)*E.outC(seg(t,1.2,1.8)));
      c.fillStyle=CREAM;c.beginPath();c.arc(cx,cy,R,0,TAU);c.arc(cx,cy,ri,0,TAU,true);c.fill('evenodd');
    }
  }
  /* split into arcs */
  if(t>=1.8&&t<2.32){
    var e2=E.ioC(seg(t,1.8,2.3)),rot=e2*rotEnd;
    c.strokeStyle=CREAM;c.lineWidth=S1_W;c.lineCap='butt';
    for(var j=0;j<8;j++){
      var mid=rot+j*PI/4+PI/8,len=(PI/4)*(1-.93*e2);
      c.beginPath();c.arc(cx,cy,S1_R-S1_W/2,mid-len/2,mid+len/2);c.stroke();
    }
  }
  /* bars fly to letter columns, then letters pop */
  if(t>=2.28){
    var capH=cap;
    for(var k=0;k<8;k++){
      var li=k>>1,side=(k&1)?1:-1;
      var tp=3.12+li*.15;
      var p=E.ioC(seg(t,2.3+k*.045,2.3+k*.045+.6));
      var mid2=rotEnd+k*PI/4+PI/8;
      var px=cx+(S1_R-S1_W/2)*Math.cos(mid2),py=cy+(S1_R-S1_W/2)*Math.sin(mid2);
      var tx=xc[li]+side*ws[li]*.2,ty=base-capH/2;
      var a0=((mid2+PI/2)%PI+PI)%PI;
      var ang=lerp(a0,PI/2,p);
      var full=lerp(18,capH,E.outB(p));
      var coll=E.inC(seg(t,tp-.02,tp+.2));
      var len=full*(1-coll);
      if(len<1)continue;
      var bx=lerp(px,tx,p),by=lerp(py,ty,p)+(full-len)/2*p;
      c.save();c.translate(bx,by);c.rotate(ang);c.fillStyle=CREAM;
      c.fillRect(-len/2,-S1_W/2,len,S1_W);c.restore();
    }
    setFont(fs);c.fillStyle=CREAM;c.textAlign='center';c.textBaseline='alphabetic';
    for(i=0;i<4;i++){
      var tpp=3.12+i*.15,s=E.outB(seg(t,tpp,tpp+.42));
      if(s<.002)continue;
      var brea=1+.012*Math.sin(t*2.4+i);
      c.save();c.translate(xc[i],base);c.scale(s*brea,s*brea*(1+(1-seg(t,tpp,tpp+.3))*.25));
      c.fillText(word[i],0,0);c.restore();
    }
    /* caption */
    var ca=E.outC(seg(t,3.75,4.15));
    if(ca>0){
      c.save();c.globalAlpha=ca;c.font='500 26px '+MONO;if('letterSpacing' in c)c.letterSpacing='14px';
      c.fillStyle=VERM;c.textAlign='center';c.textBaseline='alphabetic';
      c.fillText('SHOWREEL 2026',cx+7,base+92-(1-ca)*16);
      if('letterSpacing' in c)c.letterSpacing='0px';c.restore();
    }
  }
  /* iris to cream */
  var ir=E.ioC(seg(t,4.05,4.5));
  if(ir>0){c.fillStyle=CREAM;c.beginPath();c.arc(cx,cy,ir*1250,0,TAU);c.fill();}
}

/* ================= SCENE 2 — Bauhaus grid ================= */
var TILE=240,PX0=480,PY0=60;
/* type: 0 circle 1 half 2 quarter 3 tri 4 ring 5 bars 6 arcs 7 diamond */
var COL={C:CREAM,K:INK,V:VERM,B:COB,S:SUN};
var TILES=[
 {t:0,f:'V',b:'C',r:0},{t:1,f:'B',b:'S',r:0},{t:2,f:'K',b:'C',r:1},{t:3,f:'S',b:'B',r:0},
 {t:6,f:'S',b:'K',r:2},{t:4,f:'C',b:'V',r:0},{t:5,f:'K',b:'S',r:0},{t:1,f:'V',b:'C',r:3},
 {t:3,f:'K',b:'V',r:1},{t:2,f:'S',b:'B',r:3},{t:0,f:'B',b:'S',r:0},{t:7,f:'V',b:'K',r:0},
 {t:1,f:'C',b:'B',r:2},{t:5,f:'V',b:'C',r:0},{t:6,f:'K',b:'S',r:0},{t:0,f:'S',b:'V',r:0}
];
var ORDER=[5,0,10,15,3,12,6,9,1,14,4,11,7,2,13,8];
var ORD=[];(function(){for(var i=0;i<16;i++)ORD[ORDER[i]]=i;})();
function shape(type,fg,bg,s){
  var h=s/2;
  c.fillStyle=bg;c.fillRect(-h,-h,s,s);
  c.fillStyle=fg;
  switch(type){
    case 0:c.beginPath();c.arc(0,0,h*.86,0,TAU);c.fill();break;
    case 1:c.beginPath();c.arc(0,h,h,PI,TAU);c.closePath();c.fill();break;
    case 2:c.beginPath();c.moveTo(-h,h);c.arc(-h,h,s,-PI/2,0);c.closePath();c.fill();break;
    case 3:c.beginPath();c.moveTo(-h,-h);c.lineTo(h,h);c.lineTo(-h,h);c.closePath();c.fill();break;
    case 4:c.beginPath();c.arc(0,0,h*.86,0,TAU);c.arc(0,0,h*.4,0,TAU,true);c.fill('evenodd');break;
    case 5:for(var i=0;i<4;i++)c.fillRect(-h+s*(i*2+.5)/8-s/32,-h,s/8,s);break;
    case 6:
      for(var k=0;k<3;k++){var r0=s*(1-k*.3),r1=r0-s*.15;
        c.beginPath();c.arc(-h,h,r0,-PI/2,0);c.arc(-h,h,r1,0,-PI/2,true);c.closePath();c.fill();}
      break;
    case 7:c.save();c.rotate(PI/4);c.fillRect(-h*.62,-h*.62,h*1.24,h*1.24);c.restore();break;
  }
}
function scene2(t){
  c.fillStyle=CREAM;c.fillRect(0,0,W,H);
  var beat=t>=3.6?Math.floor((t-3.6)/.6)+1:0;
  var bph=t>=3.6?((t-3.6)%.6)/.6:0;
  /* side furniture */
  c.fillStyle=INK;c.textAlign='left';c.textBaseline='alphabetic';
  var la=E.outC(seg(t,.1,.7));
  c.save();c.translate(150,1010);c.rotate(-PI/2);setFont(150);c.globalAlpha=la;c.fillText('SHAPES',0-(1-la)*300,0);c.restore();
  c.globalAlpha=1;
  var ra=E.outC(seg(t,.3,.9));
  c.save();c.globalAlpha=ra;setFont(76);
  c.fillText('FORM',1500,180+(1-ra)*40);c.fillText('FOLLOWS',1500,262+(1-ra)*40);
  c.fillStyle=VERM;c.fillText('RHYTHM',1500,344+(1-ra)*40);c.restore();
  c.fillStyle=INK;c.font='500 22px '+MONO;if('letterSpacing' in c)c.letterSpacing='4px';
  c.fillText('100 BPM · 4/4',1502,410);
  if('letterSpacing' in c)c.letterSpacing='0px';
  /* beat squares */
  for(var q=0;q<4;q++){
    var on=t>=3.6&&((beat-1)%4)===q;
    var pulse=on?1-E.outC(bph):0;
    c.fillStyle=on?VERM:'rgba(20,17,15,.16)';
    var sz=54+pulse*14;
    c.fillRect(1502+q*74-(sz-54)/2,470-(sz-54)/2,sz,sz);
  }
  /* poster frame */
  c.fillStyle=INK;c.fillRect(PX0-10,PY0-10,TILE*4+20,TILE*4+20);
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();
  for(var idx=0;idx<16;idx++){
    var tl=TILES[idx],row=idx>>2,col=idx&3;
    var cx=PX0+col*TILE+TILE/2,cy=PY0+row*TILE+TILE/2;
    var st=.15+ORD[idx]*.2,ts=t-st;
    var mode=idx%4,ox=0,oy=0,rot=0,sc=1;
    if(ts<0)continue;
    var d=.62,p=seg(ts,0,d);
    if(mode===0){oy=-(1-E.outBo(p))*1200;}
    else if(mode===1){var e=E.outC(p);ox=-(1-e)*1300;rot=-ox/(TILE/2)*.9;}
    else if(mode===2){sc=Math.max(.001,E.outE(p));}
    else{rot=-(1-E.outB(p))*PI*1.5;sc=Math.max(.001,E.outC(p));}
    /* beat changes: hard cuts */
    var r=tl.r,fg=tl.f,bg=tl.b,ty=tl.t;
    if(beat>0){
      for(var b=1;b<=beat;b++){
        if((idx+b)%3===0)r++;
        if((idx+b)%4===0){var tmp=fg;fg=bg;bg=tmp;}
      }
    }
    /* exit */
    var ex=seg(t,6.35+((idx*7)%16)*.02,6.8+((idx*7)%16)*.02);
    if(ex>0){sc*=Math.max(.001,1-E.inB(ex));rot+=ex*PI*.5;}
    /* beat kick */
    var kick=(t>=3.6&&t<6.3)?1+.045*(1-E.outC(bph)):1;
    c.save();c.translate(Math.round(cx+ox),Math.round(cy+oy));c.rotate(rot);c.scale(sc*kick,sc*kick);
    c.rotate(r*PI/2);
    shape(ty,COL[fg],COL[bg],TILE);
    c.restore();
  }
  c.restore();
  /* poster hairline */
  c.strokeStyle=INK;c.lineWidth=3;
  var lw=1+(t>=3.6?(1-E.outC(bph))*3:0);
  c.lineWidth=lw;c.strokeRect(PX0-10-lw*2,PY0-10-lw*2,TILE*4+20+lw*4,TILE*4+20+lw*4);
}

/* ================= SCENE 3 — line drawing & morph ================= */
var NP=520;
function cr(pts,per){
  var out=[],n=pts.length;
  for(var i=0;i<n-1;i++){
    var p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,n-1)];
    for(var k=0;k<per;k++){
      var t=k/per,t2=t*t,t3=t2*t;
      out.push([
        .5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),

/* ================= SCENE 5 — radial burst ================= */

  var cx=960,cy=540;

  var step=TAU/48,bph=(t*100/60)%1,pulse=(1-E.outC(bph))*.55;
  var cols=[VERM,CREAM,COB,SUN];
  for(var m=0;m<24;m++){
    var a=rot+m*2*step;
    var w1=step*(1+pulse),w2=step*(1-pulse);

    c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,R,a,a+w1);c.closePath();c.fill();
    c.fillStyle=(m&1)?SUN:CREAM;
    c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,R,a+w1,a+w1+w2);c.closePath();c.fill();
  }

var T=0,playing=!reduce,speed=1,lastNow=0,soundOn=false,ac=null,master=null;

function audioInit(){
  if(ac)return;

    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;

  }catch(e){ac=null;}
}
function sfxCut(){
  if(!soundOn||!ac)return;
  try{
    var t0=ac.currentTime;
    var o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.setValueAtTime(1800,t0);o.frequency.exponentialRampToValueAtTime(700,t0+.05);
    g.gain.setValueAtTime(.35,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.07);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.09);
    var len=Math.floor(ac.sampleRate*.5),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    var s=ac.createBufferSource();s.buffer=buf;
    var bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(400,t0);bp.frequency.exponentialRampToValueAtTime(4200,t0+.4);
    var g2=ac.createGain();g2.gain.setValueAtTime(.0001,t0);g2.gain.exponentialRampToValueAtTime(.5,t0+.14);g2.gain.exponentialRampToValueAtTime(.001,t0+.45);
    s.connect(bp);bp.connect(g2);g2.connect(master);s.start(t0);
  }catch(e){}
}
function sfxTick(){
  if(!soundOn||!ac)return;
  try{
    var t0=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.frequency.value=880;g.gain.setValueAtTime(.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.05);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.06);

}
function crossed(a,b,list,fn){
  for(var i=0;i<list.length;i++){if(a<list[i]&&b>=list[i])fn();}
}
function frame(now){
  var dt=lastNow?Math.min(.1,(now-lastNow)/1000):0;lastNow=now;
  if(playing&&!document.hidden){
    var prev=T;T+=dt*speed;
    if(T>=DUR){T-=DUR;crossed(-1,0,[0],function(){});sfxCut();prev=-1;}
    crossed(prev,T,CUES,sfxCut);crossed(prev,T,BEATS,sfxTick);
    render(T);ui();
  }
  requestAnimationFrame(frame);
}

/* ================= UI ================= */
var bar=document.getElementById('bar'),playBtn=document.getElementById('playBtn'),playIcon=document.getElementById('playIcon');
var tcode=document.getElementById('tcode'),track=document.getElementById('track'),fillEl=document.getElementById('fill'),head=document.getElementById('head');
var names=document.getElementById('names'),sceneNow=document.getElementById('sceneNow'),hint=document.getElementById('hint');
var speedBtn=document.getElementById('speedBtn'),soundBtn=document.getElementById('soundBtn');
var PATH_PLAY='M7 4l13 8-13 8z',PATH_PAUSE='M6 4h4v16H6zM14 4h4v16h-4z';
var nameBtns=[],hintT=0;
(function(){
  for(var i=0;i<SCENES.length;i++){
    var s=SCENES[i];
    var tick=document.createElement('div');tick.className='tick';tick.style.left=(s.a/DUR*100)+'%';track.appendChild(tick);
    var b=document.createElement('button');b.type='button';b.textContent=pad(i+1)+' '+s.n;
    b.style.left=(s.a/DUR*100)+'%';b.setAttribute('aria-label','Jump to scene '+(i+1)+', '+s.n);
    (function(t0){b.addEventListener('click',function(){seek(t0);});})(s.a);
    names.appendChild(b);nameBtns.push(b);
  }
})();
var lastUi='';
function ui(){
  var pct=T/DUR*100;
  fillEl.style.width=pct+'%';head.style.left=pct+'%';
  var si=sceneAt(T),m=Math.floor(T);
  var s='00:'+pad(m);
  if(s!==lastUi){
    lastUi=s;
    tcode.innerHTML='<b>'+s+'</b> <span class="tot">/ 00:30</span>';
    track.setAttribute('aria-valuenow',''+m);track.setAttribute('aria-valuetext',m+' seconds, scene '+(si+1)+' '+SCENES[si].n);
    sceneNow.textContent=pad(si+1)+' '+SCENES[si].n;
    for(var i=0;i<nameBtns.length;i++){if(i===si)nameBtns[i].setAttribute('aria-current','true');else nameBtns[i].removeAttribute('aria-current');}
  }
}
function seek(t){T=clamp(t,0,DUR-.001);render(T);ui();showBar();}
function setPlaying(p){
  playing=p;
  document.getElementById('playBtn').setAttribute('aria-label',p?'Pause':'Play');
  playIcon.innerHTML='<path d="'+(p?PATH_PAUSE:PATH_PLAY)+'"/>';
  hint.textContent=p?'Playing':'Paused';
  hint.classList.add('on');clearTimeout(hintT);hintT=setTimeout(function(){hint.classList.remove('on');},1100);
  lastNow=0;showBar();
}
playBtn.addEventListener('click',function(e){e.stopPropagation();setPlaying(!playing);});
stage.addEventListener('click',function(){setPlaying(!playing);});
var SPEEDS=[.5,1,2],sIdx=1;
speedBtn.addEventListener('click',function(){
  sIdx=(sIdx+1)%3;speed=SPEEDS[sIdx];
  var l=(speed===.5?'0.5':speed)+'×';speedBtn.textContent=l;speedBtn.setAttribute('aria-label','Playback speed '+l);showBar();
});
soundBtn.addEventListener('click',function(){
  soundOn=!soundOn;soundBtn.setAttribute('aria-pressed',soundOn);
  soundBtn.setAttribute('aria-label','Sound cues, '+(soundOn?'on':'off'));
  document.getElementById('sndPath').setAttribute('d',soundOn?'M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2-3.7v7.4a4.5 4.5 0 0 0 2-3.7zM16 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z':'M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2-3.7v7.4a4.5 4.5 0 0 0 2-3.7z');
  if(soundOn){audioInit();try{if(ac&&ac.state==='suspended')ac.resume();}catch(e){}sfxTick();}
  showBar();
});
/* scrubbing */
var scrubbing=false,wasPlaying=false;
function seekFromEvent(e){var r=track.getBoundingClientRect();seek((e.clientX-r.left)/r.width*DUR);}
track.addEventListener('pointerdown',function(e){
  e.stopPropagation();scrubbing=true;wasPlaying=playing;playing=false;
  try{track.setPointerCapture(e.pointerId);}catch(_){}
  seekFromEvent(e);
});
track.addEventListener('pointermove',function(e){if(scrubbing)seekFromEvent(e);});
function endScrub(){if(!scrubbing)return;scrubbing=false;if(wasPlaying)setPlaying(true);}
track.addEventListener('pointerup',endScrub);track.addEventListener('pointercancel',endScrub);
track.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){seek(T+1);e.preventDefault();e.stopPropagation();}
  else if(e.key==='ArrowLeft'){seek(T-1);e.preventDefault();e.stopPropagation();}
  else if(e.key==='Home'){seek(0);e.preventDefault();}
  else if(e.key==='End'){seek(DUR-.5);e.preventDefault();}
});
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k===' '&&e.target===document.body){setPlaying(!playing);e.preventDefault();}
  else if(k==='ArrowRight'&&e.target===document.body){seek(T+2);}
  else if(k==='ArrowLeft'&&e.target===document.body){seek(T-2);}
  else if(k>='1'&&k<='6'){seek(SCENES[+k-1].a+.02);}
  else if(k==='m'||k==='M'){soundBtn.click();}
  else if(k==='s'||k==='S'){speedBtn.click();}
  else if(k==='k'||k==='K'){setPlaying(!playing);}
  showBar();
});
/* auto-hide bar */
var hideTimer=0;
function showBar(){
  bar.classList.remove('hide');clearTimeout(hideTimer);
  hideTimer=setTimeout(function(){
    if(playing&&!scrubbing&&!bar.contains(document.activeElement)&&!bar.matches(':hover'))bar.classList.add('hide');
  },2600);
}
window.addEventListener('pointermove',showBar);
window.addEventListener('touchstart',showBar,{passive:true});
bar.addEventListener('focusin',showBar);

/* grain texture */
(function(){
  try{
    var g=document.createElement('canvas');g.width=g.height=200;var gc=g.getContext('2d'),id=gc.createImageData(200,200),d=id.data;
    for(var i=0;i<d.length;i+=4){var v=(Math.random()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
    gc.putImageData(id,0,0);
    document.getElementById('grain').style.backgroundImage='url('+g.toDataURL('image/png')+')';
  }catch(e){}
})();

if('ResizeObserver' in window){new ResizeObserver(fit).observe(stage);}else window.addEventListener('resize',fit);
fit();
if(reduce){setPlaying(false);hint.textContent='Paused — press play';}
render(T);ui();showBar();
document.addEventListener('visibilitychange',function(){lastNow=0;});
requestAnimationFrame(frame);
window.__reel={seek:seek,play:setPlaying,time:function(){return T;}};
})();
</script>
</body>
