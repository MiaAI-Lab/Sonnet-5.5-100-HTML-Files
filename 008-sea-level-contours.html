<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eadfc4">
<title>Contour: Rising Tides — a survey of the Skerry Isles</title>
<meta name="description" content="An interactive topographic map of a fictional archipelago. Raise the sea from 0 to +12 metres and watch the shoreline recompute, the lowlands flood and the villages turn red.">
<style>
:root{--paper:#eadfc4;--paper2:#e0d3b3;--brown:#8a5a2b;--index:#5e3a17;--sea:#4b8fa8;--shallow:#a6cfd9;--green:#7a8f4a;--red:#b83b2e;--ink:#3b2a17;
--hum:"Gill Sans","Gill Sans MT",Optima,Calibri,"Segoe UI",Ubuntu,Cantarell,sans-serif;
--type:"American Typewriter","Courier New",Courier,"Nimbus Mono PS",monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--hum);-webkit-tap-highlight-color:transparent}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#view{touch-action:none;cursor:crosshair}
.card{position:absolute;background:rgba(238,228,201,.93);border:1.5px solid var(--index);box-shadow:0 0 0 3px rgba(238,228,201,.93),0 0 0 4px rgba(94,58,23,.7),3px 5px 0 4px rgba(59,42,23,.12)}
.title{left:clamp(16px,2.4vw,40px);top:clamp(16px,2.6vh,34px);padding:14px 22px 14px 20px;max-width:min(560px,calc(100vw - 150px));pointer-events:none}
.title h1{margin:0;font:600 clamp(22px,2.6vw,36px)/1.02 var(--hum);font-variant:small-caps;letter-spacing:.09em;color:var(--index);white-space:nowrap}
.title p{margin:8px 0 0;font:400 11px/1.5 var(--type);letter-spacing:.04em;color:var(--brown)}
.legend{left:clamp(16px,2.4vw,40px);bottom:clamp(16px,2.6vh,34px);padding:10px 14px 8px;width:196px;pointer-events:none}
.legend svg{display:block;width:100%;height:auto}
.compass{position:absolute;width:clamp(84px,9vw,132px);left:clamp(230px,17vw,270px);bottom:clamp(10px,2vh,26px);pointer-events:none;opacity:.92}
.scalebar{position:absolute;left:clamp(230px,17vw,270px);bottom:clamp(120px,17vh,168px);width:150px;pointer-events:none}
.panel{right:clamp(14px,2vw,32px);top:50%;transform:translateY(-50%);width:clamp(112px,9.5vw,142px);padding:14px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.panel h2{margin:0;font:600 12px/1 var(--hum);font-variant:small-caps;letter-spacing:.2em;color:var(--index)}
.lvl{font:700 clamp(22px,2.2vw,30px)/1 var(--type);color:var(--index);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.lvl small{font-size:.5em;color:var(--brown);margin-left:2px}
.lvl .sg{color:var(--red);font-size:.55em;display:block;text-align:center;min-height:1.1em;letter-spacing:.02em}
.slider{position:relative;width:64px;height:min(38vh,340px);min-height:180px;touch-action:none;cursor:ns-resize;outline:none}
.slider .rail{position:absolute;left:38px;top:0;bottom:0;width:6px;border:1.2px solid var(--index);background:linear-gradient(180deg,var(--paper) 0,var(--paper2) 100%)}
.slider .fill{position:absolute;left:38px;bottom:0;width:6px;background:var(--sea);border:1.2px solid var(--index);border-top:0;height:0;box-sizing:border-box}
.slider .ticks{position:absolute;left:0;top:0;bottom:0;width:36px}
.slider .ticks i{position:absolute;right:0;height:0;border-top:1.2px solid var(--index);width:9px}
.slider .ticks i.m{width:16px}
.slider .ticks b{position:absolute;left:0;transform:translateY(-50%);font:400 10px/1 var(--type);color:var(--brown)}
.slider .knob{position:absolute;left:24px;width:34px;height:20px;margin-top:-10px;background:var(--paper);border:1.6px solid var(--index);box-shadow:2px 3px 0 rgba(59,42,23,.25);border-radius:2px}
.slider .knob::before{content:"";position:absolute;left:5px;right:5px;top:9px;border-top:1.6px solid var(--red)}
.slider:focus-visible .knob{outline:2px solid var(--red);outline-offset:3px}
.stats{width:100%;display:grid;gap:9px;font:400 10px/1.25 var(--type);color:var(--brown);border-top:1px solid rgba(94,58,23,.5);padding-top:10px}
.stats b{display:block;font:700 17px/1.1 var(--type);color:var(--index);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats .risk b.hot{color:var(--red)}
.surge{width:100%;padding:9px 6px;border:1.6px solid var(--red);background:transparent;color:var(--red);font:700 10.5px/1.2 var(--hum);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s}
.surge:hover:not(:disabled){background:var(--red);color:var(--paper)}
.surge:disabled{opacity:.7;cursor:default;background:rgba(184,59,46,.12);animation:pulse 1s infinite}
.surge:focus-visible{outline:2px solid var(--index);outline-offset:3px}
@keyframes pulse{50%{background:rgba(184,59,46,.28)}}
.tip{position:absolute;left:0;top:0;pointer-events:none;padding:7px 10px 8px;background:rgba(238,228,201,.95);border:1.2px solid var(--index);font:400 11px/1.5 var(--type);color:var(--index);white-space:nowrap;opacity:0;transition:opacity .2s;will-change:transform}
.tip b{color:var(--red)}
.tip.on{opacity:1}
.hint{position:absolute;left:50%;bottom:clamp(14px,2.4vh,28px);transform:translateX(-50%);margin:0;font:italic 400 13px/1.4 var(--hum);color:var(--brown);letter-spacing:.03em;pointer-events:none;transition:opacity 1.4s}
.hint.gone{opacity:0}
.warn{position:absolute;left:50%;top:clamp(16px,3vh,36px);transform:translateX(-50%);padding:6px 16px;border:1.6px solid var(--red);background:rgba(238,228,201,.94);color:var(--red);font:700 12px/1 var(--hum);letter-spacing:.3em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .4s}
.warn.on{opacity:1}
@media (max-width:760px){
  .legend,.compass{display:none}
  .scalebar{left:16px;bottom:16px}
  .panel{width:98px;padding:10px 8px}
  .title{padding:10px 14px}
  .title p{font-size:9.5px}
  .hint{display:none}
  .slider{height:min(30vh,240px)}
}
@media (max-height:640px){.slider{height:min(30vh,200px);min-height:120px}.panel{gap:8px}}
@media (prefers-reduced-motion:reduce){.surge:disabled{animation:none}}
</style>
</head>
<body>
<canvas id="base" aria-hidden="true"></canvas>
<canvas id="view" role="img" aria-label="Topographic map of the fictional Skerry Isles with contour lines, hillshading and a sea that rises with the slider. Move the pointer to read elevation and place names."  tabindex="0"></canvas>

<header class="card title"><h1>Contour: Rising Tides</h1><p>Survey Sheet 4 &middot; the Skerry Isles &middot; contour interval 20 m, index lines every 100 m</p></header>

<div class="card legend" role="group" aria-label="Legend">

<g font-family="Courier New,Courier,monospace" font-size="9.5" fill="#5e3a17">
<line x1="0" y1="26" x2="34" y2="26" stroke="#8a5a2b" stroke-width="1"/><text x="44" y="29">Contour, 20 m</text>

<circle r="46" fill="none" stroke="#5e3a17" stroke-width="1"/><circle r="37" fill="none" stroke="#8a5a2b" stroke-width=".6"/>

<path d="M0-54L6-6 0 0-6-6Z M0 54L-6 6 0 0 6 6Z M-54 0L-6-6 0 0-6 6Z M54 0L6 6 0 0 6-6Z" fill="#5e3a17" opacity=".85"/>
<path d="M0-54L6-6 0 0Z M0 54L-6 6 0 0Z M-54 0L-6-6 0 0Z M54 0L6 6 0 0Z" fill="#eadfc4"/>
<path d="M0-54L6-6 0 0-6-6ZM0 54L-6 6 0 0 6 6ZM-54 0L-6-6 0 0-6 6ZM54 0L6 6 0 0 6-6Z" fill="none" stroke="#5e3a17" stroke-width=".8"/>

<svg class="scalebar" viewBox="0 0 150 34" aria-hidden="true" focusable="false">
<g fill="#eadfc4" stroke="#5e3a17" stroke-width="1"><rect x="4" y="12" width="35" height="7"/><rect x="39" y="12" width="35" height="7" fill="#5e3a17"/><rect x="74" y="12" width="35" height="7"/><rect x="109" y="12" width="35" height="7" fill="#5e3a17"/></g>
<g font-family="Courier New,Courier,monospace" font-size="9" fill="#5e3a17" text-anchor="middle"><text x="4" y="9">0</text><text x="74" y="9">1</text><text x="128" y="9">2 km</text><text x="74" y="31" font-size="8">scale 1 : 25 000</text></g></svg>

<aside class="card panel" aria-label="Sea level controls">
  <h2>Sea level</h2>
  <div class="lvl" id="lvl">+0.0<small>m</small><span class="sg" id="lvlSg">&nbsp;</span></div>
  <div class="slider" id="slider" role="slider" tabindex="0" aria-orientation="vertical" aria-label="Sea level rise in metres" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" aria-valuetext="0.0 metres">
    <div class="ticks" id="ticks"></div><div class="rail"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div>
  </div>
  <div class="stats">
    <div>Land remaining<b id="land">100.0%</b></div>
    <div class="risk">Villages at risk<b id="risk">0 / 5</b></div>
  </div>
  <button class="surge" id="surge" type="button">Storm surge +2 m</button>
</aside>

<p class="warn" id="warn" aria-hidden="true">Storm surge warning</p>
<p class="hint" id="hint">Drag the gauge to raise the sea &middot; move over the map to read the ground</p>
<div class="tip" id="tip" aria-hidden="true"></div>

<script>
(function(){
'use strict';
var doc=document,win=window;
function $(id){return doc.getElementById(id)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function lerp(a,b,t){return a+(b-a)*t}
function sm(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}
var mqR=win.matchMedia('(prefers-reduced-motion: reduce)'),reduce=mqR.matches;
if(mqR.addEventListener)mqR.addEventListener('change',function(e){reduce=e.matches});
var baseC=$('base'),viewC=$('view'),bx=null,vx=null;
try{bx=baseC.getContext('2d');vx=viewC.getContext('2d')}catch(e){}
if(!bx||!vx)return;

/* ---------------------------------------------------------------- noise */
var seed=7;
function hash2(x,y){var n=Math.sin(x*127.1+y*311.7+seed*74.7)*43758.5453;return n-Math.floor(n)}
function vn(x,y){var i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  return lerp(lerp(hash2(i,j),hash2(i+1,j),fx),lerp(hash2(i,j+1),hash2(i+1,j+1),fx),fy)}
function fbm(x,y){return vn(x,y)*.5+vn(x*2.03,y*2.03)*.26+vn(x*4.1,y*4.1)*.15+vn(x*8.3,y*8.3)*.09}
var BLOBS=[[.24,.36,.19,1],[.36,.62,.14,.9],[.5,.3,.12,.8],[.55,.56,.2,1],[.7,.42,.13,.85],[.66,.74,.1,.75],[.16,.66,.09,.7],[.42,.83,.08,.6],[.8,.6,.08,.55]];

/* ---------------------------------------------------------------- state */
var W=0,H=0,dpr=1,cs=4,gw=0,gh=0,ELEV=null,FL=null,QUE=null,LAND0=0,landCount=0;
var level=0,effLevel=-1,surgeT=-1,shore=null,shoreN=0,villages=[],places=[],route=[],shipT=.2;
var wat=doc.createElement('canvas'),watX=wat.getContext('2d'),shim=doc.createElement('canvas'),shimX=shim.getContext('2d'),hatchP=null,tmp=doc.createElement('canvas'),tmpX=tmp.getContext('2d'),small=doc.createElement('canvas'),smallX=small.getContext('2d'),shal=doc.createElement('canvas'),shalX=shal.getContext('2d');
var streak=doc.createElement('canvas');
var ptr={x:-1,y:-1,on:false,kx:0,ky:0};

function elevAt(u,v,asp){
  var m=0;
  for(var i=0;i<BLOBS.length;i++){
    var b=BLOBS[i],dx=(u-b[0])*asp,dy=v-b[1],d=Math.sqrt(dx*dx+dy*dy)/b[2];
    if(d<1.3)m=Math.max(m,b[3]*Math.pow(1-d/1.3,1.25));
  }
  var e=m*.98+(fbm(u*asp*6.5,v*6.5)-.5)*1.05*(.28+m)-.02;
  return e;
}
function build(){
  W=win.innerWidth;H=win.innerHeight;dpr=Math.min(win.devicePixelRatio||1,1.5);
  var pix=W*H*dpr*dpr,cap=3.4e6;if(pix>cap)dpr*=Math.sqrt(cap/pix);
  cs=W*H>1.1e6?5:4;
  baseC.width=viewC.width=Math.round(W*dpr);baseC.height=viewC.height=Math.round(H*dpr);
  gw=Math.ceil(W/cs)+2;gh=Math.ceil(H/cs)+2;
  ELEV=new Float32Array(gw*gh);FL=new Uint8Array(gw*gh);QUE=new Int32Array(gw*gh);
  var asp=W/H,portrait=asp<.85,i,j;
  landCount=0;
  for(j=0;j<gh;j++)for(i=0;i<gw;i++){
    var u=Math.min(1,i*cs/W),v=Math.min(1,j*cs/H),e=portrait?elevAt(v*.8+.1,1-u*.95,1/asp*.9):elevAt(u,v,asp);
    var edge=Math.min(u,v,1-u,1-v);e-=Math.max(0,.09-edge)*4;
    var h;
    if(e>.3){var t=clamp((e-.3)/.7,0,1);h=175*Math.pow(t,1.45)+.15}
    else h=-(.3-e)*170;
    ELEV[j*gw+i]=h;
    if(h>0)landCount++;
  }
  LAND0=landCount;
  placeVillages();
  buildRoute();
  small.width=gw;small.height=gh;shal.width=gw;shal.height=gh;
  wat.width=viewC.width;wat.height=viewC.height;
  buildBase();buildPatterns();
  effLevel=-99;setLevel(level,true);
}

/* ---------------------------------------------------------------- places */
var VN=['Port Calder','Merrow','Saltreach','Hollin Cove','Tarn End'],TARGET=[1.4,3.3,5.6,8.3,10.9];
function placeVillages(){
  villages=[];places=[];
  var used=[],R=0x9e3779b9,rnd=function(){R=(R*1664525+1013904223)|0;return (R>>>8)/16777216};
  for(var k=0;k<5;k++){
    var best=null,bs=1e9;
    for(var n=0;n<9000;n++){
      var i=3+((rnd()*(gw-6))|0),j=3+((rnd()*(gh-6))|0),h=ELEV[j*gw+i];
      if(h<TARGET[k]-.55||h>TARGET[k]+.55)continue;
      var near=false;for(var d=-6;d<=6&&!near;d++)for(var e=-6;e<=6;e++){if(ELEV[(j+d)*gw+i+e]<=0){near=true;break}}
      if(!near)continue;
      var ok=true;for(var q=0;q<used.length;q++){var dx=used[q][0]-i,dy=used[q][1]-j;if(dx*dx+dy*dy<(150/cs)*(150/cs)){ok=false;break}}
      if(!ok)continue;
      var sc=Math.abs(h-TARGET[k])+rnd()*.3;if(sc<bs){bs=sc;best=[i,j,h]}
      if(n>2500&&best)break;
    }
    if(!best){
      for(var t=0;t<gw*gh;t++){var ii=t%gw,jj=(t/gw)|0,hh=ELEV[t];if(hh>TARGET[k]-.9&&hh<TARGET[k]+.9&&ii>3&&jj>3&&ii<gw-3&&jj<gh-3){best=[ii,jj,hh];break}}
    }
    if(best){used.push(best);villages.push({i:best[0],j:best[1],h:best[2],name:VN[k],flooded:false})}
  }
  villages.forEach(function(v){places.push({x:v.i*cs,y:v.j*cs,name:v.name,kind:'village'})});
  /* summits and named waters */
  var peaks=[],sn=['Mt Corrin','Cairn Hollow','The Wether'];
  for(var t2=0;t2<gw*gh;t2+=3){
    var i2=t2%gw,j2=(t2/gw)|0,h2=ELEV[t2];
    if(h2<70||i2<3||j2<3||i2>gw-4||j2>gh-4)continue;
    var top=true;for(var a=-4;a<=4&&top;a+=2)for(var b=-4;b<=4;b+=2)if(ELEV[(j2+a)*gw+i2+b]>h2){top=false;break}
    if(!top)continue;
    var far=true;for(var p=0;p<peaks.length;p++){var ddx=peaks[p].i-i2,ddy=peaks[p].j-j2;if(ddx*ddx+ddy*ddy<(170/cs)*(170/cs)){far=false;break}}
    if(far)peaks.push({i:i2,j:j2,h:h2});
  }
  peaks.sort(function(a,b){return b.h-a.h});
  peaks=peaks.slice(0,3);
  peaks.forEach(function(p,k){places.push({x:p.i*cs,y:p.j*cs,name:sn[k]+' ('+Math.round(p.h)+' m)',kind:'summit'})});
  places.peaks=peaks;
  var wn=[['Sable Bay',.09,.5],['Gannet Sound',.5,.94],['The Narrows',.42,.5],['Corrin Deep',.9,.2]];
  wn.forEach(function(w){places.push({x:w[1]*W,y:w[2]*H,name:w[0],kind:'water'})});
}
function buildRoute(){
  route=[];var m=Math.min(W,H)*.045+18,n=64;
  for(var i=0;i<n;i++){
    var a=i/n*Math.PI*2,c=Math.cos(a),s=Math.sin(a),e=6;
    var x=W/2+Math.sign(c)*Math.pow(Math.abs(c),1/e)*(W/2-m-cs*3),y=H/2+Math.sign(s)*Math.pow(Math.abs(s),1/e)*(H/2-m-cs*3);
    route.push([x,y]);
  }
}

/* ---------------------------------------------------------------- static layers */
function landCol(h,shade,o){
  var t=sm(0,55,h),r=lerp(122,222,t),g=lerp(143,205,t),b=lerp(74,158,t);
  var k=.62+.6*shade;o[0]=clamp(r*k,0,255);o[1]=clamp(g*k,0,255);o[2]=clamp(b*k,0,255);
}
function buildBase(){
  var c=bx,x,y,i,j;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle='#eadfc4';c.fillRect(0,0,W,H);
  /* paper: mottling, fibres and foxing */
  var R=0x51ed270b,rnd=function(){R=(R*1664525+1013904223)|0;return (R>>>8)/16777216};
  for(i=0;i<26;i++){var px=rnd()*W,py=rnd()*H,pr=(60+rnd()*220),g=c.createRadialGradient(px,py,0,px,py,pr);g.addColorStop(0,'rgba(150,110,60,'+(.035+rnd()*.05)+')');g.addColorStop(1,'rgba(150,110,60,0)');c.fillStyle=g;c.fillRect(px-pr,py-pr,pr*2,pr*2)}
  for(i=0;i<2600;i++){c.fillStyle=rnd()<.5?'rgba(120,84,40,'+(.03+rnd()*.05)+')':'rgba(255,250,235,'+(.05+rnd()*.08)+')';c.fillRect(rnd()*W,rnd()*H,.6+rnd()*1.8,.6+rnd()*.9)}
  /* land raster with hillshade, at grid resolution */
  var img=smallX.createImageData(gw,gh),d=img.data,col=[0,0,0];
  for(j=0;j<gh;j++)for(i=0;i<gw;i++){
    var k=j*gw+i,h=ELEV[k];
    if(h<=0){d[k*4+3]=0;continue}

    c.strokeStyle='rgba(234,223,196,.85)';c.lineWidth=3;c.strokeText(v.name,x+8,y-6);c.fillText(v.name,x+8,y-6);
  });
  /* the ship */
  shipT+=dt*(reduce?.004:.011);
  var pf=(shipT%1)*route.length,ia=Math.floor(pf)%route.length,ib=(ia+1)%route.length,ft=pf-Math.floor(pf),p=route[ia],q=route[ib];
  var sx2=lerp(p[0],q[0],ft),sy2=lerp(p[1],q[1],ft)+Math.sin(T*1.6)*.8,ang=Math.atan2(q[1]-p[1],q[0]-p[0]);
  drawShip(c,sx2,sy2,ang,T);
  /* the crosshair */
  if(ptr.on){
    var px=ptr.x,py=ptr.y,g=9;
    c.strokeStyle='rgba(184,59,46,.9)';c.lineWidth=1;c.beginPath();
    c.moveTo(0,py);c.lineTo(px-g,py);c.moveTo(px+g,py);c.lineTo(W,py);c.moveTo(px,0);c.lineTo(px,py-g);c.moveTo(px,py+g);c.lineTo(px,H);c.stroke();
    c.beginPath();c.arc(px,py,g-2,0,6.283);c.stroke();
    c.font='9px "Courier New",monospace';c.fillStyle='#b83b2e';c.textAlign='left';
  }
  updateTip(dt);
}
var rt=0;
win.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(build,180)});
placeKnob();build();
requestAnimationFrame(function(t){last=t;frame(t)});
})();
</script>
