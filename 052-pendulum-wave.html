<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendulum Wave — twenty pendulums, one cycle</title>
<meta name="description" content="Twenty pendulums, each a little slower than the last, drift through travelling waves, standing waves and apparent chaos before re-aligning exactly.">
<style>
:root{
  --bg:#07070b; --ink:#ece6da; --dim:rgba(236,230,218,.56); --faint:rgba(236,230,218,.22); --line:rgba(236,230,218,.12);
  --brass:#d8b26a; --warm:#ffcf8a;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --sans:"Avenir Next",Avenir,"Helvetica Neue","Nimbus Sans","Liberation Sans",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;font:400 13px/1.4 var(--mono);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scene{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;pointer-events:none}
.title{left:clamp(16px,3vw,40px);top:clamp(14px,2.6vh,30px)}
h1{margin:0;font:300 clamp(15px,1.5vw,20px)/1 var(--sans);letter-spacing:.42em;text-transform:uppercase}
.title p{margin:9px 0 0;color:var(--dim);font-size:11.5px;letter-spacing:.06em}
.eq{color:var(--brass)}
.views{right:clamp(16px,3vw,40px);top:clamp(12px,2.4vh,26px);display:flex;gap:8px;pointer-events:auto;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:rgba(10,10,14,.6);backdrop-filter:blur(8px)}
.seg button,.ico{appearance:none;background:none;border:0;color:var(--dim);font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:10px 14px;border-radius:99px;cursor:pointer;min-height:38px;transition:background .3s,color .3s}
.seg button[aria-pressed="true"]{background:rgba(255,207,138,.16);color:var(--warm)}
.ico{border:1px solid var(--line);width:44px;height:44px;padding:0;display:grid;place-items:center;background:rgba(10,10,14,.6)}
.ico[aria-pressed="true"]{color:var(--warm);border-color:rgba(255,207,138,.5)}
.ico svg{width:18px;height:18px}
.read{left:clamp(16px,3vw,40px);bottom:12px;color:var(--dim);font-size:11.5px;letter-spacing:.08em;min-height:1.4em}
.read b{color:var(--ink);font-weight:400}
.phase{right:clamp(16px,3vw,40px);bottom:12px;text-align:right;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--warm)}
.dock{border-top:1px solid var(--line);background:linear-gradient(#0a0a10,#07070b);padding:10px clamp(14px,3vw,40px) max(12px,env(safe-area-inset-bottom))}
.tl{position:relative;height:40px;margin-bottom:8px;cursor:ew-resize;touch-action:none;outline-offset:2px}
.tl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.row{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.ctl{display:flex;align-items:center;gap:12px;flex:1 1 230px;min-width:0}
.ctl label{color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;white-space:nowrap}
.ctl output{min-width:5.5ch;text-align:right;color:var(--ink)}
input[type=range]{flex:1;min-width:80px;appearance:none;-webkit-appearance:none;height:30px;background:transparent;cursor:pointer;--f:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--warm) var(--f),var(--line) var(--f))}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--warm)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:var(--warm);border:0;box-shadow:0 0 12px rgba(255,207,138,.6)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--warm);border:0;box-shadow:0 0 12px rgba(255,207,138,.6)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink);font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:0 16px;min-height:44px;border-radius:99px;cursor:pointer;transition:background .3s,border-color .3s}
.btn:hover{border-color:rgba(255,207,138,.5);background:rgba(255,207,138,.08)}
.btn.primary{border-color:rgba(255,207,138,.55);color:var(--warm)}
@media (max-width:700px){
  .title p{display:none}
  h1{font-size:12px;letter-spacing:.2em}
  .title{top:18px}
  .views{gap:6px}
  .ico{width:40px;height:40px}
  .seg button{padding:10px 10px}
  .phase{bottom:10px}.read{bottom:28px}
  .ctl{flex:1 1 100%}
  .btn{padding:0 12px;flex:1}
  .btns{width:100%}
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <canvas id="cv" role="img" aria-label="Twenty pendulums of increasing frequency swinging from a brass rail, forming evolving wave patterns"></canvas>
  <div class="hud title"><h1>Pendulum Wave</h1><p id="sub">x<sub>i</sub>(t) = A·cos(2π(N+i)t/T) <span class="eq">· lengths tuned, nothing coordinated</span></p></div>
  <div class="hud views">
    <div class="seg" role="group" aria-label="View"><button type="button" id="vFront" aria-pressed="true">Front</button><button type="button" id="vTop" aria-pressed="false">Top-down</button></div>
    <button class="ico" type="button" id="bSound" aria-pressed="false" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave" d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11" opacity="0"/></svg></button>
  </div>
  <div class="hud read" id="read"></div>
  <div class="hud phase" id="phase"></div>
</div>
<div class="dock">
  <div class="tl" id="tl" role="slider" tabindex="0" aria-label="Position in the cycle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><svg id="tlsvg" aria-hidden="true"></svg></div>
  <div class="row">
    <div class="ctl"><label for="sT">Cycle time</label><input id="sT" type="range" min="30" max="120" step="1" value="60"><output id="oT">60 s</output></div>
    <div class="ctl"><label for="sN">Pendulums</label><input id="sN" type="range" min="10" max="30" step="1" value="20"><output id="oN">20</output></div>
    <div class="btns"><button class="btn primary" type="button" id="bDrop">Drop all</button><button class="btn" type="button" id="bPause" aria-pressed="false">Pause</button><button class="btn" type="button" id="bBack" aria-label="Step back a quarter second">◂ Step</button><button class="btn" type="button" id="bStep" aria-label="Step forward a quarter second">Step ▸</button></div>
  </div>
</div>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<script>
(() => {
'use strict';
const doc = document, $ = s => doc.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const cv = $('#cv'), ctx = cv.getContext('2d'), scene = $('#scene');
const N0 = 24, THMAX = .46;
const STOPS = ['#ff6b6b', '#ffb84d', '#c8e86b', '#4dd8c4', '#59a6ff', '#a78bff'].map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));

let n = 20, T = 60, u = 0, paused = false, view = 0, viewT = 0, held = true, hold0 = 0, releaseAt = null, lastU = 0;
let W = 0, H = 0, DPR = 1, bobs = [], sprites = [], hover = -1, shine = 0;

/* ---------- audio: pentatonic marimba, opt-in ---------- */

const PENT = [0, 2, 4, 7, 9];
function freqOf(i) { const step = Math.floor(i * 20 / n), midi = 45 + PENT[step % 5] + 12 * Math.floor(step / 5); return 440 * Math.pow(2, (midi - 69) / 12); }

/* ---------- geometry ---------- */
function layout() {
  const r = scene.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);

}
function buildSprites() {

  for (let i = 0; i < n; i++) {
    const c = colAt(n > 1 ? i / (n - 1) : 0), s = 96, k = doc.createElement('canvas'); k.width = k.height = s; const g = k.getContext('2d');
    let gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, `rgba(${c},.95)`); gr.addColorStop(.18, `rgba(${c},.55)`); gr.addColorStop(.5, `rgba(${c},.14)`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    const b = doc.createElement('canvas'); b.width = b.height = 64; const h = b.getContext('2d');
    gr = h.createRadialGradient(24, 22, 1, 32, 32, 30);

/* projection: world x right, y up, z toward viewer; camera yaw around y, pitch around x */
const P = { x: 0, y: 0, s: 1, d: 0 };
let cs = 1, ccx = 0, ccy = 0, sy = 0, cy_ = 1, sp = 0, cp = 1, DIST = 2200;
function setCam() {

  sy = Math.sin(camYaw); cy_ = Math.cos(camYaw); sp = Math.sin(camPitch); cp = Math.cos(camPitch);
  DIST = lerp(2000, 5200, e);
}
const RW = () => Math.min(W * .84, 1500), SP = () => RW() / (n - 1);
const L0 = () => clamp(Math.min(H * (W < 620 ? .56 : .5), RW() * .55), 120, 620);
const lenOf = i => L0() * Math.pow(N0 / (N0 + i), 2) * 1.0 + L0() * .06;

}
const A_ = { x: 0, y: 0, s: 1, d: 0 }, B_ = { x: 0, y: 0, s: 1, d: 0 }, C_ = { x: 0, y: 0, s: 1, d: 0 };
/* analytic motion; held pendulums sit at full extension until released */
function relOf(i) { return releaseAt ? releaseAt[i] : 0; }
function thetaAt(i, uu) {

function bobPos(i, uu, out) {

/* ---------- drawing ---------- */
function bg() {

  ctx.stroke();

  ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = 1;
  for (const i of order) {
    const x = (i - (n - 1) / 2) * SPc; proj(x, RAILY(), 0, A_); const p = pos[i];
    ctx.strokeStyle = `rgba(236,230,218,${i === hover ? .7 : .3})`; ctx.beginPath(); ctx.moveTo(A_.x, A_.y); ctx.lineTo(p.x, p.y); ctx.stroke();

const releaseGap = () => .11;

/* ---------- timeline HUD ---------- */

  head = mk('g', {}); const l = doc.createElementNS(NSV, 'line'); l.setAttribute('y1', 4); l.setAttribute('y2', 30); l.setAttribute('stroke', '#ffcf8a'); l.setAttribute('stroke-width', 1.5); head.appendChild(l);

function tlSet() { if (head) head.setAttribute('transform', `translate(${(((u % 1) + 1) % 1) * tlW},0)`); }
let scrub = false;
function scrubTo(e) { const r = tl.getBoundingClientRect(); const f = clamp((e.clientX - r.left) / r.width, 0, .9999); u = Math.floor(u) + f; resetM(); }
tl.addEventListener('pointerdown', e => { scrub = true; tl.setPointerCapture(e.pointerId); scrubTo(e); });
tl.addEventListener('pointermove', e => { if (scrub) scrubTo(e); });
['pointerup', 'pointercancel'].forEach(t => tl.addEventListener(t, () => { scrub = false; }));
tl.addEventListener('keydown', e => { const s = e.shiftKey ? .05 : .01; if (e.key === 'ArrowRight') u += s; else if (e.key === 'ArrowLeft') u -= s; else return; e.preventDefault(); resetM(); });

/* ---------- controls ---------- */
const sT = $('#sT'), sN = $('#sN'), oT = $('#oT'), oN = $('#oN'), readEl = $('#read'), phaseEl = $('#phase'), live = $('#live');
const fill = i => i.style.setProperty('--f', ((i.value - i.min) / (i.max - i.min) * 100) + '%');
function applyT() { T = +sT.value; oT.textContent = T + ' s'; fill(sT); buildTl(); refreshRead(); }
function applyN() { n = +sN.value; oN.textContent = n; fill(sN); buildSprites(); if (releaseAt) makeRelease(false); hover = -1; resetM(); refreshRead(); }
sT.addEventListener('input', applyT); sN.addEventListener('input', applyN);
function resetM() { prevM = []; for (let i = 0; i < 40; i++) prevM.push(Math.floor(2 * (N0 + i) * u - .5)); }
function setView(v) {

  $('#vFront').setAttribute('aria-pressed', to ? 'false' : 'true'); $('#vTop').setAttribute('aria-pressed', to ? 'true' : 'false');
  if (RM.matches) view = to; live.textContent = to ? 'Top-down view' : 'Front view';
}
$('#vFront').addEventListener('click', () => setView('front')); $('#vTop').addEventListener('click', () => setView('top'));
function makeRelease(reset) {

  const base = reset ? u : hold0;

}
function drop() {

  u = Math.floor(u) + 1 - .06; hold0 = u; makeRelease(true); held = true; shine = 1; resetM();
  const beat = () => {}; void beat; if (paused) togglePause(false); live.textContent = 'Dropping all pendulums';
}
$('#bDrop').addEventListener('click', () => { drop(); });
function togglePause(v) { paused = v === undefined ? !paused : v; const b = $('#bPause'); b.textContent = paused ? 'Play' : 'Pause'; b.setAttribute('aria-pressed', paused ? 'true' : 'false'); }
$('#bPause').addEventListener('click', () => togglePause());
$('#bStep').addEventListener('click', () => { togglePause(true); u += .25 / T; resetM(); });
$('#bBack').addEventListener('click', () => { togglePause(true); u -= .25 / T; resetM(); });
const bs = $('#bSound');
bs.addEventListener('click', () => {
  if (!soundOn) { if (!initAudio()) return; soundOn = true; ac.resume && ac.resume(); setTimeout(() => note(Math.floor(n / 2)), 30); } else soundOn = false;
  bs.setAttribute('aria-pressed', soundOn ? 'true' : 'false'); $('#wave').setAttribute('opacity', soundOn ? 1 : 0); live.textContent = soundOn ? 'Sound on' : 'Sound off'; resetM();
});
doc.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName) || e.target === tl) return;
  if (e.key === ' ' && !/BUTTON/.test(e.target.tagName)) { e.preventDefault(); togglePause(); }
  else if (e.key === 'v' || e.key === 'V') setView(viewT ? 'front' : 'top');
  else if (e.key === 'd' || e.key === 'D') drop();
  else if (e.key === 's' || e.key === 'S') bs.click();
  else if (e.key === 'ArrowRight' && !/BUTTON/.test(e.target.tagName)) $('#bStep').click();
  else if (e.key === 'ArrowLeft' && !/BUTTON/.test(e.target.tagName)) $('#bBack').click();
});
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top; let best = -1, bd = 26 * 26;
  for (let i = 0; i < n; i++) { const p = bobPos(i, u, {}); const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = i; } }
  hover = best;
});

cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; let best = -1, bd = 34 * 34; for (let i = 0; i < n; i++) { const p = bobPos(i, u, {}); const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = i; } } hover = best; if (best >= 0) note(best); });
function refreshRead() {
  const fmt = i => (N0 + i).toFixed(1) + ' osc / ' + T + ' s';
  if (hover >= 0) readEl.innerHTML = `<b>#${String(hover + 1).padStart(2, '0')}</b> · ${fmt(hover)} · period ${(T / (N0 + hover)).toFixed(2)} s · ${((N0 + hover) / T).toFixed(3)} Hz`;

function phaseName(f) { for (const p of PHASES) if (f >= p[0] && f < p[1]) return p[2]; return PHASES[3][2]; }

/* ---------- loop ---------- */
let last = 0, raf = 0, hv = -2, txt = '';

if (RM.matches) { sT.value = 120; applyT(); }

if (!RM.matches) { u = -.02; hold0 = u; makeRelease(true); held = true; } else { releaseAt = null; held = false; }
