<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make a Wish — A Dandelion at Golden Hour</title>
<meta name="description" content="An interactive dandelion seed head at golden hour. Press and hold to blow, and watch two hundred and twenty wishes drift away across an out-of-focus meadow.">
<style>
:root{
  --apricot:#ffd9a8; --sage:#a9c79a; --sky:#cfe8f2; --cream:#fff7e6; --seed:#fffdf6;
  --ink:#34412b; --ink2:#5b6a50; --gold:#f2b84b; --moss:#6f8f62;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Bookman",Georgia,serif;
  --sans:"Avenir Next",Avenir,"Helvetica Neue",Helvetica,"Nimbus Sans",Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#b9cfa6;color:var(--ink);font-family:var(--sans);overflow:hidden;
  min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas#c.blowing{cursor:grabbing}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:999px}
canvas#c:focus-visible{outline:2px solid rgba(52,65,43,.55);outline-offset:-6px;border-radius:0}

/* soft photographic finish over the canvas */
.vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 46%,transparent 52%,rgba(52,72,44,.28) 100%),
             linear-gradient(180deg,rgba(255,244,222,.16),transparent 30%)}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:soft-light}
.grain svg{width:100%;height:100%;display:block}

/* ---------- copy ---------- */
.ui{position:fixed;left:0;right:0;z-index:5;pointer-events:none;padding:clamp(18px,3.2vw,44px)}
.top{top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-top:max(clamp(18px,3.2vw,44px),env(safe-area-inset-top))}
.eyebrow{display:block;font:600 10px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px}
h1{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(34px,5.2vw,78px);line-height:.95;letter-spacing:-.01em;color:var(--ink);text-shadow:0 1px 24px rgba(255,247,230,.7)}
.count{text-align:right;font-family:var(--sans);color:var(--ink)}
.count .label{display:block;font:600 10px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.count .num{font:300 clamp(34px,4.6vw,66px)/.9 var(--serif);font-style:italic;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.count .of{font:600 10px/1 var(--sans);letter-spacing:.2em;color:var(--ink2);margin-left:8px}
.count .bar{display:block;height:2px;margin:12px 0 0 auto;width:min(150px,30vw);background:rgba(52,65,43,.18);border-radius:2px;overflow:hidden}
.count .bar i{display:block;height:100%;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}

.wish{position:fixed;left:50%;bottom:clamp(96px,18vh,190px);z-index:4;transform:translateX(-50%);pointer-events:none;
  font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(30px,5.4vw,84px);white-space:nowrap;color:#fffaf0;
  text-shadow:0 2px 30px rgba(120,90,40,.45),0 0 2px rgba(120,90,40,.25);opacity:0;letter-spacing:.02em;filter:blur(8px);
  transition:opacity 1.4s var(--ease),filter 1.4s var(--ease),letter-spacing 2.4s var(--ease)}
.wish.on{opacity:1;filter:blur(0);letter-spacing:.09em}

.bottom{bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:max(clamp(18px,3.2vw,44px),env(safe-area-inset-bottom))}
.hint{font:600 10px/1.6 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:12px;transition:opacity 1s var(--ease)}
.hint i{width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.8;animation:breathe 2.6s ease-in-out infinite}
.hint.off{opacity:0}
@keyframes breathe{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1.15);opacity:.9}}
.dock{display:flex;gap:10px;align-items:center;pointer-events:auto}
.pill{appearance:none;border:1px solid rgba(255,255,255,.65);background:rgba(255,247,230,.42);color:var(--ink);
  -webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2);
  font:600 10px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;height:44px;padding:0 20px;border-radius:999px;cursor:pointer;
  box-shadow:0 10px 30px -12px rgba(60,80,40,.45),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .4s var(--ease),background-color .3s,opacity .6s var(--ease)}
.pill:hover{background:rgba(255,247,230,.7);transform:translateY(-2px)}
.pill:active{transform:translateY(0)}
#grow{opacity:0;pointer-events:none;transform:translateY(8px)}
#grow.show{opacity:1;pointer-events:auto;transform:none}
#snd{width:44px;padding:0;display:grid;place-items:center}
#snd svg{width:20px;height:20px}
#snd .wave{transition:opacity .3s}
#snd[aria-pressed="false"] .wave{opacity:.25}
.floaters{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.phrase{position:absolute;transform:translate(-50%,0);font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(17px,2.1vw,30px);color:#fffaf0;white-space:nowrap;
  text-shadow:0 1px 14px rgba(90,70,30,.55),0 0 2px rgba(90,70,30,.3);opacity:0;animation:rise 7.5s var(--ease) forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,16px);filter:blur(6px)}16%{opacity:.95;filter:blur(0)}70%{opacity:.9}100%{opacity:0;transform:translate(-50%,-92px);filter:blur(3px)}}
@media (max-width:640px){.count .of{display:none}.hint{letter-spacing:.2em;font-size:9px;max-width:60vw}.pill{padding:0 16px}}
@media (prefers-reduced-motion:reduce){
  .hint i{animation:none}
  .phrase{animation-duration:9s}
  .wish{transition-duration:.01s}
}
</style>
</head>

<div class="vig" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"><svg viewBox="0 0 200 200" preserveAspectRatio="none"><filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="200" height="200" filter="url(#g)"/></svg></div>

<header class="ui top">

    <h1>Make a Wish</h1>
  </div>
  <div class="count">
    <span class="label">Wishes released</span>
    <span class="num" id="num">0</span><span class="of" id="of">/ 220</span>

<div class="wish" id="wish" aria-hidden="true">make a wish</div>

  <div class="dock">
    <button class="pill" id="grow" type="button">Grow again</button>
    <button class="pill" id="snd" type="button" aria-pressed="false" aria-label="Wind ambience, currently off">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9h10a3 3 0 1 0-3-3"/><path d="M3 14h14a3 3 0 1 1-3 3"/><path class="wave" d="M3 19.5h6"/></svg>
    </button>
  </div>
</footer>
<p class="sr" id="live" aria-live="polite"></p>

/* =====================================================================

var head={px:0,py:0,R:150,bx:0,by:0,cy:0,L:0,ry:0,rx:.2,sway:0,swayV:0,state:'full',grow:1};

function counter(){
  elNum.textContent=released;
  elBar.style.transform='scaleX('+(released/N).toFixed(3)+')';
  if(released-lastMilestone>=55){lastMilestone=released;live.textContent=released+' wishes released'}
}
function detach(i){
  var f=spawnFlyer(i);
  sd.alive[i]=0;hubOn[i]=0;alive--;released++;
  if(f)spark(f.x,f.y,2,26);
  head.swayV+=rnd(-.012,.012);
  counter();
  if(alive===0)onAllGone();
}
function updateSeeds(dt){
  if(alive===0||head.state==='growing'&&head.grow<.9)return;
  var i;
  if(gust>.1){
    var g=(gust-.1)/.9, lam=11*Math.pow(g,1.5), dir=hoverG>pressG?hoverDir:blowDir;
    if(!everBlown){everBlown=true;elHint.classList.add('off')}
    quietT=0;elWish.textContent='make a wish';elWish.classList.add('on');
    for(i=0;i<N;i++){
      if(!sd.alive[i]||!hubOn[i])continue;
      var al=hubOX[i]*dir.x+hubOY[i]*dir.y, align=.15+.85*smooth(-.6,.9,al), h=lam*align/sd.grip[i];
      if(alive<16)h*=2.4;
      if(Math.random()<1-Math.exp(-h*dt))detach(i);
    }
  }else{
    quietT+=dt;if(quietT>2.4)elWish.classList.remove('on');
    if(!everBlown&&!reduce&&alive>N-14&&head.state==='full'){
      idleT-=dt;
      if(idleT<=0){idleT=rnd(5,9);var c=(Math.random()*N)|0,tries=0;while((!sd.alive[c]||!hubOn[c])&&tries++<40)c=(Math.random()*N)|0;if(sd.alive[c]&&hubOn[c])detach(c)}
    }
  }
}
function onAllGone(){
  head.state='bare';allGoneT=0;
  btnGrow.classList.add('show');btnGrow.tabIndex=0;
  live.textContent='All two hundred and twenty wishes have been released.';
  setTimeout(function(){if(head.state==='bare'){elWish.textContent='they are out there now';elWish.classList.add('on');quietT=-1.5}},1300);
}
function startRegrow(){
  if(head.state==='growing')return;
  head.state='growing';head.grow=0;alive=N;released=0;lastMilestone=0;
  for(var i=0;i<N;i++){sd.alive[i]=1;sd.start[i]=Math.random()*.25}
  btnGrow.classList.remove('show');btnGrow.tabIndex=-1;
  elWish.classList.remove('on');counter();
  elHint.classList.add('off');
}
btnGrow.addEventListener('click',startRegrow);
function updateGrow(dt){
  if(head.state==='bare'){allGoneT+=dt;if(allGoneT>6)startRegrow()}
  else if(head.state==='growing'){
    head.grow+=dt/(reduce?4.5:8);
    if(head.grow>=1){head.grow=1;head.state='full';elHintTxt.textContent='Press & hold to blow again';elHint.classList.remove('off')}
  }
}

/* ---------- soft wind ambience (WebAudio), off by default ---------- */
var audio={ctx:null,on:false,gain:null,filt:null};
function audioInit(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    var c=new AC(), len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0), b=0, i;
    for(i=0;i<len;i++){b=.985*b+.015*(Math.random()*2-1);d[i]=b*7}
    var src=c.createBufferSource();src.buffer=buf;src.loop=true;
    var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=.7;
    var g=c.createGain();g.gain.value=0;
    src.connect(f);f.connect(g);g.connect(c.destination);src.start();
    audio.ctx=c;audio.gain=g;audio.filt=f;return true;
  }catch(e){return false}
}
btnSnd.addEventListener('click',function(){
  if(!audio.ctx&&!audioInit())return;
  audio.on=!audio.on;
  try{if(audio.on&&audio.ctx.state==='suspended')audio.ctx.resume()}catch(e){}
  btnSnd.setAttribute('aria-pressed',audio.on?'true':'false');
  btnSnd.setAttribute('aria-label','Wind ambience, currently '+(audio.on?'on':'off'));
  if(!audio.on)audio.gain.gain.setTargetAtTime(0,audio.ctx.currentTime,.25);
});
function updateAudio(){
  if(!audio.on||!audio.ctx)return;
  var t=audio.ctx.currentTime;
  audio.gain.gain.setTargetAtTime(.03+.15*gust+.012*Math.sin(T*.7),t,.18);
  audio.filt.frequency.setTargetAtTime(360+gust*820+110*Math.sin(T*.4),t,.25);
}
var PENT=[523.25,587.33,659.25,783.99,880,1046.5];
window.__chime=function(){
  if(!audio.on||!audio.ctx)return;
  try{
    var c=audio.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=PENT[(Math.random()*PENT.length)|0]*(Math.random()<.4?.5:1);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+2.3);
  }catch(e){}
};

/* ---------- sizing and the frame loop ---------- */
function resize(){
  W=Math.max(320,window.innerWidth);H=Math.max(320,window.innerHeight);
  DPR=Math.min(window.devicePixelRatio||1,W*H>2.2e6?1.5:2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  scaleK=Math.min(W,H)/900;if(scaleK<.5)scaleK=.5;
  bdC.width=Math.max(2,Math.round(W*BDS));bdC.height=Math.max(2,Math.round(H*BDS));bdTick=0;
  layout();paintBG();paintFG();updateHead(0);
}
var rz=0;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(resize,80)});
var last=0, avg=.016;
function frame(now){
  window.requestAnimationFrame(frame);
  if(doc.hidden){last=0;return}
  var dt=last?Math.min(.033,(now-last)/1000):.016;last=now;T+=dt;
  avg+=(dt-avg)*.04;
  if(avg>.03&&quality>.5)quality-=.004;else if(avg<.021&&quality<1)quality+=.0015;
  updateWind(dt);updateHead(dt);updateGrow(dt);updateSeeds(dt);updateFly(dt);updateSparks(dt);updateAudio();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackdrop(dt);
  drawFly(0);drawHead();drawFly(1);drawSparks();
  drawForeground(Math.sin(T*.6)*(reduce?.3:.7)+blowDir.x*gust*2.2);
}
resize();counter();
window.requestAnimationFrame(frame);
})();
</script>
