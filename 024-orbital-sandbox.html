<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbits — An N-Body Gravity Sandbox</title>
<meta name="description" content="Orbits: a clean n-body gravity sandbox. Drag to launch planets, watch predicted trajectories, merge worlds, slingshot probes and try the figure-8 three-body orbit.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101215">
<style>
:root{
  --bg:#101215; --ink:#fff4e0; --dim:rgba(255,244,224,.56); --faint:rgba(255,244,224,.16); --line:rgba(255,244,224,.22);
  --coral:#ff7a59; --cyan:#56d4e0; --sand:#e9d8a6; --lilac:#b8a1ff;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --hum:"Gill Sans","Gill Sans MT",Optima,Calibri,"Segoe UI","Ubuntu Sans",Ubuntu,Cantarell,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font-family:var(--hum);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.lab{font:500 10px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ui{position:fixed;pointer-events:none;z-index:5}
.ui>*{pointer-events:auto}

/* head: title + year numeral + rail */
.head{left:clamp(14px,2.4vw,32px);top:clamp(12px,2.4vw,28px);width:min(280px,calc(100vw - 28px));display:flex;flex-direction:column;gap:10px;max-height:calc(100dvh - 150px)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:20px;height:20px}
.year{font:200 clamp(56px,8.6vw,124px)/.9 var(--hum);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px;pointer-events:none}
.year small{font:500 11px var(--mono);letter-spacing:.2em;margin-left:8px;color:var(--dim)}
.rail{display:flex;flex-direction:column;margin-top:6px;border-top:1px solid var(--line);overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
.rail-h{display:flex;justify-content:space-between;padding:10px 0 6px}
.row{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid rgba(255,244,224,.07);cursor:pointer;background:none;text-align:left;border-left:0;border-right:0;border-top:0;width:100%}
.row:hover,.row.foc{background:rgba(255,244,224,.06)}
.row.foc{box-shadow:inset 2px 0 var(--ink)}
.dot{width:10px;height:10px;border-radius:50%}
.row b{font:500 13px/1.1 var(--hum);letter-spacing:.02em}
.row small{display:block;margin-top:3px;font:400 9.5px/1 var(--mono);color:var(--dim);letter-spacing:.04em}
.x{width:26px;height:26px;border-radius:50%;color:var(--dim);font:400 16px/1 var(--hum);display:grid;place-items:center;opacity:.5}
.row:hover .x,.row:focus-within .x{opacity:1}
.x:hover{background:rgba(255,122,89,.25);color:var(--ink)}
.rowwrap{display:flex;align-items:stretch}
.rowwrap .row{flex:1;width:auto}
.rowwrap .x{align-self:center}

/* top right readouts */
.read{right:clamp(14px,2.4vw,32px);top:clamp(12px,2.4vw,28px);display:grid;gap:12px;text-align:right}
.read div b{display:block;margin-top:5px;font:300 clamp(20px,2.4vw,30px)/1 var(--hum);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.read div b i{font:400 11px var(--mono);font-style:normal;color:var(--dim);margin-left:4px}
.hint{right:clamp(14px,2.4vw,32px);top:clamp(150px,20vw,220px);font:400 10px/1.7 var(--mono);color:var(--dim);letter-spacing:.06em;text-align:right;pointer-events:none;max-width:220px}
.toast{left:50%;transform:translateX(-50%);bottom:calc(clamp(84px,9vw,96px) + 10px);font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--ink);background:rgba(16,18,21,.85);border:1px solid var(--line);padding:9px 14px;border-radius:99px;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}

/* bottom toolbar */
.bar{left:50%;transform:translateX(-50%);bottom:clamp(10px,2vw,22px);width:min(1080px,calc(100vw - 20px));display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(16,18,21,.82);border:1px solid var(--line);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:99px;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:none;cursor:pointer;transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
.chip:hover{background:rgba(255,244,224,.1)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sz{display:flex;gap:4px}
.sz .chip{padding:0 11px 0 9px;display:inline-flex;align-items:center;gap:7px}
.sz .chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sz .chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg)}
.ts{display:flex;align-items:center;gap:10px}
.ts output{font:500 10.5px/1 var(--mono);color:var(--dim);min-width:62px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:clamp(90px,12vw,150px);height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);margin-top:-7px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
.rail-toggle{display:none}

@media (max-width:820px){
  .head{width:min(240px,60vw);max-height:none}
  .rail{display:none;position:fixed;left:10px;right:10px;bottom:168px;top:auto;max-height:36dvh;background:rgba(16,18,21,.94);border:1px solid var(--line);border-radius:12px;padding:0 10px}
  .head.open .rail{display:flex}
  .rail-toggle{display:inline-flex;margin-top:2px;align-self:flex-start}
  .hint{display:none}
  .read{gap:8px}
  .bar{gap:8px 10px}
  .grp.presets{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none}
  .toast{bottom:186px}
}
@media (max-width:480px){ .year{font-size:56px} .read div b{font-size:20px} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<h1 class="sr">Orbits, an n-body gravity sandbox</h1>
<canvas id="c" role="img" aria-label="Gravity sandbox: a warm white star with planets orbiting on fading trails. Drag on the canvas to launch a planet; use the toolbar for presets, planet size and time scale."></canvas>

<section class="ui head" id="head" aria-label="Elapsed time and bodies">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#fff4e0" stroke-opacity=".5" stroke-width="1"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#fff4e0" stroke-opacity=".3" stroke-width="1"/><circle cx="12" cy="12" r="2" fill="#fff4e0"/><circle cx="20.2" cy="8" r="1.6" fill="#ff7a59"/></svg><span class="lab">Orbits · n-body sandbox</span></div>
  <div><div class="lab">Elapsed</div><div class="year" id="year">0.00<small>yr</small></div></div>
  <button class="chip rail-toggle" id="railT" type="button" aria-expanded="false" aria-controls="rail">Bodies</button>
  <div class="rail" id="rail" role="group" aria-label="Bodies"><div class="rail-h"><span class="lab">Bodies</span><span class="lab" id="railN">0</span></div><div id="rows"></div></div>
</section>

<section class="ui read" aria-label="Readouts">
  <div><div class="lab">Bodies</div><b id="rN">0</b></div>
  <div><div class="lab">Energy drift</div><b id="rE">0.0000<i>%</i></b></div>
  <div><div class="lab">Time scale</div><b id="rT">0.60<i>yr/s</i></b></div>
</section>
<p class="ui hint" id="hint">Drag to launch · release to fire<br>Click to drop a planet on a circular orbit<br>Wheel or pinch to zoom · Space to pause</p>
<p class="ui toast" id="toast" role="status" aria-live="polite"></p>

<div class="ui bar" role="toolbar" aria-label="Sandbox controls">
  <div class="grp presets" role="group" aria-label="Presets">
    <button class="chip" type="button" data-p="solar">Solar-ish</button>
    <button class="chip" type="button" data-p="binary">Binary star</button>
    <button class="chip" type="button" data-p="fig8">Figure-8 three-body</button>
    <button class="chip" type="button" data-p="sling">Slingshot</button>
  </div>
  <div class="grp sz" role="group" aria-label="Planet size">
    <button class="chip" type="button" data-s="0" style="--c:#ff7a59" aria-pressed="true"><i></i>S</button>
    <button class="chip" type="button" data-s="1" style="--c:#56d4e0" aria-pressed="false"><i></i>M</button>
    <button class="chip" type="button" data-s="2" style="--c:#e9d8a6" aria-pressed="false"><i></i>L</button>
    <button class="chip" type="button" data-s="3" style="--c:#b8a1ff" aria-pressed="false"><i></i>Gas giant</button>
  </div>
  <div class="grp">
    <div class="ts"><label class="lab" for="ts">Time</label><input id="ts" type="range" min="0" max="100" value="55"><output id="tsO" for="ts">0.60 yr/s</output></div>
    <button class="chip" type="button" id="bPause" aria-pressed="false">Pause</button>
    <button class="chip" type="button" id="bTrails" aria-pressed="true">Trails</button>
    <button class="chip" type="button" id="bAdd">+ Planet</button>
    <button class="chip" type="button" id="bClear">Clear</button>
  </div>
</div>

<script>
(function(){
'use strict';
var doc=document, RM=false; try{RM=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
function $(s){return doc.querySelector(s);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rnd(a,b){return a+Math.random()*(b-a);}
var MONO='ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace';
var TAU=Math.PI*2, G=4*Math.PI*Math.PI, EPS2=0.02*0.02;
var cv=$('#c'), ctx=cv.getContext('2d'), W=1,H=1,DPR=1;

/* ---------- classes ---------- */
var CLS=[
 {n:'S',m:1e-5,col:'#ff7a59',names:['Cinder','Ember','Rust','Kiln','Ochre','Flint']},
 {n:'M',m:1e-4,col:'#56d4e0',names:['Tide','Brine','Mist','Glacier','Lagoon','Reef']},
 {n:'L',m:1e-3,col:'#e9d8a6',names:['Dune','Amber','Saffron','Sable','Wheat','Ivory']},
 {n:'G',m:8e-3,col:'#b8a1ff',names:['Iris','Dusk','Wisp','Violet','Nimbus','Aster']}
];
var STARN=['Helia','Sol','Aurum','Vesper','Corona'];
function hexRGB(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function rgbHex(c){function h(n){n=Math.round(clamp(n,0,255));return (n<16?'0':'')+n.toString(16);}return '#'+h(c[0])+h(c[1])+h(c[2]);}

/* ---------- world state ---------- */
var bodies=[], nextId=1, simT=0, E0=0, drift=0, flashes=[], selSize=0, timeScale=0.6, paused=false, trailsOn=true;
var view={x:0,y:0,s:100,zoom:1,ts:100}, focusId=0, aimSlow=1;
var nameCount=0;
function baseScale(){return Math.min(W,H)/2/4.2;}
function radiusAU(m,star){return star?0.06+0.05*Math.pow(m,1/3):0.016+0.034*Math.pow(m/1e-3,1/3);}
var TN=320;
function addBody(o){
  var b={id:nextId++,x:o.x,y:o.y,vx:o.vx,vy:o.vy,m:o.m,star:!!o.star,col:o.col||'#ff7a59',tint:o.tint||null,name:o.name,cls:o.cls|0,
    tx:new Float32Array(TN),ty:new Float32Array(TN),th:0,tc:0,lx:o.x,ly:o.y,born:simT};
  b.r=radiusAU(b.m,b.star); b.rgb=hexRGB(b.col); b.spr=null;
  pushTrail(b,true); bodies.push(b); return b;
}
function pushTrail(b,force){
  if(!force){var dx=b.x-b.lx,dy=b.y-b.ly; if(dx*dx+dy*dy<0.00022)return;}
  b.lx=b.x;b.ly=b.y; b.tx[b.th]=b.x; b.ty[b.th]=b.y; b.th=(b.th+1)%TN; if(b.tc<TN)b.tc++;
}
function pName(cls){nameCount++;var a=CLS[cls].names;return a[(nameCount*7+cls)%a.length]+(nameCount>6?'-'+(1+(nameCount%9)):'');}
function makeStar(x,y,vx,vy,m,tint,name){return addBody({x:x,y:y,vx:vx,vy:vy,m:m,star:true,col:'#fff4e0',tint:tint||'#fff4e0',name:name||STARN[nameCount++%STARN.length]});}
function makePlanet(x,y,vx,vy,cls){return addBody({x:x,y:y,vx:vx,vy:vy,m:CLS[cls].m,cls:cls,col:CLS[cls].col,name:pName(cls)});}
function circV(px,py,pv,M,x,y,ccw){var dx=x-px,dy=y-py,r=Math.sqrt(dx*dx+dy*dy)||1,v=Math.sqrt(G*M/r);return [pv[0]+(ccw?-dy:dy)/r*v,pv[1]+(ccw?dx:-dx)/r*v];}
function zeroMomentum(){var M=0,px=0,py=0,cx=0,cy=0,i;for(i=0;i<bodies.length;i++){var b=bodies[i];M+=b.m;px+=b.m*b.vx;py+=b.m*b.vy;cx+=b.m*b.x;cy+=b.m*b.y;}
  for(i=0;i<bodies.length;i++){bodies[i].vx-=px/M;bodies[i].vy-=py/M;bodies[i].x-=cx/M;bodies[i].y-=cy/M;bodies[i].lx=bodies[i].x;bodies[i].ly=bodies[i].y;bodies[i].th=0;bodies[i].tc=0;pushTrail(bodies[i],true);}}

/* ---------- presets ---------- */
function reset(){bodies.length=0;flashes.length=0;simT=0;focusId=0;nameCount=0;}
var PRE={
 solar:function(){reset();var s=makeStar(0,0,0,0,1,'#fff4e0','Helia');
  [[0.4,0,0.2],[0.72,1,2.4],[1.0,1,4.1],[1.55,0,5.3],[2.7,3,0.9],[3.6,2,3.4]].forEach(function(p){var a=p[2],x=p[0]*Math.cos(a),y=p[0]*Math.sin(a),c=circV(0,0,[0,0],1+CLS[p[1]].m,x,y,true);makePlanet(x,y,c[0],c[1],p[1]);});zeroMomentum();},
 binary:function(){reset();var m1=.7,m2=.5,M=m1+m2,a=1,vr=Math.sqrt(G*M/a);
  makeStar(-a*m2/M,0,0,-vr*m2/M,m1,'#fff4e0','Helia A'); var s2=makeStar(a*m1/M,0,0,vr*m1/M,m2,'#ffc79a','Helia B'); s2.col='#ffe2c0'; s2.rgb=hexRGB(s2.col);
  var c=circV(0,0,[0,0],M,2.7,0.0,true);makePlanet(2.7,0,c[0],c[1],1);
  c=circV(0,0,[0,0],M,-3.6,0,true);makePlanet(-3.6,0,c[0],c[1],2);
  var px=a*m1/M+0.16,cc=circV(a*m1/M,0,[0,vr*m1/M],m2,px,0,true);makePlanet(px,0,cc[0],cc[1],0);zeroMomentum();},
 fig8:function(){reset();var a=2.0,m=0.4,V=Math.sqrt(G*m/a);
  var p=[[-0.97000436,0.24308753],[0.97000436,-0.24308753],[0,0]],v=[[0.4662036850,0.4323657300],[0.4662036850,0.4323657300],[-0.9324073700,-0.8647314600]],T=['#ff7a59','#56d4e0','#b8a1ff'],N=['Helia α','Helia β','Helia γ'];
  for(var i=0;i<3;i++)makeStar(p[i][0]*a,p[i][1]*a,v[i][0]*V,v[i][1]*V,m,T[i],N[i]);},
 sling:function(){reset();makeStar(0,0,0,0,1,'#fff4e0','Helia');
  var vg=Math.sqrt(G*1.004/2.4);var g=makePlanet(2.4,0,0,vg,3);g.m=0.004;g.r=radiusAU(g.m,false);
  for(var i=0;i<5;i++){var k=i*0.26;makePlanet(3.2-k*(-2.5)/6.5*0.9+0,-2.2-k*0.92,-2.5,6.0,0);}
  bodies[0].vy=-0.004*vg;zeroMomentum();}
};
PRE.sling=function(){reset();makeStar(0,0,0,0,1,'#fff4e0','Helia');
  var vg=Math.sqrt(G*1.004/2.4);var g=makePlanet(2.4,0,0,vg,3);g.m=0.004;g.r=radiusAU(g.m,false);g.name='Nimbus';
  for(var i=0;i<5;i++){var k=i*0.3;makePlanet(3.2+2.5*k*0.14,-2.2-6.0*k*0.14,-2.5,6.0,0);}
  zeroMomentum();};

/* ---------- physics ---------- */
var MAXB=80, X=new Float64Array(MAXB),Y=new Float64Array(MAXB),VX=new Float64Array(MAXB),VY=new Float64Array(MAXB),MM=new Float64Array(MAXB),AX=new Float64Array(MAXB),AY=new Float64Array(MAXB);
function accel(n,x,y,m,ax,ay){
  var i,j,dx,dy,r2,inv,f,minT=1e9;
  for(i=0;i<n;i++){ax[i]=0;ay[i]=0;}
  for(i=0;i<n;i++)for(j=i+1;j<n;j++){
    dx=x[j]-x[i];dy=y[j]-y[i];r2=dx*dx+dy*dy+EPS2;inv=1/(r2*Math.sqrt(r2));
    f=G*m[j]*inv;ax[i]+=dx*f;ay[i]+=dy*f; f=G*m[i]*inv;ax[j]-=dx*f;ay[j]-=dy*f;
    var t=r2*Math.sqrt(r2)/(G*(m[i]+m[j])); if(t<minT)minT=t;
  }
  return minT;
}
function energy(){
  var n=bodies.length,e=0,i,j,b;
  for(i=0;i<n;i++){b=bodies[i];e+=0.5*b.m*(b.vx*b.vx+b.vy*b.vy);for(j=i+1;j<n;j++){var c=bodies[j],dx=c.x-b.x,dy=c.y-b.y;e-=G*b.m*c.m/Math.sqrt(dx*dx+dy*dy+EPS2);}}
  return e;
}
function rebase(){E0=energy();drift=0;}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on');},3200);}
function merge(i,j){
  var a=bodies[i],b=bodies[j]; if(b.m>a.m||(b.star&&!a.star)){var t=a;a=b;b=t;var ti=i;i=j;j=ti;}
  var M=a.m+b.m, w=b.m/M*0.6;
  var nx=(a.x*a.m+b.x*b.m)/M,ny=(a.y*a.m+b.y*b.m)/M,nvx=(a.vx*a.m+b.vx*b.m)/M,nvy=(a.vy*a.m+b.vy*b.m)/M;
  a.x=nx;a.y=ny;a.vx=nvx;a.vy=nvy;a.m=M;a.star=a.star||M>=0.06;
  if(!a.star){a.rgb=[lerp(a.rgb[0],b.rgb[0],w),lerp(a.rgb[1],b.rgb[1],w),lerp(a.rgb[2],b.rgb[2],w)];a.col=rgbHex(a.rgb);a.spr=null;}
  a.r=radiusAU(a.m,a.star);
  flashes.push({x:nx,y:ny,t:0,big:a.star?1.6:1});
  if(flashes.length>16)flashes.shift();
  if(focusId===b.id)focusId=a.id;
  bodies.splice(bodies.indexOf(b),1);
  toast(a.name+' absorbed '+b.name);
  rebase(); listDirty=true;
}
function step(dtSim){
  var n=bodies.length,i,sub=0;
  if(n<1)return;
  var left=dtSim, guard=0;
  while(left>1e-9&&guard++<400){
    n=bodies.length; for(i=0;i<n;i++){var b=bodies[i];X[i]=b.x;Y[i]=b.y;VX[i]=b.vx;VY[i]=b.vy;MM[i]=b.m;}
    var mt=accel(n,X,Y,MM,AX,AY);
    var h=Math.min(0.002,0.02*2*Math.PI*Math.sqrt(mt),left); if(h<1e-5)h=Math.min(1e-5,left);
    // kick-drift-kick
    for(i=0;i<n;i++){VX[i]+=0.5*h*AX[i];VY[i]+=0.5*h*AY[i];X[i]+=h*VX[i];Y[i]+=h*VY[i];}

    var d=doc.createElement('span');d.className='dot';d.style.background=b.star?(b.tint||'#fff4e0'):b.col;if(b.star)d.style.boxShadow='0 0 8px '+(b.tint||'#fff4e0');
    var t=doc.createElement('span');var nm=doc.createElement('b');nm.textContent=b.name;var sm=doc.createElement('small');t.appendChild(nm);t.appendChild(sm);
    var k=doc.createElement('span');k.className='lab';k.textContent=b.star?'star':CLS[b.cls].n==='G'?'giant':'planet';
    r.appendChild(d);r.appendChild(t);r.appendChild(k);
    r.setAttribute('aria-label','Focus '+b.name);
    r.addEventListener('click',function(){focusId=(focusId===b.id)?0:b.id;listDirty=true;});
    r.addEventListener('pointerenter',function(){hover=b.id;});r.addEventListener('pointerleave',function(){hover=0;});
    var x=doc.createElement('button');x.type='button';x.className='x';x.textContent='×';x.setAttribute('aria-label','Remove '+b.name);
    x.addEventListener('click',function(ev){ev.stopPropagation();removeBody(b.id);});
    w.appendChild(r);w.appendChild(x);rowsEl.appendChild(w);rowEls[b.id]=sm;
  });
  $('#railN').textContent=bodies.length;listDirty=false;
}
function updateList(){
  var cx=view.x,cy=view.y;
  bodies.forEach(function(b){var e=rowEls[b.id];if(!e)return;var pr=primaryOf(b.x,b.y,b);var r=pr&&!b.star?Math.hypot(b.x-pr.x,b.y-pr.y):Math.hypot(b.x,b.y);
    e.textContent=(b.m>=0.01?b.m.toFixed(2)+' M☉':b.m.toExponential(1)+' M☉')+' · r '+r.toFixed(2)+' · v '+Math.hypot(b.vx,b.vy).toFixed(1);});
}

/* ---------- main loop ---------- */
var last=0,acc4=0,raf=0,tt=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  if(!last)last=now;
  var dt=Math.min((now-last)/1000,1/30);last=now;tt+=dt;
  aimSlow=lerp(aimSlow,aim?0.12:1,1-Math.exp(-dt*8));
  if(!paused)step(dt*timeScale*aimSlow*(RM?0.6:1));
  if(bodies.length){
    var n=bodies.length,cxm=0,cym=0,M=0,tx,ty,f=null;
    if(focusId){for(var i=0;i<n;i++)if(bodies[i].id===focusId)f=bodies[i];}
    if(f){tx=f.x;ty=f.y;}else{for(i=0;i<n;i++){cxm+=bodies[i].m*bodies[i].x;cym+=bodies[i].m*bodies[i].y;M+=bodies[i].m;}tx=cxm/M;ty=cym/M;}
    var k=1-Math.exp(-dt*(f?4:2.5));view.x+=(tx-view.x)*k;view.y+=(ty-view.y)*k;
  }
  var zs=baseScale()*view.zoom;view.s+=(zs-view.s)*(1-Math.exp(-dt*10));
  if(aim)updateAim();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#101215';ctx.fillRect(0,0,W,H);
  var vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(255,244,224,.035)');vg.addColorStop(1,'rgba(0,0,0,.28)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  drawGrid();drawTrails();drawBodies(tt);drawFlashes(dt);drawAim();
  acc4+=dt;
  if(acc4>0.2){acc4=0;
    if(listDirty)buildList();else updateList();
    var e=energy();if(Math.abs(E0)>1e-12)drift=(e-E0)/Math.abs(E0)*100;
    $('#year').innerHTML=simT.toFixed(2)+'<small>yr</small>';
    $('#rN').textContent=bodies.length;$('#rE').innerHTML=(drift>=0?'+':'−')+Math.abs(drift).toFixed(4)+'<i>%</i>';
    $('#rT').innerHTML=(paused?'0.00':(timeScale*aimSlow).toFixed(2))+'<i>yr/s</i>';
  }
}
doc.addEventListener('visibilitychange',function(){if(doc.hidden){cancelAnimationFrame(raf);raf=0;}else if(!raf){last=0;raf=requestAnimationFrame(frame);}});

resize();tsFromSlider();PRE.solar();rebase();prB[0].classList.add('on');buildList();
view.x=0;view.y=0;view.s=baseScale();
raf=requestAnimationFrame(frame);
})();
</script>
</body>
