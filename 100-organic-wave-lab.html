<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organic Wave Lab</title>
<style>
:root{
  --bg:#1b1a55;
  --bg2:#12113a;
  --ink:#f7eefc;
  --ink2:rgba(247,238,252,.66);
  --line:rgba(255,255,255,.16);
  --card:rgba(255,255,255,.06);
  --glass:rgba(38,36,105,.58);
  --accent:#ffb38a;
  --accent2:#ff7a90;
  --lilac:#b69cff;
  --stage:#15144a;
  --tint:255,140,140;
  --round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Varela Round",system-ui,"Segoe UI",Ubuntu,Cantarell,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
body[data-theme=light]{
  --bg:#fdf6ef;--bg2:#f6e9dc;--ink:#2b2a4a;--ink2:rgba(43,42,74,.62);--line:rgba(43,42,74,.14);--card:rgba(43,42,74,.05);--glass:rgba(255,255,255,.7);--stage:#fff1e4;--accent:#e2563f;--accent2:#c2406f;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{min-height:100vh;min-height:100dvh;font-family:var(--round);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:
   radial-gradient(70% 60% at 22% 18%,rgba(var(--tint),.30),transparent 70%),
   radial-gradient(60% 60% at 85% 90%,rgba(var(--tint),.16),transparent 70%),
   linear-gradient(160deg,var(--bg),var(--bg2));
  background-attachment:fixed}
.pgrain{position:fixed;inset:0;pointer-events:none;opacity:.10;mix-blend-mode:overlay;z-index:50}
body[data-theme=light] .pgrain{opacity:.16;mix-blend-mode:multiply}

.app{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:clamp(14px,2.2vw,32px);min-height:100vh;min-height:100dvh;padding:clamp(14px,2vw,28px)}
.main{display:flex;flex-direction:column;min-width:0;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand small{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:6px}
h1{margin:0;font-weight:200;font-size:clamp(38px,6.2vw,84px);line-height:.95;letter-spacing:-.035em}
h1 b{font-weight:600;background:linear-gradient(100deg,var(--accent),var(--accent2) 50%,var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);gap:2px}
.seg button{font:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;min-height:40px;padding:0 18px;border-radius:999px;border:0;background:transparent;color:var(--ink2);cursor:pointer;transition:background .3s,color .3s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.ibtn:focus-visible,.pbtn:focus-visible,.chip:focus-visible,.sw:focus-visible,.snap:focus-visible,.sheeth:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stagewrap{position:relative;flex:none;height:calc(100vh - 292px);height:calc(100dvh - 292px);min-height:300px;display:flex;align-items:center;justify-content:center}
.stage{position:relative;height:100%;aspect-ratio:1/1;max-width:100%;border-radius:32px;overflow:hidden;background:var(--stage);box-shadow:0 30px 70px -24px rgba(0,0,0,.6),inset 0 0 0 1px var(--line)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .badge{position:absolute;left:18px;bottom:16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink);opacity:.7;mix-blend-mode:normal;font-family:var(--mono);pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.stage .ibtn{position:absolute;right:16px;bottom:14px}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:76px}
.snaps{display:flex;gap:8px;flex:1;min-width:0;max-width:100%}
.snap,.slot{width:auto;height:auto;aspect-ratio:1;max-width:64px;border-radius:18px;flex:1 1 0;min-width:0;position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.snap{cursor:pointer;padding:0;transition:transform .3s var(--ease),border-color .3s}
.snap:hover{transform:translateY(-3px);border-color:var(--accent)}
.snap svg{display:block;width:100%;height:100%}
.slot{border-style:dashed;opacity:.6}
.foot .keys{font-size:12px;color:var(--ink2);letter-spacing:.02em;line-height:1.7}
kbd{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:var(--card)}

.panel{position:relative;align-self:start;position:sticky;top:clamp(14px,2vw,28px);max-height:calc(100dvh - 2*clamp(14px,2vw,28px));overflow:auto;border-radius:30px;padding:22px 20px 22px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--line);box-shadow:0 30px 60px -24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);scrollbar-width:thin}
.sheeth{display:none}
.sec{padding:14px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:0}
.sec h2{margin:0 0 10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.ctl{margin:8px 0}
.ctl .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.ctl .lab output{font-family:var(--mono);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;--p:50%}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:14px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--ink);border:3px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.ibtn,.pbtn{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:44px;min-width:44px;padding:0 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,transform .25s var(--ease),border-color .25s}
.ibtn:hover,.pbtn:hover{background:var(--line);transform:translateY(-1px)}
.ibtn:active,.pbtn:active{transform:scale(.97)}
.pbtn.primary{background:linear-gradient(100deg,var(--accent),var(--accent2));color:#2a1030;border-color:transparent}
.ibtn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.ibtn svg{width:20px;height:20px}
.dice{transition:transform .6s var(--ease)}
.seed{flex:1;min-width:0;font-family:var(--mono);font-size:14px;min-height:44px;padding:0 12px;border-radius:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.seed:focus-visible,.hex:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gradbar{height:46px;border-radius:14px;border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;width:100%;padding:0;display:block}
.gradbar span{position:absolute;left:12px;bottom:6px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#fff;mix-blend-mode:difference}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{width:38px;height:38px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);transition:transform .3s var(--ease),border-color .3s}
.chip:hover{transform:scale(1.1)}
.chip[aria-pressed=true]{border-color:var(--ink)}
.stops{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);padding:0;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.sw[aria-pressed=true]{border-color:var(--ink);transform:translateY(-2px)}
.hex{font-family:var(--mono);font-size:14px;width:104px;min-height:40px;padding:0 10px;border-radius:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);text-transform:uppercase}
.hex.bad{border-color:#ff5c7a;color:#ff8fa5}
.hexmsg{font-size:11px;color:var(--ink2);margin:6px 0 0;min-height:1.2em}
textarea{width:100%;height:132px;resize:vertical;font-family:var(--mono);font-size:11px;line-height:1.5;padding:10px 12px;border-radius:14px;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);white-space:pre;overflow:auto}
body[data-theme=light] textarea{background:rgba(43,42,74,.06)}
.toast{font-size:12px;color:var(--accent);min-height:1.3em;margin:6px 0 0;font-weight:600}

@media (max-width:920px){
  .app{grid-template-columns:1fr;padding-bottom:88px}
  .stage{height:auto;width:100%}
  .stagewrap{height:auto;min-height:0}
  .panel{position:fixed;left:8px;right:8px;bottom:8px;top:auto;max-height:min(78dvh,620px);border-radius:28px;z-index:40;padding-top:64px;transform:translateY(calc(100% - 60px));transition:transform .5s var(--ease);box-shadow:0 -20px 50px rgba(0,0,0,.45)}
  .panel.open{transform:translateY(0)}
  .sheeth{display:flex;position:absolute;left:0;right:0;top:0;height:60px;align-items:center;justify-content:space-between;padding:0 20px;background:transparent;border:0;color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .sheeth::before{content:"";position:absolute;left:50%;top:8px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line)}
  .sheeth i{font-style:normal;transition:transform .4s var(--ease)}
  .panel.open .sheeth i{transform:rotate(180deg)}
  .foot .keys{display:none}
  .seg button{padding:0 12px}
  header{align-items:flex-start}
}
@media (max-width:420px){.seg button{padding:0 10px;font-size:12px}}
@media (prefers-reduced-motion:reduce){.panel{transition:none}.dice{transition:none}}
</style>
</head>
<body data-theme="dark">
<div class="pgrain" id="pgrain" aria-hidden="true"></div>
<div class="app">
  <main class="main">
    <header>
      <div class="brand"><small>A generative blob &amp; wave design lab</small><h1>Organic <b>Wave</b> Lab</h1></div>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" data-mode="blob" aria-pressed="true">Blob</button>
        <button type="button" data-mode="wave" aria-pressed="false">Wave</button>
        <button type="button" data-mode="rings" aria-pressed="false">Rings</button>
      </div>
    </header>
    <div class="stagewrap">
      <div class="stage" id="stage">
        <svg id="art" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Generated organic artwork"></svg>
        <div class="badge" id="badge">blob &middot; seed 1</div>
        <button class="ibtn" id="pausebtn" type="button" aria-label="Pause morph" aria-pressed="false" title="Pause / play (Space)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
      </div>
    </div>
    <div class="foot">
      <div class="snaps" id="snaps" role="group" aria-label="Saved snapshots"></div>
      <div class="keys"><kbd>R</kbd> randomise &nbsp;<kbd>Space</kbd> pause &nbsp;<kbd>S</kbd> snapshot</div>
    </div>
  </main>

  <aside class="panel" id="panel" aria-label="Controls">
    <button class="sheeth" id="sheeth" type="button" aria-expanded="false" aria-controls="panel"><span>Controls</span><i aria-hidden="true">&#9650;</i></button>
    <section class="sec">
      <h2>Shape</h2>
      <div class="ctl"><div class="lab"><label for="complexity">Complexity</label><output id="o-complexity">6</output></div><input type="range" id="complexity" min="3" max="12" step="1" value="6"></div>
      <div class="ctl"><div class="lab"><label for="dist">Distortion</label><output id="o-dist">0.55</output></div><input type="range" id="dist" min="0" max="1" step="0.01" value="0.55"></div>
      <div class="ctl"><div class="lab"><label for="speed">Speed</label><output id="o-speed">0.80</output></div><input type="range" id="speed" min="0" max="2" step="0.01" value="0.8"></div>
      <div class="ctl"><div class="lab"><label for="layers">Layers</label><output id="o-layers">4</output></div><input type="range" id="layers" min="1" max="8" step="1" value="4"></div>
      <div class="ctl"><div class="lab"><label for="blur">Blur</label><output id="o-blur">0</output></div><input type="range" id="blur" min="0" max="30" step="1" value="0"></div>
      <div class="ctl"><div class="lab"><label for="grain">Grain</label><output id="o-grain">0.35</output></div><input type="range" id="grain" min="0" max="1" step="0.01" value="0.35"></div>
    </section>
    <section class="sec">
      <h2>Seed</h2>
      <div class="row">
        <label class="sr" for="seedin" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Seed</label>
        <input class="seed" id="seedin" type="text" inputmode="numeric" value="1" maxlength="6" aria-label="Seed number">
        <button class="ibtn" id="dicebtn" type="button" aria-label="Randomise seed" title="Randomise (R)"><svg class="dice" id="diceico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/></svg></button>
        <button class="ibtn" id="lockbtn" type="button" aria-label="Lock seed" aria-pressed="false" title="Lock the shape: randomise only reshuffles colour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path id="lockarc" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
    </section>
    <section class="sec">
      <h2>Gradient <span id="palname" style="letter-spacing:.1em;text-transform:none;font-size:12px"></span></h2>
      <button class="gradbar" id="gradbar" type="button" aria-label="Cycle to next palette"><span>Click to cycle</span></button>
      <div class="chips" id="chips" role="group" aria-label="Curated palettes"></div>
      <div class="stops" id="stops" role="group" aria-label="Gradient stops"></div>
      <div class="row" style="margin-top:10px">
        <input class="hex" id="hex" type="text" value="#FF9A8B" maxlength="7" aria-label="Hex colour for the selected stop" spellcheck="false">
        <button class="ibtn" id="addstop" type="button" aria-label="Add stop" title="Add a stop (max 4)">+</button>
        <button class="ibtn" id="delstop" type="button" aria-label="Remove selected stop" title="Remove selected stop (min 2)">&minus;</button>
        <button class="ibtn" id="theme" type="button" aria-label="Toggle light theme" aria-pressed="false" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button>
      </div>
      <p class="hexmsg" id="hexmsg">Type a hex like #FFB38A and press Enter.</p>
    </section>
    <section class="sec">
      <h2>SVG code <span id="bytes" style="letter-spacing:.06em;text-transform:none;font-size:12px"></span></h2>
      <label for="code" style="position:absolute;width:1px;height:1px;overflow:hidden">Generated SVG source</label>
      <textarea id="code" readonly spellcheck="false"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="pbtn primary" id="copy" type="button" style="flex:1">Copy SVG</button>
        <button class="pbtn" id="dl" type="button" style="flex:1">Download .svg</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="pbtn" id="snapbtn" type="button" style="flex:1">Save snapshot (S)</button>
      </div>
      <p class="toast" id="toast" role="status"></p>
    </section>
  </aside>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var RM=false;try{RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
var TAU=Math.PI*2;
var NS='http://www.w3.org/2000/svg';
function clamp(x,a,b){return x<a?a:(x>b?b:x)}
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb2hex(c){function q(v){v=Math.round(clamp(v,0,255));return (v<16?'0':'')+v.toString(16)}return '#'+q(c[0])+q(c[1])+q(c[2])}
function mixc(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- palettes ---------- */
var PALS=[
  {name:'Dusk',stops:['#FFB38A','#FF7A90','#B69CFF']},
  {name:'Sunrise',stops:['#FF9A8B','#FF6A88','#FFD166']},
  {name:'Lagoon',stops:['#0F766E','#5EEAD4','#FEF3C7']},
  {name:'Orchid',stops:['#6D28D9','#C084FC','#FBCFE8']},
  {name:'Deep',stops:['#0B132B','#1C2541','#5BC0BE']}
];
function palAt(stops,u){
  var n=stops.length-1,x=clamp(u,0,1)*n,i=Math.min(n-1,Math.floor(x));
  return mixc(hex2rgb(stops[i]),hex2rgb(stops[i+1]),x-i);
}

/* ---------- state ---------- */
var S={mode:'blob',seed:1,complexity:6,dist:.55,speed:.8,layers:4,blur:0,grain:.35,stops:PALS[0].stops.slice(),t:0};
var palIdx=0,selStop=0,playing=!RM,locked=false,theme='dark';
var snaps=[];
var sdCache={seed:-1,d:null};
function seedData(seed){
  if(sdCache.seed===seed)return sdCache.d;
  var r=mulberry(seed*7919+13),d={a:[],b:[],c:[],j:[],w:[],w2:[],w3:[],lr:[]};
  for(var i=0;i<16;i++){d.a.push(r()*TAU);d.b.push(r()*TAU);d.c.push(r()*TAU);d.j.push(r()-.5);}
  for(i=0;i<10;i++){d.w.push(r()*TAU);d.w2.push(r()*TAU);d.w3.push(r()*TAU);d.lr.push(r())}
  sdCache={seed:seed,d:d};return d;
}
function nz(d,i,t){return .55*Math.sin(t*.9+d.a[i%16])+.3*Math.sin(t*1.7+d.b[i%16])+.15*Math.sin(t*2.9+d.c[i%16])}

/* ---------- spline helpers ---------- */
function f1(v){return (Math.round(v*10)/10).toString()}
function closedPath(p){
  var n=p.length/2,s='M'+f1(p[0])+' '+f1(p[1]);
  for(var i=0;i<n;i++){
    var i0=(i-1+n)%n,i1=i,i2=(i+1)%n,i3=(i+2)%n;
    var c1x=p[i1*2]+(p[i2*2]-p[i0*2])/6,c1y=p[i1*2+1]+(p[i2*2+1]-p[i0*2+1])/6;
    var c2x=p[i2*2]-(p[i3*2]-p[i1*2])/6,c2y=p[i2*2+1]-(p[i3*2+1]-p[i1*2+1])/6;
    s+='C'+f1(c1x)+' '+f1(c1y)+' '+f1(c2x)+' '+f1(c2y)+' '+f1(p[i2*2])+' '+f1(p[i2*2+1]);
  }
  return s+'Z';
}
function openPath(p){
  var n=p.length/2,s='M'+f1(p[0])+' '+f1(p[1]);
  for(var i=0;i<n-1;i++){
    var i0=Math.max(0,i-1),i1=i,i2=i+1,i3=Math.min(n-1,i+2);
    var c1x=p[i1*2]+(p[i2*2]-p[i0*2])/6,c1y=p[i1*2+1]+(p[i2*2+1]-p[i0*2+1])/6;
    var c2x=p[i2*2]-(p[i3*2]-p[i1*2])/6,c2y=p[i2*2+1]-(p[i3*2+1]-p[i1*2+1])/6;
    s+='C'+f1(c1x)+' '+f1(c1y)+' '+f1(c2x)+' '+f1(c2y)+' '+f1(p[i2*2])+' '+f1(p[i2*2+1]);
  }
  return s;
}

/* ---------- geometry: returns an array of layer descriptors ---------- */
function blobPts(st,d,k,L,t,scaleMul){
  var N=st.complexity,pts=new Array(N*2);
  var s=Math.max(.32,1-k*(L>1?.56/(L-1)*1.0:0))*scaleMul;
  var tk=t*.6+k*.55;
  var ox=Math.cos(k*1.9)*k*7,oy=Math.sin(k*1.3)*k*7;
  for(var i=0;i<N;i++){
    var ang=TAU*(i+d.j[i%16]*.3)/N+t*.05+k*.12;
    var r=285*s*(1+st.dist*.62*nz(d,i,tk));
    pts[i*2]=400+ox+Math.cos(ang)*r;pts[i*2+1]=400+oy+Math.sin(ang)*r;
  }
  return pts;
}
function describe(st,t){
  var d=seedData(st.seed),L=st.layers,out=[],k,u;
  if(st.mode==='blob'){
    for(k=0;k<L;k++){
      out.push({d:closedPath(blobPts(st,d,k,L,t,1)),kind:'fill',u:L>1?k/(L-1):0,op:k===0?.94:.66,blend:k>0,grad:k});
    }
  }else if(st.mode==='wave'){
    var c=1+st.complexity*.3,A=22+st.dist*95;
    for(k=0;k<L;k++){
      u=L>1?k/(L-1):.5;
      var base=800*(L>1?.2+.72*u:.5),pts=[],q=d.lr[k%10];
      var dir=(k%2?-1:1);
      for(var j=0;j<=42;j++){
        var x=-20+j*20,xn=x/800*TAU;
        var y=base+A*(.6+u*.5)*(Math.sin(xn*c*(1+q*.25)+d.w[k%10]+t*.9*dir)*.6+Math.sin(xn*c*2.1+d.w2[k%10]-t*1.3*dir)*.28*(.4+st.dist)+Math.sin(xn*c*.55+d.w3[k%10]+t*.5)*.4);
        pts.push(x,y);
      }
      out.push({d:openPath(pts)+'L820 820L-20 820Z',kind:'fill',u:u,op:.92,blend:false,grad:-1});
    }
  }else{
    var K=L+3;
    for(k=0;k<K;k++){
      u=K>1?k/(K-1):0;
      var pr=blobPts(st,d,0,1,t*.8+k*.35,.16+.84*(k+1)/K);
      /* soften the distortion of the inner rings */
      out.push({d:closedPath(pr),kind:'stroke',u:u,op:.92,sw:3+(K-k)*1.9*(0.5+st.dist*.5),blend:false,grad:-1});
    }
  }
  return out;
}

/* ---------- SVG string (export & thumbnails) ---------- */
function bgColor(){return theme==='light'?'#FFF1E4':'#15144A'}
function buildSVG(st,t,idp,bg,size){
  var items=describe(st,t),L=items.length,i,s='';
  var blend=theme==='light'?'multiply':'screen';
  s+='<svg xmlns="'+NS+'" viewBox="0 0 800 800"'+(size?' width="'+size+'" height="'+size+'"':' width="800" height="800"')+'>\n';
  s+='  <defs>\n';
  if(st.mode==='blob'){
    for(i=0;i<L;i++){
      var a=(i*47)*Math.PI/180,x1=400-Math.cos(a)*300,y1=400-Math.sin(a)*300,x2=400+Math.cos(a)*300,y2=400+Math.sin(a)*300;
      s+='    <linearGradient id="'+idp+'g'+i+'" gradientUnits="userSpaceOnUse" x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'">';
      for(var q=0;q<st.stops.length;q++)s+='<stop offset="'+f1(q/(st.stops.length-1)*100)+'%" stop-color="'+st.stops[q].toUpperCase()+'"/>';
      s+='</linearGradient>\n';
    }
  }
  if(st.blur>0)s+='    <filter id="'+idp+'b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="'+st.blur+'"/></filter>\n';
  s+='  </defs>\n';
  s+='  <rect width="800" height="800" fill="'+bg+'"/>\n';
  s+='  <g'+(st.blur>0?' filter="url(#'+idp+'b)"':'')+' style="isolation:isolate">\n';
  for(i=0;i<L;i++){
    var it=items[i],col;
    if(it.kind==='fill'){
      var fill=it.grad>=0?'url(#'+idp+'g'+it.grad+')':rgb2hex(palAt(st.stops,it.u));
      s+='    <path d="'+it.d+'" fill="'+fill+'" fill-opacity="'+it.op+'"'+(it.blend?' style="mix-blend-mode:'+blend+'"':'')+'/>\n';
    }else{
      s+='    <path d="'+it.d+'" fill="none" stroke="'+rgb2hex(palAt(st.stops,it.u))+'" stroke-width="'+f1(it.sw)+'" stroke-opacity="'+it.op+'" stroke-linecap="round"/>\n';
    }
  }
  s+='  </g>\n';
  s+='</svg>';
  return s;
}

/* ---------- live DOM ---------- */
var art=$('art'),liveSig='',pathEls=[],gradEls=[];
function el(n,attrs){var e=document.createElementNS(NS,n);for(var k in attrs)e.setAttribute(k,attrs[k]);return e}
function rebuildLive(){
  var items=describe(S,S.t);
  while(art.firstChild)art.removeChild(art.firstChild);
  pathEls=[];gradEls=[];
  var defs=el('defs',{});
  if(S.mode==='blob'){
    for(var i=0;i<items.length;i++){
      var a=(i*47)*Math.PI/180;
      var g=el('linearGradient',{id:'lg'+i,gradientUnits:'userSpaceOnUse',x1:400-Math.cos(a)*300,y1:400-Math.sin(a)*300,x2:400+Math.cos(a)*300,y2:400+Math.sin(a)*300});
      gradEls.push(g);defs.appendChild(g);
    }
  }
  var flt=el('filter',{id:'lblur',x:'-20%',y:'-20%',width:'140%',height:'140%'});
  var gb=el('feGaussianBlur',{stdDeviation:S.blur});flt.appendChild(gb);defs.appendChild(flt);
  /* grain filter */
  var gf=el('filter',{id:'lgrain',x:'0',y:'0',width:'100%',height:'100%'});
  gf.appendChild(el('feTurbulence',{type:'fractalNoise',baseFrequency:'.9',numOctaves:'2',seed:'3',stitchTiles:'stitch'}));
  gf.appendChild(el('feColorMatrix',{type:'saturate',values:'0'}));
  defs.appendChild(gf);
  art.appendChild(defs);
  art.appendChild(el('rect',{id:'lbg',width:800,height:800,fill:bgColor()}));
  var grp=el('g',{id:'lgrp',style:'isolation:isolate'});
  art.appendChild(grp);
  for(i=0;i<items.length;i++){
    var p=el('path',{});grp.appendChild(p);pathEls.push(p);
  }
  art.appendChild(el('rect',{id:'lgr',width:800,height:800,filter:'url(#lgrain)',style:'mix-blend-mode:overlay;pointer-events:none',opacity:0}));
  liveSig=sig();
  applyColors(items);applyBlurGrain();
}
function sig(){return S.mode+'|'+S.layers+'|'+S.stops.length}
function applyColors(items){
  items=items||describe(S,S.t);
  var blend=theme==='light'?'multiply':'screen';
  for(var i=0;i<gradEls.length;i++){
    var g=gradEls[i];while(g.firstChild)g.removeChild(g.firstChild);
    for(var q=0;q<S.stops.length;q++)g.appendChild(el('stop',{offset:(q/(S.stops.length-1)*100)+'%','stop-color':S.stops[q]}));
  }
  for(i=0;i<pathEls.length;i++){
    var it=items[i],p=pathEls[i];
    if(it.kind==='fill'){
      p.setAttribute('fill',it.grad>=0?'url(#lg'+it.grad+')':rgb2hex(palAt(S.stops,it.u)));
      p.setAttribute('fill-opacity',it.op);p.removeAttribute('stroke');
      p.style.mixBlendMode=it.blend?blend:'normal';
    }else{
      p.setAttribute('fill','none');p.setAttribute('stroke',rgb2hex(palAt(S.stops,it.u)));
      p.setAttribute('stroke-width',it.sw);p.setAttribute('stroke-opacity',it.op);p.setAttribute('stroke-linecap','round');
      p.style.mixBlendMode='normal';
    }
  }
  var bg=$('lbg');if(bg)bg.setAttribute('fill',bgColor());
}
function applyBlurGrain(){
  var grp=$('lgrp'),gb=document.querySelector('#lblur feGaussianBlur'),gr=$('lgr');
  if(gb)gb.setAttribute('stdDeviation',S.blur);
  if(grp){if(S.blur>0)grp.setAttribute('filter','url(#lblur)');else grp.removeAttribute('filter')}
  if(gr)gr.setAttribute('opacity',(S.grain*.55).toFixed(3));
}
function updatePaths(){
  if(sig()!==liveSig)rebuildLive();
  var items=describe(S,S.t);
  for(var i=0;i<pathEls.length;i++)pathEls[i].setAttribute('d',items[i].d);
}

/* ---------- code box ---------- */
var codeTimer=0,lastCode='';
function updateCode(){
  var s=buildSVG(S,S.t,'',bgColor());
  $('code').value=s;
  $('bytes').textContent=(s.length/1024).toFixed(1)+' KB';
  $('badge').textContent=S.mode+' · seed '+S.seed+' · '+palName();
}
function palName(){return palIdx>=0?PALS[palIdx].name:'Custom'}

/* ---------- tint ---------- */
var tintCur=[255,140,140];
function tintTarget(){return palAt(S.stops,.5)}
function tickTint(k){
  var tg=tintTarget();
  for(var i=0;i<3;i++)tintCur[i]+=(tg[i]-tintCur[i])*k;
  document.body.style.setProperty('--tint',Math.round(tintCur[0])+','+Math.round(tintCur[1])+','+Math.round(tintCur[2]));
}

/* ---------- UI wiring ---------- */
function setRangeFill(inp){var mn=+inp.min,mx=+inp.max,v=+inp.value;inp.style.setProperty('--p',((v-mn)/(mx-mn)*100)+'%')}
var sliders={complexity:['complexity',0],dist:['dist',2],speed:['speed',2],layers:['layers',0],blur:['blur',0],grain:['grain',2]};
function syncSliders(){
  for(var k in sliders){
    var inp=$(sliders[k][0]);inp.value=S[k];
    $('o-'+k).textContent=(+S[k]).toFixed(sliders[k][1]);setRangeFill(inp);
  }
}
Object.keys(sliders).forEach(function(k){
  var inp=$(sliders[k][0]);
  inp.addEventListener('input',function(){
    S[k]=parseFloat(inp.value);$('o-'+k).textContent=S[k].toFixed(sliders[k][1]);setRangeFill(inp);
    if(k==='blur'||k==='grain')applyBlurGrain();
    refresh();
  });
});
function refresh(){updatePaths();updateCode()}

/* mode */
var modeBtns=document.querySelectorAll('[data-mode]');
var modeLayers={blob:4,wave:5,rings:4};
for(var mi=0;mi<modeBtns.length;mi++)(function(b){
  b.addEventListener('click',function(){
    S.mode=b.getAttribute('data-mode');S.layers=modeLayers[S.mode];
    for(var j=0;j<modeBtns.length;j++)modeBtns[j].setAttribute('aria-pressed',modeBtns[j]===b?'true':'false');
    syncSliders();rebuildLive();refresh();
  });
})(modeBtns[mi]);

/* palettes & stops */
var chipsEl=$('chips'),stopsEl=$('stops'),gradbar=$('gradbar');
function gradCss(){
  var p=[];for(var i=0;i<S.stops.length;i++)p.push(S.stops[i]+' '+(i/(S.stops.length-1)*100)+'%');
  return 'linear-gradient(90deg,'+p.join(',')+')';
}
function buildChips(){
  chipsEl.innerHTML='';
  PALS.forEach(function(p,i){
    var b=document.createElement('button');b.type='button';b.className='chip';b.title=p.name;b.setAttribute('aria-label','Palette '+p.name);
    b.setAttribute('aria-pressed',i===palIdx?'true':'false');
    b.style.background='linear-gradient(135deg,'+p.stops.join(',')+')';
    b.addEventListener('click',function(){setPalette(i)});
    chipsEl.appendChild(b);
  });
}
function buildStops(){
  stopsEl.innerHTML='';
  S.stops.forEach(function(c,i){
    var b=document.createElement('button');b.type='button';b.className='sw';b.style.background=c;b.setAttribute('aria-label','Stop '+(i+1)+' '+c);
    b.setAttribute('aria-pressed',i===selStop?'true':'false');
    b.addEventListener('click',function(){selStop=i;buildStops();$('hex').value=S.stops[i].toUpperCase();$('hex').classList.remove('bad')});
    stopsEl.appendChild(b);
  });
  $('hex').value=S.stops[selStop].toUpperCase();
  gradbar.style.background=gradCss();
  $('palname').textContent=palName();
  var cs=chipsEl.children;for(var i=0;i<cs.length;i++)cs[i].setAttribute('aria-pressed',i===palIdx?'true':'false');
}
function setPalette(i){
  palIdx=i;S.stops=PALS[i].stops.slice();selStop=Math.min(selStop,S.stops.length-1);
  buildStops();applyColors();updateCode();
}
gradbar.addEventListener('click',function(){setPalette((palIdx<0?0:palIdx+1)%PALS.length)});
var hexIn=$('hex');
function tryHex(){
  var v=hexIn.value.trim();if(v[0]!=='#')v='#'+v;
  if(/^#([0-9a-fA-F]{6})$/.test(v)){
    hexIn.classList.remove('bad');$('hexmsg').textContent='Stop '+(selStop+1)+' set to '+v.toUpperCase()+'.';
    S.stops[selStop]=v.toUpperCase();palIdx=-1;buildStops();applyColors();updateCode();return true;
  }
  hexIn.classList.add('bad');$('hexmsg').textContent='Needs six hex digits, e.g. #5BC0BE.';return false;
}
hexIn.addEventListener('input',function(){var v=hexIn.value.trim();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-fA-F]{6}$/.test(v))tryHex();else hexIn.classList.toggle('bad',v.length>=7)});
hexIn.addEventListener('keydown',function(e){if(e.key==='Enter')tryHex()});
$('addstop').addEventListener('click',function(){
  if(S.stops.length>=4){$('hexmsg').textContent='Four stops is the maximum.';return}
  var i=selStop,a=hex2rgb(S.stops[i]),b=hex2rgb(S.stops[Math.min(i+1,S.stops.length-1)]);
  var c=i===S.stops.length-1?mixc(a,[255,255,255],.35):mixc(a,b,.5);
  S.stops.splice(i+1,0,rgb2hex(c).toUpperCase());selStop=i+1;palIdx=-1;buildStops();refresh();applyColors();
});
$('delstop').addEventListener('click',function(){
  if(S.stops.length<=2){$('hexmsg').textContent='A gradient needs at least two stops.';return}
  S.stops.splice(selStop,1);selStop=Math.max(0,selStop-1);palIdx=-1;buildStops();refresh();applyColors();
});
$('theme').addEventListener('click',function(){
  theme=theme==='dark'?'light':'dark';document.body.setAttribute('data-theme',theme);
  this.setAttribute('aria-pressed',theme==='light'?'true':'false');
  applyColors();updateCode();
});

/* seed, dice, lock */
var seedIn=$('seedin');
function setSeed(v){S.seed=clamp(Math.floor(v)||1,1,999999);seedIn.value=S.seed;refresh()}
seedIn.addEventListener('change',function(){setSeed(parseInt(seedIn.value,10))});
seedIn.addEventListener('keydown',function(e){if(e.key==='Enter')setSeed(parseInt(seedIn.value,10))});
var diceRot=0;
function randomize(){
  diceRot+=270;$('diceico').style.transform='rotate('+diceRot+'deg)';
  var newPal=(palIdx<0?0:palIdx)+1+Math.floor(Math.random()*(PALS.length-1));
  setPalette(newPal%PALS.length);
  if(!locked){
    S.complexity=3+Math.floor(Math.random()*8);
    S.dist=Math.round((.35+Math.random()*.55)*100)/100;
    S.seed=1+Math.floor(Math.random()*99998);seedIn.value=S.seed;
    syncSliders();
  }
  refresh();
}
$('dicebtn').addEventListener('click',randomize);
$('lockbtn').addEventListener('click',function(){
  locked=!locked;this.setAttribute('aria-pressed',locked?'true':'false');
  this.setAttribute('aria-label',locked?'Unlock seed':'Lock seed');
  $('lockarc').setAttribute('d',locked?'M8 11V8a4 4 0 0 1 8 0v3':'M8 11V8a4 4 0 0 1 7.6-1.7');
});

/* play / pause */
function setPlaying(v){
  playing=v;var b=$('pausebtn');b.setAttribute('aria-pressed',v?'false':'true');b.setAttribute('aria-label',v?'Pause morph':'Play morph');
  b.innerHTML=v?'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>'
    :'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  updateCode();
}
$('pausebtn').addEventListener('click',function(){setPlaying(!playing)});

/* snapshots */
var snapsEl=$('snaps');
function renderSnaps(){
  snapsEl.innerHTML='';
  snaps.forEach(function(sn,i){
    var b=document.createElement('button');b.type='button';b.className='snap';b.setAttribute('aria-label','Restore snapshot '+(i+1)+', '+sn.st.mode);
    b.innerHTML=buildSVG(sn.st,sn.st.t,'s'+sn.id,sn.bg,64).replace(' width="64" height="64"','');
    b.addEventListener('click',function(){restore(sn)});
    snapsEl.appendChild(b);
  });
  for(var i=snaps.length;i<6;i++){var s=document.createElement('div');s.className='slot';s.setAttribute('aria-hidden','true');snapsEl.appendChild(s)}
}
var snapId=0;
function saveSnap(){
  var st=JSON.parse(JSON.stringify(S));
  snaps.push({id:++snapId,st:st,bg:bgColor(),theme:theme,pal:palIdx,locked:locked});
  if(snaps.length>6)snaps.shift();
  renderSnaps();toast('Snapshot saved ('+snaps.length+'/6)');
}
function restore(sn){
  var st=sn.st;
  for(var k in st)S[k]=JSON.parse(JSON.stringify(st[k]));
  palIdx=sn.pal;selStop=0;seedIn.value=S.seed;
  for(var j=0;j<modeBtns.length;j++)modeBtns[j].setAttribute('aria-pressed',modeBtns[j].getAttribute('data-mode')===S.mode?'true':'false');
  if(sn.theme!==theme)$('theme').click();
  syncSliders();buildStops();rebuildLive();refresh();toast('Snapshot restored');
}
$('snapbtn').addEventListener('click',saveSnap);

/* copy / download */
var toastT=0;
function toast(m){var t=$('toast');t.textContent=m;clearTimeout(toastT);toastT=setTimeout(function(){t.textContent=''},2200)}
$('copy').addEventListener('click',function(){
  var txt=$('code').value,ok=false;
  function fallback(){
    try{var ta=$('code');ta.focus();ta.select();ok=document.execCommand('copy');ta.setSelectionRange(0,0);toast(ok?'SVG copied to clipboard':'Select the code and copy it (Ctrl+C)')}catch(e){toast('Select the code and copy it (Ctrl+C)')}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('SVG copied to clipboard')},fallback)}
    else fallback();
  }catch(e){fallback()}
});
$('dl').addEventListener('click',function(){
  try{
    var blob=new Blob([$('code').value],{type:'image/svg+xml'}),url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='organic-'+S.mode+'-'+S.seed+'.svg';document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1500);toast('Downloaded organic-'+S.mode+'-'+S.seed+'.svg');
  }catch(e){toast('Download is not available here')}
});

/* bottom sheet */
var panel=$('panel'),sheeth=$('sheeth');
sheeth.addEventListener('click',function(){var o=!panel.classList.contains('open');panel.classList.toggle('open',o);sheeth.setAttribute('aria-expanded',o?'true':'false')});

/* keys */
document.addEventListener('keydown',function(e){
  var t=e.target,tag=t&&t.tagName;
  if(tag==='INPUT'&&t.type==='text'||tag==='TEXTAREA')return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='r'||e.key==='R'){randomize()}
  else if((e.key===' '||e.code==='Space')&&tag!=='BUTTON'){setPlaying(!playing);e.preventDefault()}
  else if(e.key==='s'||e.key==='S'){saveSnap()}
});

/* page grain */
(function(){
  try{
    var c=document.createElement('canvas');c.width=c.height=180;var g=c.getContext('2d'),id=g.createImageData(180,180),d=id.data;
    for(var i=0;i<d.length;i+=4){var v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
    g.putImageData(id,0,0);$('pgrain').style.backgroundImage='url('+c.toDataURL()+')';
  }catch(e){}
})();

/* ---------- loop ---------- */
var last=0,codeAcc=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){last=now;return}
  var dt=Math.min((now-last)/1000||.016,1/20);last=now;
  tickTint(1-Math.exp(-dt*2.2));
  if(playing){
    S.t+=dt*S.speed*(RM?.3:1);
    updatePaths();
    codeAcc+=dt;if(codeAcc>.35){codeAcc=0;updateCode()}
  }
}

/* ---------- init ---------- */
tintCur=tintTarget();
buildChips();buildStops();syncSliders();rebuildLive();
S.t=2.4;updatePaths();updateCode();renderSnaps();
if(!playing)setPlaying(false);
requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame)});
})();
</script>
</body>
</html>
