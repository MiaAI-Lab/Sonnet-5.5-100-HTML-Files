<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22383a">
<title>GRV-16 — a 16-step groove box you can play</title>
<meta name="description" content="GRV-16: a tactile, fully synthesised WebAudio drum machine with 16 rubber pads, 8 voices, swing, presets and an oscilloscope.">
<style>
:root{
  --body:#1d1f24; --body2:#25282e; --orange:#ff6a1a; --cream:#efe4cc; --cream2:rgba(239,228,204,.62);
  --metal:#b9bcc1; --ink:#15171b;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,"Nimbus Sans","Liberation Sans",sans-serif;
  --pad:40px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:#3a2a20;color:var(--cream);font-family:var(--sans);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.desk{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:
 repeating-linear-gradient(92deg,rgba(0,0,0,.06) 0 2px,rgba(255,255,255,.015) 2px 5px),linear-gradient(180deg,#4b3628,#33241b)}
.mat{position:absolute;inset:14px;border-radius:26px;background:radial-gradient(90% 80% at 50% 45%,#2e4a4c,#213638 70%,#182829);box-shadow:0 30px 70px -20px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.05);overflow:hidden}
.mat::before{content:"";position:absolute;inset:14px;border-radius:16px;border:2px dashed rgba(239,228,204,.22)}
.mat::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%);pointer-events:none}
#felt{position:absolute;inset:0;opacity:.5;background-size:120px 120px}
.pencil{position:absolute;left:5%;bottom:7%;width:230px;height:14px;background:linear-gradient(180deg,#f3c53c 0 30%,#d8a51d 30% 70%,#a97f12 70%);border-radius:2px 8px 8px 2px;transform:rotate(-12deg);box-shadow:8px 12px 14px -6px rgba(0,0,0,.6);transition:transform .08s}
.pencil::before{content:"";position:absolute;left:-22px;top:0;border-right:22px solid #e7c9a0;border-top:7px solid transparent;border-bottom:7px solid transparent}
.pencil::after{content:"";position:absolute;right:0;top:0;width:26px;height:14px;background:#d96a6a;border-radius:0 8px 8px 0;box-shadow:inset 8px 0 0 #c0c4c8}
#stage{position:relative;z-index:2}
.device{position:absolute;left:0;top:0;width:1240px;transform-origin:0 0;border-radius:24px;background:linear-gradient(180deg,#25282e,#1b1d22 60%,#17191d);box-shadow:0 2px 0 rgba(255,255,255,.07) inset,0 0 0 1px #0d0e11,0 6px 0 #0f1013,0 40px 60px -14px rgba(0,0,0,.75),0 90px 90px -40px rgba(0,0,0,.6);overflow:hidden}
.device::after{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.strip{position:relative;height:96px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(180deg,#d7d9dc,#a9adb3 48%,#c6c9cd);border-bottom:2px solid #0c0d10;box-shadow:inset 0 -6px 12px rgba(0,0,0,.18);display:grid;grid-template-columns:300px 1fr 360px;align-items:center;gap:20px;padding:0 30px}
.screw{position:absolute;top:10px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eee,#7c8086);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1px;background:#4a4d52;transform:rotate(35deg)}
.brand{color:#1c1e22;line-height:1}
.brand b{display:block;font:900 40px/1 var(--sans);letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--orange)}
.brand span{display:block;margin-top:6px;font:600 9.5px var(--sans);letter-spacing:.24em;text-transform:uppercase;opacity:.75}
.lcd{height:66px;border-radius:8px;background:#0d0f10;box-shadow:inset 0 2px 8px #000,0 1px 0 rgba(255,255,255,.5);display:flex;align-items:center;gap:22px;padding:0 20px;color:var(--orange);font-family:var(--mono)}
.seg{position:relative;font:700 40px/1 var(--mono);letter-spacing:.06em;color:var(--orange);text-shadow:0 0 12px rgba(255,106,26,.75);font-variant-numeric:tabular-nums}
.seg::before{content:attr(data-g);position:absolute;left:0;top:0;color:rgba(255,106,26,.09);text-shadow:none}
.lab{font:600 8.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,140,70,.6);display:block;margin-bottom:3px}
.lcd .pn{margin-left:auto;text-align:right;font:600 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 8px rgba(255,106,26,.6)}
#scope{width:100%;height:66px;border-radius:8px;background:#0d0f10;box-shadow:inset 0 2px 8px #000,0 1px 0 rgba(255,255,255,.5);display:block}
.power{position:absolute;right:16px;top:8px;display:flex;align-items:center;gap:8px}
.led{width:10px;height:10px;border-radius:50%;background:#3a1a0c;box-shadow:inset 0 1px 2px #000,0 0 0 2px #1a1c20;transition:background .2s,box-shadow .2s}
.led.on{background:#ff8a3a;box-shadow:0 0 10px 2px rgba(255,106,26,.9),0 0 0 2px #1a1c20}
.main{display:grid;grid-template-columns:284px minmax(0,1fr);gap:26px;padding:26px 30px 22px}
.left{display:flex;flex-direction:column;gap:20px}
.knobs{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto auto;gap:14px 10px;align-items:center;justify-items:center;padding:18px 8px 14px;border-radius:14px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.knobs .kb{grid-row:1/3}
.kw{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.kw label{font:700 10px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--cream)}
.kw output{font:600 10.5px var(--mono);color:var(--orange);letter-spacing:.05em;min-height:13px}
.knob{position:relative;border-radius:50%;cursor:ns-resize;touch-action:none;outline-offset:5px;-webkit-user-select:none;user-select:none}
.knob svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.knob .cap{position:absolute;inset:14%;border-radius:50%;background:conic-gradient(from 20deg,#3b3e45,#23252a,#40434a,#1f2126,#3b3e45);box-shadow:0 6px 10px rgba(0,0,0,.6),inset 0 2px 1px rgba(255,255,255,.22),inset 0 -3px 5px rgba(0,0,0,.5);transition:transform .05s}
.knob .cap::before{content:"";position:absolute;inset:8%;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.05) 0 4deg,rgba(0,0,0,.14) 4deg 8deg)}
.knob .cap::after{content:"";position:absolute;left:50%;top:7%;width:4px;height:26%;margin-left:-2px;border-radius:3px;background:var(--orange);box-shadow:0 0 8px rgba(255,106,26,.9)}
.knob.big{width:112px;height:112px}.knob.mid{width:76px;height:76px}.knob.sm{width:32px;height:32px}
.knob.sm .cap{inset:12%}.knob.sm .cap::after{width:3px;margin-left:-1.5px}
.tip{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);padding:3px 8px;border-radius:6px;background:#0d0f10;color:var(--orange);font:600 11px var(--mono);opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
.kw.drag .tip{opacity:1}
.trans{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:stretch}
.play{position:relative;height:74px;border:0;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#3a3d44,#26282d);box-shadow:0 5px 0 #0e0f12,0 10px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .08s,box-shadow .08s}
.play:active,.play.dn{transform:translateY(4px);box-shadow:0 1px 0 #0e0f12,0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
.play svg{width:26px;height:26px;fill:var(--cream)}
.play span{font:800 11px var(--sans);letter-spacing:.24em;text-transform:uppercase}
.tled{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:12px;background:rgba(0,0,0,.2);font:700 9.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--cream2)}
.tled .led{width:16px;height:16px}
.sec-t{margin:0 0 8px;font:700 9.5px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--cream2);display:flex;align-items:center;gap:10px}
.sec-t::after{content:"";flex:1;height:1px;background:rgba(239,228,204,.18)}
.pres{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pb{height:38px;border:0;border-radius:8px;cursor:pointer;background:linear-gradient(180deg,#34373d,#25272c);box-shadow:0 3px 0 #0e0f12,0 6px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);font:700 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--cream);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s}
.pb:active{transform:translateY(3px);box-shadow:0 0 0 #0e0f12,inset 0 1px 0 rgba(255,255,255,.08)}
.pb i{width:6px;height:6px;border-radius:50%;background:#3a1a0c;box-shadow:inset 0 1px 1px #000}
.pb.cur i{background:#ff8a3a;box-shadow:0 0 8px 1px rgba(255,106,26,.9)}
.pb.alt{grid-column:span 1;color:var(--orange)}
.seq{min-width:0}
.gridw{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#444 transparent;padding-bottom:6px}
.grid{min-width:max-content}
.row{display:flex;align-items:center;height:60px;gap:0}
.row.head{height:26px}
.lbl{flex:none;width:214px;display:flex;align-items:center;gap:9px;padding-right:14px;background:linear-gradient(90deg,#1d1f24 88%,rgba(29,31,36,0))}
.name{flex:1;font:800 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--cream);white-space:nowrap;min-width:0}
.name small{display:none;font:600 8px var(--mono);letter-spacing:.16em;color:var(--cream2);margin-top:2px}
.ms{width:26px;height:24px;border:0;border-radius:6px;cursor:pointer;background:linear-gradient(180deg,#34373d,#232529);box-shadow:0 2px 0 #0d0e10,inset 0 1px 0 rgba(255,255,255,.12);font:800 10px var(--sans);color:var(--cream2);letter-spacing:.04em}
.ms[aria-pressed="true"].m{background:linear-gradient(180deg,#ff5a3a,#c93a1a);color:#fff;box-shadow:0 0 12px rgba(255,90,58,.6),0 2px 0 #0d0e10}
.ms[aria-pressed="true"].s{background:linear-gradient(180deg,#ffe28a,#e0b030);color:#2a1e00;box-shadow:0 0 12px rgba(255,220,120,.6),0 2px 0 #0d0e10}
.pads{display:flex;gap:5px;align-items:center}
.pads .g{display:flex;gap:5px;padding:5px 6px;border-radius:12px;background:rgba(0,0,0,.22);margin-right:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.pad{position:relative;width:31px;height:36px;padding:0;border:0;border-radius:9px;cursor:pointer;background:linear-gradient(180deg,#34363d,#25272c);box-shadow:0 3px 0 #0b0c0e,0 5px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -6px 10px rgba(0,0,0,.35);transition:transform .06s,box-shadow .06s,filter .1s}
.g.alt .pad{background:linear-gradient(180deg,#3c3f47,#2b2d33)}
.pad:active,.pad.dn{transform:translateY(2px);box-shadow:0 1px 0 #0b0c0e,inset 0 1px 0 rgba(255,255,255,.1)}
.pad.on{background:radial-gradient(circle at 50% 42%,#ffb680 0,#ff7a2a 38%,#c8460a 78%,#8a2e05 100%);box-shadow:0 3px 0 #0b0c0e,0 0 16px rgba(255,106,26,.5),inset 0 0 14px rgba(255,190,120,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.pad.acc{background:radial-gradient(circle at 50% 42%,#fffbe8 0,#ffd9a0 22%,#ff8a3a 55%,#c8460a 100%);box-shadow:0 3px 0 #0b0c0e,0 0 22px rgba(255,150,70,.85),inset 0 0 16px rgba(255,240,200,.9)}
.pad.acc::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
.pad.now{filter:brightness(1.35)}
.pad:not(.on).now{background:linear-gradient(180deg,#4a4d56,#33363c)}
.pad.hit{filter:brightness(1.8) saturate(1.2)}
.pad:disabled{opacity:.5}
.muted .pad.on,.muted .pad.acc{filter:saturate(.3) brightness(.65);box-shadow:0 3px 0 #0b0c0e}
.step{flex:none;width:31px;margin-right:6px;text-align:center;font:600 8.5px var(--mono);letter-spacing:.06em;color:var(--cream2);display:flex;flex-direction:column;align-items:center;gap:5px}
.step i{width:7px;height:7px;border-radius:50%;background:#3a1a0c;box-shadow:inset 0 1px 1px #000;transition:background .05s,box-shadow .05s}
.step.now i{background:#ff9a4a;box-shadow:0 0 10px 2px rgba(255,106,26,.9)}
.step.now{color:var(--orange)}
.head .pads .g{background:none;box-shadow:none;padding:0 7px}
.foot{display:flex;justify-content:space-between;align-items:center;padding:0 30px 20px;font:600 9px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:rgba(239,228,204,.4)}
.foot .feet{display:flex;gap:6px}
.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 50%,rgba(20,24,26,.6),rgba(10,12,14,.9));transition:opacity .6s,visibility .6s}
.veil.off{opacity:0;visibility:hidden;pointer-events:none}
.pw{display:flex;flex-direction:column;align-items:center;gap:20px;padding:34px 44px;border:0;background:none;cursor:pointer;color:var(--cream)}
.pw .ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#34373d,#1f2126);box-shadow:0 0 0 2px #0c0d0f,0 10px 30px rgba(0,0,0,.6),0 0 40px rgba(255,106,26,.35),inset 0 1px 0 rgba(255,255,255,.2);animation:pulse 2.2s ease-in-out infinite}
.pw svg{width:44px;height:44px;fill:none;stroke:var(--orange);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,106,26,.9))}
@keyframes pulse{50%{box-shadow:0 0 0 2px #0c0d0f,0 10px 30px rgba(0,0,0,.6),0 0 70px rgba(255,106,26,.6),inset 0 1px 0 rgba(255,255,255,.2)}}
.pw b{font:900 30px var(--sans);letter-spacing:.02em}
.pw b i{font-style:normal;color:var(--orange)}
.pw span{font:700 12px var(--sans);letter-spacing:.28em;text-transform:uppercase}
.pw small{font:500 11px var(--mono);letter-spacing:.1em;color:var(--cream2);max-width:26em;text-align:center;line-height:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dim .lcd,.dim #scope{opacity:.35}
/* ---------- phone / narrow layout ---------- */
@media (max-width:899px){
  .desk{display:block;padding:12px}
  .mat{inset:6px;border-radius:18px}.mat::before{inset:8px;border-radius:12px}
  .pencil{display:none}
  #stage{width:auto!important;height:auto!important}
  .device{position:relative;width:auto;transform:none!important;margin:6px auto 0;max-width:640px}
  .strip{height:auto;grid-template-columns:1fr 1fr;gap:10px 12px;padding:16px 16px 14px}
  .strip .brand{grid-column:1}.strip .power{grid-column:2;justify-self:end}
  .strip .lcd{grid-column:1/-1;height:58px;gap:14px;padding:0 14px}
  .seg{font-size:32px}
  #scope{grid-column:1/-1;height:52px}
  .main{grid-template-columns:1fr;gap:18px;padding:16px 12px 8px}
  .knobs{grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:auto;padding:14px 6px 10px}
  .knobs .kb{grid-row:auto}
  .knob.big{width:100px;height:100px}.knob.mid{width:72px;height:72px}
  .lbl{width:150px;padding-right:8px;position:sticky;left:0;z-index:2;background:#1d1f24}
  .name{font-size:10px;letter-spacing:.12em}.name small{display:none}
  .ms{width:30px;height:28px}
  .pad{width:42px;height:42px}
  .row{height:62px}
  .foot{padding:0 16px 16px;font-size:8px;flex-wrap:wrap;gap:6px}
}
@media (max-width:899px) and (orientation:landscape) and (max-height:520px){
  .pad{width:34px;height:34px}.pads .g{padding:4px 4px;gap:4px}.step{width:34px}
  .lbl{width:130px}
}
@media (prefers-reduced-motion:reduce){
  .pw .ring{animation:none}.pad,.play,.pb{transition:none}
}
</style>
</head>
<body>
<div class="desk" id="desk">
  <div class="mat" aria-hidden="true"><canvas id="felt" width="120" height="120" style="width:100%;height:100%"></canvas><div class="pencil" id="pencil"></div></div>
  <main id="stage">
    <div class="device dim" id="dev">
      <div class="strip">
        <span class="screw" style="left:12px"></span><span class="screw" style="right:12px"></span>
        <div class="brand"><b>GRV<i>-</i>16</b><span>Rhythm composer · 8 voices · 16 steps</span></div>
        <div class="lcd" aria-live="off">
          <div><span class="lab">Tempo</span><span class="seg" id="lcdB" data-g="888">122</span></div>
          <div><span class="lab">Step</span><span class="seg" id="lcdS" data-g="88">--</span></div>
          <div><span class="lab">Swing</span><span class="seg" id="lcdW" data-g="88">50</span></div>
          <div class="pn"><span class="lab" style="text-align:right">Pattern</span><span id="lcdP">Standby</span></div>
        </div>
        <canvas id="scope" width="360" height="66" aria-label="Oscilloscope and level meter" role="img"></canvas>
        <div class="power"><span class="lab" style="color:#333;margin:0;letter-spacing:.2em">Power</span><i class="led" id="pled"></i></div>
      </div>
      <div class="main">
        <div class="left">
          <div class="knobs">
            <div class="kw kb"><div class="knob big" id="kTempo" role="slider" tabindex="0" aria-valuenow="122" aria-label="Tempo in beats per minute"></div><label>Tempo</label><output id="oTempo">122</output><span class="tip">122</span></div>
            <div class="kw"><div class="knob mid" id="kSwing" role="slider" tabindex="0" aria-valuenow="50" aria-label="Swing"></div><label>Swing</label><output id="oSwing">50%</output><span class="tip">50%</span></div>
            <div class="kw"><div class="knob mid" id="kMaster" role="slider" tabindex="0" aria-valuenow="55" aria-label="Master volume"></div><label>Master</label><output id="oMaster">55%</output><span class="tip">55%</span></div>
          </div>
          <div class="trans">
            <button class="play" id="play" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" id="pIcon"><path d="M6 4l14 8-14 8z"/></svg><span id="pTxt">Play</span></button>
            <div class="tled"><i class="led" id="tled"></i>Beat</div>
          </div>
          <div>
            <p class="sec-t">Patterns</p>
            <div class="pres" id="pres">
              <button class="pb" type="button" data-p="0"><i></i>House</button>
              <button class="pb" type="button" data-p="1"><i></i>Boom-bap</button>
              <button class="pb" type="button" data-p="2"><i></i>Trap</button>
              <button class="pb" type="button" data-p="3"><i></i>Afrobeat</button>
              <button class="pb alt" type="button" id="rand">Random fill</button>
              <button class="pb alt" type="button" id="clear">Clear</button>
            </div>
          </div>
        </div>
        <div class="seq">
          <div class="gridw" id="gw"><div class="grid" id="grid"></div></div>
        </div>
      </div>
      <div class="foot"><span>Click a pad · right-click or long-press for accent · Space plays</span><span class="feet" aria-hidden="true">GRV-16 / 2026</span></div>
    </div>
  </main>
</div>
<div class="veil" id="veil"><button class="pw" id="pw" type="button"><span class="ring"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6v18M14 12a16 16 0 1020 0"/></svg></span><b>GRV<i>-</i>16</b><span>Tap to power on</span><small>Every sound is synthesised in your browser. Volume starts modest; the pattern begins as soon as the lights come up.</small></button></div>
<p class="sr" id="live" role="status"></p>

<script>
(function(){
'use strict';
var doc=document;
function $(s){return doc.querySelector(s)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
var TR=[['Kick','sine sweep'],['Snare','noise + tone'],['Clap','noise bursts'],['Closed hat','metal + noise'],['Open hat','metal + noise'],['Tom','sine sweep'],['Rim','click'],['Cowbell','two squares']];
var PRESETS=[

  if(an&&powered){
    if(!wave)wave=new Uint8Array(an.fftSize);an.getByteTimeDomainData(wave);
    var m=0,s2=0;for(var i=0;i<wave.length;i++){var v=(wave[i]-128)/128;s2+=v*v;if(Math.abs(v)>m)m=Math.abs(v)}
    var rms=Math.sqrt(s2/wave.length);lvl+=(Math.min(1,rms*3.2)-lvl)*(rms*3.2>lvl?.5:.12);peak=Math.max(peak*.97,m);
    var st=0;for(i=1;i<wave.length/2;i++){if(wave[i-1]<128&&wave[i]>=128){st=i;break}}
    sx.strokeStyle='rgba(255,106,26,.35)';sx.lineWidth=5;sx.lineJoin='round';drawW(true);sx.strokeStyle='#ffa060';sx.lineWidth=1.6;drawW(false);
    function drawW(){sx.beginPath();var n=Math.min(480,wave.length-st),w0=vuW+8,ww=W-w0-6;for(var j=0;j<n;j++){var x=w0+j/n*ww,y=H/2-((wave[st+j]-128)/128)*(H*.46);if(j===0)sx.moveTo(x,y);else sx.lineTo(x,y)}sx.stroke()}
  }else{sx.strokeStyle='rgba(255,140,70,.4)';sx.lineWidth=1.4;sx.beginPath();sx.moveTo(vuW+8,H/2);sx.lineTo(W-6,H/2);sx.stroke();lvl*=.9}
  // VU segments
  var segs=12,sh=(H-12)/segs;
  for(var q=0;q<segs;q++){var on=q<lvl*segs,y0=H-6-(q+1)*sh+1;sx.fillStyle=on?(q>9?'#ff3d2a':q>7?'#ffb030':'#ff6a1a'):'rgba(255,106,26,.1)';sx.fillRect(10,y0,vuW*.42,sh-2);sx.fillRect(10+vuW*.5,y0,vuW*.42,sh-2)}
}

/* ---------- felt texture + loop ---------- */
try{var fc=$('#felt'),fx=fc.getContext('2d'),im=fx.createImageData(120,120),d=im.data;for(var i=0;i<d.length;i+=4){var v=Math.random();d[i]=200;d[i+1]=230;d[i+2]=225;d[i+3]=v<.5?0:(v*34)|0}fx.putImageData(im,0,0);
  $('#felt').style.imageRendering='auto';var tile=doc.createElement('canvas');tile.width=tile.height=120;tile.getContext('2d').putImageData(im,0,0);$('#felt').parentNode.style.backgroundImage;fc.style.display='none';
  var mat=$('#felt').parentNode;mat.style.setProperty('--felt','url("'+tile.toDataURL()+'")');var ov=doc.createElement('div');ov.style.cssText='position:absolute;inset:0;opacity:.55;background-image:var(--felt);background-size:120px 120px';mat.insertBefore(ov,mat.firstChild)}catch(e){}
var pen=$('#pencil');
function loop(){
  requestAnimationFrame(loop);
  if(doc.hidden)return;
  if(playing){var t=now(),c=false;while(queue.length&&queue[0].t<=t+.005){var q=queue.shift();showStep(q.s);c=true}}
  if(kick>0){kick*=.86;if(!reduce)pen.style.transform='rotate('+(-12+kick*1.6)+'deg) translateY('+(-kick*1.5).toFixed(2)+'px)'}
  drawScope();
}
requestAnimationFrame(loop);

/* ---------- fit to viewport ---------- */
var dev=$('#dev'),stage=$('#stage');
function fit(){
  var w=window.innerWidth,h=window.innerHeight;
  if(w<900){dev.style.transform='';stage.style.width='';stage.style.height='';return}
  var dh=dev.offsetHeight,s=Math.min((w-56)/1240,(h-56)/dh,1.35);
  dev.style.transform='scale('+s.toFixed(4)+')';stage.style.width=(1240*s)+'px';stage.style.height=(dh*s)+'px';
}
window.addEventListener('resize',fit);fit();

/* ---------- power on ---------- */
function powerOn(){
  if(powered)return;powered=true;
  initAudio();try{if(ctx&&ctx.resume)ctx.resume()}catch(e){}
  $('#veil').classList.add('off');dev.classList.remove('dim');
  var leds=0,txt=['GRV-16','BOOT','READY'],ti=0;$('#pled').classList.add('on');
  if(!audioOK)$('#lcdP').textContent='No audio';
  var bt=setInterval(function(){$('#lcdP').textContent=txt[Math.min(ti++,2)];if(ti>3){clearInterval(bt)}},reduce?50:260);
  applyMaster();
  setTimeout(function(){loadPreset(0);start();$('#live').textContent='Powered on. House pattern playing. Space stops.'},reduce?150:900);
}
$('#pw').addEventListener('click',powerOn);
loadPreset(0);$('#lcdP').textContent='Standby';
doc.addEventListener('visibilitychange',function(){if(doc.hidden&&playing){}});
})();
</script>
