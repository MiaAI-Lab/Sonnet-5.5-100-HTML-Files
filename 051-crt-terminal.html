<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORACLE-9 — Operator Console</title>
<meta name="description" content="A phosphor-amber CRT operator console with a real interactive shell: boot sequence, poems and story fragments, fortunes, a safe calculator, colour themes and a falling-glyph mode.">
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,"Nimbus Sans","Liberation Sans",sans-serif;
  --hand:"Bradley Hand","Segoe Print","Chalkboard SE","Comic Neue","Z003","URW Chancery L",cursive;
  --ph:#ffb000; --ph-dim:#9a6500; --ph-hi:#ffe3a3; --bg:#120a00; --bg2:#1d1105; --err:#ff6a3d;
  --g1:rgba(255,176,0,.9); --g2:rgba(255,140,0,.55); --g3:rgba(255,110,0,.24); --gc:255,150,30;
  --bright:1.1; --glow:.8;
  --beige:#d9cfb8;
  --tex:none; --dust:none;
}
body[data-theme="green"]{--ph:#3dff77;--ph-dim:#188c3c;--ph-hi:#c9ffd8;--bg:#03120a;--bg2:#062010;--err:#ff8c5a;--g1:rgba(61,255,119,.9);--g2:rgba(40,230,100,.5);--g3:rgba(20,200,80,.22);--gc:60,255,120}
body[data-theme="white"]{--ph:#e4eeff;--ph-dim:#7f8ea8;--ph-hi:#ffffff;--bg:#05080d;--bg2:#0b1119;--err:#ff9090;--g1:rgba(210,228,255,.85);--g2:rgba(150,190,255,.45);--g3:rgba(110,160,255,.2);--gc:160,200,255}
*,*::before,*::after{box-sizing:border-box}
html{background:#080503;-webkit-text-size-adjust:100%}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:#0a0603;color:var(--ph);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit}
:focus-visible{outline:2px solid var(--ph-hi);outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

/* ------------------------------------------------------------------ room */
.room{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(62% 56% at 50% 43%,rgba(var(--gc),calc(.2*var(--glow))),rgba(var(--gc),calc(.05*var(--glow))) 52%,transparent 76%),
    radial-gradient(90% 60% at 50% 100%,rgba(60,38,16,.5),transparent 70%),
    linear-gradient(180deg,#140c06 0%,#0c0805 58%,#050302 100%)}
.desk{position:fixed;left:0;right:0;bottom:0;height:15vh;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,190,120,.06),transparent 4px),repeating-linear-gradient(88deg,rgba(255,255,255,.012) 0 3px,transparent 3px 9px),linear-gradient(180deg,#1d130b,#0a0604 70%);
  box-shadow:inset 0 1px 0 rgba(255,190,120,.09)}

/* ------------------------------------------------------------------ stage + monitor */
.stage{position:fixed;left:50%;top:calc(50% - 6px);width:1240px;height:880px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%}
.monitor{position:relative;width:100%;height:100%;border-radius:56px 56px 42px 42px/62px 62px 42px 42px;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.3),transparent 60%),linear-gradient(180deg,#e6dec8 0%,#dad0b9 30%,#d3c8ae 62%,#c4b99d 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.75),inset 0 -3px 0 rgba(92,74,44,.42),inset 3px 0 0 rgba(255,255,255,.35),inset -3px 0 0 rgba(92,74,44,.28),inset 0 0 90px rgba(112,88,50,.3),0 2px 0 #a99e82,0 46px 70px -26px rgba(0,0,0,.9),0 0 0 1px rgba(60,44,20,.55)}
.monitor::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:var(--tex);background-size:200px 200px;mix-blend-mode:multiply;opacity:.6}
.reflect{position:absolute;left:6%;right:6%;bottom:-46px;height:56px;pointer-events:none;background:radial-gradient(50% 100% at 50% 0%,rgba(var(--gc),calc(.3*var(--glow))),transparent 72%);filter:blur(12px)}
.top{position:absolute;left:94px;width:760px;top:0;height:58px;display:flex;align-items:center;gap:26px;
  font:700 10.5px/1 var(--sans);letter-spacing:.36em;color:#8d8166;text-shadow:0 1px 0 rgba(255,255,255,.55);pointer-events:none}
.screw{position:absolute;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efe8d6,#b3a88c 60%,#8a7f66);box-shadow:0 1px 2px rgba(50,38,18,.55),inset 0 -1px 1px rgba(60,46,20,.4)}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:6.5px;height:2px;background:rgba(50,40,20,.6);transform:rotate(38deg);border-radius:1px}
.screw.a{left:30px;top:24px}.screw.b{right:30px;top:24px}.screw.c{left:30px;bottom:26px}.screw.d{right:30px;bottom:26px}
.recess{position:absolute;left:94px;top:58px;width:1052px;height:652px;padding:16px;border-radius:64px;
  background:linear-gradient(150deg,#bfb497 0%,#d7cdb5 45%,#e2dac5 100%);
  box-shadow:inset 0 4px 10px rgba(74,56,28,.55),inset 0 -2px 0 rgba(255,255,255,.55),inset 3px 0 6px rgba(74,56,28,.3),0 2px 0 rgba(255,255,255,.6),0 0 0 1px rgba(110,90,54,.45)}
.gasket{position:relative;width:100%;height:100%;border-radius:52px;padding:10px;background:#0a0705;
  box-shadow:inset 0 0 0 2px #1b1510,inset 0 0 14px 3px #000,0 1px 0 rgba(255,255,255,.4)}
.glass{position:relative;width:100%;height:100%;border-radius:9% / 11%;overflow:hidden;background:var(--bg);isolation:isolate;cursor:text}

/* the phosphor tube */
.content{position:absolute;inset:0;opacity:0;filter:brightness(var(--bright));
  background:radial-gradient(ellipse at 50% 46%,var(--bg2) 0%,var(--bg) 58%,#040200 100%)}
body.on .content{opacity:1;transition:opacity .45s .25s}
.term{position:absolute;inset:0;padding:24px 30px 26px;overflow-y:auto;overflow-x:hidden;font:400 18px/1.3 var(--mono);letter-spacing:.04em;color:var(--ph);
  text-shadow:-.55px 0 rgba(255,50,20,.32),.55px 0 rgba(40,190,255,.24),0 0 1px var(--g1),0 0 6px var(--g2),0 0 18px var(--g3);
  white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:none;transition:color .5s,opacity .3s;font-variant-ligatures:none}
.term::-webkit-scrollbar{display:none}
body.matrix .term{opacity:0}
#log{display:inline}
.seg{display:inline}
.seg.dim{color:var(--ph-dim);text-shadow:0 0 1px var(--g3),0 0 8px var(--g3)}
.seg.hi{color:var(--ph-hi);text-shadow:-.55px 0 rgba(255,50,20,.32),.55px 0 rgba(40,190,255,.24),0 0 2px var(--g1),0 0 9px var(--g2),0 0 24px var(--g3)}
.seg.err{color:var(--err);text-shadow:0 0 2px var(--err),0 0 9px var(--err)}
.seg.art{display:block;letter-spacing:0;line-height:1.08;font-variant-ligatures:none;white-space:pre;text-shadow:0 0 1px var(--g1),0 0 7px var(--g2),0 0 20px var(--g3)}
.seg.art.hi{line-height:1;color:var(--ph);text-shadow:0 0 1px var(--g1),0 0 6px var(--g2),0 0 22px var(--g2)}
.seg.ok{color:var(--ph-hi);animation:okblink .55s steps(1) 3}
@keyframes okblink{0%,49%{opacity:1}50%,100%{opacity:.12}}
.cur{display:inline-block;background:var(--ph);color:var(--bg);box-shadow:0 0 9px var(--g2),0 0 22px var(--g3);text-shadow:none;animation:blink 1.05s steps(1) infinite}
.cur.solid{animation:none}
@keyframes blink{0%,54%{opacity:1}55%,100%{opacity:0}}
#tcur{display:inline-block;width:.62em;height:1.05em;vertical-align:-.16em;background:var(--ph);box-shadow:0 0 9px var(--g2),0 0 22px var(--g3);animation:blink 1.05s steps(1) infinite}
#pline{display:none}
body.idle #pline{display:block}
#ghost{color:var(--ph-dim);text-shadow:0 0 6px var(--g3)}
.ghost{position:absolute;left:0;right:0;bottom:0;height:44px;opacity:0;border:0;padding:0;margin:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;z-index:9}
#mx{position:absolute;inset:0;width:100%;height:100%;display:none}
body.matrix #mx{display:block}
.skiphint{position:absolute;left:0;right:0;text-align:center;bottom:20px;font:400 11px/1 var(--mono);letter-spacing:.24em;color:var(--ph-dim);text-shadow:0 0 6px var(--g3);display:none;z-index:3}
body.bootmode .skiphint{display:block}
.mxhint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:400 13px/1 var(--mono);letter-spacing:.3em;color:var(--ph-hi);text-shadow:0 0 8px var(--g2);display:none;z-index:3;animation:blink 1.6s steps(1) infinite}
body.matrix .mxhint{display:block}

/* CRT glass effects */
.fx{position:absolute;inset:0;pointer-events:none}
.scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.36) 2px 3px);mix-blend-mode:multiply}
.mask{background:repeating-linear-gradient(90deg,rgba(255,40,40,.045) 0 1px,rgba(40,255,60,.04) 1px 2px,rgba(50,90,255,.05) 2px 3px);mix-blend-mode:screen;opacity:.75}
.roll{top:-34%;height:32%;bottom:auto;background:linear-gradient(to bottom,transparent,rgba(var(--gc),.025) 22%,rgba(var(--gc),.075) 50%,rgba(var(--gc),.025) 78%,transparent);mix-blend-mode:screen;animation:roll 9s linear infinite}
@keyframes roll{0%{transform:translateY(0)}100%{transform:translateY(420%)}}
.flick{background:rgba(var(--gc),.055);mix-blend-mode:screen;animation:flick .13s steps(1) infinite}
@keyframes flick{0%{opacity:.15}25%{opacity:.9}50%{opacity:.35}75%{opacity:1}100%{opacity:.2}}
.dust{background:var(--dust) center/100% 100% no-repeat;mix-blend-mode:screen;opacity:.42}
.vig{background:radial-gradient(ellipse at 50% 47%,transparent 58%,rgba(0,0,0,.34) 84%,rgba(0,0,0,.72) 100%)}
.glare{background:
  radial-gradient(130% 90% at 20% 4%,rgba(255,255,255,.14),transparent 40%),
  linear-gradient(118deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 26%,transparent 34%),
  radial-gradient(ellipse 40% 20% at 80% 94%,rgba(255,255,255,.05),transparent 70%)}
.glare::before{content:"";position:absolute;left:3.2%;top:3.6%;width:28%;height:22%;border-radius:100% 0 60% 0/100% 0 60% 0;border-top:2px solid rgba(255,255,255,.2);border-left:2px solid rgba(255,255,255,.14);filter:blur(1.2px);opacity:.8}
.curve{box-shadow:inset 0 0 80px 6px rgba(0,0,0,.6),inset 0 0 22px 5px rgba(0,0,0,.8),inset 0 0 0 2px rgba(0,0,0,.9)}
.beam{left:50%;top:50%;right:auto;bottom:auto;width:0;height:3px;transform:translate(-50%,-50%);opacity:0;background:var(--ph-hi);box-shadow:0 0 22px 7px rgba(var(--gc),.75);border-radius:2px}
body.booting .beam{animation:beamOn .95s cubic-bezier(.3,.7,.2,1) both}
@keyframes beamOn{0%{width:0;height:3px;opacity:1}30%{width:92%;height:3px;opacity:1}62%{width:100%;height:100%;opacity:.85;border-radius:0}100%{width:100%;height:100%;opacity:0;border-radius:0}}
body.poweroff .beam{animation:beamOff .6s ease-in both}
@keyframes beamOff{0%{width:100%;height:100%;opacity:.5;border-radius:0}45%{width:100%;height:4px;opacity:1}85%{width:5px;height:4px;opacity:1;border-radius:50%}100%{width:0;height:0;opacity:0}}
body.off .content{opacity:0;transition:opacity .25s}
body.off .flick,body.off .roll{opacity:0}
body.glitch .glass{animation:glitch .5s steps(1)}
@keyframes glitch{0%{transform:translateX(0);filter:brightness(1)}12%{transform:translateX(-7px);filter:brightness(1.7) hue-rotate(-20deg)}24%{transform:translateX(9px) skewX(2deg);filter:brightness(.6)}38%{transform:translateX(-3px);filter:brightness(1.4)}56%{transform:translateX(4px)}100%{transform:none;filter:none}}

/* ------------------------------------------------------------------ front panel */
.panel{position:absolute;left:94px;right:94px;top:736px;height:112px;display:flex;align-items:center;gap:36px}
.plate{flex:0 0 306px;height:88px;border-radius:9px;padding:11px 18px 12px;display:flex;flex-direction:column;justify-content:center;gap:7px;
  background:linear-gradient(180deg,#28231b,#14110c);border:2px solid #b8ad91;
  box-shadow:inset 0 0 0 1px #000,inset 0 2px 6px rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.75),0 -1px 0 rgba(90,72,40,.35)}
.plate b{font:900 31px/1 Impact,"Arial Black","Haettenschweiler","Franklin Gothic Heavy","Nimbus Sans",sans-serif;letter-spacing:.15em;color:#ecdfc2;text-shadow:0 1px 0 #000,0 -1px 0 rgba(255,255,255,.14);white-space:nowrap}
.plate small{font:700 9.5px/1 var(--sans);letter-spacing:.3em;color:#a99c7d;white-space:nowrap}
.plate i{display:block;height:3px;background:linear-gradient(90deg,#e5a12a 0 33.3%,#d2691e 33.3% 66.6%,#b23a2a 66.6%)}
.vents{flex:1;min-width:60px;height:62px;border-radius:12px;position:relative;
  background:repeating-linear-gradient(90deg,#1a140c 0 5px,rgba(255,255,255,.55) 5px 6px,transparent 6px 13px),linear-gradient(180deg,#c9bea3,#d8ceb6);
  box-shadow:inset 0 4px 8px rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,.4),0 1px 0 rgba(255,255,255,.65)}
.vents::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 45%)}
.ctrls{display:flex;align-items:center;gap:28px}
.grp{display:flex;flex-direction:column;align-items:center;gap:9px}
.lbl{font:700 9px/1 var(--sans);letter-spacing:.24em;color:#8b7f64;text-shadow:0 1px 0 rgba(255,255,255,.5);white-space:nowrap}
.led{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a4a3c,#1b241c 60%,#0b100c);box-shadow:inset 0 0 2px #000,0 0 0 3px #b3a88b,0 0 0 4px rgba(60,46,20,.5),0 1px 0 4px rgba(255,255,255,.5);transition:background .3s,box-shadow .3s}
body.on .led{background:radial-gradient(circle at 35% 30%,#e0ffe6,#3dff6e 40%,#0b8a2c);box-shadow:inset 0 0 2px rgba(0,60,10,.5),0 0 0 3px #b3a88b,0 0 0 4px rgba(60,46,20,.5),0 0 10px 2px rgba(61,255,110,.85),0 0 26px 6px rgba(61,255,110,.4)}
.rocker{position:relative;width:46px;height:30px;border-radius:5px;border:0;padding:0;cursor:pointer;background:linear-gradient(180deg,#2a251d,#15120d);box-shadow:inset 0 0 0 1px #000,0 0 0 3px #b3a88b,0 0 0 4px rgba(60,46,20,.5),0 3px 5px rgba(50,38,18,.5)}
.rocker::before{content:"";position:absolute;left:4px;right:4px;top:3px;height:12px;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#efe4c8,#b8ac8e);box-shadow:0 1px 2px rgba(0,0,0,.6);transition:top .18s,height .18s}
body.on .rocker::before{top:14px;height:12px;border-radius:1px 1px 3px 3px;background:linear-gradient(180deg,#b8ac8e,#efe4c8)}
.rocker span{position:absolute;left:0;right:0;font:800 8px/1 var(--sans);text-align:center;color:#9d9174}
.rocker .i{top:5px;display:none}.rocker .o{bottom:4px}
.sw{position:relative;width:46px;height:24px;border-radius:12px;border:0;padding:0;cursor:pointer;background:linear-gradient(180deg,#1e1a13,#2c271e);box-shadow:inset 0 2px 4px #000,0 0 0 3px #b3a88b,0 0 0 4px rgba(60,46,20,.5)}
.sw::before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3ecd8,#a99e83);box-shadow:0 2px 3px rgba(0,0,0,.6);transition:left .2s}
.sw[aria-checked="true"]::before{left:25px;background:radial-gradient(circle at 35% 30%,#fff6dc,#e5a12a)}
.knobwrap{position:relative;width:96px;height:80px;display:flex;align-items:center;justify-content:center}
.knobwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.knob{position:relative;width:62px;height:62px;border-radius:50%;cursor:grab;touch-action:none;outline-offset:6px;
  background:repeating-conic-gradient(#c5b99c 0 3deg,#8f846a 3deg 6deg);
  box-shadow:0 4px 7px rgba(50,38,18,.65),0 0 0 3px #a89d82,0 0 0 4px rgba(50,38,18,.5),inset 0 1px 1px rgba(255,255,255,.7);transform:rotate(var(--rot,0deg))}
.knob:active{cursor:grabbing}
.knob::before{content:"";position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#f2ebd8,#bfb399 55%,#8c8067);box-shadow:inset 0 -3px 5px rgba(60,46,20,.45),0 1px 3px rgba(0,0,0,.5)}
.knob i{position:absolute;left:50%;top:10px;width:4px;height:17px;margin-left:-2px;border-radius:2px;background:#2b2216;box-shadow:0 1px 0 rgba(255,255,255,.5)}
.note{position:absolute;right:112px;top:10px;width:204px;padding:12px 14px 13px;transform:rotate(2.6deg);font:400 18px/1.15 var(--hand);color:#3b3320;
  background:linear-gradient(170deg,#f6ea94,#eedb73);box-shadow:0 8px 10px -4px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.4) inset;pointer-events:none}
.note::before{content:"";position:absolute;left:50%;top:-9px;width:64px;height:20px;margin-left:-32px;background:rgba(255,255,255,.4);box-shadow:0 1px 2px rgba(0,0,0,.2);transform:rotate(-2deg)}
.keys{display:none}
.serial{position:absolute;right:104px;bottom:14px;font:700 8.5px/1 var(--sans);letter-spacing:.3em;color:#9a8e72;text-shadow:0 1px 0 rgba(255,255,255,.5)}

/* ------------------------------------------------------------------ compact (phones, short screens) */
body.compact{--s:1}
body.compact .stage{left:0;top:0;width:100%;height:var(--vh,100dvh);transform:none}
body.compact .monitor{border-radius:0;display:flex;flex-direction:column;padding:8px 8px 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(92,74,44,.4)}
body.compact .top,body.compact .screw,body.compact .note,body.compact .serial,body.compact .reflect{display:none}
body.compact .recess{position:relative;left:auto;top:auto;width:auto;height:auto;flex:1;min-height:0;padding:8px;border-radius:34px}
body.compact .gasket{border-radius:28px;padding:6px}
body.compact .glass{border-radius:22px/26px}
body.compact .term{font-size:clamp(11.5px,3.5vw,15px);padding:16px 16px 18px;letter-spacing:.03em}
body.compact .panel{position:relative;left:auto;right:auto;top:auto;height:auto;padding:12px 6px 6px;gap:12px;justify-content:space-between}
body.compact .plate{flex:0 1 150px;height:58px;padding:7px 10px;gap:4px;min-width:0}
body.compact .plate b{font-size:19px}
body.compact .plate small{font-size:6.6px;letter-spacing:.18em}
body.compact .vents{display:none}
body.compact .ctrls{gap:14px}
body.compact .lbl{font-size:7.5px}
body.compact .knobwrap{width:66px;height:62px}
body.compact .knob{width:42px;height:42px}
body.compact .knob::before{inset:6px}
body.compact .knob i{top:7px;height:11px}
body.compact .keys{display:flex;gap:6px;padding:4px 4px calc(10px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}
body.compact .keys::-webkit-scrollbar{display:none}
.keys button{flex:1 0 auto;min-width:52px;min-height:44px;padding:0 10px;cursor:pointer;font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#4a4130;
  border:0;border-radius:7px;background:linear-gradient(180deg,#efe6cf,#d3c8ac);box-shadow:0 3px 0 #9d9174,0 4px 5px rgba(50,38,18,.5),inset 0 1px 0 rgba(255,255,255,.8)}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #9d9174,0 2px 3px rgba(50,38,18,.5),inset 0 1px 0 rgba(255,255,255,.8)}

@media (prefers-reduced-motion:reduce){
  .flick,.roll{animation:none;opacity:0}
  body.glitch .glass{animation:none}
  .cur,#tcur,.mxhint{animation:none}
}
</style>
</head>
<body class="off" data-theme="amber">
<div class="room" aria-hidden="true"></div>
<div class="desk" aria-hidden="true"></div>

<div class="stage" id="stage">
  <div class="monitor" id="monitor">
    <div class="top" aria-hidden="true"><span>MERIDIAN DATA SYSTEMS</span><span>MODEL OC-9 &nbsp;·&nbsp; PHOSPHOR-A</span></div>
    <i class="screw a" aria-hidden="true"></i><i class="screw b" aria-hidden="true"></i><i class="screw c" aria-hidden="true"></i><i class="screw d" aria-hidden="true"></i>

    <div class="recess">
      <div class="gasket">
        <div class="glass" id="glass">
          <div class="content" id="content">
            <div class="term" id="scr" role="log" aria-label="Terminal output" aria-live="off"><span id="log"></span><span id="tcur"></span><div id="pline"><span id="pfx"></span><span id="ib"></span><span class="cur" id="ic"> </span><span id="ia"></span><span id="ghost"></span></div></div>
            <canvas id="mx" aria-hidden="true"></canvas>
            <div class="mxhint" aria-hidden="true">PRESS ANY KEY</div>
            <div class="skiphint" aria-hidden="true">ENTER · SKIP</div>
          </div>
          <div class="fx scan" aria-hidden="true"></div>
          <div class="fx mask" aria-hidden="true"></div>
          <div class="fx roll" aria-hidden="true"></div>
          <div class="fx flick" aria-hidden="true"></div>

  if (S.power) body.style.setProperty('--glow', (.25 + S.bright * .75).toFixed(3));
  knob.style.setProperty('--rot', (-135 + S.bright * 270).toFixed(1) + 'deg'); knob.setAttribute('aria-valuenow', Math.round(S.bright * 100));
}
(function knobInit() {
  let drag = false;
  const fromEvent = e => { const r = knob.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); let deg = Math.atan2(dx, -dy) * 180 / Math.PI; if (deg > 135 && deg <= 180) deg = 135; if (deg < -135 || deg > 180) deg = -135; return clamp((deg + 135) / 270, 0, 1); };
  knob.addEventListener('pointerdown', e => { drag = true; try { knob.setPointerCapture(e.pointerId); } catch (er) { /* ignore */ } setBright(fromEvent(e)); e.preventDefault(); });
  knob.addEventListener('pointermove', e => { if (drag) setBright(fromEvent(e)); });
  const up = () => { drag = false; }; knob.addEventListener('pointerup', up); knob.addEventListener('pointercancel', up);
  knob.addEventListener('keydown', e => { const k = e.key, st = e.shiftKey ? .15 : .05; if (k === 'ArrowRight' || k === 'ArrowUp') setBright(S.bright + st); else if (k === 'ArrowLeft' || k === 'ArrowDown') setBright(S.bright - st); else if (k === 'Home') setBright(0); else if (k === 'End') setBright(1); else return; e.preventDefault(); });
  knob.addEventListener('wheel', e => { e.preventDefault(); setBright(S.bright - Math.sign(e.deltaY) * .04); }, { passive: false });
})();

/* an occasional hiccup in the signal keeps the glass feeling alive */
setInterval(() => { if (S.power && !RM.matches && !doc.hidden && Math.random() < .35) { glass.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + (Math.random() < .5 ? -3 : 3) + 'px)' }, { transform: 'translateX(0)' }], { duration: 110 }); } }, 9000);
doc.addEventListener('visibilitychange', () => { if (doc.hidden && S.mode === 'matrix') { /* matrix keeps its state; rAF pauses by itself */ } });

/* boot */
fit(); setBright(S.bright, true);
setTimeout(() => { fit(); powerOn(); }, 350);
window.addEventListener('load', fit);
})();
</script>
