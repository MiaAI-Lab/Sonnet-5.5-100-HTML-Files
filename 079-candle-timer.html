<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0806">
<title>Candle Hour — a focus timer</title>
<style>
:root{
  color-scheme:dark;
  --room:#0b0806; --ivory:#f3e9d2; --flame:#ffb347; --flame2:#ffd98a; --core:#7fb5ff; --brass:#b88a44; --brass2:#d8b066;
  --dim:rgba(243,233,210,.62); --hair:rgba(184,138,68,.5);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"URW Bookman","C059","Nimbus Roman",serif;
  --sans:"Gill Sans","Gill Sans MT",Optima,Calibri,"Segoe UI",Ubuntu,Cantarell,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gut:clamp(14px,3vw,40px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--room);color:var(--ivory)}
body{height:100vh;height:100dvh;overflow:hidden;font-family:var(--serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.grain,.vig{position:fixed;inset:0;pointer-events:none}
.vig{background:radial-gradient(120% 95% at 50% 62%,transparent 46%,rgba(4,2,1,.72) 100%)}
.grain{opacity:.5;mix-blend-mode:overlay}

.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.head{margin-top:clamp(18px,5.5vh,64px);text-align:center;padding:0 var(--gut);transition:opacity 1.6s var(--ease)}
.kicker{font:500 clamp(10px,.9vw,12px) var(--sans);letter-spacing:.42em;text-transform:uppercase;color:var(--brass);padding-left:.42em;opacity:.85}
.time{margin-top:clamp(2px,1vh,10px);font-weight:400;font-size:clamp(48px,min(8.6vw,13.5vh),124px);line-height:1;letter-spacing:.03em;font-variant-numeric:oldstyle-nums tabular-nums;color:var(--ivory);text-shadow:0 0 44px rgba(255,170,80,.38),0 2px 0 rgba(0,0,0,.25);transition:opacity 1.8s var(--ease)}
.finished .head{opacity:0}
.dim .time{opacity:.3}
.dim .kicker{opacity:.4}
.msg{margin-top:clamp(6px,1.6vh,16px);min-height:1.5em;font-style:italic;font-size:clamp(15px,1.8vw,22px);letter-spacing:.01em;color:var(--dim);transition:opacity .7s var(--ease);text-shadow:0 1px 18px rgba(0,0,0,.9)}
.msg.out{opacity:0}

.done{position:absolute;left:0;right:0;top:clamp(70px,16vh,170px);display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;visibility:hidden;transition:opacity 2.2s var(--ease),visibility 0s 2.2s;padding:0 var(--gut)}
.done.show{opacity:1;visibility:visible;transition:opacity 2.2s var(--ease),visibility 0s}
.done .big{font-size:clamp(34px,6vw,76px);font-weight:400;font-style:italic;letter-spacing:.01em;line-height:1.08;text-shadow:0 0 40px rgba(255,190,110,.35)}
.breath{width:clamp(54px,7vw,84px);aspect-ratio:1;margin:clamp(16px,3vh,30px) 0;border-radius:50%;border:1px solid var(--hair);box-shadow:0 0 30px rgba(255,190,110,.18) inset,0 0 30px rgba(255,190,110,.12);animation:breathe 10s var(--ease) infinite}
@keyframes breathe{0%,100%{transform:scale(.55);opacity:.45}40%{transform:scale(1.1);opacity:1}}

.dock{position:absolute;left:0;right:0;bottom:0;padding:0 var(--gut) clamp(14px,3.2vh,34px);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;transition:opacity 1.4s var(--ease)}
.dock>*{pointer-events:auto}
.dim .dock{opacity:.5}
.dim .dock:hover,.dim .dock:focus-within{opacity:1}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips{gap:6px}
.glass{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border-radius:999px;border:1px solid var(--hair);color:#ecd6a6;font:500 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;background:linear-gradient(180deg,rgba(255,236,200,.13),rgba(255,236,200,.03));box-shadow:inset 0 1px 0 rgba(255,244,220,.22),0 8px 26px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:border-color .3s var(--ease),color .3s var(--ease),background .3s var(--ease),transform .2s var(--ease),box-shadow .3s var(--ease),opacity .3s}
.glass:hover{border-color:var(--brass2);color:#fff1cf;box-shadow:inset 0 1px 0 rgba(255,244,220,.3),0 0 26px rgba(255,170,80,.22),0 8px 26px rgba(0,0,0,.45)}
.glass:active{transform:scale(.96)}
.glass:focus-visible,.custom input:focus-visible{outline:2px solid var(--flame2);outline-offset:3px}
.glass[disabled]{opacity:.38;cursor:default;pointer-events:none}
.chip{min-width:56px;padding:0 14px;letter-spacing:.14em}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#d9b56b,#9b7232);color:#2a1a08;border-color:#e9c77e;box-shadow:inset 0 1px 0 rgba(255,244,220,.55),0 0 24px rgba(255,170,80,.28)}
.glass svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#b-light.pulse{border-color:var(--flame2);color:#fff1cf;animation:beckon 2.4s ease-in-out infinite}
@keyframes beckon{0%,100%{box-shadow:inset 0 1px 0 rgba(255,244,220,.22),0 0 0 rgba(255,170,80,0),0 8px 26px rgba(0,0,0,.45)}50%{box-shadow:inset 0 1px 0 rgba(255,244,220,.3),0 0 30px rgba(255,170,80,.4),0 8px 26px rgba(0,0,0,.45)}}
.custom{display:flex;align-items:center;gap:8px;font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.custom[hidden]{display:none}
.custom{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);padding:8px 10px;border-radius:999px;background:rgba(11,8,6,.72);border:1px solid var(--hair);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#b-sound[aria-pressed="false"] .on,#b-sound[aria-pressed="true"] .off{display:none}
.custom input{width:84px;height:42px;border-radius:999px;border:1px solid var(--hair);background:rgba(255,236,200,.06);color:var(--ivory);font:400 18px var(--serif);text-align:center;letter-spacing:.04em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  .glass{min-height:44px;padding:0 15px;letter-spacing:.14em}
  .u{display:none}
  .chips{flex-wrap:nowrap;gap:5px}
  .chip{min-width:0;flex:0 0 auto;padding:0 13px;letter-spacing:.08em}
  .actions{flex-wrap:nowrap;gap:6px;width:100%;max-width:420px}
  .actions .glass{flex:1 1 0;min-width:0;padding:0 6px;letter-spacing:.09em;font-size:11px}
  .dock{gap:8px}
}
@media (max-height:620px){.kicker{display:none}.msg{display:none}}
@media (prefers-reduced-motion:reduce){.breath{animation:none;opacity:.8}#b-light.pulse{animation:none}.time,.head,.dock,.msg,.done{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="grain" id="grain" aria-hidden="true"></div>
<div class="vig" aria-hidden="true"></div>

<main class="ui" id="ui">
  <header class="head" id="head">
    <p class="kicker">Candle Hour</p>
    <h1 class="time" id="time">25:00</h1>
    <p class="msg" id="msg">Let the noise burn down.</p>
  </header>

  <section class="done" id="done" aria-label="Session complete">
    <p class="big">Well done.</p>
    <p class="big">Breathe.</p>
    <div class="breath" aria-hidden="true"></div>
    <button class="glass" id="again" type="button">Light another</button>
  </section>

  <nav class="dock" aria-label="Candle controls">
    <div class="row chips" id="chips" role="group" aria-label="Candle length in minutes">
      <button class="glass chip" type="button" data-min="5" aria-pressed="false" aria-label="5 minutes">5<span class="u"> min</span></button>
      <button class="glass chip" type="button" data-min="15" aria-pressed="false" aria-label="15 minutes">15<span class="u"> min</span></button>
      <button class="glass chip" type="button" data-min="25" aria-pressed="true" aria-label="25 minutes">25<span class="u"> min</span></button>
      <button class="glass chip" type="button" data-min="50" aria-pressed="false" aria-label="50 minutes">50<span class="u"> min</span></button>
      <button class="glass chip" type="button" id="b-custom" aria-pressed="false" aria-expanded="false" aria-controls="custom">Custom</button>
    </div>
    <form class="custom" id="custom" hidden>
      <label for="in-min">Minutes</label>
      <input id="in-min" type="number" inputmode="numeric" min="1" max="180" value="30">
      <button class="glass" type="submit">Set</button>
    </form>
    <div class="row actions">
      <button class="glass" id="b-light" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8c2.4 2.6 3.6 4.4 3.6 6.4a3.6 3.6 0 0 1-7.2 0c0-1.2.5-2.2 1.4-3.2.2 1 .7 1.6 1.4 1.9C7 5.4 7.4 3.9 8 1.8z"/></svg>Light</button>
      <button class="glass" id="b-pause" type="button">Pause</button>
      <button class="glass" id="b-reset" type="button">Reset</button>
      <button class="glass" id="b-sound" type="button" aria-pressed="true" aria-label="Bell and sounds: on"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="on" d="M11.5 5.5a3.6 3.6 0 0 1 0 5M13.2 3.8a6 6 0 0 1 0 8.4"/><path class="off" d="M11.5 6l3.5 4M15 6l-3.5 4"/></svg><span class="lbl">Sound</span></button>
    </div>
  </nav>
</main>
<p class="sr" id="live" aria-live="polite"></p>

<script>
(function () {
'use strict';
/* ============ helpers, copy, state ============ */
const $ = (s) => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const MESSAGES = [
  'Let the noise burn down.',
  'One thing. Then the next.',
  'The wax does not hurry.',
  'Small light, steady hands.',
  'Let the tabs wait.',
  'Breathe in for four, out for six.',
  'Whatever is urgent will keep for a candle’s length.',
  'Watch the flame lean when you sigh.',
  'Attention is a kind of warmth.',
  'You are allowed to do only this.',
  'The room is quiet. So can you be.',
  'Every minute, a little less wax and a little more done.'
];
const S = { state: 'unlit', duration: 25 * 60, remaining: 25 * 60, endAt: 0, flame: 0, igniteAge: 9, snuffAge: 99, doneAge: -1, sound: true, chimed: false };
const ui = {
  root: $('#ui'), time: $('#time'), msg: $('#msg'), done: $('#done'), live: $('#live'), light: $('#b-light'), pause: $('#b-pause'), reset: $('#b-reset'),
  sound: $('#b-sound'), again: $('#again'), custom: $('#custom'), bCustom: $('#b-custom'), inMin: $('#in-min'), grain: $('#grain'),
  chips: Array.from(document.querySelectorAll('.chip[data-min]'))
};
const ptr = { x: -999, y: -999, down: false, near: 0, blow: 0, seen: 0 };
let lastActivity = 0, msgT = 0, msgNow = '', shownTime = '', shownSec = -1, blowFx = 0;

/* ============ audio: one soft bell, a puff and a scritch; created only after a user gesture ============ */
let AC = null, master = null;
function ensureAudio() {
  try {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return AC; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    AC = new C(); master = AC.createGain(); master.gain.value = 0.22; master.connect(AC.destination);
  } catch (e) { AC = null; }
  return AC;
}
function noiseBurst(dur, f0, f1, q, gain, type) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = b; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.value = gain; src.connect(fl); fl.connect(g); g.connect(master); src.start(t);
}
function sfxIgnite() { noiseBurst(0.22, 3200, 1400, 1.2, 0.5, 'bandpass'); setTimeout(() => noiseBurst(0.7, 500, 160, 0.7, 0.28, 'lowpass'), 90); }
function sfxPuff() { noiseBurst(0.55, 900, 220, 0.6, 0.55, 'lowpass'); }
function sfxBell() {
  if (!AC || !S.sound) return;
  const t = AC.currentTime, base = 392;
  [[1, 0.5, 4.4], [2.0, 0.26, 3.4], [2.76, 0.2, 2.8], [4.07, 0.11, 2], [5.4, 0.07, 1.5], [8.93, 0.035, 1]].forEach((p) => {
    const o = AC.createOscillator(), a = AC.createGain();
    o.type = 'sine'; o.frequency.value = base * p[0];
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(p[1], t + 0.01); a.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
    o.connect(a); a.connect(master); o.start(t); o.stop(t + p[2] + 0.05);
  });
}

/* ============ the session: light, snuff, reset, finish ============ */
function fmtTime(sec) {
  const s = Math.max(0, Math.ceil(sec - 0.0001)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(r).padStart(2, '0');
}
function setMsg(text) {
  if (text === msgNow) return; msgNow = text;
  ui.msg.classList.add('out'); clearTimeout(msgT);
  msgT = setTimeout(() => { ui.msg.textContent = text; ui.msg.classList.remove('out'); }, REDUCED ? 0 : 600);
}
function syncUI() {
  const st = S.state;
  ui.light.disabled = st === 'burning' || st === 'done'; ui.light.classList.toggle('pulse', st === 'unlit' || st === 'paused');
  ui.light.lastChild.textContent = st === 'paused' ? 'Relight' : 'Light';
  ui.pause.disabled = st !== 'burning'; ui.reset.disabled = st === 'unlit' && S.remaining >= S.duration - 0.5;
  ui.done.classList.toggle('show', st === 'done' && S.doneAge > 2.2); ui.root.classList.toggle('finished', st === 'done' && S.doneAge > 1.6);
  const mins = Math.round(S.duration / 60);
  ui.chips.forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.min === mins && !customOn)));
  ui.bCustom.setAttribute('aria-pressed', String(customOn));
}
let customOn = false;
function light(byUser) {
  if (S.state === 'burning' || S.state === 'done') return;
  if (byUser) ensureAudio();
  S.state = 'burning'; S.endAt = performance.now() + S.remaining * 1000; S.igniteAge = 0; S.snuffAge = 99;
  if (byUser) sfxIgnite();
  scheduleDrip(2.2);
  msgNow = ''; setMsg(MESSAGES[Math.floor((S.duration - S.remaining) / 60) % MESSAGES.length]);
  ui.live.textContent = 'Candle lit. ' + fmtTime(S.remaining) + ' remaining.'; syncUI();
}
function snuff(kind) {
  if (S.state !== 'burning') return;
  S.remaining = Math.max(0, (S.endAt - performance.now()) / 1000); S.state = 'paused'; S.snuffAge = 0;
  emitSmoke(26, 1); trail = 2.8; sfxPuff();
  setMsg(kind === 'blown' ? 'You blew it out. Relight when you are ready.' : 'The flame rests. Relight when you are ready.');
  ui.live.textContent = 'Candle snuffed. Paused at ' + fmtTime(S.remaining) + '.'; syncUI();
}
function reset() {
  S.state = 'unlit'; S.remaining = S.duration; S.doneAge = -1; S.snuffAge = 99; S.chimed = false; S.flame = Math.min(S.flame, 0.0);
  drips.length = 0; smokeN = 0; pendingDrip = 1e9; shownSec = -1;
  setMsg('A quiet room, waiting for a light.'); ui.live.textContent = 'Candle reset to ' + fmtTime(S.duration) + '.'; syncUI();
}
function finish() {
  S.state = 'done'; S.remaining = 0; S.doneAge = 0; S.chimed = false; pendingDrip = 1e9;
  setMsg('Well done. Breathe.'); ui.live.textContent = 'Time is up. Well done. Breathe.'; syncUI();
}
function setDurationSec(sec, autoLight) {
  S.duration = clamp(Math.round(sec), 5, 180 * 60); reset();
  if (autoLight) { ensureAudio(); setTimeout(() => light(true), 750); }
}
const setDuration = (min, autoLight) => setDurationSec(clamp(Math.round(min), 1, 180) * 60, autoLight);
function applyHash() { const m = /^#(\d{1,4})s$/.exec(location.hash); if (m) { customOn = false; setDurationSec(+m[1], true); } }   // easter egg: #12s lights a twelve-second candle
function tickSession() {
  if (S.state === 'burning') { S.remaining = (S.endAt - performance.now()) / 1000; if (S.remaining <= 0) finish(); }
  const t = fmtTime(S.remaining);
  if (t !== shownTime) { shownTime = t; ui.time.textContent = t; document.title = (S.state === 'done' ? 'Well done' : t) + ' · Candle Hour'; }
  if (S.state === 'burning') {
    const el = S.duration - S.remaining, idx = Math.floor(el / 60);
    if (S.remaining <= 60 && S.duration >= 120) setMsg('The last minute. Stay with it.');
    else setMsg(MESSAGES[idx % MESSAGES.length]);
  }
  if (S.state === 'done' && S.doneAge > 2.2 && !ui.done.classList.contains('show')) syncUI();
}
ui.light.addEventListener('click', () => light(true));
ui.pause.addEventListener('click', () => { ensureAudio(); snuff('pause'); });
ui.reset.addEventListener('click', () => { ensureAudio(); customOn = false; reset(); });
ui.again.addEventListener('click', () => { ensureAudio(); S.remaining = S.duration; reset(); setTimeout(() => light(true), 500); });
ui.chips.forEach((b) => b.addEventListener('click', () => { customOn = false; ui.custom.hidden = true; ui.bCustom.setAttribute('aria-expanded', 'false'); setDuration(+b.dataset.min, true); }));
ui.bCustom.addEventListener('click', () => {
  const open = ui.custom.hidden; ui.custom.hidden = !open; ui.bCustom.setAttribute('aria-expanded', String(open));
  if (open) { customOn = true; syncUI(); ui.inMin.focus(); } else { customOn = false; syncUI(); }

ui.custom.addEventListener('submit', (e) => { e.preventDefault(); const v = parseFloat(ui.inMin.value); if (v >= 1) { customOn = true; setDuration(v, true); syncUI(); } });
ui.sound.addEventListener('click', () => {
  S.sound = !S.sound; ui.sound.setAttribute('aria-pressed', String(S.sound)); ui.sound.setAttribute('aria-label', 'Bell and sounds: ' + (S.sound ? 'on' : 'off'));
  if (S.sound) ensureAudio();
});
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target && e.target.tagName; if (tag === 'INPUT') return;
  wake();
  if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); if (S.state === 'burning') { ensureAudio(); snuff('pause'); } else if (S.state !== 'done') light(true); }
  else if (e.key === 'r' || e.key === 'R') { ensureAudio(); customOn = false; reset(); }
  else if (e.key >= '1' && e.key <= '4') { const b = ui.chips[+e.key - 1]; if (b) b.click(); }
});
document.querySelector('.dock').addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b && e.detail) b.blur(); });   // mouse users: hand Space back to the candle
function wake() { lastActivity = performance.now(); ui.root.classList.remove('dim'); }
/* ============ noise, colour helpers, sprites ============ */
function hs(i) { i = Math.imul(i ^ 61, 0x27d4eb2d); i ^= i >>> 15; i = Math.imul(i, 0x85ebca6b); i ^= i >>> 13; return (i >>> 0) / 4294967296; }
function n1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hs(i) * (1 - u) + hs(i + 1) * u; }
const mixc = (a, b, t) => 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
const cv = $('#scene'), ctx = cv.getContext('2d');
const bgC = document.createElement('canvas'), bgX = bgC.getContext('2d');
const lightC = document.createElement('canvas'), lightX = lightC.getContext('2d');
const candC = document.createElement('canvas'), candX = candC.getContext('2d');
function sprite(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'), r = size / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach((s) => gr.addColorStop(s[0], s[1])); g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const glowSpr = sprite(256, [[0, 'rgba(255,214,150,.95)'], [0.12, 'rgba(255,178,84,.55)'], [0.35, 'rgba(255,140,60,.2)'], [0.7, 'rgba(230,100,40,.05)'], [1, 'rgba(200,80,30,0)']]);
const smokeSpr = sprite(64, [[0, 'rgba(226,218,208,.55)'], [0.45, 'rgba(206,198,190,.22)'], [1, 'rgba(190,184,178,0)']]);
(function () {   // static film grain, blended by the compositor
  const c = document.createElement('canvas'); c.width = c.height = 140; const g = c.getContext('2d'), im = g.createImageData(140, 140);
  for (let i = 0; i < 140 * 140; i++) { const v = 110 + Math.random() * 60; im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 70; }
  g.putImageData(im, 0, 0);
  try { ui.grain.style.backgroundImage = 'url(' + c.toDataURL('image/png') + ')'; ui.grain.style.backgroundSize = '140px 140px'; } catch (e) { /* optional */ }
})();

    g.addColorStop(0, 'rgba(255,150,60,' + (0.95 * fm.ember).toFixed(3) + ')'); g.addColorStop(0.4, 'rgba(255,90,20,' + (0.4 * fm.ember).toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g; ctx.fillRect(tipx - r, tipy - r, r * 2, r * 2); ctx.restore();
  }
  if (fm.h < 1.2 || S.flame < 0.01) return;
  const h = fm.h, w = fm.w, L = clamp(fm.L, 0, 1.6), tx = fm.tip * h * 0.45;
  ctx.save(); ctx.translate(fm.x + fm.tip * cw * 0.05, fm.y - cw * 0.02);

  let R = cw * 3.1 * (0.72 + 0.28 * L); ctx.globalAlpha = clamp(0.62 * L, 0, 1); ctx.drawImage(glowSpr, -R, -h * 0.5 - R, R * 2, R * 2);
  R = cw * 1.25; ctx.globalAlpha = clamp(0.34 * L, 0, 1); ctx.drawImage(glowSpr, -R, -h * 0.5 - R, R * 2, R * 2);

  let g = ctx.createLinearGradient(0, h * 0.07, 0, -h);
  g.addColorStop(0, 'rgba(255,120,30,.55)'); g.addColorStop(0.18, 'rgba(255,150,50,.92)'); g.addColorStop(0.5, 'rgba(255,179,71,.96)'); g.addColorStop(0.8, 'rgba(255,190,92,.72)'); g.addColorStop(1, 'rgba(255,130,50,0)');

  ctx.fillStyle = g; ctx.fill(p);

/* ============ pointer: the flame leans away; press and hold close by to blow it out ============ */
window.addEventListener('pointermove', (e) => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.seen = performance.now(); wake(); }, { passive: true });

/* ============ frame loop ============ */
let last = 0, simT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = 0; return; }
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016); last = now; simT += dt;
  tickSession();

window.addEventListener('resize', () => { layout(); updateGeom(1); });
