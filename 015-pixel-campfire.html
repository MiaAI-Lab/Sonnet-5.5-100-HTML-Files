<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Light at Camp — Pixel Campfire</title>
<meta name="description" content="A low-resolution pixel-art campfire at night: Doom-fire flames, Bayer-dithered sky, a sitting camper toasting a marshmallow, and firelight that flickers across every pixel. Click to feed the fire, hold to blow.">
<meta name="theme-color" content="#0b1026">
<style>
:root{
  --sky:#0b1026;
  --night:#161c47;
  --edge:#3a4690;
  --cream:#fff6d5;
  --amber:#ffd23f;
  --ember:#f26b1d;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1026;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#scene{
  position:absolute;left:0;top:0;display:block;touch-action:none;cursor:crosshair;outline:none;
  image-rendering:crisp-edges;image-rendering:pixelated;
  background:#0b1026;
}
#scene:focus-visible{outline:3px solid var(--amber);outline-offset:-6px}
.snd{
  position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:5;
  display:flex;align-items:center;gap:10px;padding:10px 14px 10px 12px;border:0;border-radius:0;cursor:pointer;
  color:#c9d3ff;background:#141a3f;
  font:700 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  box-shadow:0 -3px 0 0 #0b1026,0 3px 0 0 #0b1026,-3px 0 0 0 #0b1026,3px 0 0 0 #0b1026,inset 0 0 0 2px #3a4690,inset 0 -3px 0 0 #232a67;
  transition:color .15s,background .15s;
}
.snd:hover{color:#fff6d5;background:#1a2150}
.snd:active{transform:translateY(2px)}
.snd:focus-visible{outline:3px solid var(--amber);outline-offset:5px}
.snd svg{width:14px;height:12px;flex:none}
.snd .waves{display:none}
.snd[aria-pressed="true"]{color:#ffd23f}
.snd[aria-pressed="true"] .waves{display:inline}
.snd b{font-weight:700;min-width:2.2em;text-align:left}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){.snd{padding:9px 11px 9px 10px;font-size:10px;letter-spacing:.12em}}
</style>
</head>

<canvas id="scene" width="240" height="135" tabindex="0" role="img" aria-label="Pixel-art night scene: a campfire burning inside a ring of stones, a small tent with a glowing interior, and a camper toasting a marshmallow under a crescent moon. Click or press Space to throw a log on the fire; hold the mouse button to blow on it."></canvas>
<button class="snd" id="snd" type="button" aria-pressed="false" aria-label="Fire crackle sound">

      put(ex - 1, ey - 2, FIRE[12 + (fl & 1)]); put(ex, ey - 2, FIRE[9 + fl % 3]); put(ex - 2, ey - 2, FIRE[8 + ((fl + 1) & 1)]); put(ex - 1, ey - 3, FIRE[7 + (fl & 1)]);
    }
  }
}
function drawSparks(dt, t) {
  var i, s, f, c;
  for (i = 0; i < sparks.length; i++) {
    s = sparks[i]; if (!s.a) continue;
    s.l -= dt; if (s.l <= 0) { s.a = false; continue; }
    s.vx += (wind * 26 - s.vx) * Math.min(1, dt * 1.6) + (Math.random() - 0.5) * 22 * dt;
    s.vy -= 5 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    f = s.l / s.ml;
    c = f > 0.72 ? SPARK[0] : f > 0.45 ? SPARK[1] : f > 0.2 ? SPARK[2] : SPARK[3];
    if (f < 0.32 && ((t * 22 + i * 7) | 0) % 3 === 0) continue;                    /* blink out */
    put(Math.round(s.x), Math.round(s.y), c);
  }
}
function spawnSpark(burst) {
  var i, s;
  for (i = 0; i < sparks.length; i++) if (!sparks[i].a) { s = sparks[i]; break; }
  if (!s) return;
  var f = clamp(fuel + surge * 0.5, 0.2, 1.7);
  s.a = true; s.x = fx + (Math.random() - 0.5) * (6 + f * 12); s.y = hy - 12 - Math.random() * (8 + f * 12);
  s.vx = (Math.random() - 0.5) * 16 + wind * 10; s.vy = -(12 + Math.random() * 26) * (burst ? 1.5 : 1);
  s.ml = s.l = 0.9 + Math.random() * 2.2;
}
function drawSmoke(dt) {
  var i, s, a, c1 = P(0x4a5599), c2 = P(0x39427d);
  if (Math.random() < dt * (1.6 + fuel * 2)) {
    for (i = 0; i < smokes.length; i++) if (!smokes[i].a) {
      s = smokes[i]; s.a = true; s.x = fx + (Math.random() - 0.5) * 10; s.y = hy - 28 - fuel * 14 - Math.random() * 6; s.vx = wind * 8 + (Math.random() - 0.5) * 3;
      s.ml = s.l = 5 + Math.random() * 4; break;
    }
  }
  for (i = 0; i < smokes.length; i++) {
    s = smokes[i]; if (!s.a) continue;
    s.l -= dt; if (s.l <= 0) { s.a = false; continue; }
    s.x += (s.vx + Math.sin(s.l * 1.3 + i) * 2.4) * dt; s.y -= (5 + fuel * 4) * dt; s.vx += (wind * 9 - s.vx) * dt * 0.5;
    a = Math.sin(3.14159 * (s.l / s.ml)) * 0.5;
    var px = Math.round(s.x), py = Math.round(s.y);
    if (px >= 0 && px < W && py >= 0 && py < gy && bay(px, py) < a) buf[py * W + px] = (i & 1) ? c1 : c2;
    if (bay(px + 1, py) < a * 0.5) put(px + 1, py, c2);
  }
}
function throwLog(sx, sy) {
  if (logProj) return;
  var tx = fx + (Math.random() * 6 - 3), ty = hy - 8, T = clamp(0.5 + Math.hypot(tx - sx, ty - sy) / 300, 0.5, 0.85), g = 220;
  logProj = { x: sx, y: sy, vx: (tx - sx) / T, vy: (ty - sy - 0.5 * g * T * T) / T, g: g, t: 0, T: T, spin: 0 };
  if (hintMode !== 1 || hintLast !== 'throw') { hintMode = 1; hintLast = 'throw'; hintSince = simT; }
  firstAction = true;
  thud(false);
}
function stepLog(dt) {
  var p = logProj; if (!p) return;
  p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.spin += dt * 12;
  var f = ((p.spin | 0) & 1), s = f ? S_LOGH : S_LOGS;
  if (f) { drawSprite(S_LOGS, Math.round(p.x) - 6, Math.round(p.y) - 2, R_LOG, false); }
  else {                                                     /* upright frame: 4 wide, 12 tall */
    var ox = Math.round(p.x) - 2, oy = Math.round(p.y) - 6, yy, xx;
    for (yy = 0; yy < 12; yy++) for (xx = 0; xx < 4; xx++) put(ox + xx, oy + yy, M.lM[lightIdx(clamp(ox + xx, 0, W - 1), clamp(oy + yy, 0, H - 1))]);
  }
  if (p.t >= p.T) {
    logProj = null; fuel = Math.min(1.35, fuel + 0.3); surge = 1; logsThrown++;
    var i; for (i = 0; i < 16; i++) spawnSpark(true);
    thud(true); crackle(1.6); crackle(1.2);
    live.textContent = 'A log lands on the fire.';
  }
}
function drawGust(dt) {
  var i, g, c = [P(0xcfd8ff), P(0x8a96d8), P(0x4a5599)];
  if (blowing || keyBlow) {
    if (Math.random() < dt * 40) for (i = 0; i < gust.length; i++) if (!gust[i].a) {
      g = gust[i]; g.a = true; g.x = (keyBlow ? (keyBlow < 0 ? fx - 42 : fx + 42) : ptrX) + (Math.random() - 0.5) * 6; g.y = (keyBlow ? hy - 12 : ptrY) + (Math.random() - 0.5) * 16; g.l = 0.75; break;
    }
  }
  for (i = 0; i < gust.length; i++) {
    g = gust[i]; if (!g.a) continue;
    g.l -= dt; if (g.l <= 0) { g.a = false; continue; }
    var dir2 = wind >= 0 ? 1 : -1;
    g.x += dir2 * 92 * dt;
    var gx = Math.round(g.x), gyy = Math.round(g.y), len = 4, k;
    for (k = 0; k < len; k++) put(gx - dir2 * k, gyy, c[k > 2 ? 2 : k > 0 ? 1 : 0]);
  }
}
function drawText(str, x, y, col, sh) {
  var i, ch, gl, r, c, cx = x;
  for (i = 0; i < str.length; i++) {
    ch = str.charAt(i); gl = FONT[ch] || FONT[' '];
    for (r = 0; r < 7; r++) for (c = 0; c < 5; c++) if (gl[r].charAt(c) === '#') { if (sh) put(cx + c + 1, y + r + 1, sh); put(cx + c, y + r, col); }
    cx += 6;
  }
}
function textW(s) { return s.length * 6 - 1; }
function drawCaptions(t) {
  var title = 'LAST LIGHT AT CAMP', n = reduce ? title.length : clamp(Math.floor((t - 0.7) * 9), 0, title.length);
  var warm = clamp(0.4 + fireI * 0.5, 0, 1), c1 = pack(mixc(rgbOf(0xc9d3ff), rgbOf(0xfff6d5), warm)), sh = P(0x0b1026);
  var tw = textW(title), tx = (W - tw) >> 1, ty = 7;
  if (n > 0) drawText(title.substring(0, n), tx, ty, c1, sh);
  /* hint */
  var lines, blink;
  if (hintMode === 0) lines = W < 150 ? ['PRESS TO FEED', 'THE FIRE'] : ['PRESS TO FEED THE FIRE'];
  else if (fuel < 0.46 && logProj === null) lines = W < 150 ? ['FEED THE FIRE', 'BEFORE IT DIES'] : ['FEED THE FIRE BEFORE IT DIES'];
  else if (hintMode === 1) lines = hintLast === 'throw' ? ['HOLD TO BLOW'] : (W < 150 ? ['CLICK TO', 'THROW A LOG'] : ['CLICK TO THROW A LOG']);
  else lines = null;
  if (lines) {
    blink = reduce ? true : (t % 2.4) < 1.7;
    if (t > 2.6 && blink) {
      var i, hc = pack(mixc(rgbOf(0x9fb0f0), rgbOf(0xffeaa8), clamp(fireI * 0.75, 0, 1)));
      for (i = 0; i < lines.length; i++) drawText(lines[i], (W - textW(lines[i])) >> 1, H - 12 - (isPortrait ? 17 : 0) - (lines.length - 1 - i) * 9, hc, sh);
    }
  }
}

/* ============================================================
   audio (opt-in): filtered-noise crackle, fire roar, wind, log thud
   ============================================================ */
var ac = null, master = null, nbuf = null, roar = null, windG = null, snd = false;
function audioInit() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext, i, d;
    if (!AC) return false;
    if (!ac) {
      ac = new AC(); master = ac.createGain(); master.gain.value = 0.42; master.connect(ac.destination);
      nbuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); d = nbuf.getChannelData(0);
      for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      var a = ac.createBufferSource(); a.buffer = nbuf; a.loop = true;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
      roar = ac.createGain(); roar.gain.value = 0; a.connect(lp); lp.connect(roar); roar.connect(master); a.start();
      var b = ac.createBufferSource(); b.buffer = nbuf; b.loop = true; b.playbackRate.value = 0.8;
      var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.6;
      windG = ac.createGain(); windG.gain.value = 0; b.connect(bp); bp.connect(windG); windG.connect(master); b.start();
    }
    if (ac.state === 'suspended') ac.resume();
    return true;
  } catch (e) { ac = null; return false; }
}
function crackle(k) {
  if (!snd || !ac) return;
  try {
    var t = ac.currentTime, s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain(), pk = (0.05 + Math.random() * 0.13) * (k || 1);
    s.buffer = nbuf; bp.type = 'bandpass'; bp.frequency.value = 1200 + Math.random() * 3800; bp.Q.value = 1.5 + Math.random() * 4;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(pk, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.02 + Math.random() * 0.07);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t, Math.random() * 1.6, 0.13);
  } catch (e) { /* ignore */ }
}
function thud(land) {
  if (!snd || !ac) return;
  try {
    var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(land ? 130 : 260, t); o.frequency.exponentialRampToValueAtTime(land ? 42 : 120, t + 0.16);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(land ? 0.55 : 0.18, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + (land ? 0.24 : 0.12));
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.28);

}
function audioTick() {
  if (!snd || !ac) return;
  try {
    var t = ac.currentTime;
    roar.gain.setTargetAtTime(0.028 * clamp(fireI, 0.3, 1.6), t, 0.25);
    windG.gain.setTargetAtTime(0.11 * Math.abs(wind), t, 0.12);

function setSound(on) {
  if (on) { if (!audioInit()) return; snd = true; } else {
    snd = false; try { if (ac) { roar.gain.setTargetAtTime(0, ac.currentTime, 0.1); windG.gain.setTargetAtTime(0, ac.currentTime, 0.1); } } catch (e) { /* ignore */ }
  }

  if (snd) { crackle(1.4); }
}
sndBtn.addEventListener('click', function (e) {
  setSound(!snd);
  if (e.detail > 0) sndBtn.blur();                  /* mouse users go straight back to feeding the fire with Space */
});

/* ============================================================
   input
   ============================================================ */
function toLogical(e) {
  var r = cv.getBoundingClientRect();
  ptrX = (e.clientX - r.left) / r.width * W; ptrY = (e.clientY - r.top) / r.height * H;
}
cv.addEventListener('pointerdown', function (e) {
  if (e.button > 0) return;
  toLogical(e); down = true; downT = performance.now(); blowing = false;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  e.preventDefault();
});
cv.addEventListener('pointermove', function (e) { toLogical(e); });
function release(e) {
  if (!down) return;
  var dur = performance.now() - downT;
  down = false;
  if (!blowing && dur < 260 && e.type !== 'pointercancel') throwLog(ptrX, ptrY);
  blowing = false;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('keydown', function (e) {
  if (e.target === sndBtn && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.repeat) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault(); return; }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); var side = Math.random() < 0.5; throwLog(side ? fx - 56 : fx + 56, hy - 40); }
  else if (e.key === 'ArrowLeft') { keyBlow = -1; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { keyBlow = 1; e.preventDefault(); }
});
window.addEventListener('keyup', function (e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keyBlow = 0; });

/* ============================================================
   main loop
   ============================================================ */
var last = 0, started = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (!started) { started = true; last = now; }
  var dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
  simT += dt; var t = simT;

  /* blow / wind */
  if (down && !blowing && performance.now() - downT > 240) { blowing = true; firstAction = true; if (hintMode === 0) { hintMode = 1; hintLast = 'blow'; hintSince = simT; } }
  if (blowing) { var dxp = fx - ptrX; windGoal = (dxp >= 0 ? 1 : -1) * clamp(0.55 + Math.abs(dxp) / 60, 0.55, 1); }
  else if (keyBlow) windGoal = -keyBlow;
  else windGoal = 0;

  if (blowing || keyBlow) { fuel -= dt * 0.012; surge = Math.min(0.35, surge + dt * 0.4); }

  flick += (flickGoal - flick) * Math.min(1, dt * 12);

  lantI = 0.94 + 0.06 * Math.sin(t * 7.3) + (Math.random() - 0.5) * 0.05;

  /* fire cellular automaton at a fixed 30 Hz (15 Hz when reduced motion) */
  fireAcc += dt; var stepLen = reduce ? 1 / 15 : 1 / 30, guard = 0;
  while (fireAcc >= stepLen && guard++ < 4) { fireStep(); fireAcc -= stepLen; }
  if (fireAcc > 0.2) fireAcc = 0;

  /* crackle events */
  crackleT -= dt;
  if (crackleT <= 0) {
    crackleT = (0.09 + Math.random() * 0.7) / (0.45 + fuel);
    var n = 1 + ((Math.random() * 3) | 0), j; for (j = 0; j < n; j++) spawnSpark(false);
    if (Math.random() < 0.6) surge = Math.min(1, surge + 0.06);
    crackle(0.8 + fuel * 0.6);
  }

  audioClock += dt; if (audioClock > 0.25) { audioClock = 0; audioTick(); }

  /* ---- compose the frame ---- */
  buf.set(skyBase);
  drawStars(t); drawShoot(dt, t);
  drawTrees(farTrees, P(0x161c47), t, reduce ? 0.35 : 0.8);
  drawTrees(midTrees, P(0x0e1339), t, reduce ? 0.4 : 1);
  drawSmoke(dt);
  drawGround();
  drawTent(t);
  drawStones(RING_BACK);
  drawAshEmbers(t);
  drawLogsBurning();
  drawFire();
  drawLogsCross();
  drawLogFront(t);
  drawStones(RING_FRONT);
  drawCharacter(t);
  drawStick(t, dt);
  drawNearTrees(t);
  drawSparks(dt, t);
  drawGust(dt);
  stepLog(dt);
  drawCaptions(t);

  /* dithered fade-in from black */
  if (fadeT < 1.3) {
    fadeT += dt; var fv = clamp(fadeT / 1.2, 0, 1), i, x, y;
    if (fv < 1) for (y = 0; y < H; y++) for (x = 0; x < W; x++) if (bay(x, y) > fv) buf[y * W + x] = SKY[0];
  }
  ctx.putImageData(img, 0, 0);
}

layout();
var rzT = 0;
window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(layout, 120); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(layout, 120); });
document.addEventListener('visibilitychange', function () { last = performance.now(); });
requestAnimationFrame(frame);
})();
