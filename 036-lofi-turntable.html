<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rainy Sunday Records — a lo-fi turntable</title>
<style>
/* Rainy Sunday Records: golden hour, a wet window, a record that never quite ends */
:root{
  --brown:#7b4b2a;--tan:#c98b4b;--cream:#f4e7cf;--sage:#8fa58a;--tang:#f08a3c;--blue:#4b6a8a;--ink:#3a2313;
  --round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Varela Round",Ubuntu,Cantarell,"Trebuchet MS",system-ui,sans-serif;
  --serif:"Cooper Black","Bookman Old Style","URW Bookman",Bookman,Georgia,serif;
  --hand:"Bradley Hand","Segoe Print","Chilanka","Purisa","Marker Felt","Comic Sans MS",cursive;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a10;color:var(--ink);overscroll-behavior:none}
body{height:100vh;height:100dvh;font-family:var(--round);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px dashed var(--tang);outline-offset:4px}
.room{position:fixed;inset:0;overflow:hidden}
.wall{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(123,75,42,.05) 0 3px,transparent 3px 58px),
  linear-gradient(180deg,#f3e2c1 0,#e8cd9f 60%,#d9b47c 100%)}
.desk{position:absolute;left:0;right:0;bottom:0;top:var(--deskY,45%);background:var(--wood,#8a5a33);background-size:cover;box-shadow:0 -10px 30px rgba(60,30,10,.35),inset 0 14px 22px rgba(40,20,8,.4)}
.desk::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,200,120,.0),rgba(40,20,8,.35))}
.night-tint{position:fixed;inset:0;pointer-events:none;background:#17233d;mix-blend-mode:multiply;opacity:0;transition:opacity 1.6s;z-index:40}
.night .night-tint{opacity:.55}
.vig{position:fixed;inset:0;pointer-events:none;z-index:41;background:radial-gradient(120% 100% at 50% 45%,rgba(0,0,0,0) 55%,rgba(30,12,4,.5) 100%)}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:38;mix-blend-mode:screen}

.stage{position:absolute;left:50%;top:50%;width:calc(var(--cw)*1px);height:calc(var(--ch)*1px);transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%}
.o{position:absolute;left:var(--x);top:var(--y);width:var(--w)}
.port .o{left:var(--px);top:var(--py);width:var(--pw)}
.o svg{display:block;width:100%;height:auto;overflow:visible}

/* wall furniture */
.sign{text-align:center;transform:rotate(-1.2deg)}
.sign h1{margin:0;font:800 64px/1 var(--serif);letter-spacing:.01em;color:#5a3218;text-shadow:0 2px 0 rgba(255,240,210,.7)}
.sign p{margin:8px 0 0;font:400 26px/1.1 var(--hand);color:#8a5a33}
.port .sign h1{font-size:78px}.port .sign p{font-size:34px}
.card{background:#fbf3df;padding:18px 22px 20px;box-shadow:0 8px 18px rgba(80,40,10,.3);transform:rotate(-2.5deg);position:relative}
.card::before{content:"";position:absolute;left:50%;top:-14px;width:96px;height:30px;translate:-50% 0;rotate:-3deg;background:rgba(240,138,60,.55);clip-path:polygon(0 0,100% 6%,97% 100%,3% 92%)}
.card small{display:block;font:700 15px/1 var(--round);letter-spacing:.18em;text-transform:uppercase;color:var(--sage)}
.card b{display:block;margin:8px 0 6px;font:400 34px/1.05 var(--hand);color:var(--brown)}
.card span{display:block;font:400 21px/1.25 var(--hand);color:#8a6a4a}
.port .card small{font-size:22px}.port .card b{font-size:50px}.port .card span{font-size:30px}
.eq{display:flex;gap:4px;align-items:flex-end;height:22px;margin-top:10px}
.eq i{width:6px;height:4px;background:var(--tang);border-radius:2px}
.clip{position:fixed;inset:0;overflow:hidden}
.win canvas{position:absolute;left:8.8%;top:9.7%;width:82.4%;height:81%;border-radius:2px}
.raysw{position:absolute;display:flex;align-items:center;gap:12px;padding:10px 16px 8px;border-radius:14px;background:#6b3f20;color:var(--cream);box-shadow:0 6px 12px rgba(50,25,8,.4),inset 0 2px 0 rgba(255,255,255,.15);font:700 24px/1 var(--hand)}
.raysw .sw{width:56px;height:28px;border-radius:14px;background:#3b2412;position:relative;transition:background .3s}
.raysw .sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--cream);transition:translate .25s}
.raysw[aria-checked="true"] .sw{background:var(--blue)}
.raysw[aria-checked="true"] .sw::after{translate:28px 0}
.sway{transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.2deg)}}
.steam path{fill:none;stroke:rgba(255,246,228,.75);stroke-width:5;stroke-linecap:round;stroke-dasharray:40 60;animation:steam 4.2s ease-in-out infinite;filter:blur(1.6px)}
@keyframes steam{0%{stroke-dashoffset:60;opacity:0;transform:translateY(8px)}30%{opacity:.9}100%{stroke-dashoffset:-40;opacity:0;transform:translateY(-22px)}}
.lampbtn{position:absolute;left:0;top:0;width:100%;height:100%}

/* sleeves */
.sleeves{position:absolute;left:var(--x);top:var(--y);width:var(--w);display:flex;gap:var(--gap,22px)}
.port .sleeves{left:var(--px);top:var(--py);width:var(--pw);gap:18px}
.sleeve{flex:1;aspect-ratio:1;position:relative;border-radius:4px;box-shadow:0 10px 20px rgba(30,12,4,.5),0 0 0 1px rgba(0,0,0,.25);transform:translateY(var(--ty,0)) rotate(var(--r,0deg));transition:transform .35s cubic-bezier(.3,1.5,.5,1);background:#000;overflow:hidden}
.sleeve:hover{--ty:-22px}
.sleeve[aria-pressed="true"]{--ty:-46px}
.sleeve svg{position:absolute;inset:0;width:100%;height:100%}
.sleeve .lab{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 7px;font:400 22px/1 var(--hand);color:#fff3dc;background:linear-gradient(180deg,rgba(30,14,4,0),rgba(30,14,4,.72));text-shadow:0 1px 3px rgba(0,0,0,.7);text-align:left}
.port .sleeve .lab{font-size:30px}

/* light */
.beam{position:absolute;left:0;top:0;width:calc(var(--cw)*1px);height:calc(var(--ch)*1px);pointer-events:none;mix-blend-mode:screen;transition:opacity 1.6s}
.night .beam{opacity:0}
.lampglow{position:absolute;left:var(--x);top:var(--y);width:900px;height:900px;margin:-450px 0 0 -450px;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,184,77,.5) 0,rgba(255,184,77,.16) 34%,rgba(255,184,77,0) 66%);transition:opacity 1s,scale 1s;opacity:.8}
.port .lampglow{left:var(--px);top:var(--py)}
.night .lampglow{opacity:1;scale:1.25}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{position:absolute;font:400 28px/1.1 var(--hand);color:#fff3d6;text-shadow:0 2px 6px rgba(50,20,4,.8);transition:opacity 1s;pointer-events:none}
.hint.gone{opacity:0}
.knobwrap{cursor:ns-resize;touch-action:none}
@media (prefers-reduced-motion:reduce){.sway,.steam path{animation:none}.steam path{opacity:.5}.sleeve{transition:none}}
</style>
</head>
<body>
<div class="room" id="room"><div class="wall"></div><div class="desk" id="desk"></div></div>

<div class="clip"><div class="stage land" id="stage" style="--cw:1600;--ch:900">
  <div class="o sign" style="--x:470px;--y:44px;--w:640px;--px:40px;--py:70px;--pw:440px"><h1>Rainy Sunday Records</h1><p>open all afternoon &middot; closed to everything else</p></div>

  <div class="o card" style="--x:70px;--y:64px;--w:290px;--px:60px;--py:330px;--pw:400px" id="card">
    <small>now spinning</small><b id="cardName">Umbrella Weather</b><span id="cardMeta">74 bpm &middot; D minor</span>
    <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <!-- window -->
  <div class="o win" style="--x:1196px;--y:26px;--w:360px;--px:500px;--py:36px;--pw:370px">
    <svg viewBox="0 0 360 330" aria-label="A window with rain running down the glass" role="img">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b6a8a"/><stop offset="1" stop-color="#9ab0c4"/></linearGradient>
        <linearGradient id="skyN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16233a"/><stop offset="1" stop-color="#3b4e6b"/></linearGradient>
        <linearGradient id="fab" x1="0" x2="1"><stop offset="0" stop-color="#cfd8c4"/><stop offset=".2" stop-color="#9fb39a"/><stop offset=".4" stop-color="#c3d0ba"/><stop offset=".6" stop-color="#8fa58a"/><stop offset=".8" stop-color="#bccbb4"/><stop offset="1" stop-color="#8fa58a"/></linearGradient>
        <filter id="blur3"><feGaussianBlur stdDeviation="2.4"/></filter>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c98b4b"/><stop offset="1" stop-color="#7b4b2a"/></linearGradient>
      </defs>
      <rect x="0" y="0" width="360" height="322" rx="6" fill="url(#wood)"/>
      <rect x="28" y="30" width="304" height="268" fill="url(#sky)"/>
      <rect x="28" y="30" width="304" height="268" fill="url(#skyN)" id="skyNight" opacity="0" style="transition:opacity 1.6s"/>
      <g filter="url(#blur3)" opacity=".9"><path d="M28 250V214h30v-30h26v46h22v-58h28v58h30v-38h24v38h34v-24h30v24h52v48z" fill="#2b3f58"/>
        <circle cx="70" cy="232" r="4" fill="#ffc46b"/><circle cx="128" cy="222" r="5" fill="#ffd28a"/><circle cx="190" cy="236" r="4" fill="#ffc46b"/><circle cx="246" cy="230" r="5" fill="#ffb84d"/><circle cx="300" cy="246" r="4" fill="#ffd28a"/></g>
      <path d="M40 60L150 30M120 110L260 40M180 150L330 80" stroke="#fff" stroke-opacity=".12" stroke-width="10" stroke-linecap="round"/>
      <path d="M180 30V298M28 164H332" stroke="#7b4b2a" stroke-width="12"/><path d="M180 30V298M28 164H332" stroke="#c98b4b" stroke-width="2" stroke-opacity=".8"/>
      <rect x="0" y="312" width="360" height="18" rx="4" fill="#8a5a33"/><rect x="0" y="312" width="360" height="4" fill="#d9a468"/>
      <path d="M0 0H46C40 90 44 200 30 322H0Z" fill="url(#fab)" opacity=".95"/><path d="M0 0H46C40 90 44 200 30 322" fill="none" stroke="#6d866a" stroke-width="2"/>
    </svg>
    <canvas id="rain" aria-hidden="true"></canvas>
    <button type="button" class="raysw" id="rainSw" role="switch" aria-checked="false" style="left:20px;top:340px"><span>rain sound</span><i class="sw"></i></button>
  </div>

  <!-- plant -->
  <div class="o" style="--x:70px;--y:250px;--w:230px;--px:10px;--py:470px;--pw:210px">
    <svg viewBox="0 0 230 320" aria-hidden="true">
      <g class="sway" style="transform-box:fill-box"><path d="M115 210C90 150 60 120 44 60C74 84 100 130 115 210Z" fill="#8fa58a"/><path d="M115 210C110 140 118 90 128 20C146 84 128 150 115 210Z" fill="#6f886b"/><path d="M115 210C140 150 178 120 196 66C160 84 132 140 115 210Z" fill="#a8bba2"/>
      <path d="M112 216C80 190 42 190 12 150C54 150 96 170 112 216Z" fill="#799170"/><path d="M118 216C152 194 190 196 222 160C178 156 134 172 118 216Z" fill="#8fa58a"/></g>
      <g class="sway" style="animation-delay:-2s;transform-box:fill-box"><path d="M115 210C100 170 92 140 84 100C110 130 122 170 115 210Z" fill="#b5c7ae"/><path d="M118 212C136 168 150 150 160 110C136 130 116 170 118 212Z" fill="#6f886b"/></g>
      <path d="M50 216H180L166 310Q165 316 158 316H72Q65 316 64 310Z" fill="#d4703a"/><path d="M44 208H186V226H44Z" fill="#e0834c"/><path d="M50 226H180" stroke="#9c4c22" stroke-width="3" stroke-opacity=".5"/>
      <ellipse cx="115" cy="212" rx="70" ry="7" fill="#4a2c18"/>
    </svg>
  </div>

  <!-- lamp -->
  <div class="o" style="--x:290px;--y:196px;--w:190px;--px:660px;--py:350px;--pw:220px" id="lampBox">
    <svg viewBox="0 0 190 260" aria-hidden="true">
      <ellipse cx="60" cy="238" rx="50" ry="12" fill="#3b2412"/><ellipse cx="60" cy="232" rx="46" ry="10" fill="#7b4b2a"/>
      <path d="M60 232L82 120L128 60" fill="none" stroke="#3b2412" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M60 232L82 120L128 60" fill="none" stroke="#c98b4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="rotate(28 130 60)"><path d="M100 30H176L162 96H114Z" fill="#f4e7cf" stroke="#7b4b2a" stroke-width="4" stroke-linejoin="round"/><ellipse cx="138" cy="96" rx="24" ry="7" fill="#ffd27a"/></g>
      <circle cx="128" cy="60" r="6" fill="#7b4b2a"/>
    </svg>
    <button class="lampbtn" id="lampBtn" aria-pressed="false" aria-label="Lamp: switch between golden hour and late evening"></button>
  </div>

  <div class="beam" id="beam"><svg viewBox="0 0 1600 900" width="1600" height="900" aria-hidden="true"><defs><linearGradient id="bg1" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcc70" stop-opacity=".62"/><stop offset="1" stop-color="#ffb04a" stop-opacity=".08"/></linearGradient><filter id="bb"><feGaussianBlur stdDeviation="5"/></filter></defs><g id="panes" filter="url(#bb)" fill="url(#bg1)"></g></svg></div>

  <!-- turntable -->
  <div class="o" style="--x:270px;--y:392px;--w:780px;--px:60px;--py:760px;--pw:780px" id="ttBox">
    <svg id="tt" viewBox="0 0 760 430" aria-label="A turntable with a spinning record and a tonearm" role="group">
      <defs>
        <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a06a38"/><stop offset=".5" stop-color="#7b4b2a"/><stop offset="1" stop-color="#5a3419"/></linearGradient>
        <linearGradient id="walnutSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a3f21"/><stop offset="1" stop-color="#3f2410"/></linearGradient>
        <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8edd8"/><stop offset="1" stop-color="#e9d8b5"/></linearGradient>
        <radialGradient id="vinyl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1c1917"/><stop offset=".55" stop-color="#0f0d0c"/><stop offset="1" stop-color="#191614"/></radialGradient>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e9c9"/><stop offset=".5" stop-color="#c9b68f"/><stop offset="1" stop-color="#efe0bb"/></linearGradient>
        <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5dc"/><stop offset=".5" stop-color="#c9a866"/><stop offset="1" stop-color="#8a6a34"/></linearGradient>
        <clipPath id="vclip"><circle r="208"/></clipPath>
        <path id="lblArc" d="M-49 0A49 49 0 1 1 49 0A49 49 0 1 1 -49 0"/>
        <path id="lblArc2" d="M-34 0A34 34 0 1 1 34 0A34 34 0 1 1 -34 0"/>
      </defs>
      <ellipse cx="380" cy="372" rx="372" ry="42" fill="#2a1408" opacity=".38" filter="url(#blur3)"/>
      <g transform="translate(380 190) scale(1 .62)">
        <rect x="-350" y="-262" width="700" height="590" rx="34" fill="url(#walnutSide)"/>
        <rect x="-350" y="-270" width="700" height="540" rx="34" fill="url(#walnut)"/>
        <rect x="-350" y="-270" width="700" height="540" rx="34" fill="none" stroke="#d9a468" stroke-opacity=".5" stroke-width="3"/>
        <rect x="-326" y="-246" width="652" height="492" rx="20" fill="url(#panel)"/>
        <g id="platter" transform="translate(-60 10)">
          <circle r="226" fill="#00000030" cx="6" cy="8"/>
          <circle r="224" fill="url(#metal)"/><circle r="214" fill="#2d2119"/>
          <circle r="208" fill="url(#vinyl)"/>
          <g id="grooves" fill="none"></g>
          <g id="sheenG" clip-path="url(#vclip)"></g>
          <g id="recSwap"><g id="rec">
            <path d="M120 -20L190 -24M-160 40L-100 30M40 150L44 190M-60 -180L-56 -140M150 100L120 84M-10 -120L-12 -100" stroke="#fff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round"/>
            <circle r="68" id="lblBase" fill="#f08a3c"/><circle r="60" fill="#ffffff" fill-opacity=".14"/><circle r="26" fill="#000" fill-opacity=".08"/>
            <text id="lblT1" font-size="10.5" font-weight="800" fill="#3a2313" letter-spacing="1.6" style="font-family:var(--round);text-transform:uppercase"><textPath href="#lblArc" startOffset="0">Rainy Sunday Records &#183; Side A &#183; 33&#8531; rpm &#183;</textPath></text>
            <text id="lblT2" font-size="9.5" font-weight="700" fill="#3a2313" style="font-family:var(--serif)"><textPath href="#lblArc2" startOffset="0" id="lblTP">Umbrella Weather</textPath></text>
            <path d="M-4 -26L0 -34L4 -26Z" fill="#3a2313"/>
          </g></g>
          <circle r="7" fill="#1a1410"/><circle r="4" fill="url(#metal)"/>
        </g>
        <g id="btn" role="button" tabindex="0" aria-label="Play or lift the needle" style="cursor:pointer">
          <circle cx="-262" cy="196" r="38" fill="#00000033"/><circle cx="-262" cy="196" r="34" fill="#f08a3c"/><circle cx="-262" cy="196" r="34" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
          <path id="btnIc" d="M-272 180L-248 196L-272 212Z" fill="#fff5e0"/><circle id="led" cx="-262" cy="246" r="6" fill="#5a3a20"/>
        </g>
        <g><rect x="150" y="190" width="170" height="16" rx="8" fill="#c9b68f"/><rect x="200" y="182" width="16" height="32" rx="5" fill="#7b4b2a"/><text x="150" y="234" font-size="20" fill="#7b4b2a" style="font-family:var(--round);font-weight:800">33</text><text x="196" y="234" font-size="20" fill="#b9a480" style="font-family:var(--round);font-weight:800">45</text></g>
        <g transform="translate(260 -170)">
          <circle r="46" fill="#00000026" cx="8" cy="10"/><circle r="42" fill="url(#metal)"/><circle r="26" fill="#f4e7cf" stroke="#b9a480" stroke-width="3"/>
        </g>
        <g id="armRest" transform="translate(212 178)"><path d="M-10 -14V10H10V-14" fill="none" stroke="#7b4b2a" stroke-width="6" stroke-linecap="round"/></g>
        <g id="armLift"><g id="armShadow" opacity=".3"></g>
          <g id="arm" role="slider" tabindex="0" aria-label="Tonearm. Drag onto the record, or use the arrow keys" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="at rest" style="cursor:grab">
            <g transform="translate(260 -170)"><g id="armRot">
              <rect x="-74" y="-11" width="42" height="22" rx="6" fill="url(#tube)" stroke="#8a6a34" stroke-width="2"/><rect x="-32" y="-4" width="34" height="8" fill="url(#tube)"/>
              <path d="M0 -4H300C316 -4 330 -8 338 -8V8C330 8 316 4 300 4H0Z" fill="url(#tube)" stroke="#8a6a34" stroke-width="1.5"/>
              <path d="M322 -14H360V14H322Z" fill="#f4e7cf" stroke="#8a6a34" stroke-width="3" transform="translate(-16 0)"/><rect x="326" y="-8" width="22" height="16" rx="3" fill="#f08a3c" stroke="#7b4b2a" stroke-width="2"/>
              <path d="M330 -14L346 -30" stroke="#8a6a34" stroke-width="4" stroke-linecap="round"/><circle cx="340" cy="0" r="2.4" fill="#111"/>
              <circle r="30" fill="url(#metal)" stroke="#8a6a34" stroke-width="2"/><circle r="16" fill="#f4e7cf"/><circle r="6" fill="#7b4b2a"/>
              <path d="M0 0H360" stroke="transparent" stroke-width="42"/>
            </g></g>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <!-- speaker -->
  <div class="o" style="--x:1140px;--y:440px;--w:210px;--px:580px;--py:1160px;--pw:220px" id="spkBox">
    <svg viewBox="0 0 210 300" aria-label="Speaker with a volume knob" role="group">
      <defs><radialGradient id="cone" cx="46%" cy="42%" r="60%"><stop offset="0" stop-color="#5b4432"/><stop offset=".6" stop-color="#2b1e14"/><stop offset="1" stop-color="#150e08"/></radialGradient></defs>
      <rect x="6" y="10" width="198" height="284" rx="18" fill="#4b2b14"/><rect x="0" y="0" width="198" height="284" rx="18" fill="url(#walnut)" stroke="#d9a468" stroke-opacity=".4" stroke-width="2"/>
      <rect x="16" y="16" width="166" height="252" rx="12" fill="#f4e7cf" fill-opacity=".9" stroke="#b9a480" stroke-width="2"/>

    for(j=0;j<tr.bl.length;j++){var b=tr.bl[j];bass(out,t0+(b[0]+(b[0]%2?tr.sw:0))*sd,tr.bass[b8]+(b[1]===12?12:b[1]===7?7:b[1]===5?5:0)-(b[1]===12?12:0)*0,b[3],b[2]*sd)}
    return 16*sd;
  };
  /* sessions: one gain per playback so a stop silences everything at once */
  E.start=function(tr,startBar,thump){
    E.stop(.05);TR=tr;barIdx=startBar;var t=ctx.currentTime+.06;
    var out=ctx.createGain();out.gain.value=0;out.gain.setTargetAtTime(1,t,.08);out.connect(musicSum);sess=out;nextBar=t;
    crG.gain.setTargetAtTime(.5,t,.15);
    if(thump){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(30,t+.15);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(mix);o.start(t);o.stop(t+.25)}
    pump();if(!timer&&ctx.constructor.name!=='OfflineAudioContext')timer=setInterval(pump,60);
  };
  function pump(){if(!sess||!TR)return;while(nextBar<ctx.currentTime+.45){nextBar+=E.scheduleBar(TR,barIdx,nextBar,sess);barIdx++}}
  E.stop=function(fade){
    if(timer){clearInterval(timer);timer=0}
    if(sess){var s=sess,t=ctx.currentTime;s.gain.cancelScheduledValues(t);s.gain.setTargetAtTime(0,t,fade||.12);setTimeout(function(){try{s.disconnect()}catch(e){}},1500);sess=null}
    crG.gain.setTargetAtTime(0,ctx.currentTime,.12);
  };
  E.playing=function(){return !!sess};
  E.bar=function(){return barIdx};
  E.offline=function(tr,bars){var t=0,b;var out=ctx.createGain();out.connect(musicSum);master.gain.value=gainOf(.65);for(b=0;b<bars;b++)t+=E.scheduleBar(tr,b,t+.05,out);return t};
  return E;
}
/* ENGINE END */

/* ---------- state ---------- */
var AC=null,eng=null,vol=.65,rain=false,trackIdx=0,night=false;
try{var sv=JSON.parse(localStorage.getItem('rsr')||'{}');if(typeof sv.vol==='number')vol=Math.max(0,Math.min(1,sv.vol))}catch(e){}
function save(){try{localStorage.setItem('rsr',JSON.stringify({vol:vol}))}catch(e){}}
function ensureAudio(){
  if(eng)return true;
  try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;AC=new C();eng=makeEngine(AC);eng.setVolume(vol);eng.setRain(rain);return true}catch(e){if(window.console)console.warn('audio unavailable',e);eng=null;return false}
}

/* ---------- turntable ---------- */
var ttSvg=$('tt'),flat=$('platter').parentNode,armRot=$('armRot'),armLift=$('armLift'),armEl=$('arm'),rec=$('rec'),sheen=$('sheenG');
var TX=260,TY=-170,PX=-60,PY=10,ARM_L=340,A_REST=98,A_OUT=117.6,A_IN=137.6,A_MAX=146,R_OUT=203,R_IN=85;
var alpha=A_REST,alphaT=A_REST,lift=0,liftT=0,progress=0,mode='rest',recA=0,spin=1,SIDE=100,dragging=false,restartAt=0,seek=null;
function needleR(a){var x=TX+ARM_L*Math.cos(a*D2R)-PX,y=TY+ARM_L*Math.sin(a*D2R)-PY;return Math.sqrt(x*x+y*y)}
function alphaFromR(r){return A_OUT+(A_IN-A_OUT)*Math.max(0,Math.min(1,(R_OUT-r)/(R_OUT-R_IN)))}
function say(t){$('live').textContent=t}
function setLabel(){
  var t=TRACKS[trackIdx];$('lblBase').setAttribute('fill',t.label);$('lblTP').textContent=t.name;
  $('cardName').textContent=t.name;$('cardMeta').innerHTML=t.bpm+' bpm &middot; '+t.key;
  var b=slv.children,i;for(i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',i===trackIdx?'true':'false');
  $('lblT1').setAttribute('fill',t.label==='#f4e7cf'?'#3a2313':'#3a2313');
}
function swapAnim(){var g=$('recSwap');if(reduce)return;g.style.transition='transform .18s,opacity .18s';g.style.transformOrigin='0 0';g.style.transformBox='fill-box';g.style.transform='scale(.9)';g.style.opacity='.3';setTimeout(function(){setLabel();g.style.transform='scale(1)';g.style.opacity='1'},190)}
function startPlay(fromProgress){
  if(!ensureAudio())return;eng.resume();
  progress=fromProgress||0;
  var bar=Math.floor(progress*8);
  eng.start(TRACKS[trackIdx],bar,true);mode='playing';liftT=0;hideHint();
  $('led').setAttribute('fill','#ffb84d');$('btnIc').setAttribute('d','M-276 182H-266V210H-276ZM-258 182H-248V210H-258Z');
  say('Playing '+TRACKS[trackIdx].name);
}
function stopPlay(toRest){
  if(eng)eng.stop(.12);
  $('led').setAttribute('fill','#5a3a20');$('btnIc').setAttribute('d','M-272 180L-248 196L-272 212Z');
  if(toRest){mode='rest';alphaT=A_REST;liftT=1;setTimeout(function(){if(mode==='rest')liftT=0},600)}
}
function autoPlay(){
  if(mode==='playing'||mode==='seek')return;
  ensureAudio();if(eng)eng.resume();
  mode='seek';liftT=1;seek={t0:performance.now(),from:alpha,to:A_OUT,stage:0};hideHint();
}
function toggle(){if(mode==='playing'){stopPlay(true);say('Needle lifted')}else if(mode==='rest')autoPlay()}
function pickTrack(i,play){
  if(!ensureAudio()){trackIdx=i;setLabel();return}
  eng.resume();
  var was=mode==='playing';trackIdx=i;swapAnim();
  if(was){stopPlay(false);mode='seek';liftT=1;seek={t0:performance.now(),from:alpha,to:A_OUT,stage:0}}
  else if(play&&mode==='rest')autoPlay();
  say('Record: '+TRACKS[i].name);
}
$('btn').addEventListener('click',toggle);
$('btn').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
$('rec').addEventListener('click',toggle);
$('platter').addEventListener('click',function(e){if(e.target===this.firstChild||e.target.getAttribute('r')==='208')toggle()});

function toFlat(cx,cy){var p=ttSvg.createSVGPoint();p.x=cx;p.y=cy;var m=flat.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
armEl.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();if(eng)eng.resume();
  dragging=true;mode='drag';liftT=1;if(eng&&eng.playing())eng.stop(.1);
  $('led').setAttribute('fill','#5a3a20');hideHint();armEl.style.cursor='grabbing';
  try{armEl.setPointerCapture(e.pointerId)}catch(err){}
});
armEl.addEventListener('pointermove',function(e){
  if(!dragging)return;var p=toFlat(e.clientX,e.clientY),a=Math.atan2(p.y-TY,p.x-TX)/D2R;
  if(a<0)a+=360;alphaT=Math.max(A_REST-4,Math.min(A_MAX,a));alpha+=(alphaT-alpha)*.6;
});
function endDrag(){
  if(!dragging)return;dragging=false;armEl.style.cursor='grab';
  var r=needleR(alphaT);
  if(r<R_OUT+8&&r>R_IN-8){startPlay(Math.max(0,Math.min(.99,(R_OUT-r)/(R_OUT-R_IN))));alpha=alphaT}
  else{mode='rest';alphaT=A_REST;liftT=1;setTimeout(function(){if(mode==='rest')liftT=0},700);say('Needle at rest')}
}
armEl.addEventListener('pointerup',endDrag);armEl.addEventListener('pointercancel',endDrag);
armEl.addEventListener('keydown',function(e){
  var k=e.key;if(k==='ArrowLeft'||k==='ArrowUp'||k==='ArrowRight'||k==='ArrowDown'){
    e.preventDefault();var d=(k==='ArrowLeft'||k==='ArrowUp')?-1.6:1.6;
    if(mode==='playing'){stopPlay(false)}mode='drag';liftT=1;alphaT=Math.max(A_REST-4,Math.min(A_MAX,alphaT+d));alpha=alphaT}
  else if(k==='Enter'||k===' '){e.preventDefault();var r=needleR(alphaT);if(r<R_OUT+8&&r>R_IN-8)startPlay(Math.max(0,Math.min(.99,(R_OUT-r)/(R_OUT-R_IN))));else{mode='rest';alphaT=A_REST;liftT=0}}
  else if(k==='Escape'){stopPlay(true)}
});
var hintEl=$('hint'),hintGone=false;function hideHint(){if(!hintGone){hintGone=true;hintEl.classList.add('gone')}}
setTimeout(hideHint,30000);

/* ---------- volume knob ---------- */
var knob=$('knob'),knobRot=$('knobRot'),kDrag=null;
function setVol(v,persist){vol=Math.max(0,Math.min(1,v));knobRot.setAttribute('transform','rotate('+(-135+vol*270).toFixed(1)+' 99 238)');knob.setAttribute('aria-valuenow',Math.round(vol*100));if(eng)eng.setVolume(vol);if(persist)save()}
knob.addEventListener('pointerdown',function(e){e.preventDefault();ensureAudio();kDrag={y:e.clientY,v:vol};try{knob.setPointerCapture(e.pointerId)}catch(err){}});
knob.addEventListener('pointermove',function(e){if(kDrag)setVol(kDrag.v+(kDrag.y-e.clientY)/(150*S),false)});
knob.addEventListener('pointerup',function(){if(kDrag){kDrag=null;save()}});
knob.addEventListener('wheel',function(e){e.preventDefault();setVol(vol-e.deltaY*.001,true)},{passive:false});
knob.addEventListener('keydown',function(e){if(e.key==='ArrowUp'||e.key==='ArrowRight'){e.preventDefault();setVol(vol+.05,true)}else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();setVol(vol-.05,true)}});
setVol(vol,false);

/* ---------- rain switch, lamp, keyboard ---------- */
var rainSw=$('rainSw');
rainSw.addEventListener('click',function(){rain=!rain;rainSw.setAttribute('aria-checked',rain?'true':'false');if(ensureAudio()){eng.resume();eng.setRain(rain)}say(rain?'Rain sound on':'Rain sound off')});
$('lampBtn').addEventListener('click',function(){night=!night;body.classList.toggle('night',night);$('lampBtn').setAttribute('aria-pressed',night?'true':'false');$('skyNight').setAttribute('opacity',night?1:0);say(night?'Late evening':'Golden hour')});
addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;var t=e.target&&e.target.tagName;
  if(e.key>='1'&&e.key<='4'){pickTrack(+e.key-1,true)}
  else if((e.key===' ')&&t!=='BUTTON'&&!(e.target.getAttribute&&e.target.getAttribute('role'))){e.preventDefault();toggle()}
  else if(e.key==='r'||e.key==='R')rainSw.click();
});

/* ---------- rain on the window + dust in the light ---------- */
var rc=$('rain'),rg=rc.getContext('2d'),drops=[],streaks=[],RW=300,RH=260,rdpr=1;
function sizeRain(){var b=rc.getBoundingClientRect();rdpr=Math.min(2,window.devicePixelRatio||1);rc.width=Math.max(2,Math.round(b.width*rdpr));rc.height=Math.max(2,Math.round(b.height*rdpr));RW=b.width/S;RH=b.height/S}
function mkStreak(s){s.x=Math.random()*RW*1.2-RW*.1;s.y=Math.random()*RH;s.l=10+Math.random()*24;s.v=520+Math.random()*700;s.a=.14+Math.random()*.22}
function mkDrop(d){d.x=Math.random()*RW;d.y=Math.random()*RH*.8;d.r=1.6+Math.random()*3.6;d.v=0;d.wait=Math.random()*5;d.slide=false;d.trail=0}
for(var qi=0;qi<80;qi++){var st={};mkStreak(st);streaks.push(st)}
for(qi=0;qi<16;qi++){var dd={};mkDrop(dd);drops.push(dd)}
function drawRain(dt){
  var I=rain?1:.55;rg.setTransform(rdpr*S,0,0,rdpr*S,0,0);rg.clearRect(0,0,RW,RH);
  var n=(streaks.length*I)|0,i,s,d;rg.lineCap='round';
  for(i=0;i<n;i++){s=streaks[i];s.y+=s.v*dt*(reduce?.3:1);s.x-=s.v*dt*.18*(reduce?.3:1);if(s.y>RH+30||s.x<-30)mkStreak(s),s.y=-20;
    rg.strokeStyle='rgba(225,236,247,'+s.a+')';rg.lineWidth=1.2;rg.beginPath();rg.moveTo(s.x,s.y);rg.lineTo(s.x+s.l*.18,s.y-s.l);rg.stroke()}
  for(i=0;i<drops.length;i++){d=drops[i];
    if(!d.slide){d.wait-=dt*I*(reduce?.3:1);if(d.wait<0){d.slide=true;d.v=10}}
    else{d.v+=dt*(80+d.r*30);d.y+=d.v*dt;d.trail+=d.v*dt;if(d.y>RH+10)mkDrop(d)}
    if(d.slide&&d.trail>0){rg.strokeStyle='rgba(225,236,247,.16)';rg.lineWidth=d.r*.7;rg.beginPath();rg.moveTo(d.x,d.y-Math.min(d.trail,60));rg.lineTo(d.x,d.y);rg.stroke()}
    var gr=rg.createRadialGradient(d.x-d.r*.3,d.y-d.r*.3,0,d.x,d.y,d.r);gr.addColorStop(0,'rgba(255,255,255,.85)');gr.addColorStop(.6,'rgba(200,220,240,.25)');gr.addColorStop(1,'rgba(120,150,180,.35)');
    rg.fillStyle=gr;rg.beginPath();rg.arc(d.x,d.y,d.r,0,TAU);rg.fill()}
}
var dc=$('dust'),dg=dc.getContext('2d'),motes=[],ddpr=1;
function sizeDust(){ddpr=Math.min(2,window.devicePixelRatio||1);dc.width=Math.round(innerWidth*ddpr);dc.height=Math.round(innerHeight*ddpr)}
for(qi=0;qi<46;qi++)motes.push({x:Math.random(),y:Math.random(),r:.8+Math.random()*1.8,p:Math.random()*6.28,v:.004+Math.random()*.01});
function drawDust(t,dt){
  dg.setTransform(ddpr,0,0,ddpr,0,0);dg.clearRect(0,0,innerWidth,innerHeight);
  var a=body.classList.contains('night')?.12:.6,i,m,W=innerWidth,H=innerHeight;
  for(i=0;i<motes.length;i++){m=motes[i];m.y-=m.v*dt*(reduce?.2:1);m.x+=Math.sin(t*.0004+m.p)*.00016*(reduce?.2:1);if(m.y<.08){m.y=.98;m.x=Math.random()}
    var px=m.x*W,py=m.y*H,tw=.5+.5*Math.sin(t*.0012+m.p);dg.fillStyle='rgba(255,226,160,'+(a*(.25+.45*tw)).toFixed(3)+')';dg.beginPath();dg.arc(px,py,m.r*S*1.2,0,TAU);dg.fill()}
}

/* ---------- main loop ---------- */
var cone=$('coneG'),eqEls=$('eq').children,lvBuf=new Uint8Array(128),lvS=0,last=0,sideFrac=0;
function frame(t){
  requestAnimationFrame(frame);if(doc.hidden){last=t;return}
  var dt=last?Math.min(.05,(t-last)/1000):.016;last=t;
  var speed=reduce?.25:1;
  recA=(recA+200*D2R*dt*speed)%TAU;var wob=Math.sin(t*.0019)*.02;
  rec.setAttribute('transform','rotate('+((recA*(1+wob))/D2R).toFixed(2)+')');
  sheen.setAttribute('transform','rotate('+(-recA/D2R*.35).toFixed(2)+')');
  /* arm */
  if(mode==='seek'&&seek){
    var u=Math.min(1,(performance.now()-seek.t0)/1100),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;alpha=seek.from+(seek.to-seek.from)*e;alphaT=alpha;
    if(u>=1){seek=null;liftT=0;setTimeout(function(){if(mode==='seek')startPlay(0)},260)}
  }else if(mode==='playing'){
    progress+=dt/SIDE;
    if(progress>=1){progress=1;stopPlay(false);mode='wait';liftT=1;restartAt=performance.now()+2600}
    alphaT=A_OUT+(A_IN-A_OUT)*progress;alpha=alphaT;
  }else if(mode==='wait'){alpha=A_IN+3;if(performance.now()>restartAt){mode='seek';seek={t0:performance.now(),from:alpha,to:A_OUT,stage:0}}}
  else if(mode==='rest'){alpha+=(alphaT-alpha)*(1-Math.exp(-dt*7))}
  else if(mode==='drag'&&!dragging){alpha=alphaT}
  lift+=(liftT-lift)*(1-Math.exp(-dt*14));
  armRot.setAttribute('transform','rotate('+alpha.toFixed(2)+')');
  armLift.setAttribute('transform','translate(0 '+(-lift*34).toFixed(1)+')');
  var r=needleR(alpha);
  armEl.setAttribute('aria-valuenow',Math.round(Math.max(0,Math.min(1,(R_OUT-r)/(R_OUT-R_IN)))*100));
  armEl.setAttribute('aria-valuetext',(mode==='playing'?'playing, '+Math.round(progress*100)+' percent through the side':'at rest or lifted'));
  /* speaker + equaliser */
  var lv=0;if(eng&&eng.playing()){lv=eng.level(lvBuf)}
  lvS+=(lv-lvS)*.4;
  cone.style.transform='scale('+(1+lvS*.07).toFixed(3)+')';
  var i;for(i=0;i<eqEls.length;i++){var h=mode==='playing'?4+Math.abs(Math.sin(t*.004*(1+i*.37)+i))*(6+lvS*18):4;eqEls[i].style.height=h.toFixed(1)+'px'}
  drawRain(dt);drawDust(t,dt);
}
window.addEventListener('resize',function(){clearTimeout(window.__rz);window.__rz=setTimeout(layout,60)});
layout();setLabel();sizeRain();
requestAnimationFrame(frame);
})();
