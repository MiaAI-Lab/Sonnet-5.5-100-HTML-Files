  lensC.setAttribute('cx',f1(lx));lensC.setAttribute('cy',f1(ly));lensC.setAttribute('r',f1(lensR));
  magEl.setAttribute('transform','matrix('+MAG+' 0 0 '+MAG+' '+f1(lx*(1-MAG))+' '+f1(ly*(1-MAG))+')');
  shadowEl.setAttribute('cx',f1(lx+14));shadowEl.setAttribute('cy',f1(ly+20));shadowEl.setAttribute('rx',f1(lensR+18));shadowEl.setAttribute('ry',f1(lensR+18));
  lensFrame.innerHTML=frameMarkup(lensR);
}

/* ---------------- interaction ---------------- */
var pinsOn=true, sel=-1, lastMove=0, tour=0, tourT=0, dragging=false, isTouch=false, downP=null;
function toU(e){var r=svg.getBoundingClientRect();return [(e.clientX-r.left)/r.width*vb.w,(e.clientY-r.top)/r.height*vb.h]}
function spotAt(u,pad){var b=null,bd=1e9;spots.forEach(function(s){var d=Math.hypot(u[0]-s.x,u[1]-s.y);if(d<s.r*(pad||1)&&d<bd){bd=d;b=s}});return b}
stage.addEventListener('pointermove',function(e){
  isTouch=e.pointerType==='touch';
  if(isTouch&&!dragging)return;
  var u=toU(e);tx=u[0];ty=u[1]-(isTouch?lensR*.95:0);lastMove=performance.now();
});
stage.addEventListener('pointerdown',function(e){
  isTouch=e.pointerType==='touch';dragging=true;downP={x:e.clientX,y:e.clientY};
  var u=toU(e);tx=u[0];ty=u[1]-(isTouch?lensR*.95:0);lastMove=performance.now();
  try{stage.setPointerCapture(e.pointerId)}catch(x){}
});
stage.addEventListener('pointerup',function(e){
  dragging=false;
  var moved=downP?Math.hypot(e.clientX-downP.x,e.clientY-downP.y):0;
  if(moved<10){var u=toU(e),s=spotAt(u,1.15);if(s)openCard(s.i)}
  lastMove=performance.now();
});
stage.addEventListener('pointercancel',function(){dragging=false});
function bindSpecs(){
  Array.prototype.forEach.call(svg.querySelectorAll('#base .spec'),function(g){
    var i=+g.getAttribute('data-i');
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard(i)}});
    g.addEventListener('focus',function(){tx=spots[i].x;ty=spots[i].y;lastMove=performance.now()});
  });
}
$('pinBtn').addEventListener('click',function(){
  pinsOn=!pinsOn;svg.classList.toggle('nopins',!pinsOn);this.setAttribute('aria-pressed',pinsOn?'true':'false');this.textContent=pinsOn?'Unpin all':'Pin all';
});
function markSel(){
  Array.prototype.forEach.call(svg.querySelectorAll('.pin'),function(p){p.classList.toggle('on',+p.getAttribute('data-pin')===sel)});
}
var card=$('card');
function openCard(i){
  var s=SP[i];sel=i;markSel();
  $('cKick').textContent='Field card · N° '+(i+1)+' of VIII · Pl. XIV';
  $('cTitle').innerHTML='<span>'+s.n+'</span> '+s.e;
  $('cCommon').textContent=s.c;
  $('cDl').innerHTML='<dt>Length</dt><dd>'+s.mm+' mm.</dd><dt>Habitat</dt><dd>'+s.habitat+'</dd><dt>Range</dt><dd>'+s.range+'</dd><dt>Season</dt><dd>'+s.season+'</dd>';
  $('cNote').textContent=s.note;$('cSig').textContent='— '+s.by;
  WIG=!reduce;$('cMini').innerHTML='<g transform="scale('+f1(105/s.H)+')">'+bug(s,false,'m')+'</g>';WIG=false;
  card.hidden=false;$('live').textContent='Field card opened: '+s.n+' '+s.e;
  $('cClose').focus({preventScroll:true});
}
function closeCard(){card.hidden=true;sel=-1;markSel()}
$('cClose').addEventListener('click',closeCard);
window.addEventListener('keydown',function(e){if(e.key==='Escape'&&!card.hidden)closeCard()});

/* ---------------- ambience: beam, dust motes and a moth ---------------- */
var fx=$('fx'),fc=fx.getContext('2d'),FW=0,FH=0,DPR=1,motes=[],moth=null,nextMoth=6;
function fxSize(){DPR=Math.min(devicePixelRatio||1,1.5);FW=innerWidth;FH=innerHeight;fx.width=FW*DPR;fx.height=FH*DPR;
  if(!motes.length){var r=mul(5);for(var i=0;i<70;i++)motes.push({x:r(),y:r(),z:r(),ph:r()*6.28,s:.4+r()})}}
function beamK(x,y){var d=Math.abs((x/FW-.12)*.9-(y/FH-.0)*.55)/.5;return clamp(1-d*d*2.2,0,1)}
function drawMoth(dt,t){
  if(!moth){nextMoth-=dt;if(nextMoth<=0&&!reduce){var L=Math.random()<.5;moth={x:L?-40:FW+40,y:FH*(.15+Math.random()*.5),vx:(L?1:-1)*(70+Math.random()*40),ph:0,t:0}}return}
  moth.t+=dt;moth.x+=moth.vx*dt;moth.y+=Math.sin(moth.t*1.7)*38*dt+Math.sin(moth.t*.6)*22*dt;moth.ph+=dt*17;
  var fl=Math.abs(Math.cos(moth.ph)),d=moth.vx>0?1:-1;
  fc.save();fc.translate(moth.x,moth.y);fc.rotate(Math.sin(moth.t*1.7)*.25);fc.scale(d,1);fc.globalAlpha=.92;
  fc.fillStyle='rgba(0,0,0,.18)';fc.beginPath();fc.ellipse(10,26,15,4,0,0,6.28);fc.fill();
  [[1,'#a98e62','#6d5636'],[-1,'#a98e62','#6d5636']].forEach(function(w){
    fc.save();fc.scale(1,w[0]);fc.rotate(-.5*(1-fl)*w[0]*0);
    fc.fillStyle=w[1];fc.strokeStyle=w[2];fc.lineWidth=1;fc.beginPath();fc.moveTo(0,0);fc.bezierCurveTo(-6,-22*fl-4,-24,-30*fl-4,-30,-16*fl-2);fc.bezierCurveTo(-26,-6,-14,0,0,0);fc.fill();fc.stroke();
    fc.fillStyle='#d9c79a';fc.beginPath();fc.arc(-19,-11*fl-2,3.2*Math.max(.3,fl),0,6.28);fc.fill();fc.restore();
  });
  fc.fillStyle='#5a4428';fc.beginPath();fc.ellipse(2,0,3.4,10,1.57,0,6.28);fc.fill();
  fc.strokeStyle='#5a4428';fc.lineWidth=.8;fc.beginPath();fc.moveTo(11,0);fc.quadraticCurveTo(18,-8,23,-9);fc.moveTo(11,0);fc.quadraticCurveTo(18,8,23,9);fc.stroke();fc.restore();
  if(moth.x<-80||moth.x>FW+80){moth=null;nextMoth=14+Math.random()*12}
}
function fxFrame(dt,t){
  fc.setTransform(DPR,0,0,DPR,0,0);fc.clearRect(0,0,FW,FH);
  var g=fc.createLinearGradient(FW*.05,0,FW*.75,FH);g.addColorStop(0,'rgba(255,232,180,.16)');g.addColorStop(1,'rgba(255,232,180,0)');
  fc.save();fc.globalCompositeOperation='lighter';fc.fillStyle=g;fc.beginPath();fc.moveTo(FW*.02,0);fc.lineTo(FW*.34,0);fc.lineTo(FW*.98,FH);fc.lineTo(FW*.5,FH);fc.closePath();fc.fill();
  motes.forEach(function(m){
    if(!reduce){m.x+=(Math.sin(t*.13+m.ph)*.006+.0016)*dt*m.s;m.y+=(Math.cos(t*.11+m.ph)*.005-.0009)*dt*m.s}
    if(m.x>1.02)m.x=-.02;if(m.y<-.02)m.y=1.02;if(m.y>1.02)m.y=-.02;if(m.x<-.03)m.x=1.02;
    var X=m.x*FW,Y=m.y*FH,b=beamK(X,Y),a=.08+b*.75*(.6+.4*Math.sin(t*1.3+m.ph*3));
    fc.globalAlpha=a;fc.fillStyle='#fff1c8';fc.beginPath();fc.arc(X,Y,.6+m.z*1.5+b*.8,0,6.28);fc.fill();
  });
  fc.restore();fc.globalAlpha=1;
  drawMoth(dt,t);
}

/* ---------------- loop ---------------- */
var last=0,T=0;
function frame(now){
  requestAnimationFrame(frame);
  if(doc.hidden){last=0;return}
  var dt=last?Math.min(.05,(now-last)/1000):.016;last=now;T+=dt;
  if(!dragging&&now-lastMove>4500&&!reduce){
    tourT-=dt;
    if(tourT<=0){tour=(tour+1)%spots.length;tourT=3.4}
    var s=spots[tour];if(s){tx=s.x+Math.sin(T*.7)*s.r*.25;ty=s.y+Math.cos(T*.9)*s.r*.2}
  }
  var k=1-Math.exp(-dt*(reduce?30:9));
  lx+=(tx-lx)*k;ly+=(ty-ly)*k;
  renderLens();fxFrame(dt,T);
}
layout();fxSize();
if(reduce){var s0=spots[0];tx=lx=s0.x;ty=ly=s0.y}else{var s1=spots[0];tx=s1.x;ty=s1.y;lx=vb.w*.3;ly=vb.h*.55;tourT=3;lastMove=-9999}
var rt=0;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){layout();fxSize()},90)});
requestAnimationFrame(frame);
})();
</script>
</body>
