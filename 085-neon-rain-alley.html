<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramen Alley 2049 - Neon Rain</title>
<meta name="description" content="A rainy cyberpunk noodle alley at night: real 3D perspective walls, neon signs you can switch off, a wet mirror street and steam.">
<style>
:root{
  --bg:#070b14; --bg2:#0b1424; --teal:#0fb5ae; --orange:#ff8a3d; --mag:#ff2fa5; --vio:#6d28d9;
  --ink:#d8ecec; --vu:1vh; --hz:calc(58 * var(--vu)); --a:min(calc(45 * var(--vu)), 40vw);
  --cx:0; --cy:0; --mx:50%; --my:40%;
  --cond:"Bahnschrift","Arial Narrow","Oswald","Nimbus Sans Narrow","Franklin Gothic Medium",Impact,"Liberation Sans Narrow",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
}
@supports (height:1dvh){:root{--vu:1dvh}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;color-scheme:dark}
body{font-family:var(--mono);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

.scene{position:fixed;inset:0;overflow:hidden;touch-action:none;background:var(--bg)}
.stage{position:absolute;left:0;top:0;width:100%;height:var(--hz);overflow:hidden;background:var(--bg)}

/* ---------- sky ---------- */
.sky{position:absolute;inset:-2% -4%;transform:translateX(calc(var(--cx) * .6vw));
  background:
   radial-gradient(60% 46% at 50% 100%,rgba(255,138,61,.38),transparent 72%),
   radial-gradient(38% 40% at 22% 92%,rgba(255,47,165,.28),transparent 70%),
   radial-gradient(38% 40% at 78% 88%,rgba(15,181,174,.28),transparent 70%),
   linear-gradient(#03050b,#08101f 36%,#101c36 64%,#231f45 88%,#3a2748)}
.cloud{position:absolute;left:-30%;width:160%;height:26%;filter:blur(14px);opacity:.5;
  background:radial-gradient(40% 60% at 20% 50%,rgba(70,60,120,.5),transparent),radial-gradient(34% 60% at 62% 45%,rgba(30,90,110,.45),transparent),radial-gradient(30% 50% at 88% 60%,rgba(120,50,110,.35),transparent);
  animation:drift 90s linear infinite alternate}
.cloud.c2{top:26%;opacity:.35;animation-duration:140s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.sk{position:absolute;left:-4%;width:108%;bottom:0}
.sk canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sk.back{height:74%;transform:translateX(calc(var(--cx) * .9vw))}
.sk.mid{height:52%;transform:translateX(calc(var(--cx) * 1.5vw))}
.blink{position:absolute;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:#ff3b4d;box-shadow:0 0 8px 2px rgba(255,59,77,.8);animation:blink 2.4s infinite}
@keyframes blink{0%,12%,100%{opacity:1}14%,60%{opacity:.08}62%{opacity:1}}

.ads{position:absolute;inset:0;transform:translateX(calc(var(--cx) * 1.1vw))}
.ad{position:absolute;left:var(--x);bottom:var(--y);width:calc(var(--w) * var(--vu));height:calc(var(--h) * var(--vu));
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;
  background:linear-gradient(115deg,#ff2fa5,#6d28d9,#0fb5ae,#ff8a3d,#ff2fa5);background-size:320% 100%;
  animation:adshift 9s linear infinite;opacity:.82;border-radius:.4vh;overflow:hidden;
  box-shadow:0 0 5vh rgba(255,47,165,.45);transform:skewX(var(--sk,0deg))}
.ad::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 1px,transparent 1px 3px);animation:scan 3s linear infinite}
.ad::after{content:"";position:absolute;left:0;right:0;height:22%;top:-30%;background:linear-gradient(transparent,rgba(255,255,255,.35),transparent);animation:sweep 5s ease-in-out infinite}
.ad b{position:relative;font:800 calc(var(--fs) * var(--vu))/1 var(--cond);letter-spacing:.06em;text-shadow:0 0 1vh rgba(0,0,0,.6);text-transform:uppercase}
.ad i{position:relative;font:normal 600 calc(var(--fs) * var(--vu) * .32)/1.3 var(--mono);letter-spacing:.2em;text-transform:uppercase;margin-top:.8vh;opacity:.9}
.ad.off{opacity:0;box-shadow:none;transition:opacity .25s}
@keyframes adshift{to{background-position:320% 0}}
@keyframes scan{to{background-position:0 12px}}
@keyframes sweep{0%,30%{top:-30%}100%{top:130%}}

.actors{position:absolute;inset:0;transform:translateX(calc(var(--cx) * 1.3vw))}
.car{position:absolute;top:var(--t);left:-30%;width:9vh;height:1.3vh;animation:fly var(--fd) linear infinite;animation-delay:var(--dl);opacity:0}
.car::before{content:"";position:absolute;right:0;top:0;width:100%;height:100%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,138,61,.5) 55%,#ffe2b8);filter:blur(1px)}
.car::after{content:"";position:absolute;right:0;top:-.3vh;width:1.2vh;height:1.9vh;border-radius:50%;background:radial-gradient(#fff,#ffb56b 40%,transparent 70%)}
@keyframes fly{0%{left:-22%;opacity:0}2%{opacity:1}13%{left:118%;opacity:1}14%,100%{left:118%;opacity:0}}
.drone{position:absolute;left:0;top:19%;width:4.2vh;height:2.2vh;animation:dr 34s linear infinite}
.drone svg{width:100%;height:100%;overflow:visible;animation:bob 3.2s ease-in-out infinite}
.drone .lt{animation:blink 1.1s infinite}
@keyframes dr{from{left:-6%}to{left:106%}}
@keyframes bob{50%{transform:translateY(.7vh) rotate(-3deg)}}

.vpglow{position:absolute;left:calc(50% + var(--cx) * 6%);bottom:0;width:70vmax;height:60%;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,164,96,.85),rgba(255,47,165,.32) 26%,rgba(15,181,174,.16) 46%,transparent 66%);mix-blend-mode:screen}

/* ---------- alley in true CSS 3D ---------- */
.alley{position:absolute;inset:0;perspective:calc(70 * var(--vu));perspective-origin:calc(50% + var(--cx) * 6%) 100%}
.world{position:absolute;inset:0;transform-style:preserve-3d}
.wall{position:absolute;bottom:0;width:calc(400 * var(--vu));height:calc(132 * var(--vu));transform-style:preserve-3d}
.wl{left:calc(50% - var(--a));transform-origin:0 100%;transform:translateZ(calc(40 * var(--vu))) rotateY(90deg)}
.wr{right:calc(50% - var(--a));transform-origin:100% 100%;transform:translateZ(calc(40 * var(--vu))) rotateY(-90deg)}
.bld{position:absolute;bottom:0;background-color:#0a1120;background-size:100% 100%;box-shadow:inset 0 .5vh 0 rgba(120,210,255,.18)}
.wl .bld{border-right:.3vh solid rgba(0,0,0,.6)}
.wr .bld{border-left:.3vh solid rgba(0,0,0,.6)}
.fog{position:absolute;inset:0;pointer-events:none}
.wl .fog{background:linear-gradient(90deg,rgba(38,42,86,0) 6%,rgba(38,42,86,.42) 20%,rgba(50,46,96,.82) 40%,rgba(60,50,100,.96) 62%)}
.wr .fog{background:linear-gradient(270deg,rgba(38,42,86,0) 6%,rgba(38,42,86,.42) 20%,rgba(50,46,96,.82) 40%,rgba(60,50,100,.96) 62%)}
.sgs{position:absolute;inset:0;transform-style:preserve-3d}
.wl .sg{left:calc((var(--d) + 40) * var(--vu));transform-origin:0 50%;transform:rotateY(-90deg)}
.wr .sg{right:calc((var(--d) + 40) * var(--vu));transform-origin:100% 50%;transform:rotateY(90deg)}
.xp{position:absolute;left:calc(50% - var(--a));width:calc(2 * var(--a));height:calc(30 * var(--vu));bottom:calc(var(--h) * var(--vu));transform:translateZ(calc(-1 * var(--d) * var(--vu)));pointer-events:none}
.xp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.xp path{fill:none;stroke:#03060c;stroke-width:1.3}
.lan{position:absolute;width:calc(3.6 * var(--vu));height:calc(4.6 * var(--vu));margin-left:calc(-1.8 * var(--vu));border-radius:45%;
  background:repeating-linear-gradient(0deg,rgba(90,10,10,.5) 0 2px,transparent 2px 5px),radial-gradient(circle at 50% 45%,#fff2c8,#ffa24a 45%,#d9331f 100%);
  box-shadow:0 0 calc(4 * var(--vu)) rgba(255,110,50,.8),0 0 calc(10 * var(--vu)) rgba(255,70,40,.45);animation:sway 4s ease-in-out infinite alternate}
.lan::before{content:"";position:absolute;left:35%;right:35%;top:-16%;height:16%;background:#12080a}
.lan.g{background:repeating-linear-gradient(0deg,rgba(0,40,40,.5) 0 2px,transparent 2px 5px),radial-gradient(circle at 50% 45%,#d6fffb,#25d4c8 45%,#0a6a72 100%);box-shadow:0 0 calc(4 * var(--vu)) rgba(15,181,174,.8),0 0 calc(10 * var(--vu)) rgba(15,181,174,.4)}
.lan.off{background:#1a1418;box-shadow:none}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

/* neon blade signs */
.sg{position:absolute;bottom:calc(var(--b) * var(--vu));width:calc(var(--w) * var(--vu));height:calc(var(--h) * var(--vu));
  display:flex;flex-direction:column-reverse;align-items:center;justify-content:space-evenly;padding:calc(.8 * var(--vu));margin:0;
  writing-mode:vertical-rl;text-orientation:upright;font:800 calc(var(--fs) * var(--vu))/1 var(--cond);letter-spacing:.04em;
  color:var(--c);background:rgba(5,8,16,.86);border:calc(.42 * var(--vu)) solid var(--c);border-radius:calc(1.2 * var(--vu));cursor:pointer;
  text-shadow:0 0 calc(.3 * var(--vu)) #fff,0 0 calc(.9 * var(--vu)) var(--c),0 0 calc(2.4 * var(--vu)) var(--c),0 0 calc(5 * var(--vu)) var(--c);
  box-shadow:0 0 calc(1.2 * var(--vu)) var(--c),0 0 calc(4 * var(--vu)) var(--c),inset 0 0 calc(1.4 * var(--vu)) var(--c);
  animation:flick var(--fd,8s) linear infinite;animation-delay:var(--dl,0s);transition:color .2s,box-shadow .2s,text-shadow .2s,border-color .2s;-webkit-appearance:none;appearance:none}
.sg::after{content:"";position:absolute;inset:-25%;z-index:-1;background:radial-gradient(closest-side,var(--c),transparent);opacity:.2;pointer-events:none}
.sg>span{display:block}
.sg .brk span{display:inline}
.sg:hover{filter:brightness(1.3)}
.sg.off{color:#26324a;border-color:#1b2538;text-shadow:none;box-shadow:none;animation:none;background:rgba(4,6,12,.9);filter:none}
.sg.off::after{opacity:0}
.sg.off span{animation:none!important;opacity:1!important}
.sg.ignite{animation:ignite .95s steps(1) 1}
@keyframes flick{0%,100%{opacity:1}91%{opacity:1}91.6%{opacity:.55}92.2%{opacity:1}93%{opacity:.7}93.4%{opacity:1}}
@keyframes ignite{0%{opacity:.05}8%{opacity:1}14%{opacity:.1}22%{opacity:.95}30%{opacity:.15}44%{opacity:1}52%{opacity:.5}62%{opacity:1}100%{opacity:1}}
.brk{animation:brkall 6.5s linear infinite}
.brk .b1{animation:brk1 3.1s steps(1) infinite}
.brk .b2{animation:brk2 4.3s steps(1) infinite}
.brk .b3{opacity:.12;text-shadow:none}
@keyframes brk1{0%,20%,26%,58%,100%{opacity:1}21%,24%{opacity:.12}59%,62%{opacity:.25}}
@keyframes brk2{0%,44%,48%,80%,100%{opacity:1}45%,47%{opacity:.1}81%{opacity:.3}}
@keyframes brkall{0%,70%,100%{opacity:1}71%{opacity:.35}72%{opacity:1}73%{opacity:.2}74.5%{opacity:1}}
.mirror .sg{text-shadow:0 0 calc(.9 * var(--vu)) var(--c),0 0 calc(2.4 * var(--vu)) var(--c)}
.mirror .sg::after{display:none}
.mirror .lan{box-shadow:0 0 calc(4 * var(--vu)) rgba(255,110,50,.7)}

.mist{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;background:linear-gradient(0deg,rgba(15,181,174,.22),rgba(109,40,217,.08) 55%,transparent)}
.flash{position:absolute;inset:0;pointer-events:none;background:#b9c8ff;opacity:0;mix-blend-mode:screen;z-index:9}
.flash.go{animation:bolt .9s linear 1}
@keyframes bolt{0%{opacity:0}6%{opacity:.34}14%{opacity:.05}22%{opacity:.5}40%{opacity:.08}100%{opacity:0}}

/* ---------- wet street ---------- */
.ground{position:absolute;left:0;top:var(--hz);width:100%;bottom:0;overflow:hidden;background:linear-gradient(#0c1526,#05070d)}
.mirror{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none;opacity:.62;
  -webkit-mask-image:linear-gradient(#000 10%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.08));mask-image:linear-gradient(#000 10%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.08))}
.mirror-inner{position:absolute;left:0;top:0;width:100%;height:var(--hz);transform:scaleY(-1);filter:url(#ripple)}
.mirror .stage{pointer-events:none}
.sheen{position:absolute;inset:0;pointer-events:none;
  background:
   repeating-linear-gradient(0deg,rgba(2,4,9,.34) 0 2px,transparent 2px 7px),
   linear-gradient(90deg,rgba(255,47,165,.10),transparent 30%,transparent 68%,rgba(255,138,61,.13)),
   radial-gradient(60% 60% at 50% 0,rgba(255,150,90,.28),transparent 70%),
   linear-gradient(rgba(7,11,20,.1),rgba(4,6,12,.72));
  background-size:100% 14px,100% 100%,100% 100%,100% 100%;animation:shimmer 7s linear infinite}
@keyframes shimmer{to{background-position:0 14px,0 0,0 0,0 0}}
.pud{position:absolute;pointer-events:none;border-radius:50%;mix-blend-mode:screen;filter:blur(1px)}
.spill{position:absolute;left:0;right:0;top:0;height:2.2vh;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,200,150,.5),transparent);opacity:.35}

canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.torch{position:absolute;inset:0;pointer-events:none;z-index:7;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--mx) var(--my),rgba(255,222,176,.24),rgba(255,138,61,.09) 12vmax,transparent 30vmax)}
.vig{position:absolute;inset:0;pointer-events:none;z-index:8;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(2,3,7,.75))}
.grain{position:absolute;inset:0;pointer-events:none;z-index:8;opacity:.14;mix-blend-mode:overlay}

/* ---------- foreground people & stall ---------- */
.fg{position:absolute;inset:0;z-index:4;pointer-events:none;transform:translateX(calc(var(--cx) * -1.6vw))}
.walker{position:absolute;left:0;animation:walk var(--dur) linear infinite;animation-delay:var(--dl)}
.walker.rev{animation-name:walkr}
.walker svg{display:block;overflow:visible}
.walker .top{filter:drop-shadow(0 0 1vh var(--u))}
.walker .refl{transform:scaleY(-1);opacity:.28;filter:blur(1.2px);margin-top:-.3vh}
.walker .bo{animation:step .62s ease-in-out infinite alternate}
.walker .l1{transform-origin:16px 72px;animation:leg .62s ease-in-out infinite alternate}
.walker .l2{transform-origin:24px 72px;animation:leg .62s ease-in-out infinite alternate-reverse}
@keyframes walk{from{transform:translateX(-14vw)}to{transform:translateX(112vw)}}
@keyframes walkr{from{transform:translateX(112vw) scaleX(-1)}to{transform:translateX(-14vw) scaleX(-1)}}
@keyframes step{to{transform:translateY(-.8px)}}
@keyframes leg{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.stall{position:absolute;left:calc(1vw + var(--cx) * 0vw);bottom:calc(3.5 * var(--vu));width:clamp(230px,32vw,470px);z-index:5}
.stall svg{display:block;width:100%;height:auto;overflow:visible}
.stall .glowfloor{position:absolute;left:-10%;right:-10%;bottom:-6%;height:34%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,150,70,.6),transparent);mix-blend-mode:screen;animation:warm 3.4s ease-in-out infinite alternate}
@keyframes warm{from{opacity:.8}to{opacity:1}}
.noren{transform-origin:50% 0;animation:sway 3.6s ease-in-out infinite alternate}
.noren:nth-of-type(2){animation-delay:-1.4s}.noren:nth-of-type(3){animation-delay:-2.3s}
.bulb{filter:drop-shadow(0 0 4px #ffb56b) drop-shadow(0 0 10px #ff8a3d)}

/* ---------- chrome ---------- */
.title{position:absolute;top:calc(2.4 * var(--vu));left:0;right:0;z-index:10;text-align:center;pointer-events:none;padding:0 4vw}
.title h1{margin:0;display:inline-block;font:700 clamp(34px,6.3vw,100px)/.95 var(--cond);letter-spacing:.11em;text-transform:uppercase;transform:scaleY(1.22);transform-origin:50% 0;
  text-shadow:0 0 6px rgba(0,0,0,.7),0 2px 22px rgba(0,0,0,.6);white-space:nowrap}
.title h1 .t1{color:#ffd9b4;text-shadow:0 0 .12em #fff2,0 0 .3em var(--orange),0 0 .8em var(--orange),0 0 1.6em rgba(255,138,61,.7)}
.title h1 .t2{color:#bffcf8;text-shadow:0 0 .12em #fff2,0 0 .3em var(--teal),0 0 .8em var(--teal),0 0 1.6em rgba(15,181,174,.7)}
.title h1 .t3{color:#ffc4e6;text-shadow:0 0 .12em #fff2,0 0 .3em var(--mag),0 0 .8em var(--mag),0 0 1.6em rgba(255,47,165,.7)}
.title h1 .t1{animation:tflick 9s linear infinite}
.title h1 .t3{animation:tflick 13s linear infinite 3s}
@keyframes tflick{0%,100%{opacity:1}94%{opacity:1}94.5%{opacity:.4}95.2%{opacity:1}96%{opacity:.6}96.5%{opacity:1}}
.uline{display:block;height:calc(.6 * var(--vu));min-height:4px;max-width:min(760px,84vw);margin:calc(1.4 * var(--vu)) auto 0;border-radius:4px;
  background:linear-gradient(90deg,var(--orange),var(--mag) 50%,var(--teal));box-shadow:0 0 8px #fff5,0 0 18px var(--mag),0 0 42px var(--mag),0 0 80px rgba(109,40,217,.8)}
.title.off h1 span{color:#26324a;text-shadow:none;animation:none}
.title.off .uline{background:#1b2538;box-shadow:none}
.title.ignite h1 span,.title.ignite .uline{animation:ignite .95s steps(1) 1}
.sub{margin:calc(1.8 * var(--vu)) 0 0;font-size:clamp(10px,1.05vw,13px);letter-spacing:.34em;text-transform:uppercase;color:rgba(200,236,236,.78);text-shadow:0 1px 8px #000}
.read{position:absolute;left:clamp(12px,2vw,28px);top:calc(2.6 * var(--vu));z-index:10;font-size:11px;letter-spacing:.14em;line-height:1.9;color:rgba(190,230,230,.7);text-transform:uppercase;pointer-events:none;text-shadow:0 1px 6px #000}
.read b{color:var(--orange);font-weight:600}
.ctl{position:absolute;right:clamp(12px,2vw,28px);bottom:clamp(12px,2.4vh,28px);z-index:12;display:flex;align-items:center;gap:14px;padding:12px 16px;
  background:rgba(6,10,20,.72);border:1px solid rgba(15,181,174,.4);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 24px rgba(15,181,174,.15),inset 0 0 20px rgba(15,181,174,.06)}
.ctl .rl{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a9d9d6}
.ctl .rl label{cursor:pointer}
.ctl output{min-width:2.4em;text-align:right;color:var(--orange)}
.ctl input[type=range]{width:clamp(90px,12vw,160px);height:28px;accent-color:var(--teal);background:transparent;cursor:pointer}
.btn{min-height:40px;padding:0 14px;background:rgba(15,181,174,.08);border:1px solid rgba(15,181,174,.55);border-radius:6px;color:#bffcf8;font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .2s,box-shadow .2s}
.btn:hover{background:rgba(15,181,174,.2);box-shadow:0 0 14px rgba(15,181,174,.5)}
.btn.warm{border-color:rgba(255,138,61,.7);color:#ffd9b4;background:rgba(255,138,61,.08)}
.btn.warm:hover{background:rgba(255,138,61,.22);box-shadow:0 0 14px rgba(255,138,61,.5)}
.btn[disabled]{opacity:.55;cursor:default}
.hint{position:absolute;left:50%;bottom:calc(1.6 * var(--vu));transform:translateX(-50%);z-index:9;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(190,230,230,.55);white-space:nowrap;pointer-events:none;text-shadow:0 1px 6px #000}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:900px){
  .read{display:none}
  .hint{display:none}
  .ctl{left:12px;right:12px;bottom:12px;justify-content:space-between;flex-wrap:wrap;gap:8px 10px;padding:10px 12px}
  .ctl .rl{flex:1 1 100%}
  .ctl input[type=range]{flex:1;width:auto}
  .ctl .btn{flex:1}
  .stall{width:clamp(180px,46vw,300px);bottom:calc(20 * var(--vu))}
  .title h1{letter-spacing:.05em;font-size:clamp(28px,8.6vw,80px)}
  .ad{width:calc(var(--w) * var(--vu) * .72);height:calc(var(--h) * var(--vu) * .72)}
  .sub{letter-spacing:.2em}
}
@media (max-width:900px) and (max-height:520px){.stall{display:none}}
@media (prefers-reduced-motion:reduce){
  .sg,.title h1 span,.lan,.cloud,.noren{animation:none}
  .ad,.ad::before,.ad::after,.sheen{animation-duration:30s}
  .car,.drone{animation-duration:90s}
  .walker{animation-duration:calc(var(--dur) * 3)}
}
body.hid *{animation-play-state:paused!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="ripple" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feTurbulence id="rt" type="fractalNoise" baseFrequency="0.006 0.09" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G" result="d"/>

  '<rect class="l1" x="14.5" y="72" width="4.4" height="17" rx="1.6" fill="#04060b"/>'+
  '<rect class="l2" x="21.5" y="72" width="4.4" height="17" rx="1.6" fill="#04060b"/></g></svg>';
}
WALKERS.forEach(function(w,i){
  var d=document.createElement("div");d.className="walker"+(w.rev?" rev":"");
  d.style.cssText="--u:"+w.c+";--h:"+w.h+";--dur:"+w.dur+"s;--dl:"+w.dl+"s;top:calc("+(w.y*100)+"% - "+w.h+" * var(--vu))";
  d.innerHTML=walkerSVG("top")+walkerSVG("refl");
  fg.appendChild(d);
});

/* ---------- neon state ---------- */
var live=$("#live");
function setSign(id,on,ign){
  $$('[data-sign="'+id+'"]').forEach(function(el){
    el.classList.toggle("off",!on);
    if(el.tagName==="BUTTON"&&!el.disabled)el.setAttribute("aria-pressed",on?"true":"false");
    if(on&&ign){el.classList.remove("ignite");void el.offsetWidth;el.classList.add("ignite");setTimeout(function(){el.classList.remove("ignite")},1000)}
  });
  if(id==="title"){var t=$("#title");t.classList.toggle("off",!on);if(on&&ign){t.classList.remove("ignite");void t.offsetWidth;t.classList.add("ignite");setTimeout(function(){t.classList.remove("ignite")},1000)}}
}
var signState={};
function isOn(id){return signState[id]!==false}
$$("#stage .sg").forEach(function(b){
  b.addEventListener("click",function(){
    var id=b.getAttribute("data-sign"),on=!isOn(id);signState[id]=on;
    setSign(id,on,true);zap(on);
    live.textContent=b.getAttribute("aria-label").split(" neon")[0]+(on?" on":" off");
  });
});
var busy=false;
function lightsOut(){
  if(busy)return;busy=true;
  var btn=$("#lo");btn.disabled=true;btn.textContent="Blackout";
  var ids=[];$$("#stage .sg").forEach(function(b){ids.push(b.getAttribute("data-sign"))});
  var all=ids.concat(["lan","ads","title"]);
  all.forEach(function(id,i){setTimeout(function(){signState[id]=false;setSign(id,false);thunk()},i*70)});
  var t0=all.length*70+2300;
  var order=["lan","title"].concat(ids,["ads"]);
  order.forEach(function(id,i){setTimeout(function(){signState[id]=true;setSign(id,true,true);zap(true)},t0+i*330)});
  setTimeout(function(){busy=false;btn.disabled=false;btn.textContent="Lights out"},t0+order.length*330+900);
}
$("#lo").addEventListener("click",lightsOut);

/* ---------- camera + torch ---------- */
var scene=$("#scene"),cam={x:0,y:0,tx:0,ty:0},lastMove=-1e9,mouse={x:.5,y:.4};
function onMove(e){
  var W=window.innerWidth,H=window.innerHeight;
  cam.tx=(e.clientX/W-.5)*2;cam.ty=(e.clientY/H-.5)*2;
  mouse.x=e.clientX/W;mouse.y=e.clientY/H;lastMove=performance.now();
  scene.style.setProperty("--mx",(mouse.x*100)+"%");scene.style.setProperty("--my",(mouse.y*100)+"%");
}
window.addEventListener("pointermove",onMove,{passive:true});
window.addEventListener("pointerdown",onMove,{passive:true});

/* ---------- FX canvas: rain, splashes, steam ---------- */
var cv=$("#fx"),ctx=cv.getContext("2d"),W=0,H=0,dpr=1,HZ=0;
var MAXN=700,DX=[],DY=[],DV=[],DL=[],DG=[];
var level=.62,rings=[],RN=110,ri=0,sprites=[];
function mkSprite(col){var c=document.createElement("canvas");c.width=c.height=64;var g=c.getContext("2d"),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,"rgba("+col+",.42)");r.addColorStop(.5,"rgba("+col+",.1)");r.addColorStop(1,"rgba("+col+",0)");g.fillStyle=r;g.fillRect(0,0,64,64);return c}
sprites=[mkSprite("205,225,235"),mkSprite("120,225,220"),mkSprite("255,190,140"),mkSprite("255,120,190")];
var bucketDef=[{len:[26,44],v:[1150,1450],lw:1.7,a:.34,rg:[.86,1]},{len:[14,24],v:[800,1000],lw:1.1,a:.26,rg:[.4,.86]},{len:[8,14],v:[540,700],lw:.8,a:.18,rg:[0,.4]}];
function rnd(a,b){return a+Math.random()*(b-a)}
function spawnDrop(i,init){
  var b=bucketDef[i%3];
  DL[i]=rnd(b.len[0],b.len[1]);DV[i]=rnd(b.v[0],b.v[1]);
  DX[i]=rnd(-.15*W,1.1*W);
  DG[i]=HZ+3+(H-HZ)*rnd(b.rg[0],b.rg[1]);
  DY[i]=init?rnd(-H*.2,DG[i]):-DL[i]-rnd(0,H*.25);
}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  HZ=$("#stage").getBoundingClientRect().height;
  MAXN=Math.max(150,Math.min(760,Math.round(W*H/2100)));
  for(var i=0;i<MAXN;i++)spawnDrop(i,true);
  drawAllSky();placeVents();
}
var vents=[];
function placeVents(){
  var aPx=Math.min(.45*H,.4*W),P=.7*H;
  var defs=[["l",34,20,1],["r",58,26,2],["l",96,30,1],["r",130,34,0],["l",180,44,3],["r",240,50,1],["l",130,30,2]];
  vents=defs.map(function(d){return{side:d[0]==="l"?-1:1,d:d[1],r:d[2],c:d[3],pool:[],acc:0}});
  vents.aPx=aPx;vents.P=P;
  var st=$("#stall").getBoundingClientRect();
  vents.stall={x:st.left+st.width*.69,y:st.top+st.height*.74,r:st.width*.16,c:2,pool:[],acc:0,fixed:true};
  vents.push(vents.stall);
}
var steamMax=60;
function emit(v,x,y,sc){
  var p=v.pool;
  if(p.length>=steamMax)return;
  p.push({x:x+rnd(-4,4)*sc,y:y,vx:rnd(-6,6)*sc-14*sc,vy:-rnd(14,34)*sc,age:0,life:rnd(2.2,4.2),r:rnd(.7,1.1)*v.r*sc,rot:0});
}
function drawSteam(dt){
  var ox=W*(.5+.06*cam.x),k;
  ctx.globalCompositeOperation="lighter";
  for(var i=0;i<vents.length;i++){
    var v=vents[i],x,y,sc;
    if(v.fixed){x=v.x;y=v.y;sc=1}
    else{k=vents.P/(vents.P+v.d);x=ox+(W/2+v.side*vents.aPx-ox)*k;y=HZ-3*k;sc=Math.max(.3,k)*.8}
    v.acc+=dt*(v.fixed?8:5);
    while(v.acc>=1){v.acc-=1;emit(v,x,y,v.fixed?1:sc)}
    var sp=sprites[v.c];
    for(var j=v.pool.length-1;j>=0;j--){
      var p=v.pool[j];p.age+=dt;
      if(p.age>=p.life){v.pool.splice(j,1);continue}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.995;
      var t=p.age/p.life,rr=p.r*(1.2+t*2.6)*(v.fixed?1:1);
      ctx.globalAlpha=Math.sin(Math.min(1,t*1.4)*Math.PI*.5)*(1-t)*(v.fixed?.5:.4);
      ctx.drawImage(sp,p.x-rr,p.y-rr,rr*2,rr*2);
    }
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}
function spawnRing(x,y,b){
  var r=rings[ri%RN]||(rings[ri%RN]={});ri++;
  r.x=x;r.y=y;r.age=0;r.life=rnd(.5,.9);r.max=b===0?rnd(16,30):b===1?rnd(9,16):rnd(4,8);r.on=true;r.a=b===0?.5:b===1?.36:.24;
}
function drawRain(dt){
  var n=Math.floor(MAXN*Math.pow(level,1.15)*(reduce?.55:1));
  var slant=.2;
  for(var b=0;b<3;b++){
    var def=bucketDef[b];
    ctx.beginPath();
    for(var i=b;i<n;i+=3){
      var y=DY[i]+DV[i]*dt,x=DX[i]-DV[i]*dt*slant;
      if(y>=DG[i]){
        if(Math.random()<.42)spawnRing(x,DG[i],b);
        spawnDrop(i,false);y=DY[i];x=DX[i];
      }
      DY[i]=y;DX[i]=x;
      ctx.moveTo(x,y);ctx.lineTo(x+DL[i]*slant,y-DL[i]);
    }
    ctx.strokeStyle="rgba(190,232,245,"+def.a+")";ctx.lineWidth=def.lw;ctx.stroke();
  }
  ctx.lineWidth=1;
  for(var j=0;j<RN;j++){
    var r=rings[j];if(!r||!r.on)continue;
    r.age+=dt;if(r.age>=r.life){r.on=false;continue}
    var t=r.age/r.life,rad=r.max*(.25+t*.9);
    ctx.strokeStyle="rgba(210,238,248,"+(r.a*(1-t))+")";
    ctx.beginPath();ctx.ellipse(r.x,r.y,rad,rad*.26,0,0,6.2832);ctx.stroke();
  }
}
var last=0,running=true,acc=0;
function frame(t){
  if(!running)return;
  var dt=Math.min(.05,(t-last)/1000||.016);last=t;
  if(t-lastMove>3500&&!reduce){cam.tx=Math.sin(t/5200)*.38;cam.ty=Math.cos(t/7300)*.2}
  var k=1-Math.exp(-dt*3.2),nx=cam.x+(cam.tx-cam.x)*k,ny=cam.y+(cam.ty-cam.y)*k;
  if(Math.abs(nx-cam.x)>.0005||Math.abs(ny-cam.y)>.0005){cam.x=nx;cam.y=ny;scene.style.setProperty("--cx",cam.x.toFixed(4));scene.style.setProperty("--cy",cam.y.toFixed(4))}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  drawSteam(dt);drawRain(dt);
  if(!reduce){acc+=dt;if(acc>.16){acc=0;rippleTick(t)}}
  requestAnimationFrame(frame);
}
var rt=$("#rt");
function rippleTick(t){if(rt)rt.setAttribute("baseFrequency",(0.006+Math.sin(t/2600)*.0012).toFixed(5)+" "+(0.09+Math.sin(t/1700)*.012).toFixed(4))}
document.addEventListener("visibilitychange",function(){
  document.body.classList.toggle("hid",document.hidden);
  if(document.hidden){running=false}else if(!running){running=true;last=performance.now();requestAnimationFrame(frame)}
});
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(resize,120)});

/* ---------- controls ---------- */
var rain=$("#rain");
function setLevel(){
  level=rain.value/100;$("#rainv").textContent=rain.value;
  $("#rr").textContent=Math.round(level*level*62)+" mm/h";
  $("#rh").textContent=Math.round(70+level*28)+"%";
  if(A.on)A.applyRain();
}
rain.addEventListener("input",setLevel);
function clock(){var d=new Date(),m=(d.getMinutes()+12)%60;$("#clk").textContent="03:"+(m<10?"0":"")+m}
clock();setInterval(clock,20000);

/* lightning */
function lightning(){
  var f=$("#flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
  setTimeout(thunder,600+Math.random()*1400);
  setTimeout(lightning,26000+Math.random()*30000);
}
if(!reduce)setTimeout(lightning,14000);

/* ---------- audio (opt-in) ---------- */
var A={on:false,ctx:null};
function initAudio(){
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  var c=new AC();A.ctx=c;
  A.master=c.createGain();A.master.gain.value=0;A.master.connect(c.destination);
  var len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  A.noise=buf;
  var s=c.createBufferSource();s.buffer=buf;s.loop=true;
  var hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=1200;
  var lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=7500;
  A.rg=c.createGain();s.connect(hp);hp.connect(lp);lp.connect(A.rg);A.rg.connect(A.master);s.start();
  var s2=c.createBufferSource();s2.buffer=buf;s2.loop=true;s2.playbackRate.value=.6;
  var bp=c.createBiquadFilter();bp.type="lowpass";bp.frequency.value=380;
  A.rg2=c.createGain();s2.connect(bp);bp.connect(A.rg2);A.rg2.connect(A.master);s2.start();
  var o1=c.createOscillator(),o2=c.createOscillator(),hg=c.createGain();
  o1.type="sine";o1.frequency.value=50;o2.type="triangle";o2.frequency.value=100.4;hg.gain.value=.05;
  o1.connect(hg);o2.connect(hg);hg.connect(A.master);o1.start();o2.start();
  A.applyRain=function(){var l=level;A.rg.gain.setTargetAtTime(.02+l*.34,c.currentTime,.1);A.rg2.gain.setTargetAtTime(.05+l*.4,c.currentTime,.1)};
  return true;
}
function tone(f,dur,type,vol,slide){
  if(!A.on||!A.ctx)return;var c=A.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
  o.type=type||"sawtooth";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+.02);
}
function zap(on){tone(on?520:180,.12,"square",.03,on?90:60)}
function thunk(){tone(90,.16,"triangle",.06,40)}
function thunder(){
  if(!A.on||!A.ctx)return;var c=A.ctx,s=c.createBufferSource();s.buffer=A.noise;
  var f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=180;var g=c.createGain(),t=c.currentTime;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.7,t+.4);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
  s.connect(f);f.connect(g);g.connect(A.master);s.start(t);s.stop(t+3.3);
}
function buzzLoop(){
  if(A.on){var n=1+Math.floor(Math.random()*3);for(var i=0;i<n;i++)setTimeout(function(){tone(118,.05,"sawtooth",.035)},i*70)}
  setTimeout(buzzLoop,1800+Math.random()*4200);
}
buzzLoop();
$("#snd").addEventListener("click",function(){
  var b=this;
  try{
    if(!A.ctx&&!initAudio())return;
    A.on=!A.on;
    if(A.ctx.state==="suspended")A.ctx.resume();
    A.master.gain.setTargetAtTime(A.on?.24:0,A.ctx.currentTime,.15);
    if(A.on)A.applyRain();
    b.textContent=A.on?"Sound on":"Sound off";b.setAttribute("aria-pressed",A.on?"true":"false");
  }catch(e){console.warn("audio unavailable",e)}
});

setLevel();
resize();
requestAnimationFrame(function(t){last=t;frame(t)});
})();
</script>
</body>
