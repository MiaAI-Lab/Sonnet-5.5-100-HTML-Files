<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide · a glass that loads</title>
<meta name="theme-color" content="#cdeeeb">
<style>
/* ================= tokens ================= */
:root{
  --aqua-1:#dff5f2; --aqua-2:#bfe9e7; --turq:#2ec4b6; --teal:#1a9aa5; --deep:#0c4550; --ink:#0c4550;
  --lemon:#ffe066; --coral:#ff7f6b; --white:#ffffff;
  --serif:"Rockwell","Bookman Old Style","URW Bookman","ITC Bookman",Bookman,"DejaVu Serif",Georgia,serif;
  --round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Varela Round",system-ui,sans-serif;
  --hz:62%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:#cdeeeb;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow:hidden;background:linear-gradient(180deg,var(--aqua-1) 0%,var(--aqua-2) 100%);color:var(--ink);font-family:var(--round);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--coral);outline-offset:4px;border-radius:10px}

/* ================= backdrop: wall, table, caustics ================= */
.scene{position:fixed;inset:0;overflow:hidden}
.wall{position:absolute;inset:0;background:
  radial-gradient(60% 45% at 18% 8%,rgba(255,255,255,.55),transparent 65%),
  radial-gradient(50% 40% at 88% 14%,rgba(255,255,255,.35),transparent 70%),
  linear-gradient(180deg,var(--aqua-1) 0%,var(--aqua-2) 100%)}
.table{position:absolute;left:0;right:0;top:var(--hz);bottom:0;
  background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 45%,rgba(20,120,130,.10) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 14px 30px -14px rgba(20,110,120,.22)}
.caustic{position:absolute;left:0;bottom:0;width:100%;height:calc(100% - var(--hz));display:block;opacity:.95}
.pool{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(46,196,182,.5),rgba(46,196,182,.16) 46%,rgba(46,196,182,0) 70%);opacity:0}
.tap{position:absolute;top:0;left:50%;width:44px;height:60px;margin-left:-22px;pointer-events:none;animation:tapin 1.2s .3s cubic-bezier(.2,.8,.2,1) backwards}
.tap .pipe{position:absolute;left:9px;right:9px;top:-4px;bottom:14px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#a5d6d8,#fff 32%,#e3f6f5 58%,#86c3c7);box-shadow:0 0 0 1px rgba(95,179,184,.25),0 10px 22px -8px rgba(20,110,120,.4)}
.tap .nozzle{position:absolute;left:0;right:0;bottom:0;height:18px;border-radius:5px 5px 11px 11px;background:linear-gradient(90deg,#9fd1d4,#fff 36%,#d0ecec 60%,#72b4b9);box-shadow:0 0 0 1px rgba(95,179,184,.3),0 9px 12px -6px rgba(20,110,120,.45),inset 0 -3px 4px rgba(20,110,120,.18)}
.tap .nozzle::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:4px;border-radius:3px;background:rgba(20,110,120,.32)}

/* ================= chrome ================= */
.bar{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:clamp(12px,2.4vh,22px) clamp(16px,3vw,36px);pointer-events:none}
.brand{display:flex;align-items:baseline;gap:12px}
.mark{font:italic 900 clamp(24px,3vw,34px)/1 var(--serif);letter-spacing:-.02em;color:var(--ink)}
.tag{font:600 clamp(10px,1vw,12px)/1 var(--round);letter-spacing:.22em;text-transform:uppercase;color:rgba(12,69,80,.6)}
.snd{pointer-events:auto;position:relative;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 6px 18px rgba(20,110,120,.16),inset 0 0 0 1px rgba(255,255,255,.9);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),background-color .3s}
.snd:hover{transform:scale(1.06);background:rgba(255,255,255,.85)}
.snd svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .wv{transition:opacity .25s}
.snd[aria-pressed="false"] .wv{opacity:0}
.snd[aria-pressed="false"]::after{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:var(--coral);transform:rotate(-38deg)}

/* ================= stage ================= */
.stage{position:relative;z-index:3;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:clamp(54px,8vh,78px) 16px clamp(14px,3vh,28px)}
.glasswrap{flex:1 1 auto;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-end;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
.glasswrap svg{height:100%;width:auto;max-width:100%;aspect-ratio:500/860;overflow:visible;touch-action:manipulation;cursor:pointer}
.copy{flex:none;text-align:center;min-height:clamp(112px,16vh,148px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:clamp(8px,1.6vh,16px)}
.msg{font:700 clamp(19px,2.3vw,26px)/1.2 var(--round);letter-spacing:.01em;color:var(--ink);transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
.msg.swap{opacity:0;transform:translateY(6px)}
.sub{margin-top:6px;font:600 clamp(11px,1.1vw,13px)/1.4 var(--round);letter-spacing:.14em;text-transform:uppercase;color:rgba(12,69,80,.62);font-variant-numeric:tabular-nums}
.again{margin-top:14px;min-height:50px;padding:0 30px;border-radius:999px;background:var(--coral);color:#fff;font:800 15px/1 var(--round);letter-spacing:.06em;box-shadow:0 12px 26px -8px rgba(255,127,107,.7),inset 0 -3px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.35);animation:pop .7s cubic-bezier(.3,1.6,.4,1) both, bob 2.6s 1s ease-in-out infinite;transition:transform .25s}
.again[hidden]{display:none}
.again:hover{transform:translateY(-2px) scale(1.04)}
.again:active{transform:scale(.97)}
.foot{position:fixed;z-index:4;left:0;right:0;bottom:6px;text-align:center;font:600 10px/1 var(--round);letter-spacing:.2em;text-transform:uppercase;color:rgba(12,69,80,.4);pointer-events:none}

/* ================= svg bits ================= */
.tx{font-family:var(--serif);font-weight:900;text-anchor:middle;letter-spacing:-.02em}

/* ================= motion ================= */
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes tapin{from{transform:translateY(-70px)}to{transform:none}}

@media (max-width:520px){
  .tag{display:none}
  .foot{display:none}
}
@media (max-height:620px){
  .foot{display:none}
}
@media (prefers-reduced-motion:reduce){
  .glasswrap,.again,.tap{animation:none}
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="wall"></div>
  <div class="table"></div>
  <div class="pool" id="pool"></div>
  <canvas class="caustic" id="caustic"></canvas>
  <div class="tap" id="tap"><i class="pipe"></i><i class="nozzle"></i></div>
</div>

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6L12 18.5v-13L7.6 9.5z"/><path class="wv" d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path class="wv" d="M18 6.8a7.6 7.6 0 0 1 0 10.4"/></svg>
  </button>
</header>

<main class="stage">
  <div class="glasswrap" id="pb" role="progressbar" aria-label="Filling the glass" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 percent">
    <svg id="scene" viewBox="150 0 500 860" aria-hidden="true" focusable="false">
      <defs>

        <clipPath id="clipWater"><path id="pWaterClip" d="M0 0"/></clipPath>

        <linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fa3ad"/><stop offset="1" stop-color="#127884"/></linearGradient>
        <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd8cb" stop-opacity=".82"/><stop offset="1" stop-color="#2ec4b6" stop-opacity=".72"/></linearGradient>
        <linearGradient id="gWall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".78"/><stop offset=".18" stop-color="#fff" stop-opacity=".22"/><stop offset=".82" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".62"/></linearGradient>
        <linearGradient id="gBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".5" stop-color="#d7f4f1" stop-opacity=".55"/><stop offset="1" stop-color="#8fd6d6" stop-opacity=".55"/></linearGradient>
        <linearGradient id="gSpec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".12" stop-color="#fff" stop-opacity=".95"/><stop offset=".85" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="gShaft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="gStream" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fe9df"/><stop offset=".5" stop-color="#e9fffc"/><stop offset="1" stop-color="#5fd6ca"/></linearGradient>
        <radialGradient id="gBub" cx=".36" cy=".34" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="#fff" stop-opacity=".18"/><stop offset=".8" stop-color="#c9fff8" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/></radialGradient>
        <radialGradient id="gDrop" cx=".38" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".3" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#7fc7cc" stop-opacity=".3"/></radialGradient>
        <radialGradient id="gShadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0d6a75" stop-opacity=".42"/><stop offset=".6" stop-color="#0d6a75" stop-opacity=".14"/><stop offset="1" stop-color="#0d6a75" stop-opacity="0"/></radialGradient>

        <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-34)"><rect width="13" height="26" fill="#ff7f6b"/><rect x="13" width="13" height="26" fill="#fff7f0"/></pattern>
      </defs>

      <!-- contact shadow and soft light pool under the base -->

      <ellipse cx="470" cy="826" rx="130" ry="16" fill="url(#gGlow)" opacity=".7"/>

      <!-- glass: back of rim, faint interior tint -->
      <path d="M220 118L264 760Q266 766 274 766L526 766Q534 766 536 760L580 118A180 13.500 0 0 0 220 118Z" fill="#fff" opacity=".12"/>
      <path d="M208 118A192 17 0 0 1 592 118" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
      <path d="M220 118A180 13.500 0 0 1 580 118" fill="none" stroke="#8ccdd0" stroke-opacity=".5" stroke-width="1.500"/>

      <!-- straw, above the waterline -->
      <g clip-path="url(#clipAir)">
        <g transform="translate(300 766) rotate(14)">
          <rect x="-8" y="-770" width="16" height="770" rx="4" fill="url(#stripes)"/>
          <rect x="-5" y="-770" width="3.500" height="770" fill="#fff" opacity=".38"/>
          <rect x="3" y="-770" width="3" height="770" fill="#a3382a" opacity=".16"/>
          <ellipse cy="-770" rx="8" ry="3.200" fill="#ffd9d1"/>
        </g>
      </g>

      <!-- interior: water, straw below, bubbles, lemon -->
      <g clip-path="url(#clipIn)">
        <path id="pBack" d="M0 0" fill="url(#gBack)"/>
        <g clip-path="url(#clipWater)">
          <g transform="translate(-9 0)" opacity=".9">
            <g transform="translate(300 766) rotate(14)"><rect x="-8" y="-770" width="16" height="770" rx="4" fill="url(#stripes)"/><rect x="-5" y="-770" width="3.500" height="770" fill="#fff" opacity=".3"/></g>
          </g>
          <rect id="shA" x="270" y="150" width="46" height="640" fill="url(#gShaft)" transform="skewX(-10)"/>
          <rect id="shB" x="380" y="150" width="30" height="640" fill="url(#gShaft)" transform="skewX(-10)"/>
          <rect id="shC" x="470" y="150" width="54" height="640" fill="url(#gShaft)" transform="skewX(-10)"/>
          <ellipse cx="400" cy="770" rx="150" ry="34" fill="url(#gGlow)" opacity=".55"/>
          <g id="bubbles"></g>
        </g>
        <g id="lemon" opacity="0">
          <ellipse rx="64" ry="19" fill="#f2c02f"/>
          <ellipse rx="60" ry="16.800" fill="#fff4b8"/>
          <g id="lemonSeg" transform="scale(54 14)">
            <g fill="#ffe066" stroke="#fff7c9" stroke-width=".05">
              <path d="M0 0L.9969 .0785A1 1 0 0 1 .7604 .6494Z"/><path d="M0 0L.6494 .7604A1 1 0 0 1 .0785 .9969Z"/>
              <path d="M0 0L-.0785 .9969A1 1 0 0 1 -.6494 .7604Z"/><path d="M0 0L-.7604 .6494A1 1 0 0 1 -.9969 .0785Z"/>
              <path d="M0 0L-.9969 -.0785A1 1 0 0 1 -.7604 -.6494Z"/><path d="M0 0L-.6494 -.7604A1 1 0 0 1 -.0785 -.9969Z"/>
              <path d="M0 0L.0785 -.9969A1 1 0 0 1 .6494 -.7604Z"/><path d="M0 0L.7604 -.6494A1 1 0 0 1 .9969 -.0785Z"/>
            </g>
            <g fill="#fff8d6" opacity=".7"><circle cx=".55" cy=".2" r=".07"/><circle cx="-.3" cy=".55" r=".06"/><circle cx="-.5" cy="-.3" r=".07"/><circle cx=".2" cy="-.55" r=".06"/></g>
          </g>
          <ellipse rx="5" ry="1.600" fill="#fff9dc"/>
          <path d="M-52 -3Q-20 -12 20 -12" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
        </g>
        <path id="pFront" d="M0 0" fill="url(#gFront)"/>
        <path id="pFoam" d="M0 0" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="pops"></g>
      </g>
      <g id="stream" clip-path="url(#clipStream)"><path id="pStream" d="M0 0" fill="none" stroke="url(#gStream)" stroke-width="8" stroke-linecap="round" opacity="0"/><g id="splash"></g><g id="drips"></g></g>

      <!-- the numerals, drawn twice: ink above the waterline, white below -->

      <text id="tLight" class="tx" x="400" y="470" font-size="150" fill="#f4fffd" clip-path="url(#clipWater)"><tspan id="lNum">0</tspan><tspan id="lPct" font-size=".42em" dx=".04em">%</tspan></text>

      <!-- glass front: thick walls, base, rim, highlights, droplets -->
      <path fill-rule="evenodd" fill="url(#gWall)" d="M208 118L250 800Q252 812 270 812L530 812Q548 812 550 800L592 118ZM220 118L264 760Q266 766 274 766L526 766Q534 766 536 760L580 118Z"/>
      <path d="M262 776Q400 793 538 776L538 800Q400 816 262 800Z" fill="url(#gBase)" opacity=".8"/>
      <path d="M264 766L536 766" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>
      <path d="M250 800Q252 812 270 812L530 812Q548 812 550 800" fill="none" stroke="#5fb5b9" stroke-opacity=".45" stroke-width="1.500"/>

      <path d="M208 118L250 800Q252 812 270 812L530 812Q548 812 550 800L592 118" stroke="#5fb3b8" stroke-opacity=".38" stroke-width="1.300" fill="none"/>
      <path d="M208 118L250 800M592 118L550 800" stroke="#fff" stroke-opacity=".75" stroke-width="1.600" fill="none"/>
      <path d="M220 118L264 760M580 118L536 760" stroke="#7fc3c8" stroke-opacity=".35" stroke-width="1.200" fill="none"/>
      <path d="M208 118A192 17 0 0 0 592 118" fill="none" stroke="#fff" stroke-width="3.500" stroke-opacity=".9"/>
      <path d="M220 118A180 13.500 0 0 0 580 118" fill="none" stroke="#7fc3c8" stroke-width="1.500" stroke-opacity=".55"/>
      <path d="M232 168L268 700" stroke="url(#gSpec)" stroke-width="15" stroke-linecap="round" fill="none" opacity=".85"/>

        <circle cx="552" cy="640" r="4.600" fill="url(#gDrop)"/><circle cx="560" cy="540" r="3.200" fill="url(#gDrop)"/><circle cx="548" cy="452" r="3.800" fill="url(#gDrop)"/>
        <circle cx="566" cy="340" r="2.600" fill="url(#gDrop)"/><circle cx="556" cy="255" r="4" fill="url(#gDrop)"/><circle cx="534" cy="712" r="3" fill="url(#gDrop)"/>
        <circle cx="516" cy="556" r="2.400" fill="url(#gDrop)"/><circle cx="290" cy="520" r="2.200" fill="url(#gDrop)"/>

  <div class="copy">
    <p class="msg" id="msg" role="status">Warming up the tap&hellip;</p>
    <p class="sub" id="sub">0.0 / 96.0 MB</p>
    <button class="again" id="again" type="button" hidden>Pour again</button>
  </div>
</main>
<p class="foot">Illustrative loader &middot; no real download is happening</p>

<script>
(() => {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const TAU = Math.PI * 2;
const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
let RM = !!(mq && mq.matches);
if (mq) { const f = e => { RM = e.matches; }; if (mq.addEventListener) mq.addEventListener('change', f); else if (mq.addListener) mq.addListener(f); }

/* ---------------------------------------------------------------- geometry (mirrors the SVG) */
const CX = 400, RIM_Y = 118, FLOOR = 766, TOPMAX = 158, TABLE_TOTAL = 96;
const wl = y => 220 + (y - RIM_Y) * 0.0679, wr = y => 580 - (y - RIM_Y) * 0.0679;
const X0 = 130, X1 = 670, NP = 46, DX = (X1 - X0) / (NP - 1);

const svg = $('#scene'), pb = $('#pb');
const pBack = $('#pBack'), pFront = $('#pFront'), pFoam = $('#pFoam'), pWaterClip = $('#pWaterClip'), pAirClip = $('#pAirClip');
const gBubbles = $('#bubbles'), gPops = $('#pops'), gSplash = $('#splash'), pStream = $('#pStream');
const lemon = $('#lemon'), lemonSeg = $('#lemonSeg');
const tDark = $('#tDark'), tLight = $('#tLight'), dNum = $('#dNum'), lNum = $('#lNum'), dPct = $('#dPct'), lPct = $('#lPct');

  soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', String(soundOn));
  sndBtn.setAttribute('aria-label', soundOn ? 'Sound on. Turn off the glass clink.' : 'Sound off. Turn on the glass clink.');
  if (soundOn) { audio(); clink(0, 1.06, 0.6); }
});

/* ---------------------------------------------------------------- input: pointer tilt, device tilt, poke, keys */
window.addEventListener('pointermove', e => {
  const nx = (e.clientX / vw - 0.5) * 2; ptrTilt = clamp(nx, -1, 1) * 0.11;
  const now = performance.now();
  if (lastPX !== null && !RM) { const dtp = Math.max(8, now - lastPT) / 1000, vx = (e.clientX - lastPX) / dtp; tv += clamp(vx, -1600, 1600) * 0.00042; }
  lastPX = e.clientX; lastPT = now;
}, { passive: true });
document.documentElement.addEventListener('mouseleave', () => { ptrTilt = 0; });
let devAsked = false;
function devOri(e) { if (typeof e.gamma === 'number') devTilt = clamp(e.gamma / 42, -1, 1) * 0.13; }
try { window.addEventListener('deviceorientation', devOri, { passive: true }); } catch (err) { /* optional */ }
window.addEventListener('pointerdown', () => {
  if (devAsked) return; devAsked = true;
  try { if (window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === 'function') window.DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (err) { /* ignore */ }
}, { passive: true });
svg.addEventListener('pointerdown', e => {
  const r = svg.getBoundingClientRect(), side = (e.clientX - r.left) / r.width - 0.5;
  tv += -side * 2.2 + (Math.random() - 0.5) * 0.6; clink(0, 1 + (Math.random() - 0.5) * 0.12, 0.5);
});
function restart() {
  if (draining) return;
  draining = true; againBtn.hidden = true; done = false; tv += 1.2;
}
againBtn.addEventListener('click', restart);
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'r' && (done || draining)) restart(); else if (k === 'm') sndBtn.click();
});

/* ---------------------------------------------------------------- main loop */
let last = performance.now();
function finish() {
  done = true; doneT = timeS; shown = 100; rate = 0; spinV = 15; sparkT = -0.35; tv += -1.4;
  setTimeout(() => { if (done) { againBtn.hidden = false; } }, 1300);
  clink(0.05, 1, 1); clink(0.22, 1.19, 0.85);
}
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  const rdt = clamp((now - last) / 1000, 0.001, 0.4), dt = Math.min(rdt, 0.05); last = now; timeS += dt;
  // progress follows wall-clock time so a slow device still finishes on schedule
  if (draining) {
    prevShown = shown; shown = Math.max(0, shown - rdt * (34 + shown * 1.4)); rate = -(prevShown - shown) / rdt * 0.2;
    if (shown <= 0.05) { shown = 0; draining = false; plan = randomPlan(); clock = -0.7; rate = 0; stateKey = ''; lemonOn = 0; }
  } else if (!done) {
    clock += rdt;
    const target = at(plan, clock);
    prevShown = shown; shown += (target - shown) * (1 - Math.exp(-rdt * 5.5)); if (target >= 99.99 && shown > 99.6) shown = 100;
    const r = (shown - prevShown) / rdt; rate += (r - rate) * (1 - Math.exp(-rdt * 6));
    if (shown >= 99.999 && clock >= plan.end) finish();
  }
  // slosh spring (tilt) — driven by pointer / device tilt and by how fast the glass is filling
  tiltTarget = clamp(ptrTilt * (RM ? 0.3 : 1) + devTilt * 0.9 + clamp(rate, 0, 30) * 0.0042 * (done ? 0 : 1), -0.2, 0.2);
  for (let s = 0; s < 3; s++) { const h = dt / 3; tv += (-(RM ? 60 : 34) * (tilt - tiltTarget) - (RM ? 6.5 : 2.3) * tv) * h; tilt += tv * h; }
  buildWater(timeS, dt);
  updateShafts(timeS);
  updateBubbles(dt, timeS);
  updateStream(dt, timeS);
  updateLemon(dt, timeS);
  updateText(dt);
  updateSparkle(dt);
  updateCopy(dt);
  // a11y value (throttled by change)
  const iv = String(Math.floor(shown)); if (pb.getAttribute('aria-valuenow') !== iv) { pb.setAttribute('aria-valuenow', iv); pb.setAttribute('aria-valuetext', iv + ' percent'); }
  // caustics + light pool
  const lv = clamp(shown / 100, 0, 1);
  pool.style.opacity = (0.15 + 0.85 * lv).toFixed(2);
  if (now - lastCaus > (RM ? 260 : 85)) { lastCaus = now; drawCaustics(timeS); }
}

/* ---------------------------------------------------------------- boot */
layout();
if ('ResizeObserver' in window) new ResizeObserver(layout).observe(svg); else window.addEventListener('resize', layout);
window.addEventListener('resize', layout);
pb.addEventListener('animationend', layout);
setTimeout(layout, 1400);
buildWater(0, 0.016); updateText(0.016);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
