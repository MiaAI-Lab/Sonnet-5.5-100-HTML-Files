<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosace · a generative rose window</title>
<meta name="description" content="Rosace: a generative gothic rose window of hand-cut jewel-coloured panes and lead came, lit by a slow sun that throws coloured light across the nave floor.">
<style>
:root {
  --soot: #16161a; --lead: #1a1a1f;
  --ruby: #a4161a; --sapphire: #1e3a8a; --emerald: #0f766e; --amber: #d97706; --amethyst: #6d28d9; --ivory: #f3e7c9;
  --ink: #efe6cf; --ink2: rgba(239,230,207,.66); --gold: #e9c46a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Bookman", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0b0e; color: var(--ink); }
body { overflow: hidden; font-family: var(--serif); -webkit-text-size-adjust: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.stage { position: fixed; inset: 0; height: 100vh; height: 100dvh; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; background: #0b0b0e; }
#cv.grabbing { cursor: grabbing; }
#cv.pane { cursor: pointer; }
#cv:focus-visible { box-shadow: inset 0 0 0 2px rgba(233,196,106,.7); }

/* ---- captions ---- */
.cap { position: absolute; left: clamp(16px, 3vw, 38px); top: clamp(14px, 2.6vh, 30px); pointer-events: none; text-shadow: 0 1px 12px #000; }
.cap h1 { margin: 0; font-weight: 400; font-size: clamp(13px, 1.5vw, 16px); letter-spacing: .34em; font-variant-caps: all-small-caps; text-transform: lowercase; color: var(--ink); }
.cap h1 b { font-weight: 700; letter-spacing: .5em; margin-right: .2em; }
.cap .name { margin: 8px 0 0; font-size: clamp(13px, 1.4vw, 15px); font-style: italic; color: var(--ink2); letter-spacing: .02em; transition: opacity .5s; }
.cap .meta { margin: 3px 0 0; font-size: 11.5px; letter-spacing: .16em; font-variant-caps: all-small-caps; color: var(--ink2); opacity: .8; transition: opacity .5s; }
.tip { position: absolute; right: clamp(16px, 3vw, 38px); top: clamp(14px, 2.6vh, 30px); text-align: right; pointer-events: none; font-size: 12.5px; font-style: italic; letter-spacing: .04em; color: var(--ink2); min-height: 1.4em; text-shadow: 0 1px 10px #000; opacity: 0; transition: opacity .25s; }
.tip.on { opacity: 1; }
.tip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; box-shadow: 0 0 10px currentColor; background: currentColor; }
.hint { position: absolute; left: 0; right: 0; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 74px); text-align: center; pointer-events: none; font-size: 13px; font-style: italic; letter-spacing: .05em; color: var(--ink2); text-shadow: 0 1px 10px #000; transition: opacity 1.2s; }
.hint.gone { opacity: 0; }

/* ---- controls ---- */
.hud { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: max-content; display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 10px 22px;
  padding: 10px 22px; max-width: calc(100% - 20px); border-radius: 26px; background: rgba(10,10,13,.72); border: 1px solid rgba(243,231,201,.14);
  box-shadow: 0 14px 40px -10px #000, inset 0 1px 0 rgba(255,255,255,.05); }
.ctl { display: flex; align-items: center; gap: 12px; }
.lab { font-size: 11px; letter-spacing: .22em; font-variant-caps: all-small-caps; text-transform: lowercase; color: var(--ink2); white-space: nowrap; }
.clock { min-width: 8.2em; font-size: 13px; font-style: italic; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: min(230px, 38vw); height: 28px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, #ff8f6e, #ffd9a0 30%, #fff3d2 50%, #ffc078 72%, #ff6a44); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, #ff8f6e, #ffd9a0 30%, #fff3d2 50%, #ffc078 72%, #ff6a44); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7.5px; border-radius: 50%; border: 0;
  background: radial-gradient(circle at 36% 34%, #fff, #ffe9b0 55%, #e9b24f); box-shadow: 0 0 0 4px rgba(255,222,150,.16), 0 0 14px rgba(255,222,150,.65); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; border: 0; background: radial-gradient(circle at 36% 34%, #fff, #ffe9b0 55%, #e9b24f); box-shadow: 0 0 0 4px rgba(255,222,150,.16), 0 0 14px rgba(255,222,150,.65); }
input[type=range]:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 6px; }
.ribs { display: inline-flex; gap: 2px; margin: 0; padding: 2px; border: 1px solid rgba(243,231,201,.16); border-radius: 999px; }
.ribs label { position: relative; }
.ribs span { display: block; min-width: 34px; height: 30px; line-height: 30px; text-align: center; border-radius: 999px; font-size: 13.5px; color: var(--ink2); cursor: pointer; transition: background .3s, color .3s; font-variant-numeric: tabular-nums; }
.ribs input:checked + span { background: var(--gold); color: #1c1710; font-weight: 700; }
.ribs input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 1px; }
.btn { display: inline-flex; align-items: center; gap: 9px; height: 34px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid rgba(233,196,106,.5); background: rgba(233,196,106,.09); color: var(--ink); font: inherit; font-size: 12px;
  letter-spacing: .2em; font-variant-caps: all-small-caps; text-transform: lowercase; cursor: pointer; transition: background .3s, border-color .3s; }
.btn:hover { background: rgba(233,196,106,.2); border-color: rgba(233,196,106,.9); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn svg { width: 17px; height: 17px; }
.load { position: absolute; left: 0; right: 0; top: 42%; text-align: center; font-size: 13px; letter-spacing: .4em; font-variant-caps: all-small-caps; color: var(--ink2); opacity: 0; transition: opacity .4s; pointer-events: none; }
.load.on { opacity: 1; }

@media (max-width: 720px) {
  .hud { gap: 8px 14px; padding: 10px 14px; border-radius: 22px; }
  .hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 118px); font-size: 12.5px; }
  .clock { min-width: 0; }
  .tip { top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 150px); left: 0; right: 0; text-align: center; }
  input[type=range] { width: min(170px, 44vw); }
}
@media (max-width: 420px) { .cap .meta { display: none; } }
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv" tabindex="0" role="img" aria-label="A gothic rose window of jewel-coloured glass. Drag to turn it, click a pane to shatter it. Arrow keys turn the window, Enter breaks a pane, N makes a new window."></canvas>

  <div class="cap">
    <h1><b>Rosace</b> · Nave, north transept</h1>
    <p class="name" id="wname">Rose of the Sapphire Vigil</p>
    <p class="meta" id="wmeta">Twelve ribs</p>
  </div>
  <p class="tip" id="tip" aria-live="off"></p>
  <p class="hint" id="hint">Drag to turn the window &nbsp;·&nbsp; touch a pane to break it</p>
  <p class="load" id="load">Glazing</p>

  <div class="hud" role="group" aria-label="Window controls">
    <div class="ctl">
      <label class="lab" for="time">Time</label>
      <input type="range" id="time" min="0" max="1000" value="380" aria-describedby="clock">
      <span class="clock" id="clock">Prime · 09:10</span>
    </div>
    <div class="ctl">
      <span class="lab" id="ribsLab">Ribs</span>
      <fieldset class="ribs" aria-labelledby="ribsLab" style="border:0;padding:2px">
        <legend class="sr-only">Number of ribs</legend>
        <label><input class="sr-only" type="radio" name="ribs" value="8"><span>8</span></label>
        <label><input class="sr-only" type="radio" name="ribs" value="10"><span>10</span></label>
        <label><input class="sr-only" type="radio" name="ribs" value="12" checked><span>12</span></label>
        <label><input class="sr-only" type="radio" name="ribs" value="16"><span>16</span></label>
      </fieldset>
    </div>
    <button class="btn" id="renew" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="3"/><path d="M12 2.5v6.5M12 15v6.5M2.5 12H9M15 12h6.5M5.3 5.3l4.6 4.6M14.1 14.1l4.6 4.6M18.7 5.3l-4.6 4.6M9.9 14.1l-4.6 4.6"/></svg>
      New window
    </button>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================================================================
   Utilities
================================================================ */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROMAN = n => { const m = [[40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, c] of m) while (n >= v) { s += c; n -= v; } return s; };

/* value noise (tileable 256x256) */
const NZ = (() => { const t = new Float32Array(65536), r = mulberry(1234); for (let i = 0; i < t.length; i++) t[i] = r(); return t; })();
function samp(x, y) {
  const xf = Math.floor(x), yf = Math.floor(y), tx = x - xf, ty = y - yf, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const x0 = xf & 255, x1 = (xf + 1) & 255, y0 = (yf & 255) << 8, y1 = ((yf + 1) & 255) << 8;
  const a = NZ[y0 + x0], b = NZ[y0 + x1], c = NZ[y1 + x0], d = NZ[y1 + x1];
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}

/* ================================================================
   Jewel palette and colour schemes
================================================================ */
const JEWEL = {
  ruby: [164, 22, 26], sapphire: [30, 58, 138], emerald: [15, 118, 110],
  amber: [217, 119, 6], amethyst: [109, 40, 217], ivory: [243, 231, 201]
};
const JNAMES = ['ruby', 'sapphire', 'emerald', 'amber', 'amethyst', 'ivory'];
const SCHEMES = [
  { name: 'Sapphire Vigil', hub: ['amber', 'ivory', 'ruby'], petal: ['ivory', 'amber'], pg: ['sapphire'], archB: ['ruby', 'sapphire'], archC: ['sapphire', 'ruby'], sp1: ['emerald', 'amethyst'], rndB: ['amber', 'ivory'], rndC: ['ruby', 'sapphire'], sp2: ['amethyst', 'emerald'], rim: ['sapphire', 'ruby', 'ivory', 'sapphire'], alt: ['ivory', 'amber'] },
  { name: 'Green Litany', hub: ['ruby', 'amber', 'ivory'], petal: ['amber', 'ivory'], pg: ['emerald'], archB: ['amber', 'ivory'], archC: ['emerald', 'sapphire'], sp1: ['ruby', 'amethyst'], rndB: ['ivory', 'amber'], rndC: ['amber', 'ruby'], sp2: ['sapphire', 'ruby'], rim: ['emerald', 'amber', 'emerald', 'ivory'], alt: ['ivory', 'amber'] },
  { name: 'Violet Hour', hub: ['ivory', 'sapphire', 'amber'], petal: ['ivory', 'amethyst'], pg: ['sapphire'], archB: ['ivory', 'amber'], archC: ['amethyst', 'sapphire'], sp1: ['ruby', 'emerald'], rndB: ['amber', 'ivory'], rndC: ['ivory', 'ruby'], sp2: ['sapphire', 'amethyst'], rim: ['amethyst', 'sapphire', 'ivory', 'amethyst'], alt: ['ivory', 'ruby'] },
  { name: 'Golden Ember', hub: ['ivory', 'amber', 'ruby'], petal: ['amber', 'ruby'], pg: ['amethyst'], archB: ['ivory', 'ivory'], archC: ['ruby', 'amber'], sp1: ['sapphire', 'emerald'], rndB: ['ivory', 'amber'], rndC: ['sapphire', 'emerald'], sp2: ['ruby', 'amber'], rim: ['ruby', 'amber', 'ivory', 'ruby'], alt: ['ivory', 'sapphire'] }
];

/* ================================================================
   The rose window generator (raster): tracery by implicit geometry,
   hand-cut panes by Voronoi seeds inside each cell, lead came with
   a bevel, glass with streaks, bubbles and pot-metal glow.
   Written as a generator so a new window can be glazed in slices.
================================================================ */
const T_HUB = 0, T_PETAL = 1, T_PGL = 2, T_PGR = 3, T_ARCHB = 4, T_ARCHC = 5, T_SP1L = 6, T_SP1R = 7,
  T_RNDB = 8, T_RNDC = 9, T_SP2L = 10, T_SP2R = 11, T_RIML = 12, T_RIMR = 13, NT = 14;
const AXIS = new Uint8Array(NT); [T_PGL, T_PGR, T_SP1L, T_SP1R, T_SP2L, T_SP2R, T_RIML, T_RIMR].forEach(t => AXIS[t] = 1);
const LS = 192;   // resolution of the light map

function* bakeWindow(N, seed, S, wT, schemeIdx) {
  const rnd = mulberry(seed);
  const scheme = SCHEMES[schemeIdx % SCHEMES.length];
  const AL = TAU / N, HA = AL / 2, TA = Math.tan(HA), sinHA = Math.sin(HA), cosHA = Math.cos(HA), INVAL = 1 / AL;
  /* ---- geometry (unit radius) ---- */
  const rh = .1 + rnd() * .018, rp = .3, rc = .612, ro = .878;
  const ua = rc - .042, kk = 1.12 * Math.sqrt(3);
  const rs = ua / (cosHA + kk * sinHA), us = rs * cosHA, hs = rs * sinHA;
  const hA = ua - us, yc = (hA * hA - hs * hs) / (2 * hs), rho = yc + hs;          // two-centred arch
  const uR = (rc + ro) / 2, rhoR = Math.min(.121, uR * TA * .72);                   // roundel
  const ul = (rh + rp) / 2, Lh = (rp - rh) / 2 - .024, wh = Math.min(ul * TA * .42, .036);
  const dl = (Lh * Lh - wh * wh) / (2 * wh), rl = wh + dl;                          // petal lens
  const bA = .042, bR = .034;
  const wM = wT * .8, wV = wT * .62, wO = wT * 1.6;
  const hS = S / 2, rad = hS * .985, inv = 1 / rad;

  let gDA = 9, gDL = 9, gDRC = 9, gDC = 9, gT = 9, gM = 9;
  function classify(u, v, r, av) {
    gDA = 9; gDL = 9; gDRC = 9; gDC = 9;
    if (r < rh) return T_HUB;
    if (r < rp) {
      const a = rl - Math.hypot(u - ul, v - dl), b = rl - Math.hypot(u - ul, v + dl);
      gDL = a < b ? a : b;
      return gDL > 0 ? T_PETAL : (v >= 0 ? T_PGR : T_PGL);
    }
    if (r < rc) {
      if (u >= us) { const a = rho - Math.hypot(u - us, v - yc), b = rho - Math.hypot(u - us, v + yc); gDA = a < b ? a : b; }
      if (u < us || gDA > 0) {
        let dc = u * sinHA - av * cosHA; const dr = r - rp;
        if (dr < dc) dc = dr;
        if (u >= us && gDA < dc) dc = gDA;
        gDC = dc;
        return dc < bA ? T_ARCHB : T_ARCHC;
      }
      return v >= 0 ? T_SP1R : T_SP1L;
    }
    if (r < ro) {
      gDRC = Math.hypot(u - uR, v);
      if (gDRC < rhoR) return (rhoR - gDRC) < bR ? T_RNDB : T_RNDC;
      return v >= 0 ? T_SP2R : T_SP2L;
    }
    return v >= 0 ? T_RIMR : T_RIML;
  }
  function dStruct(u, v, r, av, type) {
    let d = Math.abs(r - rp), t = Math.abs(r - rc); if (t < d) d = t;
    t = Math.abs(r - ro); if (t < d) d = t;
    t = Math.abs(r - rh); if (t < d) d = t;
    if (r > rh) { t = u * sinHA - av * cosHA; if (t < d) d = t; }
    if (gDL < 9) { t = Math.abs(gDL); if (t < d) d = t; }
    if (gDA < 9) { t = Math.abs(gDA); if (t < d) d = t; }
    if (gDRC < 9) { t = Math.abs(gDRC - rhoR); if (t < d) d = t; }
    gT = d;
    let m = 9;
    if (type === T_ARCHB || type === T_ARCHC) m = Math.abs(gDC - bA);
    else if (type === T_RNDB || type === T_RNDC) m = Math.abs(rhoR - gDRC - bR);
    else if (AXIS[type]) m = av;
    gM = m;
  }
  const margin = (u, v) => { const r = Math.hypot(u, v), av = Math.abs(v), ty = classify(u, v, r, av); dStruct(u, v, r, av, ty); return Math.min(gT, gM); };

  /* ---- seed templates per cell type ---- */
  function place(type, n, dmin, side) {
    const pts = []; let tries = 0;
    const rr = { [T_PETAL]: [rh, rp], [T_ARCHC]: [rp, rc], [T_SP1R]: [rp + .04, rc], [T_RNDC]: [rc, ro], [T_SP2R]: [rc, ro], [T_RIMR]: [ro, 1] }[type];
    while (pts.length < n && tries++ < 700) {
      const r = rr[0] + (rr[1] - rr[0]) * rnd(), ph = side ? rnd() * HA : (rnd() * 2 - 1) * HA;
      const u = r * Math.cos(ph), v = r * Math.sin(ph);
      if (classify(u, v, r, Math.abs(v)) !== type) continue;
      if (margin(u, v) < .02) continue;
      let ok = true; for (const p of pts) if ((p[0] - u) ** 2 + (p[1] - v) ** 2 < dmin * dmin) { ok = false; break; }
      if (ok) pts.push([u, v]);
    }
    while (pts.length < n) { const r = (rr[0] + rr[1]) / 2, ph = rnd() * HA * .8; pts.push([r * Math.cos(ph), r * Math.sin(ph)]); }
    return pts;
  }
  const nArch = N <= 8 ? 7 : N <= 12 ? 5 : 4, nSp1 = N <= 8 ? 3 : 2, nSp2 = N <= 8 ? 4 : 3, nBArch = N <= 8 ? 12 : N <= 12 ? 10 : 8;
  const TM = {
    [T_PETAL]: [0, -.5, .5].map(f => [ul + f * Lh * 1.2, 0]),
    [T_ARCHC]: place(T_ARCHC, nArch, .062, false),
    [T_SP1R]: place(T_SP1R, nSp1, .05, true),
    [T_RNDC]: place(T_RNDC, 4, .05, false),
    [T_SP2R]: place(T_SP2R, nSp2, .05, true),
    [T_RIMR]: [[(ro + 1) / 2 - .032, HA * .36], [(ro + 1) / 2 + .032, HA * .68]].map(p => [p[0] * Math.cos(p[1]), p[0] * Math.sin(p[1])])
  };
  const NS = new Int32Array(NT);
  NS[T_HUB] = 7; NS[T_PETAL] = 3; NS[T_PGL] = 1; NS[T_PGR] = 1; NS[T_ARCHB] = nBArch; NS[T_ARCHC] = nArch; NS[T_SP1L] = nSp1; NS[T_SP1R] = nSp1;
  NS[T_RNDB] = 8; NS[T_RNDC] = 4; NS[T_SP2L] = nSp2; NS[T_SP2R] = nSp2; NS[T_RIML] = 2; NS[T_RIMR] = 2;
  const SEEDS = Array.from({ length: NT }, () => new Array(N).fill(null));
  const BND = Array.from({ length: NT }, () => new Array(N).fill(null));
  const BASE = Array.from({ length: NT }, () => new Int32Array(N));
  const pType = [0], pK = [0], pIdx = [0];
  let np = 1;
  // hub: global seeds
  const hubBase = np, HUB = new Float32Array(14);
  HUB[0] = 0; HUB[1] = 0;
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + rnd() * .5, r = rh * (.55 + rnd() * .12); HUB[2 + i * 2] = Math.cos(a) * r; HUB[3 + i * 2] = Math.sin(a) * r; }
  for (let i = 0; i < 7; i++) { pType.push(T_HUB); pK.push(0); pIdx.push(i); np++; }
  const jit = .011;
  for (let k = 0; k < N; k++) {
    for (let t = 1; t < NT; t++) {
      BASE[t][k] = np;
      const n = NS[t];
      if (t === T_ARCHB || t === T_RNDB) {
        const b = []; for (let j = 0; j < n; j++) b.push(((j + (rnd() - .5) * .5) / n) * TAU);
        b.sort((x, y) => x - y); BND[t][k] = Float32Array.from(b);
      } else if (n > 1 || t === T_PETAL) {
        const mirror = (t === T_SP1L || t === T_SP2L || t === T_RIML);
        const tm = TM[mirror ? t + 1 : t];
        const arr = new Float32Array(n * 2);
        for (let i = 0; i < n; i++) {
          let u = tm[i][0], v = mirror ? -tm[i][1] : tm[i][1];
          for (let a = 0; a < 6; a++) {
            const u2 = u + (rnd() - .5) * jit * 2, v2 = v + (rnd() - .5) * jit * 2;
            if (classify(u2, v2, Math.hypot(u2, v2), Math.abs(v2)) === t) { u = u2; v = v2; break; }
          }
          arr[i * 2] = u; arr[i * 2 + 1] = v;
        }
        SEEDS[t][k] = arr;
      }
      for (let i = 0; i < n; i++) { pType.push(t); pK.push(k); pIdx.push(i); np++; }
    }
  }
  /* ---- colours per pane ---- */
  const paneCol = new Float32Array(np * 3), colIdx = new Uint8Array(np), TONE = new Float32Array(np), SA = new Float32Array(np);
  const pick = (list, i) => list[i % list.length];

function paneAt(px, py) {
  if (!W) return 0;
  const dx = px - cx, dy = py - cy, cr = Math.cos(rot), sr = Math.sin(rot);
  const nx = (dx * cr + dy * sr) / R, ny = (-dx * sr + dy * cr) / R;
  if (nx * nx + ny * ny > 1) return 0;
  const bx = Math.round(nx * W.rad + W.hS - .5), by = Math.round(ny * W.rad + W.hS - .5);
  if (bx < 0 || by < 0 || bx >= W.S || by >= W.S) return 0;
  return W.label[by * W.S + bx];
}
let ptr = { id: -1, x: 0, y: 0, a0: 0, r0: 0, downT: 0, moved: 0, lastA: 0, lastT: 0, sx: 0, sy: 0 };
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function setHover(id, px, py) {
  if (id !== hoverId) {
    hoverId = id;
    cv.classList.toggle('pane', !!id && !dragging);
    if (id && W) {
      const c = JEWEL[JNAMES[W.colIdx[id]]];
      tipEl.innerHTML = '<i style="color:rgb(' + c[0] + ',' + Math.min(255, c[1] + 40) + ',' + Math.min(255, c[2] + 60) + ')"></i>' + JNAMES[W.colIdx[id]][0].toUpperCase() + JNAMES[W.colIdx[id]].slice(1) + ' glass, cut no. ' + id;
      tipEl.classList.add('on');
    } else tipEl.classList.remove('on');
  }
}
cv.addEventListener('pointerdown', e => {
  if (ptr.id !== -1) return;
  const [x, y] = evPos(e);
  cv.setPointerCapture(e.pointerId);
  ptr = { id: e.pointerId, x, y, sx: x, sy: y, a0: Math.atan2(y - cy, x - cx), r0: Math.hypot(x - cx, y - cy), downT: performance.now(), moved: 0, lastA: Math.atan2(y - cy, x - cx), lastT: performance.now() };
  dragging = true; cv.classList.add('grabbing'); hintEl.classList.add('gone');
});
cv.addEventListener('pointermove', e => {
  const [x, y] = evPos(e);
  if (ptr.id === e.pointerId) {
    ptr.moved = Math.max(ptr.moved, Math.hypot(x - ptr.sx, y - ptr.sy));
    const now = performance.now();
    let da;
    if (ptr.r0 < R * .14) da = (x - ptr.x) / R * .9;
    else { const a = Math.atan2(y - cy, x - cx); da = a - ptr.lastA; if (da > Math.PI) da -= TAU; if (da < -Math.PI) da += TAU; ptr.lastA = a; }
    if (ptr.moved > 6) {
      rot += da;
      const dtm = Math.max(8, now - ptr.lastT) / 1000; omega = lerp(omega, clamp(da / dtm, -7, 7), .35);
    }
    ptr.lastT = now; ptr.x = x; ptr.y = y;
  }
  setHover(paneAt(x, y), x, y);
});
function endPtr(e, cancel) {
  if (ptr.id !== e.pointerId) return;
  const dur = performance.now() - ptr.downT, wasClick = !cancel && ptr.moved < 7 && dur < 550;
  const [x, y] = evPos(e);
  ptr.id = -1; dragging = false; cv.classList.remove('grabbing');
  if (wasClick) {
    const id = paneAt(x, y);
    if (id) shatter(id); else if (Math.hypot(x - cx, y - cy) < R * .1) bellT = 0;
  }
  if (performance.now() - ptr.lastT > 90) omega = restOmega;
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
cv.addEventListener('pointerleave', () => { if (ptr.id === -1) setHover(0, 0, 0); });
cv.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { omega -= .9; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { omega += .9; e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { let id = hoverId; if (!id && W) id = 1 + ((Math.random() * (np - 1)) | 0); shatter(id); e.preventDefault(); }
  else if (e.key === 'n' || e.key === 'N') newWindow();
  else if (e.key === 'b' || e.key === 'B') bellT = 0;
  hintEl.classList.add('gone');
});

/* ================================================================
   Controls
================================================================ */
const timeEl = $('#time'), clockEl = $('#clock');
function setClock() { clockEl.textContent = fmtClock(sunT); }
timeEl.addEventListener('input', () => { sunT = timeEl.value / 1000; holdSun = 9; setClock(); });
let ribs = 12;
function newWindow(n) {
  if (baking) return;
  ribs = n || ribs;
  fadeOut = .55;
}
let fadeOut = 0;
document.querySelectorAll('input[name="ribs"]').forEach(r => r.addEventListener('change', () => { if (r.checked) newWindow(+r.value); }));
$('#renew').addEventListener('click', () => newWindow());

/* ================================================================
   Loop
================================================================ */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000; let dt = Math.min(.05, raw); last = now;
  if (document.hidden) return;
  const wdt = Math.min(raw, .35);          // wall-clock step for scripted sequences (fades, reveal), so they take the same time on slow machines
  T += dt;
  if (fadeOut > 0) {
    fadeOut -= wdt; fadeK = Math.max(0, fadeOut / .55);
    if (fadeOut <= 0) { fadeOut = 0; fadeK = 0; startBake(ribs, false); }
  }
  if (baking) pumpBake();
  if (W && !baking && fadeOut === 0 && revealR < 1.25) revealR += wdt / (RM ? 1.2 : 2.6);
  // slow sun (ping-pong), unless the visitor is scrubbing
  if (holdSun > 0) holdSun -= dt;
  else { sunT += dirSun * dt * (RM ? .0012 : .0058); if (sunT > .98) { sunT = .98; dirSun = -1; } if (sunT < .02) { sunT = .02; dirSun = 1; } timeEl.value = Math.round(sunT * 1000); if ((T * 4 | 0) !== ((T - dt) * 4 | 0)) setClock(); }
  // turning with inertia
  if (!dragging) { rot += omega * dt; omega += (restOmega - omega) * (1 - Math.exp(-dt * 1.25)); }
  if (bellT < 9) bellT += dt;
  stepShards(dt);
  updateLight(dt);
  drawFrame(dt);
}

/* the hint changes its mind once, then gets out of the way */
setTimeout(() => {
  if (hintEl.classList.contains('gone')) return;
  hintEl.classList.add('gone');
  setTimeout(() => { hintEl.innerHTML = 'Strike the heart of the window to ring it &nbsp;·&nbsp; press N for a new one'; hintEl.classList.remove('gone'); setTimeout(() => hintEl.classList.add('gone'), 9000); }, 1300);
}, 12000);

/* boot */
let rzT = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { layout(); }, 90); });
layout();
setClock();
startBake(12, true);
requestAnimationFrame(frame);
})();
</script>
