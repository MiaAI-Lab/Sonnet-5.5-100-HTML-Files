<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep End — A Sunlit Pool</title>
<meta name="description" content="Deep End: a top-down, sun-drenched swimming pool rendered live in WebGL. Caustic light, rippling water, a coral ring and a flamingo float. Move to make a wake, tap to splash.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0a8fb0">
<style>
:root{
  --aqua:#00b8c8; --deep:#0a6f9a; --sun:#ffe066; --coral:#ff7a6b; --foam:#f4fdff; --ink:#053b53;
  --round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Varela Round",Nunito,Ubuntu,Cantarell,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a8fb0;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--round);color:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:99px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:linear-gradient(90deg,#39d3e0,#00b8c8 45%,#0a6f9a)}

/* ============ HUD ============ */
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.tag{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:9px 14px 9px 12px;border-radius:99px;background:rgba(3,104,138,.34);border:1px solid rgba(255,255,255,.42);box-shadow:0 8px 24px -10px rgba(0,60,90,.5),inset 0 1px 0 rgba(255,255,255,.35);font:700 10.5px/1 var(--round);letter-spacing:.17em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,60,90,.45);white-space:nowrap;animation:tagIn 1.2s var(--ease) both}
.tag i{width:9px;height:9px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px rgba(255,224,102,.3),0 0 12px var(--sun);flex:none}
.tag b{font-weight:800;color:var(--sun)}
.tag small{font:600 10px/1 var(--round);letter-spacing:.12em;opacity:.85}
@keyframes tagIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.t-club{left:0;right:0;margin:0 auto;width:max-content;top:clamp(14px,2.6vw,30px);animation-delay:.4s}
.t-sun{right:clamp(14px,2.6vw,34px);top:clamp(14px,2.6vw,30px);animation-delay:.6s}
.t-lane{left:14px;top:60%;animation-delay:.8s}
.t-depth{right:clamp(14px,2.6vw,34px);bottom:clamp(14px,2.6vw,30px);animation-delay:1s}
.t-hint{left:clamp(14px,2.6vw,34px);bottom:clamp(14px,2.6vw,30px);animation-delay:1.1s;text-transform:none;letter-spacing:.05em;font-weight:600;font-size:12px}
.t-hint kbd{font:800 10px/1 var(--round);letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}

.ctl{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 20px);bottom:clamp(14px,2.6vw,30px);z-index:6;display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(3,104,138,.36);border:1px solid rgba(255,255,255,.45);box-shadow:0 10px 28px -10px rgba(0,60,90,.55);animation:tagIn 1.2s 1.2s var(--ease) both}
.ctl button{font:800 10.5px/1 var(--round);letter-spacing:.16em;text-transform:uppercase;color:#fff;padding:12px 16px;min-height:40px;border-radius:99px;background:transparent;border:0;cursor:pointer;transition:background .4s,color .4s,transform .5s var(--ease);text-shadow:0 1px 5px rgba(0,60,90,.4)}
.ctl button:hover{background:rgba(255,255,255,.18)}
.ctl button[aria-pressed="true"]{background:var(--sun);color:var(--ink);text-shadow:none;transform:scale(1.03)}

.charge{position:fixed;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid var(--sun);box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 26px rgba(255,224,102,.8);pointer-events:none;z-index:7;opacity:0;transform:scale(1);will-change:transform,opacity}
.charge.on{opacity:1;animation:charge .9s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes charge{from{transform:scale(1.1)}to{transform:scale(.28);border-color:var(--coral)}}

/* ============ fallback (no WebGL) ============ */
.fb{position:fixed;inset:0;display:none;overflow:hidden;background:linear-gradient(90deg,#5fe1ea 0%,#00b8c8 46%,#0a6f9a 100%)}
.nogl .fb{display:block}
.nogl #gl{display:none}
.fb .tiles{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.34) 0 2px,transparent 2px 38px),repeating-linear-gradient(90deg,rgba(255,255,255,.34) 0 2px,transparent 2px 38px);opacity:.6}
.fb .lanes{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 calc(16.66% - 12px),rgba(5,50,84,.55) calc(16.66% - 12px) calc(16.66% - 6px),transparent calc(16.66% - 6px) 16.66%);background-position:0 8.3%}
.fb .c{position:absolute;inset:-25%;mix-blend-mode:soft-light;animation:drift 16s ease-in-out infinite alternate}
.fb .c1{background:radial-gradient(28% 22% at 30% 40%,rgba(255,255,255,.9),transparent 70%),radial-gradient(22% 26% at 70% 30%,rgba(255,255,255,.8),transparent 70%),radial-gradient(26% 20% at 55% 75%,rgba(255,255,255,.85),transparent 70%)}
.fb .c2{background:radial-gradient(20% 16% at 20% 70%,rgba(255,255,255,.8),transparent 70%),radial-gradient(24% 22% at 82% 66%,rgba(255,255,255,.7),transparent 70%);animation-duration:23s;animation-direction:alternate-reverse}
.fb .c3{background:radial-gradient(60% 50% at 88% 6%,rgba(255,224,102,.75),transparent 60%);mix-blend-mode:screen;animation:none}
@keyframes drift{from{transform:translate(-4%,-3%) scale(1) rotate(0)}to{transform:translate(5%,4%) scale(1.14) rotate(6deg)}}
.fb .ring{position:absolute;left:16%;top:9%;width:min(24vw,26vh,230px);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(var(--coral) 0 15deg,#fff 15deg 30deg);-webkit-mask:radial-gradient(circle,transparent 36%,#000 37%);filter:drop-shadow(-10px 14px 8px rgba(0,60,90,.35));animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-8px) rotate(8deg)}}
.fb h2{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:900 clamp(64px,17vw,260px)/.9 var(--round);letter-spacing:.02em;color:rgba(255,255,255,.14);-webkit-text-stroke:clamp(3px,.5vw,8px) #fff;text-shadow:.04em .06em 0 var(--coral);animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(-50%)}50%{transform:translateY(-52%)}}

@media (max-width:820px){
  .t-club{display:none}
  .t-hint{bottom:auto;top:clamp(14px,2.6vw,30px)}
  .t-sun{top:auto;bottom:74px;right:14px}
  .t-depth{display:none}
  .ctl{bottom:16px}
  .t-lane{left:14px}
}
@media (max-width:420px){ .t-sun{display:none} .tag{font-size:9.5px;padding:8px 11px 8px 10px} .ctl button{padding:12px 13px} }
@media (prefers-reduced-motion:reduce){ .tag,.ctl{animation:none} .fb .c,.fb .ring,.fb h2{animation:none} }
</style>
</head>
<body>
<h1 class="sr">Deep End</h1>
<canvas id="gl" role="img" aria-label="Top-down view of a sunlit swimming pool: white and blue tiles, dancing caustic light, lane lines, a coral swim ring and a flamingo float bobbing on the water, with the words DEEP END painted on the floor. Move the pointer to make a wake, tap to splash."></canvas>

<div class="fb" aria-hidden="true">
  <div class="tiles"></div><div class="lanes"></div>
  <div class="c c1"></div><div class="c c2"></div><div class="c c3"></div>
  <div class="ring"></div>
  <h2>DEEP END</h2>
</div>

<div class="hud">
  <div class="tag t-club"><i></i>Municipal Pool No. 2 <small>· open swim</small></div>
  <div class="tag t-sun"><b>14:07</b> Sun high · UV 8</div>
  <div class="tag t-lane" id="laneTag"><i></i>Lane 4 · 27°C</div>
  <div class="tag t-depth" id="depthTag">Depth <b>1.2 m</b> &rarr; <b>3.0 m</b></div>
  <div class="tag t-hint" id="hintTag"><kbd>Move</kbd> for a wake · <kbd>Tap</kbd> to splash · <kbd>Hold</kbd> to cannonball</div>
</div>

<div class="ctl" role="group" aria-label="Water conditions">
  <button type="button" data-w="0.55" aria-pressed="false">Calm</button>
  <button type="button" data-w="1" aria-pressed="true">Breezy</button>
  <button type="button" data-w="1.75" aria-pressed="false">Choppy</button>
</div>
<div class="charge" id="charge" aria-hidden="true"></div>

<script>
(function(){
'use strict';
var doc=document, root=doc.documentElement;
var RM=false; try{RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
var canvas=doc.getElementById('gl');
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function sstep(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function fallback(msg){ if(msg)console.warn(msg); root.classList.add('nogl'); }

/* ============================================================
   GLSL — vertex + fragment
   ============================================================ */
var VS='attribute vec2 aPos;void main(){gl_Position=vec4(aPos,0.0,1.0);}';

var FS=[
'precision highp float;',
'uniform vec2  uRes;',
'uniform float uTime;',
'uniform float uWave;',
'uniform float uAsp;',
'uniform vec4  uRip[16];',   // wake ripples   : x y t0 amp
'uniform vec4  uSpl[6];',    // splashes       : x y t0 strength
'uniform vec4  uRing;',      // x y rot scale
'uniform vec4  uFlam;',      // x y rot scale
'uniform vec4  uAnim;',      // ringPhase flamPhase neckBend -
'uniform vec3  uPtr;',       // x y dimple
'uniform vec2  uDir;',       // depth direction
'uniform sampler2D uTex;',
'',
'#define TAU 6.28318530718',
'const float TS = 0.040;',
'const float GW = 0.034;',
'const float LW = 0.1666667;',
'const vec3 SUN   = vec3(1.0, 0.878, 0.400);',
'const vec3 CORAL = vec3(1.0, 0.478, 0.420);',
'const vec3 AQUA  = vec3(0.0, 0.722, 0.784);',
'const vec3 DEEP  = vec3(0.039, 0.435, 0.604);',
'const vec3 LDIR  = vec3(0.340, 0.400, 0.851);',
'',
'float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }',
'mat2 rot2(float a){ float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }',
'vec2 toLocalDir(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c * v.x + s * v.y, -s * v.x + c * v.y); }',
'vec2 toLocal(vec2 p, vec4 o){ return toLocalDir(p - o.xy, o.z) / o.w; }',
'',
'/* ---------- water height gradient (slopes) ---------- */',
'vec2 waves(vec2 q, float t){',
'  vec2 g = vec2(0.0), d;',
'  d = vec2( 0.80, 0.60); g += d * cos(dot(d, q) * 13.0 + t * 1.10)        * 0.050;',
'  d = vec2(-0.55, 0.83); g += d * cos(dot(d, q) * 19.0 - t * 1.35 + 1.7)  * 0.040;',
'  d = vec2( 0.20,-0.98); g += d * cos(dot(d, q) * 29.0 + t * 1.80 + 3.1)  * 0.032;',
'  d = vec2(-0.93,-0.36); g += d * cos(dot(d, q) * 41.0 - t * 2.20 + 0.6)  * 0.024;',
'  d = vec2( 0.62, 0.78); g += d * cos(dot(d, q) * 57.0 + t * 2.60 + 2.2)  * 0.016;',
'  return g;',
'}',
'vec2 hfGrad(vec2 q, float t){',
'  vec2 g = vec2(0.0), d;',
'  d = vec2( 0.71, 0.71); g += d * cos(dot(d, q) * 150.0 + t * 3.1)        * 0.040;',
'  d = vec2(-0.50, 0.87); g += d * cos(dot(d, q) * 230.0 - t * 3.9 + 1.3)  * 0.034;',
'  d = vec2( 0.97,-0.26); g += d * cos(dot(d, q) * 310.0 + t * 4.6 + 2.6)  * 0.028;',
'  d = vec2(-0.87,-0.50); g += d * cos(dot(d, q) * 420.0 - t * 5.3 + 0.4)  * 0.020;',
'  return g;',
'}',
'vec2 ripGrad(vec2 p, float t){',
'  vec2 g = vec2(0.0);',
'  for (int i = 0; i < 16; i++){',
'    vec4 r = uRip[i];',
'    float age = t - r.z;',
'    if (age < 0.0 || age > 2.6) continue;',
'    vec2 d = p - r.xy;',
'    float dist = length(d) + 1e-4;',
'    float u = dist - age * 0.38;',
'    float w = 0.05 + age * 0.03;',
'    if (abs(u) > 3.0 * w) continue;',
'    float env = exp(-(u * u) / (w * w));',
'    float ph = u * 64.0;',
'    float amp = r.w * exp(-age * 1.45) / (1.0 + dist * 8.0);',
'    float dh = amp * env * (-2.0 * u / (w * w) * cos(ph) - 64.0 * sin(ph));',
'    g += dh * d / dist;',
'  }',
'  // finger-in-the-water dimple at the pointer',
'  vec2 dp = p - uPtr.xy; float r2 = dot(dp, dp);',
'  g += dp * (uPtr.z * 16.0 * exp(-r2 / 0.0018));',
'  return g;',
'}',
'vec2 splGrad(vec2 p, float t){',
'  vec2 g = vec2(0.0);',
'  for (int i = 0; i < 6; i++){',
'    vec4 s = uSpl[i];',
'    float age = t - s.z;',
'    if (age < 0.0 || age > 5.0) continue;',
'    vec2 d = p - s.xy;',
'    float dist = length(d) + 1e-4;',
'    float u = dist - age * 0.50;',
'    float w = 0.11 + age * 0.06;',
'    if (abs(u) < 3.2 * w){',
'      float env = exp(-(u * u) / (w * w));',
'      float ph = u * 44.0;',
'      float amp = s.w * exp(-age * 0.80) / sqrt(1.0 + dist * 6.0);',
'      float dh = amp * env * (-2.0 * u / (w * w) * cos(ph) - 44.0 * sin(ph));',
'      g += dh * d / dist;',
'    }',
'    float sg = 0.0035 + age * 0.012;',
'    g += d * (s.w * 14.0 * exp(-age * 6.0) * exp(-dist * dist / sg) / sg);',
'  }',
'  return g;',
'}',
'',
'/* ---------- classic iterative sin-based tileable water caustic ---------- */',
'float caustic(vec2 uv, float t){',
'  vec2 p = mod(uv * TAU, TAU) - 250.0;',
'  vec2 i = p;',
'  float c = 1.0;',
'  float inten = 0.005;',
'  for (int n = 0; n < 5; n++){',
'    float tt = t * (1.0 - (3.5 / float(n + 1)));',
'    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));',
'    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));',
'  }',
'  c /= 5.0;',
'  c = 1.17 - pow(c, 1.4);',
'  return pow(abs(c), 8.0);',
'}',
'',
'/* ---------- floating objects: SDFs ---------- */',
'float sdCap(vec2 p, vec2 a, vec2 b, float r){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }',
'float sdTap(vec2 p, vec2 a, vec2 b, float ra, float rb){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - mix(ra, rb, h); }',
'float smin(float a, float b, float k){ float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }',
'float sdEll(vec2 p, vec2 r){ float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-5); }',
'vec2 neckSpace(vec2 q, float bend){ vec2 nb = vec2(0.19, 0.05); return nb + rot2(-bend) * (q - nb); }',
'vec2 bez(float t){ float u = 1.0 - t; return u * u * u * vec2(0.19, 0.05) + 3.0 * u * u * t * vec2(0.46, 0.06) + 3.0 * u * t * t * vec2(0.50, 0.36) + t * t * t * vec2(0.27, 0.47); }',
'float neckSDF(vec2 n){',
'  float d = 1e3; vec2 a = bez(0.0); float ra = 0.058;',
'  for (int i = 1; i <= 10; i++){',
'    float t = float(i) * 0.1;',
'    vec2 b = bez(t); float rb = 0.058 - 0.014 * t;',
'    d = min(d, sdTap(n, a, b, ra, rb));',
'    a = b; ra = rb;',
'  }',
'  return d;',
'}',
'float flamSDF(vec2 q, float bend){',
'  float d = sdEll(q, vec2(0.30, 0.19));',
'  d = smin(d, sdEll(q - vec2(-0.29, 0.0), vec2(0.13, 0.085)), 0.07);',
'  vec2 n = neckSpace(q, bend);',
'  float nk = neckSDF(n);',
'  nk = smin(nk, length(n - vec2(0.258, 0.488)) - 0.064, 0.05);',
'  return smin(d, nk, 0.06);',
'}',
'float beakSD(vec2 n){',
'  float b = sdCap(n, vec2(0.225, 0.492), vec2(0.130, 0.468), 0.023);',
'  return min(b, sdCap(n, vec2(0.130, 0.468), vec2(0.108, 0.434), 0.020));',
'}',
'float ringSD(vec2 p){ vec2 q = toLocal(p, uRing); return (abs(length(q) - 0.118) - 0.046) * uRing.w; }',
'const vec2 FOFF = vec2(0.02, 0.18);',
'float flamSD(vec2 p){ vec2 q = toLocal(p, uFlam) + FOFF; return min(flamSDF(q, uAnim.z), beakSD(neckSpace(q, uAnim.z))) * uFlam.w; }',
'',
'/* ---------- tile floor + lanes + painted lettering ---------- */',
'vec4 tsamp(vec2 uv){ vec4 s = texture2D(uTex, uv); return vec4(s.rgb * s.a, s.a); }',
'vec3 floorColor(vec2 f, float pxw, float dz){',
'  vec2 tp = f / TS;',
'  vec2 id = floor(tp);',
'  vec2 fr = fract(tp);',
'  float h1 = hash21(id);',
'  float h2 = hash21(id + 17.7);',
'  float aa = pxw / TS * 1.4;',
'  vec3 tA = vec3(0.965, 0.992, 1.000);',
'  vec3 tB = vec3(0.790, 0.925, 0.985);',
'  vec3 tC = vec3(0.520, 0.840, 0.935);',
'  vec3 tc = mix(tA, tB, smoothstep(0.25, 0.95, h1) * 0.85);',
'  tc = mix(tc, tC, step(0.94, h2) * 0.62);',
'  tc *= 0.975 + 0.04 * h2;',
'  vec2 e = min(fr, 1.0 - fr);',
'  float edge = min(e.x, e.y);',
'  float grout = 1.0 - smoothstep(GW - aa, GW + aa, edge);',
'  float hiE = (1.0 - smoothstep(GW, GW + 0.14, 1.0 - fr.y)) + (1.0 - smoothstep(GW, GW + 0.14, fr.x));',
'  float shE = (1.0 - smoothstep(GW, GW + 0.14, fr.y)) + (1.0 - smoothstep(GW, GW + 0.14, 1.0 - fr.x));',
'  tc += 0.045 * hiE - 0.05 * shE;',
'  tc = mix(tc, vec3(0.62, 0.79, 0.89), grout);',
'  // swimmer lane lines with T-marks',
'  float ly = abs(mod(f.y + 0.5, LW) - 0.5 * LW);',
'  float lh = 0.0105, laa = pxw * 1.4;',
'  float xEnd = 0.5 * uAsp - mix(0.05, 0.13, smoothstep(0.5, 1.4, uAsp));',
'  float lane = (1.0 - smoothstep(lh - laa, lh + laa, ly)) * (1.0 - smoothstep(xEnd - laa, xEnd + laa, abs(f.x)));',
'  float tm = (1.0 - smoothstep(lh - laa, lh + laa, abs(abs(f.x) - xEnd))) * (1.0 - smoothstep(0.048 - laa, 0.048 + laa, ly));',
'  lane = max(lane, tm);',
'  tc = mix(tc, vec3(0.06, 0.19, 0.35), lane * 0.9);',
'  return tc;',
'}',
'// painted lettering (offscreen canvas texture): blurs a little more the deeper it lies',
'vec4 paintText(vec2 f, float dz){',
'  vec2 tuv = f / vec2(uAsp, 1.0) + 0.5;',
'  float br = 0.0010 + 0.0075 * dz * dz;',
'  vec4 tx = tsamp(tuv) * 0.36;',
'  tx += tsamp(tuv + vec2( br,  br)) * 0.16;',
'  tx += tsamp(tuv + vec2(-br,  br)) * 0.16;',
'  tx += tsamp(tuv + vec2( br, -br)) * 0.16;',
'  tx += tsamp(tuv + vec2(-br, -br)) * 0.16;',
'  return vec4(tx.rgb / max(tx.a, 0.001), clamp(tx.a, 0.0, 1.0));',
'}',
'',
'/* ---------- inflatable ring ---------- */',
'vec4 drawRing(vec2 p, vec2 g){',
'  vec4 o = uRing;',
'  vec2 d0 = p - o.xy;',
'  if (dot(d0, d0) > 0.09) return vec4(0.0);',
'  vec2 q = toLocal(p, o);',
'  float R = 0.118, r = 0.046;',
'  float rl = length(q);',
'  float s = rl - R;',
'  float d = abs(s) - r;',
'  float aa = 1.4 / (uRes.y * o.w);',

'/* ---------- flamingo float ---------- */',
'vec4 drawFlam(vec2 p, vec2 g){',

'  vec2 d0 = p - o.xy;',

'  float w1 = abs(sdEll(q - vec2(-0.06, 0.0), vec2(0.20, 0.125)));',
'  float w2 = abs(sdEll(q - vec2(-0.04, 0.0), vec2(0.125, 0.075)));',
'  float wing = max((1.0 - smoothstep(0.0025, 0.0055, w1)) * step(q.x, 0.06), (1.0 - smoothstep(0.0025, 0.0055, w2)) * step(q.x, 0.04));',

'  vec3 L = normalize(LDIR);',

'/* ---------- splash foam + droplets ---------- */',

'  for (int i = 0; i < 6; i++){',

'    float age = t - s.z;',
'    if (age < 0.0 || age > 1.5) continue;',
'    vec2 d = p - s.xy;',
'    float dist = length(d);',
'    float k = clamp(s.w * 85.0, 0.4, 2.2);',

'    float zr = (dist - fr) / (0.012 + age * 0.012);',

'',
'void main(){',
'  vec2 uv = gl_FragCoord.xy / uRes;',

'  float pxw = 1.0 / uRes.y;',

'  // water surface slopes: waves + wakes + splashes',

'  // depth: absorption + scattering, more saturated with depth',

'  // floor paint: keeps its colour, takes on the water tint and softens with depth',

'  // floats',
'  vec4 rc = drawRing(p, g);',
'  vec4 fl = drawFlam(p, g);',
'  col = mix(col, rc.rgb, rc.a);',
'  col = mix(col, fl.rgb, fl.a);',

'  // sun glare + glints',
'  vec2 sp = (uv - vec2(0.90, 0.94)) * vec2(uAsp, 1.0);',

'  vec2 gs = waves(q, t) * uWave + hfGrad(q, t) * (0.45 + 0.45 * uWave) + rp * 0.6;',
'  vec3 nrm = normalize(vec3(-gs * 1.6, 1.0));',
'  vec3 Ld = normalize(LDIR);',
'  vec3 Hh = normalize(Ld + vec3(0.0, 0.0, 1.0));',
'  float nh = max(dot(nrm, Hh), 0.0);',
'  float glint = (pow(nh, 380.0) * 1.7 + pow(nh, 60.0) * 0.05) * (0.5 + 1.3 * sg) * (1.0 - onObj);',

'  // splash foam',
'  col = mix(col, vec3(1.0), splashFoam(p, t) * 0.92);',

'  // soft vignette + gentle curve',
'  vec2 vv = uv - 0.5;',
'  col *= 1.05 - 0.15 * dot(vv, vv) * 1.7;',

var W=window.innerWidth,H=window.innerHeight,asp=W/H;
function bubble(text,x,y,fs,e1,e2,lineH,layers){
  // rounded "sticker" outline: glyph grown by e1, minus glyph grown by e2 -> a band with round corners
  var lines=text.split('|'), i;

  sctx.font='900 100px '+FONT;

  var w=toWorld(e.clientX,e.clientY), now=performance.now();
  var dt=Math.max(8,now-(ptr.tm||now-16))/1000; ptr.tm=now;
  var dx=w[0]-ptr.x, dy=w[1]-ptr.y, dist=Math.sqrt(dx*dx+dy*dy);
  ptr.speed=lerp(ptr.speed,dist/dt,0.35);
  ptr.x=w[0]; ptr.y=w[1]; ptr.has=true;
  if(ptr.down){ptr.moved+=Math.abs(e.clientX-ptr.sx)+Math.abs(e.clientY-ptr.sy); ptr.sx=e.clientX; ptr.sy=e.clientY; charge.style.left=e.clientX+'px'; charge.style.top=e.clientY+'px';}
  var sd=Math.hypot(ptr.x-ptr.lastSpawnX,ptr.y-ptr.lastSpawnY);
  if(sd>0.035){ addWake(ptr.x,ptr.y,clamp(0.0009+ptr.speed*0.0011,0.0009,0.0042)*(RM?0.6:1)); ptr.lastSpawnX=ptr.x; ptr.lastSpawnY=ptr.y; }
  ptr.dimple=Math.max(ptr.dimple,clamp(ptr.speed*0.05,0,0.5));
  // nudge floats the pointer swims into
  [ring,flam].forEach(function(o){
    var ox=o.x-ptr.x, oy=o.y-ptr.y, d=Math.sqrt(ox*ox+oy*oy), rr=o.r*o.s+0.03;
    if(d<rr&&d>0.001){ var f=(1-d/rr)*clamp(ptr.speed,0,2.5)*0.05; o.vx+=ox/d*f; o.vy+=oy/d*f; o.vr+=(ox*dy-oy*dx)/(d*rr+0.05)*2.2; }
  });
}
function pup(e){
  if(!ptr.down)return; ptr.down=false; charge.classList.remove('on');
  var held=clamp((performance.now()-ptr.t0)/900,0,1), w=toWorld(e.clientX,e.clientY);
  addSplash(w[0],w[1],(0.0068+held*0.0085)*(RM?0.75:1));
  if(held>0.7){ setTimeout(function(){addSplash(w[0],w[1],0.004);},170); }
  try{canvas.releasePointerCapture(e.pointerId);}catch(x){}
}
canvas.addEventListener('pointerdown',pdown);
canvas.addEventListener('pointermove',pmove);
canvas.addEventListener('pointerup',pup);
canvas.addEventListener('pointercancel',function(){ptr.down=false;charge.classList.remove('on');});
canvas.addEventListener('pointerleave',function(){ptr.dimple=0;});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
// keyboard alternative: Space / Enter drops a splash somewhere in the pool
window.addEventListener('keydown',function(e){
  var tg=e.target&&e.target.tagName;
  if(tg==='BUTTON')return;
  if(e.key===' '||e.key==='Enter'||e.key==='s'||e.key==='S'){
    e.preventDefault();
    var x=(Math.random()-0.5)*asp*0.8, y=(Math.random()-0.5)*0.7;
    addSplash(x,y,0.0072+Math.random()*0.004);
  }
});

/* ---------- water conditions ---------- */
var btns=[].slice.call(doc.querySelectorAll('.ctl button'));
btns.forEach(function(b){ b.addEventListener('click',function(){ waveT=parseFloat(b.getAttribute('data-w')); btns.forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');}); }); });
if(RM){ waveT=0.55; btns.forEach(function(o){o.setAttribute('aria-pressed',o.getAttribute('data-w')==='0.55'?'true':'false');}); wave=0.55; }

/* ---------- floats physics ---------- */
function stepFloat(o,dt,t,ph){
  var rb=(o.b||o.r)*o.s*0.85, hw=0.5*asp-rb, hh=0.5-rb;
  var tw=RM?0.25:1;
  o.vx+=(Math.sin(t*0.11+ph)*0.006+(o.hx-o.x)*0.05)*dt*tw; o.vy+=(Math.cos(t*0.09+ph*1.7)*0.005+(o.hy-o.y)*0.05)*dt*tw;
  o.x+=o.vx*dt; o.y+=o.vy*dt; o.rot+=o.vr*dt;
  var damp=Math.exp(-dt*0.85); o.vx*=damp; o.vy*=damp; o.vr*=Math.exp(-dt*0.7);
  o.vr+=Math.sin(t*0.17+ph)*0.05*dt*tw;
  if(o.x>hw){o.x=hw;o.vx=-Math.abs(o.vx)*0.6;} if(o.x<-hw){o.x=-hw;o.vx=Math.abs(o.vx)*0.6;}
  if(o.y>hh){o.y=hh;o.vy=-Math.abs(o.vy)*0.6;} if(o.y<-hh){o.y=-hh;o.vy=Math.abs(o.vy)*0.6;}
}
function collide(){
  var dx=flam.x-ring.x, dy=flam.y-ring.y, d=Math.sqrt(dx*dx+dy*dy)||0.001, min=ring.r*ring.s+flam.r*flam.s*0.85;
  if(d<min){
    var nx=dx/d, ny=dy/d, pen=min-d;
    ring.x-=nx*pen*0.6; ring.y-=ny*pen*0.6; flam.x+=nx*pen*0.4; flam.y+=ny*pen*0.4;
    var rv=(flam.vx-ring.vx)*nx+(flam.vy-ring.vy)*ny;
    if(rv<0){ var j=-(1.4)*rv/(1/ring.m+1/flam.m); ring.vx-=j*nx/ring.m; ring.vy-=j*ny/ring.m; flam.vx+=j*nx/flam.m; flam.vy+=j*ny/flam.m; ring.vr+=0.4*rv; flam.vr-=0.3*rv; }
  }
}

/* ---------- main loop ---------- */
var last=0, avg=0.02, fcount=0, running=true, raf=0;
var UR=new Float32Array(2);
function frame(now){
  raf=requestAnimationFrame(frame);
  if(!last)last=now;
  var dt=Math.min((now-last)/1000,1/20); last=now;
  var ts=RM?0.4:1; T+=dt*ts;
  wave=lerp(wave,waveT,1-Math.exp(-dt*2.5));
  // floats
  var st=Math.min(dt,1/30);
  stepFloat(ring,st,T,0.0); stepFloat(flam,st,T,2.3); collide();
  neckV+=(-neck*9-neckV*2.4)*st; neck+=neckV*st;
  ptr.dimple*=Math.exp(-dt*(ptr.down?1.2:3.4)); ptr.speed*=Math.exp(-dt*3);
  // uniforms
  gl.uniform2f(U.uRes,canvas.width,canvas.height);
  gl.uniform1f(U.uTime,T);
  gl.uniform1f(U.uWave,wave*(RM?0.8:1));
  gl.uniform1f(U.uAsp,asp);
  gl.uniform4fv(U.uRip,rip); gl.uniform4fv(U.uSpl,spl);
  var bobR=1+0.014*Math.sin(T*1.7), bobF=1+0.012*Math.sin(T*1.35+1.2);
  gl.uniform4f(U.uRing,ring.x,ring.y,ring.rot+0.06*Math.sin(T*0.9),ring.s*bobR);
  gl.uniform4f(U.uFlam,flam.x,flam.y,flam.rot+0.05*Math.sin(T*0.8+2),flam.s*bobF);
  gl.uniform4f(U.uAnim,T*1.7,T*1.35,0.14*Math.sin(T*0.9+1)+0.05*Math.sin(T*2.3)+neck,0);
  gl.uniform3f(U.uPtr,ptr.x,ptr.y,ptr.has?ptr.dimple:0);
  gl.uniform2f(U.uDir,depthDir[0],depthDir[1]);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.uniform1i(U.uTex,0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  // adaptive resolution
  avg=lerp(avg,Math.min(dt,0.2),0.06); fcount++;
  if(!forced&&fcount%36===0){
    if(avg>0.034&&scale>minScale){scale=Math.max(minScale,scale*0.86);sizeCanvas();}
    else if(avg<0.0185&&scale<maxScale){scale=Math.min(maxScale,scale*1.08);sizeCanvas();}
  }
}
function start(){ if(!raf&&running){last=0;raf=requestAnimationFrame(frame);} }
function stop(){ if(raf){cancelAnimationFrame(raf);raf=0;} }
doc.addEventListener('visibilitychange',function(){ if(doc.hidden)stop(); else start(); });

sizeCanvas(); buildText(); start();
})();
</script>
</body>
</html>
